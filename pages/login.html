    <!-- ========== Pattern C Navbar CSS ========== -->
    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }
        
        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1001;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Adjustments ========== */
        @media (max-width: 991.98px) {

        }
    </style>

    <!-- ========== Page-Specific CSS ========== -->
    <style>
        .login-container {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .login-card {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: var(--spacing-2xl);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .login-header .logo {
            font-family: var(--font-heading);
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .login-header h1 {
            font-size: var(--font-size-xl);
            margin-bottom: var(--spacing-xs);
        }

        .login-header p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin: 0;
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-label {
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
        }

        .form-control {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 16px;
            color: var(--color-text-primary);
            transition: all var(--transition-fast);
        }

        .form-control:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: var(--color-text-light);
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-light);
        }

        .input-group .form-control {
            padding-left: 2.5rem;
        }

        .password-toggle {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-light);
            cursor: pointer;
            padding: 0;
        }

        .password-toggle:hover {
            color: var(--color-accent);
        }

        .form-check {
            margin-bottom: var(--spacing-lg);
        }

        .form-check-input:checked {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
        }

        .form-check-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .forgot-link {
            font-size: var(--font-size-sm);
            color: var(--color-accent);
        }

        .btn-login {
            width: 100%;
            background-color: var(--color-accent);
            border: none;
            color: white;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: var(--font-size-base);
            transition: all var(--transition-fast);
        }

        .btn-login:hover {
            background-color: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: var(--spacing-lg) 0;
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--color-border);
        }

        .divider span {
            padding: 0 var(--spacing-md);
        }

        .social-buttons {
            display: flex;
            gap: var(--spacing-md);
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-card);
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
            font-weight: 500;
            transition: all var(--transition-fast);
            text-decoration: none;
        }

        .btn-social:hover {
            background-color: var(--color-bg-hover);
            border-color: var(--color-accent);
            color: var(--color-text-primary);
        }

        .signup-link {
            text-align: center;
            margin-top: var(--spacing-lg);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .signup-link a {
            color: var(--color-accent);
            font-weight: 500;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: var(--spacing-xl);
                border-radius: var(--radius-lg);
            }

            .social-buttons {
                flex-direction: column;
            }
        }

        /* スワイプナビゲーション対応 */
        html, body {
            overscroll-behavior-x: auto;
        }
    </style>
</head>

<!-- Navbar Overlay -->
<div id="navbar-container"></div>

    <div class="login-container">
        <div class="login-card fade-in">
            <!-- Header -->
            <div class="login-header">
                <a href="../index.html" class="logo">
                    <i class="fas fa-book-open"></i>
                    Publisher
                </a>
                <h1 data-i18n="login.welcomeBack">Welcome Back</h1>
                <p data-i18n="login.subtitle">Sign in to continue to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="login.email">Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            data-i18n-placeholder="login.emailPlaceholder"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="login.password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            data-i18n-placeholder="login.passwordPlaceholder"
                            placeholder="Enter your password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe" data-i18n="login.rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="forgot-link" data-i18n="login.forgotPassword">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i><span data-i18n="login.signIn">Sign In</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span data-i18n="login.orContinueWith">or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-buttons">
                <a href="#" class="btn-social">
                    <i class="fab fa-google"></i>
                    Google
                </a>
                <a href="#" class="btn-social">
                    <i class="fab fa-apple"></i>
                    Apple
                </a>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-link">
                <span data-i18n="login.noAccount">Don't have an account?</span> 
                <a href="register.html" data-i18n="login.signUpFree">Sign up for free</a>
            </div>
        </div>
    </div>

    <!-- ========== Pattern C Navbar JS ========== -->
    <script>
        // ========== 多言語対応テキスト（9言語）==========
        const uiText = {
            translationTools: { en: 'Tools', ja: '翻訳ツール', zh: '翻译工具',
                es: 'Herramientas de traducción', fr: 'Outils de traduction', de: 'Übersetzungstools',
                ko: '번역 도구', ar: 'أدوات الترجمة', pt: 'Ferramentas de tradução'
            },
            mangaTranslator: {
                en: 'Manga Translator', ja: 'マンガ翻訳', zh: '漫画翻译',
                es: 'Traductor de Manga', fr: 'Traducteur de Manga', de: 'Manga-Übersetzer',
                ko: '만화 번역기', ar: 'مترجم المانجا', pt: 'Tradutor de Mangá'
            },
            novelTranslator: {
                en: 'Novel Translator', ja: '小説翻訳', zh: '小说翻译',
                es: 'Traductor de Novela', fr: 'Traducteur de Roman', de: 'Roman-Übersetzer',
                ko: '소설 번역기', ar: 'مترجم الروايات', pt: 'Tradutor de Romance'
            },
            translationStatus: {
                en: 'Translation Status', ja: '翻訳状況', zh: '翻译状态',
                es: 'Estado de traducción', fr: 'Statut de traduction', de: 'Übersetzungsstatus',
                ko: '번역 상태', ar: 'حالة الترجمة', pt: 'Status da tradução'
            },
            findTranslators: {
                en: 'Find Translators', ja: '翻訳者を探す', zh: '寻找翻译',
                es: 'Buscar traductores', fr: 'Trouver des traducteurs', de: 'Übersetzer finden',
                ko: '번역가 찾기', ar: 'البحث عن مترجمين', pt: 'Encontrar tradutores'
            },
            contact: {
                en: 'Contact', ja: 'お問い合わせ', zh: '联系我们',
                es: 'Contacto', fr: 'Contact', de: 'Kontakt',
                ko: '문의', ar: 'اتصل بنا', pt: 'Contato'
            },
            library: {
                en: 'Library', ja: 'ライブラリ', zh: '书库',
                es: 'Biblioteca', fr: 'Bibliothèque', de: 'Bibliothek',
                ko: '라이브러리', ar: 'المكتبة', pt: 'Biblioteca'
            },
            dashboard: {
                en: 'Dashboard', ja: 'ダッシュボード', zh: '控制台',
                es: 'Panel', fr: 'Tableau de bord', de: 'Dashboard',
                ko: '대시보드', ar: 'لوحة التحكم', pt: 'Painel'
            },
            accountSettings: {
                en: 'Account Settings', ja: 'アカウント設定', zh: '账户设置',
                es: 'Configuración de cuenta', fr: 'Paramètres du compte', de: 'Kontoeinstellungen',
                ko: '계정 설정', ar: 'إعدادات الحساب', pt: 'Configurações da conta'
            },
            logout: {
                en: 'Log Out', ja: 'ログアウト', zh: '退出登录',
                es: 'Cerrar sesión', fr: 'Déconnexion', de: 'Abmelden',
                ko: '로그아웃', ar: 'تسجيل الخروج', pt: 'Sair'
            },
            logOutConfirm: {
                en: 'Are you sure you want to log out?', ja: 'ログアウトしますか？', zh: '确定要退出登录吗？',
                es: '¿Estás seguro de que quieres cerrar sesión?', fr: 'Êtes-vous sûr de vouloir vous déconnecter?', de: 'Sind Sie sicher, dass Sie sich abmelden möchten?',
                ko: '로그아웃 하시겠습니까?', ar: 'هل أنت متأكد أنك تريد تسجيل الخروج؟', pt: 'Tem certeza que deseja sair?'
            }
        };
        
        function getCurrentLanguage() {
            return localStorage.getItem('preferredLanguage') || 'en';
        }
        
        function getL(obj) {
            const lang = getCurrentLanguage();
            return obj[lang] || obj.en || '';
        }
        
        function updateUIText() {

            const els = {

            };
            Object.keys(els).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = getL(els[id]);
            });
        }
        
        function toggleUserDropdown(e) {
            e.preventDefault();
            e.stopPropagation();
            const dropdown = document.getElementById('userDropdown');
            const dropdownMenu = document.getElementById('userMenu');
            dropdown.classList.toggle('open');
            dropdownMenu.classList.toggle('show');
        }
        
        function handleLogout() {
            if (confirm(getL(uiText.logOutConfirm))) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.reload();
            }
        }
        
        function loadUserInfo() {
            const userStr = localStorage.getItem('user');
            const token = localStorage.getItem('token');
            const isLoggedIn = !!(userStr && token);
            
            if (isLoggedIn) {
                try {
                    const user = JSON.parse(userStr);
                    const displayName = user.display_name || user.firstName || user.email || 'User';
                    const userNameEl = document.getElementById('userName');
                    const userDisplayNameEl = document.getElementById('userDisplayName');
                    const userEmailEl = document.getElementById('userEmail');
                    if (userNameEl) userNameEl.textContent = displayName;
                    if (userDisplayNameEl) userDisplayNameEl.textContent = displayName;
                    if (userEmailEl) userEmailEl.textContent = user.email || '';
                    document.body.classList.add('logged-in');
                } catch (e) {
                    document.body.classList.remove('logged-in');
                }
            } else {
                document.body.classList.remove('logged-in');
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const desktopSelector = document.getElementById('languageSelector');
            const mobileSelector = document.getElementById('languageSelectorMobile');
            
            if (desktopSelector && mobileSelector) {
                const savedLang = localStorage.getItem('preferredLanguage') || 'en';
                desktopSelector.value = savedLang;
                mobileSelector.value = savedLang;
                
                mobileSelector.addEventListener('change', function() {
                    desktopSelector.value = this.value;
                    if (typeof changeLanguage === 'function') changeLanguage(this.value);
                    updateUIText();
                });
                
                desktopSelector.addEventListener('change', function() {
                    mobileSelector.value = this.value;
                    updateUIText();
                });
            }
            
            updateUIText();
            setTimeout(updateUIText, 100);
            loadUserInfo();
            
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.user-dropdown')) {
                    const dropdown = document.getElementById('userDropdown');
                    const dropdownMenu = document.getElementById('userMenu');
                    if (dropdown) dropdown.classList.remove('open');
                    if (dropdownMenu) dropdownMenu.classList.remove('show');
                }
            });
            
            const navbarCollapse = document.getElementById('navbarNav');
            const navbarOverlay = document.getElementById('navbarOverlay');
            
            if (navbarCollapse) {
                navbarCollapse.addEventListener('show.bs.collapse', function() {
                    if (navbarOverlay) navbarOverlay.classList.add('show');
                });
                navbarCollapse.addEventListener('hide.bs.collapse', function() {
                    if (navbarOverlay) navbarOverlay.classList.remove('show');
                });
            }
            
            if (navbarOverlay) {
                navbarOverlay.addEventListener('click', function() {
                    const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                    if (bsCollapse) bsCollapse.hide();
                });
            }
            
            document.addEventListener('languageChanged', function() {
                updateUIText();
            });
        });
    </script>

    <!-- ========== Page-Specific JS ========== -->
    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to dashboard
                    alert('Login successful! Redirecting...');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.error || 'Login failed. Please try again.');
                               }
            } catch (error) {
                console.error('Login error:', error);
                alert('Connection error. Please try again later.');
            }
        });
    </script>
</body>
</html>
