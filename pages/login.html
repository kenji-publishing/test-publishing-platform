<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Sign In - AuctLect</title>
    <script src="../js/config.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link href="../css/variables.css" rel="stylesheet">
    <link href="../css/style-new.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/navbar.css" rel="stylesheet">
    <link href="../css/mobile-fixes.css" rel="stylesheet">
    <link href="../css/navbar.css" rel="stylesheet">
    
    <!-- ========== Pattern C Navbar CSS ========== -->
    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }
        
        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1001;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Adjustments ========== */
        @media (max-width: 991.98px) {

        }
    </style>

    <!-- ========== Page-Specific CSS ========== -->
    <style>
        .login-container {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .login-card {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: var(--spacing-2xl);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .login-header .logo {
            font-family: var(--font-heading);
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .login-header h1 {
            font-size: var(--font-size-xl);
            margin-bottom: var(--spacing-xs);
        }

        .login-header p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin: 0;
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-label {
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
        }

        .form-control {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 16px;
            color: var(--color-text-primary);
            transition: all var(--transition-fast);
        }

        .form-control:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: var(--color-text-light);
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-light);
        }

        .input-group .form-control {
            padding-left: 2.5rem;
        }

        .password-toggle {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-light);
            cursor: pointer;
            padding: 0;
        }

        .password-toggle:hover {
            color: var(--color-accent);
        }

        .form-check {
            margin-bottom: var(--spacing-lg);
        }

        .form-check-input:checked {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
        }

        .form-check-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .forgot-link {
            font-size: var(--font-size-sm);
            color: var(--color-accent);
        }

        .btn-login {
            width: 100%;
            background-color: var(--color-accent);
            border: none;
            color: white;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: var(--font-size-base);
            transition: all var(--transition-fast);
        }

        .btn-login:hover {
            background-color: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: var(--spacing-lg) 0;
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--color-border);
        }

        .divider span {
            padding: 0 var(--spacing-md);
        }

        .social-buttons {
            display: flex;
            gap: var(--spacing-md);
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-card);
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
            font-weight: 500;
            transition: all var(--transition-fast);
            text-decoration: none;
        }

        .btn-social:hover {
            background-color: var(--color-bg-hover);
            border-color: var(--color-accent);
            color: var(--color-text-primary);
        }

        .signup-link {
            text-align: center;
            margin-top: var(--spacing-lg);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .signup-link a {
            color: var(--color-accent);
            font-weight: 500;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: var(--spacing-xl);
                border-radius: var(--radius-lg);
            }

            .social-buttons {
                flex-direction: column;
            }
        }

        /* スワイプナビゲーション対応 */
        html, body {
            overscroll-behavior-x: auto;
        }
    </style>
</head>
<body>

<!-- ========== NAVBAR HTML START ========== -->

<!-- Navbar Overlay -->
<div id="navbar-container"></div>

    <div class="login-container">
        <div class="login-card fade-in">
            <!-- Header -->
            <div class="login-header">
                <a href="../index.html" class="logo">
                    <i class="fas fa-book-open"></i>
                    AuctLect
                </a>
                <h1 data-i18n="login.welcomeBack">Welcome Back</h1>
                <p data-i18n="login.subtitle">Sign in to continue to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="login.email">Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            data-i18n-placeholder="login.emailPlaceholder"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="login.password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            data-i18n-placeholder="login.passwordPlaceholder"
                            placeholder="Enter your password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe" data-i18n="login.rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="forgot-link" data-i18n="login.forgotPassword">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i><span data-i18n="login.signIn">Sign In</span>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span data-i18n="login.orContinueWith">or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-buttons">
                <a href="#" class="btn-social">
                    <i class="fab fa-google"></i>
                    Google
                </a>
                <a href="#" class="btn-social">
                    <i class="fab fa-apple"></i>
                    Apple
                </a>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-link">
                <span data-i18n="login.noAccount">Don't have an account?</span> 
                <a href="register.html" data-i18n="login.signUpFree">Sign up for free</a>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/lang/ja.js"></script>
    <script src="../js/lang/en.js"></script>
    <script src="../js/lang/zh.js"></script>
    <script src="../js/lang/es.js"></script>
    <script src="../js/lang/fr.js"></script>
    <script src="../js/lang/de.js"></script>
    <script src="../js/lang/ko.js"></script>
    <script src="../js/lang/ar.js"></script>
    <script src="../js/lang/pt.js"></script>
    <script src="../js/lang/it.js"></script>
    

    <!-- (Old "Pattern C Navbar JS" block removed: it called the deleted
         updateUIText() and referenced navbar elements that don't exist at
         this point — navbar.js and i18n.js handle all of it now.) -->

    <!-- ========== Page-Specific JS ========== -->
    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch((window.API_ORIGIN || '') + '/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to dashboard
                    alert('Login successful! Redirecting...');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.error || 'Login failed. Please try again.');
                               }
            } catch (error) {
                console.error('Login error:', error);
                alert('Connection error. Please try again later.');
            }
        });
    </script>
</body>
</html>
