<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="registerTranslator.pageTitle">Translator Registration - Publisher</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style-new.css">
    <link rel="stylesheet" href="../css/mobile-fixes.css">
    
    <style>
        .navbar-lang-selector { display: flex; align-items: center; margin-right: 0.5rem; }
        @media (max-width: 991.98px) { .navbar-lang-selector { order: 1; } .navbar-toggler { order: 2; } }
        .register-container { padding: var(--spacing-xl) 0; max-width: 800px; margin: 0 auto; }
        .register-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-xl); }
        .register-header { text-align: center; margin-bottom: var(--spacing-xl); }
        .register-header .icon { font-size: 4rem; color: var(--color-success, #28a745); margin-bottom: var(--spacing-md); }
        .register-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .register-header p { color: var(--color-text-secondary); }
        .form-section { margin-bottom: var(--spacing-xl); }
        .form-section h5 { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--spacing-md); display: flex; align-items: center; gap: var(--spacing-sm); }
        .form-section h5 i { color: var(--color-accent); }
        .form-label { font-weight: 500; margin-bottom: var(--spacing-xs); }
        .form-text { font-size: var(--font-size-sm); color: var(--color-text-muted); }
        .form-check-label { font-weight: 400; }
        .btn-register { padding: var(--spacing-md) var(--spacing-xl); font-size: var(--font-size-lg); }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-book-open"></i> Publisher
            </a>
            <!-- Mobile Language Selector -->
            <div class="navbar-lang-selector d-lg-none">
                <select class="language-selector" id="languageSelectorMobile">
                    <option value="en">🇬🇧 English</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="pt">🇧🇷 Português</option>
                </select>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html" data-i18n="nav.home">Home</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <!-- Desktop Language Selector -->
                    <select class="language-selector d-none d-lg-block" id="languageSelector">
                        <option value="en">🇬🇧 English</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="zh">🇨🇳 中文</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="ar">🇸🇦 العربية</option>
                        <option value="pt">🇧🇷 Português</option>
                    </select>
                    <a href="login.html" class="btn btn-outline-custom" data-i18n="nav.login">Sign In</a>
                    <a href="register.html" class="btn btn-custom" data-i18n="nav.register">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="register-container">
        <div class="container">
            <div class="register-card">
                <div class="register-header">
                    <div class="icon">
                        <i class="fas fa-language"></i>
                    </div>
                    <h1 data-i18n="registerTranslator.title">Translator Registration</h1>
                    <p data-i18n="registerTranslator.subtitle">Bridge cultures and connect readers worldwide</p>
                </div>

                <form id="translatorRegistrationForm">
                    <!-- Personal Information -->
                    <div class="form-section">
                        <h5><i class="fas fa-user"></i> <span data-i18n="registerTranslator.personalInfo">Personal Information</span></h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label" data-i18n="registerTranslator.firstName">First Name *</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label" data-i18n="registerTranslator.lastName">Last Name *</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label" data-i18n="registerTranslator.email">Email Address *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="country" class="form-label" data-i18n="registerTranslator.country">Country *</label>
                            <select class="form-select" id="country" required>
                                <option value="" data-i18n="registerTranslator.selectCountry">Select your country</option>
                                <option value="US" data-i18n="registerTranslator.countries.us">United States</option>
                                <option value="GB" data-i18n="registerTranslator.countries.gb">United Kingdom</option>
                                <option value="JP" data-i18n="registerTranslator.countries.jp">Japan</option>
                                <option value="DE" data-i18n="registerTranslator.countries.de">Germany</option>
                                <option value="FR" data-i18n="registerTranslator.countries.fr">France</option>
                                <option value="ES" data-i18n="registerTranslator.countries.es">Spain</option>
                                <option value="CN" data-i18n="registerTranslator.countries.cn">China</option>
                                <option value="other" data-i18n="registerTranslator.countries.other">Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Language Expertise -->
                    <div class="form-section">
                        <h5><i class="fas fa-exchange-alt"></i> <span data-i18n="registerTranslator.languageExpertise">Language Expertise</span></h5>
                        
                        <div class="mb-3">
                            <label for="nativeLanguage" class="form-label" data-i18n="registerTranslator.nativeLanguage">Native Language *</label>
                            <select class="form-select" id="nativeLanguage" required>
                                <option value="" data-i18n="registerTranslator.selectNativeLanguage">Select your native language</option>
                                <option value="en" data-i18n="registerTranslator.languages.en">English</option>
                                <option value="es" data-i18n="registerTranslator.languages.es">Spanish</option>
                                <option value="de" data-i18n="registerTranslator.languages.de">German</option>
                                <option value="fr" data-i18n="registerTranslator.languages.fr">French</option>
                                <option value="ja" data-i18n="registerTranslator.languages.ja">Japanese</option>
                                <option value="zh" data-i18n="registerTranslator.languages.zh">Chinese</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="registerTranslator.translateFrom">Languages I Can Translate From *</label>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="en" id="from-en">
                                        <label class="form-check-label" for="from-en" data-i18n="registerTranslator.languages.en">English</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="es" id="from-es">
                                        <label class="form-check-label" for="from-es" data-i18n="registerTranslator.languages.es">Spanish</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="de" id="from-de">
                                        <label class="form-check-label" for="from-de" data-i18n="registerTranslator.languages.de">German</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="fr" id="from-fr">
                                        <label class="form-check-label" for="from-fr" data-i18n="registerTranslator.languages.fr">French</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="ja" id="from-ja">
                                        <label class="form-check-label" for="from-ja" data-i18n="registerTranslator.languages.ja">Japanese</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="zh" id="from-zh">
                                        <label class="form-check-label" for="from-zh" data-i18n="registerTranslator.languages.zh">Chinese</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="registerTranslator.translateTo">Languages I Can Translate To *</label>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="en" id="to-en">
                                        <label class="form-check-label" for="to-en" data-i18n="registerTranslator.languages.en">English</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="es" id="to-es">
                                        <label class="form-check-label" for="to-es" data-i18n="registerTranslator.languages.es">Spanish</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="de" id="to-de">
                                        <label class="form-check-label" for="to-de" data-i18n="registerTranslator.languages.de">German</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="fr" id="to-fr">
                                        <label class="form-check-label" for="to-fr" data-i18n="registerTranslator.languages.fr">French</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="ja" id="to-ja">
                                        <label class="form-check-label" for="to-ja" data-i18n="registerTranslator.languages.ja">Japanese</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="zh" id="to-zh">
                                        <label class="form-check-label" for="to-zh" data-i18n="registerTranslator.languages.zh">Chinese</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Experience & Expertise -->
                    <div class="form-section">
                        <h5><i class="fas fa-star"></i> <span data-i18n="registerTranslator.experienceExpertise">Experience &amp; Expertise</span></h5>
                        
                        <div class="mb-3">
                            <label for="experience" class="form-label" data-i18n="registerTranslator.yearsExperience">Years of Translation Experience *</label>
                            <select class="form-select" id="experience" required>
                                <option value="" data-i18n="registerTranslator.selectExperience">Select experience level</option>
                                <option value="0-2" data-i18n="registerTranslator.experience.years02">0-2 years</option>
                                <option value="3-5" data-i18n="registerTranslator.experience.years35">3-5 years</option>
                                <option value="6-10" data-i18n="registerTranslator.experience.years610">6-10 years</option>
                                <option value="10+" data-i18n="registerTranslator.experience.years10plus">10+ years</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="specializations" class="form-label" data-i18n="registerTranslator.specializations">Specializations *</label>
                            <select class="form-select" id="specializations" multiple size="5" required>
                                <option value="literary" data-i18n="registerTranslator.specs.literary">Literary Fiction</option>
                                <option value="technical" data-i18n="registerTranslator.specs.technical">Technical Writing</option>
                                <option value="manga" data-i18n="registerTranslator.specs.manga">Manga/Comics</option>
                                <option value="poetry" data-i18n="registerTranslator.specs.poetry">Poetry</option>
                                <option value="academic" data-i18n="registerTranslator.specs.academic">Academic Texts</option>
                                <option value="business" data-i18n="registerTranslator.specs.business">Business Documents</option>
                                <option value="marketing" data-i18n="registerTranslator.specs.marketing">Marketing Content</option>
                            </select>
                            <div class="form-text" data-i18n="registerTranslator.selectMultipleHint">Hold Ctrl (Cmd on Mac) to select multiple</div>
                        </div>

                        <div class="mb-3">
                            <label for="certifications" class="form-label" data-i18n="registerTranslator.certifications">Certifications (Optional)</label>
                            <textarea class="form-control" id="certifications" rows="3" data-i18n-placeholder="registerTranslator.certificationsPlaceholder" placeholder="List any relevant certifications or qualifications..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="portfolio" class="form-label" data-i18n="registerTranslator.portfolio">Portfolio/Website (Optional)</label>
                            <input type="url" class="form-control" id="portfolio" placeholder="https://">
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                        <label class="form-check-label" for="agreeTerms">
                            <span data-i18n="registerTranslator.agreeToTerms">I agree to the</span>
                            <a href="terms.html" data-i18n="registerTranslator.termsOfService">Terms of Service</a>
                            <span data-i18n="registerTranslator.and">and</span>
                            <a href="revenue-sharing.html" data-i18n="registerTranslator.revenueSharing">Revenue Sharing Agreement</a> *
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-custom btn-register">
                            <i class="fas fa-user-plus me-2"></i><span data-i18n="registerTranslator.createAccount">Create Translator Account</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <p class="small mb-0" data-i18n="footer.copyright">&copy; 2024 Publisher. All rights reserved.</p>
                <div class="d-flex gap-3">
                    <a href="support/faq.html" class="text-secondary" data-i18n="footer.help">Help</a>
                    <a href="terms.html" class="text-secondary" data-i18n="footer.terms">Terms</a>
                    <a href="privacy.html" class="text-secondary" data-i18n="footer.privacy">Privacy</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/language-switcher.js"></script>
    <script>
        // Language switching
        function switchLanguage(lang) {
            localStorage.setItem('preferredLanguage', lang);
            
            // Update both selectors
            document.getElementById('languageSelector').value = lang;
            document.getElementById('languageSelectorMobile').value = lang;
            
            // Use LanguageSwitcher if available
            if (typeof LanguageSwitcher !== 'undefined') {
                LanguageSwitcher.changeLanguage(lang);
            } else if (typeof loadLanguage === 'function') {
                loadLanguage(lang);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set current language
            const currentLang = localStorage.getItem('preferredLanguage') || 'en';
            const desktopSelector = document.getElementById('languageSelector');
            const mobileSelector = document.getElementById('languageSelectorMobile');
            
            if (desktopSelector) {
                desktopSelector.value = currentLang;
                desktopSelector.addEventListener('change', function() {
                    switchLanguage(this.value);
                });
            }
            
            if (mobileSelector) {
                mobileSelector.value = currentLang;
                mobileSelector.addEventListener('change', function() {
                    switchLanguage(this.value);
                });
            }
        });

        // Form submission
        document.getElementById('translatorRegistrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registration submitted! (This will connect to backend in production)');
        });
    </script>
</body>
</html>
