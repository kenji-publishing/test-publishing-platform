        // =============================================
        // UI Logic
        // =============================================
        let currentTemplate = 'ticketReceived';
        let currentView = 'html';
        
        function updatePreview() {
            const template = templates[currentTemplate];
            
            document.getElementById('emailTo').textContent = template.to;
            document.getElementById('emailSubject').textContent = template.subject;
            
            const htmlPreview = document.getElementById('htmlPreview');
            const textPreview = document.getElementById('textPreview');
            
            if (currentView === 'html') {
                htmlPreview.style.display = 'block';
                textPreview.style.display = 'none';
                htmlPreview.srcdoc = template.html;
            } else {
                htmlPreview.style.display = 'none';
                textPreview.style.display = 'block';
                textPreview.textContent = template.text;
            }
        }
        
        // Template selector
        document.querySelectorAll('.template-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTemplate = this.dataset.template;
                updatePreview();
            });
        });
        
        // View tabs
        document.querySelectorAll('.preview-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;
                updatePreview();
            });
        });
        
        // Initial load
        updatePreview();
    </script>
