<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202608302024">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202608302024">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/variables.css?v=202608302024" rel="stylesheet">
    <link href="../css/style-new.css?v=202608302024" rel="stylesheet">
    <link href="../css/components.css?v=202608302024" rel="stylesheet">
    <link href="../css/navbar.css?v=202608302024" rel="stylesheet">
    <link href="../css/mobile-fixes.css?v=202608302024" rel="stylesheet">
    <link href="../css/navbar.css?v=202608302024" rel="stylesheet">
    <style>
        /* ========== Pattern C: Mobile Language Selector ========== */

        /* ========== Pattern C: PC Navbar - 横並び維持 ========== */
        @media (min-width: 1200px) {
            .navbar-nav { flex-wrap: wrap !important; flex-direction: row !important; }
            .navbar-nav .nav-item { white-space: nowrap !important; }
            .navbar-nav .nav-link { white-space: nowrap !important; padding: 0.5rem 0.6rem !important; font-size: 0.9rem; }

            .dropdown-menu { white-space: nowrap; }
            .navbar-buttons-guest { display: flex !important; flex-wrap: nowrap !important; gap: 0.5rem; }
            .navbar-buttons-guest .btn { white-space: nowrap !important; flex-shrink: 0; }
        }

        /* ========== Pattern C: Auth Visibility Control ========== */

        /* ========== Pattern C: User Dropdown Menu ========== */

        /* ========== Pattern C: Navbar Overlay ========== */

        /* ========== Pattern C: Mobile Adjustments ========== */
        @media (max-width: 1199.98px) {

        }

        /* ========== Page Specific: Translation Status ========== */
        .status-card { border-left: 4px solid #6c757d; transition: all 0.3s; background: var(--color-bg-card); border-radius: var(--radius-lg); }
        .status-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .status-pending { border-left-color: #ffc107; }
        .status-in-progress { border-left-color: #0dcaf0; }
        .status-completed { border-left-color: #198754; }
        .status-failed { border-left-color: #dc3545; }
        .language-flag { font-size: 2rem; }
        .stat-box { background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%); color: white; border-radius: var(--radius-lg); padding: var(--spacing-lg); }
        .stat-box-pink { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-box-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .stat-box-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    </style>
</head>
<body>
    <!-- ========== NAVBAR HTML START (Pattern C) ========== -->

    <!-- Navbar Overlay -->
    <div id="navbar-container"></div>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h2><i class="fas fa-language text-accent"></i> <span data-i18n="translation.title">Translation Status</span></h2>
            <a href="dashboard.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i><span data-i18n="translation.backToDashboard">Back to Dashboard</span></a>
        </div>
        <div class="card mb-4" style="background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-lg)">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-2 text-center mb-3 mb-md-0">
                        <div class="bg-secondary rounded" style="width:100px;height:140px;display:flex;align-items:center;justify-content:center;margin:0 auto"><i class="fas fa-book text-white fa-3x"></i></div>
                    </div>
                    <div class="col-md-10">
                        <select id="workSelector" class="form-select mb-2" style="display:none; max-width:420px;"></select>
                        <h4 id="workTitle" dir="auto">Loading...</h4>
                        <p class="text-muted mb-2" id="workAuthor"></p>
                        <div class="mb-2"><span class="badge bg-primary me-2" id="contentType">Text</span><span class="badge bg-secondary" id="genre">Fiction</span></div>
                        <p class="mb-0"><small class="text-muted"><i class="fas fa-globe"></i> <span data-i18n="translation.original">Original</span>: <strong id="originalLang">Japanese</strong></small></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-6 col-md-3 mb-3"><div class="stat-box text-center"><h3 class="mb-0" id="totalTranslations">0</h3><small data-i18n="translation.totalTranslations">Total Translations</small></div></div>
            <div class="col-6 col-md-3 mb-3"><div class="stat-box stat-box-pink text-center"><h3 class="mb-0" id="completedCount">0</h3><small data-i18n="translation.completed">Completed</small></div></div>
            <div class="col-6 col-md-3 mb-3"><div class="stat-box stat-box-blue text-center"><h3 class="mb-0" id="inProgressCount">0</h3><small data-i18n="translation.inProgress">In Progress</small></div></div>
            <div class="col-6 col-md-3 mb-3"><div class="stat-box stat-box-green text-center"><h3 class="mb-0" id="overallProgress">0%</h3><small data-i18n="translation.overallProgress">Overall Progress</small></div></div>
        </div>
        <div class="row" id="translationList"></div>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js?v=202608302024"></script>
    <script src="../js/i18n.js?v=202608302024"></script>
    <script src="../js/navbar.js?v=202608302024"></script>
    <!-- 言語ファイル（9言語） -->
    <script src="../js/lang/ja.js?v=202608302024"></script>
    <script src="../js/lang/en.js?v=202608302024"></script>
    <script src="../js/lang/zh.js?v=202608302024"></script>
    <script src="../js/lang/zh-TW.js?v=202608302024"></script>
    <script src="../js/lang/es.js?v=202608302024"></script>
    <script src="../js/lang/fr.js?v=202608302024"></script>
    <script src="../js/lang/de.js?v=202608302024"></script>
    <script src="../js/lang/ko.js?v=202608302024"></script>
    <script src="../js/lang/ar.js?v=202608302024"></script>
    <script src="../js/lang/pt.js?v=202608302024"></script>
    <script src="../js/lang/it.js?v=202608302024"></script>
    <!-- 翻訳ベース（共通関数） -->
    <!-- 言語切替機能 -->
    
    <!-- ========== Pattern C: Navbar JavaScript ========== -->
    <script>

document.addEventListener('DOMContentLoaded', function() {
        loadUserInfo();

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.user-dropdown')) {
                const dropdown = document.getElementById('userDropdown');
                const dropdownMenu = document.getElementById('userMenu');
                if (dropdown) dropdown.classList.remove('open');
                if (dropdownMenu) dropdownMenu.classList.remove('show');
            }
        });

        const navbarCollapse = document.getElementById('navbarNav');
        const navbarOverlay = document.getElementById('navbarOverlay');

        if (navbarCollapse) {
            navbarCollapse.addEventListener('show.bs.collapse', function() {
                if (navbarOverlay) navbarOverlay.classList.add('show');
            });
            navbarCollapse.addEventListener('hide.bs.collapse', function() {
                if (navbarOverlay) navbarOverlay.classList.remove('show');
            });
        }

        if (navbarOverlay) {
            navbarOverlay.addEventListener('click', function() {
                const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                if (bsCollapse) bsCollapse.hide();
            });
        }

    });
    </script>
    <!-- ========== Page Specific Script（実データ: 自作品の翻訳状況。デモ撤去済み） ========== -->
    <script>
        const TS_LANG_NAMES = { en: 'English', ja: '日本語', zh: '中文', es: 'Español', fr: 'Français', de: 'Deutsch', ko: '한국어', ar: 'العربية', pt: 'Português', it: 'Italiano', 'zh-TW': '繁體中文' };
        const TS_FLAGS = { en: '🇬🇧', ja: '🇯🇵', zh: '🇨🇳', es: '🇪🇸', fr: '🇫🇷', de: '🇩🇪', ko: '🇰🇷', ar: '🇸🇦', pt: '🇵🇹', it: '🇮🇹' };
        let tsWorks = [];

        function tsMsg(ja, en) { return (getCurrentLanguage() === 'ja') ? ja : en; }
        function escT(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

        async function tsInit() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/works/my', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
                tsWorks = data.works || [];
            } catch (e) {
                console.error('Failed to load works:', e);
                tsWorks = [];
            }

            if (!tsWorks.length) {
                document.getElementById('workTitle').textContent = tsMsg('作品がありません', 'No works yet');
                document.getElementById('contentType').textContent = '';
                document.getElementById('genre').textContent = '';
                document.getElementById('originalLang').textContent = '-';
                document.getElementById('translationList').innerHTML =
                    '<div class="col-12"><p class="text-muted" style="padding:1rem;">' + tsMsg('作品をアップロードすると、ここで翻訳の進行状況を確認できます。', 'Upload a work to track its translations here.') + '</p></div>';
                tsSetStats([]);
                return;
            }

            const sel = document.getElementById('workSelector');
            sel.style.display = '';
            sel.innerHTML = tsWorks.map(w => '<option value="' + escT(w.work_id) + '">' + escT(w.title) + '</option>').join('');
            sel.onchange = () => tsLoadWork(sel.value);
            tsLoadWork(tsWorks[0].work_id);
        }

        async function tsLoadWork(workId) {
            const w = tsWorks.find(x => String(x.work_id) === String(workId)) || {};
            document.getElementById('workTitle').textContent = w.title || '';
            document.getElementById('contentType').textContent = w.content_type || 'text';
            document.getElementById('genre').textContent = w.genre || '';
            document.getElementById('originalLang').textContent = TS_LANG_NAMES[w.original_language] || w.original_language || '';

            const token = localStorage.getItem('token');
            let translations = [];
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/ai-translation/status/' + encodeURIComponent(workId), {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await resp.json();
                if (resp.ok) translations = data.translations || [];
            } catch (e) {
                console.error('Failed to load translations:', e);
            }

            tsSetStats(translations);
            const list = document.getElementById('translationList');
            if (!translations.length) {
                list.innerHTML = '<div class="col-12"><p class="text-muted" style="padding:1rem;">' + tsMsg('この作品にはまだ翻訳がありません。', 'No translations for this work yet.') + '</p></div>';
                return;
            }

            list.innerHTML = translations.map(t => {
                const done = t.status === 'completed';
                const failed = t.status === 'failed';
                const badge = done ? '<span class="badge bg-success"><i class="fas fa-check-circle"></i> ' + tsMsg('完了', 'Completed') + '</span>'
                    : failed ? '<span class="badge bg-danger"><i class="fas fa-times-circle"></i> ' + tsMsg('失敗', 'Failed') + '</span>'
                    : t.status === 'in_progress' ? '<span class="badge bg-info"><i class="fas fa-spinner fa-spin"></i> ' + tsMsg('翻訳中', 'In progress') + '</span>'
                    : '<span class="badge bg-warning text-dark"><i class="fas fa-hourglass-half"></i> ' + tsMsg('待機中', 'Queued') + '</span>';
                const typeLabel = t.translation_type === 'ai' ? tsMsg('AI翻訳', 'AI translation') : tsMsg('翻訳者による翻訳', 'Human translation');
                const dateStr = new Date(t.updated_at || t.created_at).toLocaleDateString();
                return '<div class="col-md-6 mb-4"><div class="card status-card h-100 ' + (done ? 'status-completed' : 'status-pending') + '"><div class="card-body"><div class="d-flex align-items-start">'
                    + '<div class="language-flag me-3">' + (TS_FLAGS[t.target_language] || '🌐') + '</div>'
                    + '<div class="flex-grow-1"><h5 class="mb-1">' + (TS_LANG_NAMES[t.target_language] || escT(t.target_language)) + '</h5>'
                    + '<div class="mb-2">' + badge + '</div>'
                    + '<small class="text-muted"><i class="fas ' + (t.translation_type === 'ai' ? 'fa-robot' : 'fa-user') + '"></i> ' + typeLabel + ' • <i class="fas fa-clock"></i> ' + dateStr + '</small>'
                    + '</div></div></div></div></div>';
            }).join('');
        }

        function tsSetStats(translations) {
            const total = translations.length;
            const done = translations.filter(t => t.status === 'completed').length;
            const prog = translations.filter(t => t.status === 'in_progress').length;
            document.getElementById('totalTranslations').textContent = total;
            document.getElementById('completedCount').textContent = done;
            document.getElementById('inProgressCount').textContent = prog;
            document.getElementById('overallProgress').textContent = total ? Math.round(done / total * 100) + '%' : '0%';
        }

        document.addEventListener('DOMContentLoaded', tsInit);
    </script>
</body>
</html>
