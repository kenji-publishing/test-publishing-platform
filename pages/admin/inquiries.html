<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg?v=202608172055">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - Admin Dashboard</title>
    <script src="../../js/config.js?v=202608172055"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .admin-wrapper { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 260px; background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%); color: #fff; position: fixed; height: 100vh; overflow-y: auto; z-index: 1000; }
        .admin-sidebar .brand { padding: 20px; font-size: 1.4rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
        .admin-sidebar .nav-menu { padding: 15px 0; }
        .admin-sidebar .nav-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.7); text-decoration: none; transition: all 0.3s; border-left: 3px solid transparent; }
        .admin-sidebar .nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .admin-sidebar .nav-item.active { background: rgba(255,255,255,0.15); color: #fff; border-left-color: #3498db; }
        .admin-sidebar .nav-item i { font-size: 1.2rem; width: 24px; }
        .badge-pending { background: #e74c3c; color: #fff; font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; margin-left: auto; }
        .admin-sidebar .nav-section { padding: 15px 20px 8px; font-size: 0.75rem; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 1px; }
        .admin-main { flex: 1; margin-left: 260px; background: #f5f6fa; min-height: 100vh; }
        .admin-header { background: #fff; padding: 15px 30px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
        .admin-content { padding: 30px; }
        .content-panel { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .panel-header { padding: 18px 24px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .panel-header h2 { font-size: 1.05rem; font-weight: 600; margin: 0; color: #2c3e50; }
        .panel-body { padding: 20px 24px; }
        .inq-item { border: 1px solid #eee; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
        .inq-head { padding: 13px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .inq-head:hover { background: #fafbfc; }
        .inq-detail { display: none; border-top: 1px solid #eee; padding: 16px; background: #fafbfc; }
        .inq-item.open .inq-detail { display: block; }
        .inq-body-text { white-space: pre-wrap; background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 12px 14px; font-size: 0.88rem; margin-bottom: 14px; }
        .st { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 0.76rem; font-weight: 600; white-space: nowrap; }
        .st.open { background: #ffebee; color: #c62828; }
        .st.answered { background: #e8f5e9; color: #2e7d32; }
        .st.closed { background: #f5f5f5; color: #757575; }
        .muted { color: #95a5a6; font-size: 0.82rem; }
        .cat-chip { background: #eef2f7; color: #2c3e50; border-radius: 8px; padding: 2px 9px; font-size: 0.76rem; white-space: nowrap; }
        #msg { display: none; margin-bottom: 16px; }
        .filter-btns .btn { font-size: 0.82rem; }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <aside class="admin-sidebar">
        <a href="index.html" class="brand"><i class="bi bi-shield-lock"></i> AuctLect Admin</a>
        <nav class="nav-menu">
                <div class="nav-section">メイン</div>
                <a class="nav-item" href="index.html"><i class="bi bi-grid-1x2"></i><span>ダッシュボード</span></a>
                <div class="nav-section">ユーザー管理</div>
                <a class="nav-item" href="index.html#users"><i class="bi bi-people"></i><span>ユーザー一覧</span></a>
                <a class="nav-item" href="index.html#verification"><i class="bi bi-person-check"></i><span>本人確認</span><span class="badge-pending" id="verification-badge" style="display:none;">0</span></a>
                <div class="nav-section">コンテンツ</div>
                <a class="nav-item" href="index.html#moderation"><i class="bi bi-shield-check"></i><span>コンテンツ審査</span><span class="badge-pending" id="moderation-badge" style="display:none;">0</span></a>
                <a class="nav-item" href="reports.html"><i class="bi bi-flag"></i><span>通報の確認</span><span class="badge-pending" id="report-badge" style="display:none;">0</span></a>
                <a class="nav-item" href="index.html#translations"><i class="bi bi-translate"></i><span>翻訳キュー</span><span class="badge-pending" id="translation-badge" style="display:none;">0</span></a>
                <a class="nav-item" href="index.html#dmca"><i class="bi bi-exclamation-triangle"></i><span>DMCA管理</span><span class="badge-pending" id="dmca-badge" style="display:none;">0</span></a>
                <div class="nav-section">分析</div>
                <a class="nav-item" href="analytics.html"><i class="bi bi-bar-chart-line"></i><span>アナリティクス</span></a>
                <div class="nav-section">サポート</div>
                <a class="nav-item active" href="inquiries.html"><i class="bi bi-envelope-open"></i><span>お問い合わせ</span><span class="badge-pending" id="inquiry-badge" style="display:none;">0</span></a>
                <a class="nav-item" href="feedback.html"><i class="bi bi-chat-dots"></i><span>フィードバック</span><span class="badge-pending" id="feedback-badge" style="display:none;">0</span></a>
                <div class="nav-section">財務</div>
                <a class="nav-item" href="index.html#finance"><i class="bi bi-graph-up"></i><span>収益レポート</span></a>
                <a class="nav-item" href="payouts.html"><i class="bi bi-cash-coin"></i><span>収益の支払い</span></a>
            </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <div><strong>お問い合わせ</strong> <span style="color:#7f8c8d; font-size:0.85rem; margin-left:10px;">返信はアプリ内メッセージで届きます</span></div>
            <div class="filter-btns btn-group" role="group">
                <button class="btn btn-sm btn-outline-secondary active" data-filter="" onclick="setFilter(this)">すべて</button>
                <button class="btn btn-sm btn-outline-secondary" data-filter="open" onclick="setFilter(this)">未対応</button>
                <button class="btn btn-sm btn-outline-secondary" data-filter="answered" onclick="setFilter(this)">返信済み</button>
                <button class="btn btn-sm btn-outline-secondary" data-filter="closed" onclick="setFilter(this)">クローズ</button>
            </div>
        </header>

        <div class="admin-content">
            <div class="alert" id="msg"></div>
            <div class="content-panel">
                <div class="panel-header"><h2><i class="bi bi-envelope-open"></i> 問い合わせ一覧 <span class="muted" id="countLabel"></span></h2></div>
                <div class="panel-body" id="inqList"><p class="muted">読み込み中...</p></div>
            </div>
        </div>
    </main>
</div>

<script>
    const API = (window.API_ORIGIN || '') + '/api/inquiries/admin';
    const token = localStorage.getItem('token');
    let currentFilter = '';

    // faq_categoriesのidに対応（contact.htmlの選択カテゴリ）
    const CATEGORIES = { 1: 'アカウント', 2: '購入・支払い', 3: '読書', 4: '翻訳', 5: '作家向け', 6: '翻訳者・編集者向け', 7: '不具合', 8: 'その他' };
    const STATUS_LABELS = { open: '未対応', answered: '返信済み', closed: 'クローズ' };

    function showMsg(text, kind) {
        const el = document.getElementById('msg');
        el.className = 'alert alert-' + (kind || 'info');
        el.textContent = text;
        el.style.display = 'block';
    }
    function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

    async function api(path, opts) {
        const resp = await fetch(API + path, Object.assign({
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
        }, opts));
        if (resp.status === 401 || resp.status === 403) {
            throw new Error('管理者アカウントでログインしてください（メインサイトでログイン後にこのページを開きます）');
        }
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
        return data;
    }

    function setFilter(btn) {
        document.querySelectorAll('.filter-btns .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        loadInquiries();
    }

    async function loadInquiries() {
        try {
            const data = await api(currentFilter ? '?status=' + currentFilter : '');
            const list = document.getElementById('inqList');
            document.getElementById('countLabel').textContent = '（' + data.inquiries.length + '件）';
            if (!data.inquiries.length) {
                list.innerHTML = '<p class="muted">該当する問い合わせはありません</p>';
                return;
            }
            list.innerHTML = data.inquiries.map(i => {
                const created = String(i.created_at).replace('T', ' ').slice(0, 16);
                const replyArea = i.status === 'closed' ? '' :
                    '<label class="form-label" style="font-size:0.85rem; font-weight:600;">返信（ユーザーのメッセージに届きます）</label>' +
                    '<textarea class="form-control mb-2" id="reply-' + i.inquiry_id + '" rows="4" placeholder="返信内容を入力..."></textarea>' +
                    '<button class="btn btn-sm btn-primary me-2" onclick="sendReply(\'' + i.inquiry_id + '\')"><i class="bi bi-send"></i> メッセージで返信</button>' +
                    '<button class="btn btn-sm btn-outline-secondary" onclick="closeInquiry(\'' + i.inquiry_id + '\')">返信せず閉じる</button>';
                return '<div class="inq-item" id="inq-' + i.inquiry_id + '">' +
                    '<div class="inq-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
                        '<div style="min-width:0;">' +
                            '<div style="font-weight:600; font-size:0.92rem;">' + esc(i.subject) + '</div>' +
                            '<div class="muted">' + esc(i.user_name || '') + ' &lt;' + esc(i.email) + '&gt; ・ ' + created + '</div>' +
                        '</div>' +
                        '<div style="display:flex; gap:8px; align-items:center;">' +
                            '<span class="cat-chip">' + (CATEGORIES[i.category] || esc(i.category)) + '</span>' +
                            '<span class="st ' + i.status + '">' + (STATUS_LABELS[i.status] || i.status) + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="inq-detail">' +
                        '<div class="inq-body-text">' + esc(i.body) + '</div>' +
                        replyArea +
                    '</div>' +
                '</div>';
            }).join('');
        } catch (e) {
            document.getElementById('inqList').innerHTML = '<p class="muted">' + esc(e.message) + '</p>';
        }
    }

    async function sendReply(id) {
        const ta = document.getElementById('reply-' + id);
        const message = (ta.value || '').trim();
        if (!message) { showMsg('返信内容を入力してください', 'warning'); return; }
        try {
            await api('/' + id + '/reply', { method: 'POST', body: JSON.stringify({ message }) });
            showMsg('返信をメッセージで送信しました（ステータス: 返信済み）', 'success');
            loadInquiries();
        } catch (e) {
            showMsg('返信に失敗しました: ' + e.message, 'danger');
        }
    }

    async function closeInquiry(id) {
        if (!confirm('この問い合わせを返信せずにクローズしますか？')) return;
        try {
            await api('/' + id + '/close', { method: 'POST' });
            showMsg('クローズしました', 'success');
            loadInquiries();
        } catch (e) {
            showMsg('更新に失敗しました: ' + e.message, 'danger');
        }
    }

    if (!token) {
        showMsg('管理者アカウントでログインしてください（メインサイトでログイン後にこのページを開きます）', 'warning');
        document.getElementById('inqList').innerHTML = '';
    } else {
        loadInquiries();
    }
</script>

    <script>
    // サイドバーの審査待ち件数バッジ（ダッシュボードと同じ数字を全ページで表示。1件以上のみ）
    (async function loadSidebarBadges() {
        const t = localStorage.getItem('token');
        if (!t) return;
        const get = (u) => fetch((window.API_ORIGIN || '') + u, { headers: { 'Authorization': 'Bearer ' + t } })
            .then(r => r.ok ? r.json() : null).catch(() => null);
        const show = (id, n) => {
            const el = document.getElementById(id);
            if (el && n > 0) { el.textContent = n; el.style.display = ''; }
        };
        const [ver, mod, dmca, trans, fb, inq, rep] = await Promise.all([
            get('/api/verification/admin/stats'),
            get('/api/moderation/admin/stats'),
            get('/api/dmca/admin/stats'),
            get('/api/translation-queue/admin/stats'),
            get('/api/feedback/admin/stats'),
            get('/api/inquiries/admin/stats'),
            get('/api/reports/admin/stats')
        ]);
        if (fb) show('feedback-badge', parseInt(fb.highPriority) || 0);
        if (ver) show('verification-badge', parseInt(ver.pending) || 0);
        if (mod) show('moderation-badge', parseInt(mod.draft) || 0);
        if (dmca && dmca.stats) show('dmca-badge', parseInt(dmca.stats.new) || 0);
        if (trans && trans.stats) show('translation-badge', parseInt(trans.stats.pending) || 0);
        if (inq) show('inquiry-badge', parseInt(inq.open) || 0);
        if (rep) show('report-badge', parseInt(rep.open) || 0);
    })();
    </script>
</body>
</html>
