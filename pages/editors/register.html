<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg?v=202608172055">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Editor - AuctLect</title>
    <script src="../../js/config.js?v=202608172055"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../../css/variables.css?v=202608172055" rel="stylesheet">
    <link href="../../css/style-new.css?v=202608172055" rel="stylesheet">
    <link href="../../css/components.css?v=202608172055" rel="stylesheet">
    <link href="../../css/navbar.css?v=202608172055" rel="stylesheet">
    <link href="../../css/mobile-fixes.css?v=202608172055" rel="stylesheet">

    <style>
        body { background: var(--color-bg); }
        .register-container { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
        .form-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .form-card h5 { font-family: var(--font-heading); margin-bottom: 1rem; }
        .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.4rem; }
        .success-box { text-align: center; padding: 3rem 1rem; }
        .success-box i { font-size: 3.5rem; color: #4c9a5f; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="register-container">
        <div class="text-center mb-4">
            <h1 style="font-family: var(--font-heading);"><i class="fas fa-pen-nib me-2"></i><span id="pageTitle">編集者として登録</span></h1>
            <p class="text-secondary" id="pageSubtitle"></p>
        </div>

        <div id="registerForm">
            <div class="form-card">
                <h5><i class="fas fa-user me-2"></i><span id="secBasic"></span></h5>
                <div class="mb-3">
                    <label class="form-label" id="labelDisplayName"></label>
                    <input type="text" class="form-control" id="display-name" maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label" id="labelBio"></label>
                    <textarea class="form-control" id="bio" rows="4" maxlength="2000"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" id="labelYears"></label>
                        <input type="number" class="form-control" id="years-experience" min="0" max="60" value="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" id="labelResponse"></label>
                        <select class="form-select" id="response-hours">
                            <option value="6">〜6h</option>
                            <option value="12">〜12h</option>
                            <option value="24" selected>〜24h</option>
                            <option value="48">〜48h</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h5><i class="fas fa-tags me-2"></i><span id="secSpecs"></span></h5>
                <div class="check-grid" id="specGrid"></div>
            </div>

            <div class="form-card">
                <h5><i class="fas fa-language me-2"></i><span id="secLangs"></span></h5>
                <p class="small text-secondary" id="langsHint"></p>
                <div class="check-grid" id="langGrid"></div>
                <div class="mt-3">
                    <label class="form-label" id="labelNative"></label>
                    <select class="form-select" id="native-lang" data-lang-select style="max-width: 260px;"></select>
                </div>
            </div>

            <!-- 収益受け取りの案内（Stripe等のアカウント不要・受取口座はプロフィールで登録） -->
            <div style="background:rgba(139,115,85,0.08); border:1px solid rgba(139,115,85,0.35); border-radius:8px; padding:0.75rem 1rem; margin-bottom:1rem; font-size:0.85rem;">
                <i class="fas fa-university me-1"></i>
                <span data-i18n="profile.payoutNotice">Receiving revenue: no Stripe or PayPal account is needed. Simply register your bank account on your Profile page — revenue is paid monthly (month-end closing, paid by the 15th of the following month; minimum ¥3,000 / $20 / £15).</span>
                <a href="../profile.html#payoutCard" data-i18n="profile.payoutNoticeLink">Register your payout account</a>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-custom btn-lg" onclick="submitRegistration()" id="btnSubmit"></button>
                <a href="index.html" class="btn btn-soft-custom" id="btnBack"></a>
            </div>
        </div>

        <div id="successView" class="form-card success-box" style="display:none;">
            <i class="fas fa-check-circle"></i>
            <h4 id="successTitle"></h4>
            <p class="text-secondary" id="successDesc"></p>
            <a href="index.html" class="btn btn-custom mt-2" id="btnGoDirectory"></a>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/i18n.js?v=202608172055"></script>
    <script src="../../js/navbar.js?v=202608172055"></script>
    <script>
        const API_BASE = (window.API_ORIGIN || '') + '/api';

        const uiText = {
            pageTitle: { en: 'Register as Editor', ja: '編集者として登録', zh: '注册为编辑', es: 'Registrarse como Editor', fr: 'S\'inscrire comme Editeur', de: 'Als Lektor registrieren', ko: '편집자로 등록', ar: 'التسجيل كمحرر', pt: 'Registrar-se como Editor', it: 'Registrati come Editor' },
            pageSubtitle: { en: 'Create your public profile so authors can find and contact you. Editors receive 10% of edited work sales.', ja: '公開プロフィールを作成すると、作家があなたを見つけて依頼できるようになります。編集者は編集作品の収益の10%を受け取ります。', zh: '创建公开资料，让作者可以找到并联系您。编辑获得编辑作品销售额的10%。', es: 'Crea tu perfil público para que los autores puedan encontrarte. Los editores reciben el 10% de las ventas.', fr: 'Créez votre profil public pour que les auteurs puissent vous trouver. Les éditeurs reçoivent 10% des ventes.', de: 'Erstellen Sie Ihr öffentliches Profil, damit Autoren Sie finden können. Lektoren erhalten 10% der Verkäufe.', ko: '공개 프로필을 만들면 작가가 당신을 찾아 의뢰할 수 있습니다. 편집자는 판매 수익의 10%를 받습니다.', ar: 'أنشئ ملفك العام ليتمكن المؤلفون من العثور عليك. يحصل المحررون على 10% من المبيعات.', pt: 'Crie seu perfil público para que autores possam encontrá-lo. Editores recebem 10% das vendas.', it: 'Crea il tuo profilo pubblico così gli autori possono trovarti. Gli editor ricevono il 10% delle vendite.' },
            secBasic: { en: 'Basic Information', ja: '基本情報', zh: '基本信息', es: 'Información básica', fr: 'Informations de base', de: 'Grundinformationen', ko: '기본 정보', ar: 'معلومات أساسية', pt: 'Informações básicas', it: 'Informazioni di Base' },
            labelDisplayName: { en: 'Display Name', ja: '表示名（ペンネーム可）', zh: '显示名称', es: 'Nombre visible', fr: 'Nom affiché', de: 'Anzeigename', ko: '표시 이름', ar: 'الاسم المعروض', pt: 'Nome de exibição', it: 'Nome Visualizzato' },
            labelBio: { en: 'Bio / Introduction', ja: '自己紹介', zh: '简介', es: 'Biografía', fr: 'Présentation', de: 'Über mich', ko: '자기소개', ar: 'نبذة تعريفية', pt: 'Biografia', it: 'Biografia' },
            labelYears: { en: 'Years of Experience', ja: '経験年数', zh: '经验年数', es: 'Años de experiencia', fr: 'Années d\'expérience', de: 'Jahre Erfahrung', ko: '경력(년)', ar: 'سنوات الخبرة', pt: 'Anos de experiência', it: 'Anni di Esperienza' },
            labelResponse: { en: 'Typical Response Time', ja: '返答時間の目安', zh: '典型响应时间', es: 'Tiempo de respuesta', fr: 'Délai de réponse', de: 'Antwortzeit', ko: '응답 시간', ar: 'وقت الاستجابة', pt: 'Tempo de resposta', it: 'Tempo di Risposta' },
            secSpecs: { en: 'Specializations', ja: '専門分野', zh: '专业领域', es: 'Especializaciones', fr: 'Spécialisations', de: 'Spezialisierungen', ko: '전문 분야', ar: 'التخصصات', pt: 'Especializações', it: 'Specializzazioni' },
            secLangs: { en: 'Working Languages', ja: '対応言語', zh: '工作语言', es: 'Idiomas de trabajo', fr: 'Langues de travail', de: 'Arbeitssprachen', ko: '작업 언어', ar: 'لغات العمل', pt: 'Idiomas de trabalho', it: 'Lingue di Lavoro' },
            langsHint: { en: 'Select all languages you can edit in.', ja: '編集を引き受けられる言語をすべて選択してください。', zh: '选择您可以编辑的所有语言。', es: 'Selecciona todos los idiomas en los que puedes editar.', fr: 'Sélectionnez toutes les langues dans lesquelles vous pouvez éditer.', de: 'Wählen Sie alle Sprachen, in denen Sie lektorieren können.', ko: '편집 가능한 언어를 모두 선택하세요.', ar: 'اختر جميع اللغات التي يمكنك التحرير بها.', pt: 'Selecione todos os idiomas em que você pode editar.', it: 'Seleziona tutte le lingue in cui puoi editare.' },
            labelNative: { en: 'Native Language', ja: 'ネイティブ言語', zh: '母语', es: 'Lengua materna', fr: 'Langue maternelle', de: 'Muttersprache', ko: '모국어', ar: 'اللغة الأم', pt: 'Língua nativa', it: 'Lingua Madre' },
            btnSubmit: { en: 'Create Profile', ja: 'プロフィールを作成', zh: '创建资料', es: 'Crear perfil', fr: 'Créer le profil', de: 'Profil erstellen', ko: '프로필 만들기', ar: 'إنشاء الملف', pt: 'Criar perfil', it: 'Crea Profilo' },
            btnBack: { en: 'Back to Directory', ja: '編集者一覧へ戻る', zh: '返回编辑列表', es: 'Volver al directorio', fr: 'Retour à l\'annuaire', de: 'Zurück zum Verzeichnis', ko: '목록으로 돌아가기', ar: 'العودة إلى الدليل', pt: 'Voltar ao diretório', it: 'Torna alla Directory' },
            successTitle: { en: 'Profile created!', ja: 'プロフィールを作成しました！', zh: '资料已创建！', es: '¡Perfil creado!', fr: 'Profil créé !', de: 'Profil erstellt!', ko: '프로필이 생성되었습니다!', ar: 'تم إنشاء الملف!', pt: 'Perfil criado!', it: 'Profilo creato!' },
            successDesc: { en: 'Your profile is now visible in the editor directory. Authors can contact you via Messages.', ja: 'あなたのプロフィールが編集者一覧に表示されるようになりました。作家からの依頼はメッセージに届きます。', zh: '您的资料现已显示在编辑列表中。作者将通过消息与您联系。', es: 'Tu perfil ya es visible en el directorio. Los autores te contactarán por Mensajes.', fr: 'Votre profil est visible dans l\'annuaire. Les auteurs vous contacteront par Messages.', de: 'Ihr Profil ist jetzt im Verzeichnis sichtbar. Autoren kontaktieren Sie über Nachrichten.', ko: '프로필이 편집자 목록에 표시됩니다. 작가의 의뢰는 메시지로 도착합니다.', ar: 'ملفك مرئي الآن في دليل المحررين. سيتواصل المؤلفون معك عبر الرسائل.', pt: 'Seu perfil está visível no diretório. Autores entrarão em contato via Mensagens.', it: 'Il tuo profilo è ora visibile nella directory. Gli autori ti contatteranno tramite Messaggi.' },
            btnGoDirectory: { en: 'View Directory', ja: '編集者一覧を見る', zh: '查看编辑列表', es: 'Ver directorio', fr: 'Voir l\'annuaire', de: 'Verzeichnis ansehen', ko: '목록 보기', ar: 'عرض الدليل', pt: 'Ver diretório', it: 'Vedi Directory' },
            alertLoginRequired: { en: 'Please log in first.', ja: '先にログインしてください。', zh: '请先登录。', es: 'Inicia sesión primero.', fr: 'Veuillez d\'abord vous connecter.', de: 'Bitte zuerst anmelden.', ko: '먼저 로그인해 주세요.', ar: 'يرجى تسجيل الدخول أولاً.', pt: 'Faça login primeiro.', it: 'Accedi prima.' },
            alertNeedName: { en: 'Please enter a display name.', ja: '表示名を入力してください。', zh: '请输入显示名称。', es: 'Introduce un nombre visible.', fr: 'Veuillez saisir un nom affiché.', de: 'Bitte Anzeigenamen eingeben.', ko: '표시 이름을 입력해 주세요.', ar: 'يرجى إدخال الاسم المعروض.', pt: 'Digite um nome de exibição.', it: 'Inserisci un nome visualizzato.' },
            alertNeedLang: { en: 'Please select at least one working language.', ja: '対応言語を1つ以上選択してください。', zh: '请至少选择一种工作语言。', es: 'Selecciona al menos un idioma.', fr: 'Sélectionnez au moins une langue.', de: 'Mindestens eine Sprache wählen.', ko: '언어를 하나 이상 선택해 주세요.', ar: 'اختر لغة واحدة على الأقل.', pt: 'Selecione pelo menos um idioma.', it: 'Seleziona almeno una lingua.' },
            alertRegFailed: { en: 'Registration failed', ja: '登録に失敗しました', zh: '注册失败', es: 'Error en el registro', fr: 'Échec de l\'inscription', de: 'Registrierung fehlgeschlagen', ko: '등록에 실패했습니다', ar: 'فشل التسجيل', pt: 'Falha no registro', it: 'Registrazione non riuscita' }
        };

        const SPECS = {
            fiction: { en: 'Fiction', ja: '小説', zh: '小说', es: 'Ficción', fr: 'Fiction', de: 'Belletristik', ko: '소설', ar: 'خيال', pt: 'Ficção', it: 'Narrativa' },
            manga: { en: 'Manga', ja: 'マンガ', zh: '漫画', es: 'Manga', fr: 'Manga', de: 'Manga', ko: '만화', ar: 'مانغا', pt: 'Mangá', it: 'Manga' },
            nonfiction: { en: 'Non-Fiction', ja: 'ノンフィクション', zh: '非虚构', es: 'No ficción', fr: 'Non-fiction', de: 'Sachbuch', ko: '논픽션', ar: 'غير خيالي', pt: 'Não ficção', it: 'Saggistica' },
            poetry: { en: 'Poetry', ja: '詩・俳句', zh: '诗歌', es: 'Poesía', fr: 'Poésie', de: 'Poesie', ko: '시', ar: 'شعر', pt: 'Poesia', it: 'Poesia' },
            academic: { en: 'Academic', ja: '学術', zh: '学术', es: 'Académico', fr: 'Académique', de: 'Akademisch', ko: '학술', ar: 'أكاديمي', pt: 'Acadêmico', it: 'Accademico' },
            childrens: { en: 'Children\'s', ja: '児童書', zh: '儿童文学', es: 'Infantil', fr: 'Jeunesse', de: 'Kinderbuch', ko: '아동', ar: 'أطفال', pt: 'Infantil', it: 'Ragazzi' }
        };
        const LANGS = { en: 'English', ja: '日本語', zh: '中文', es: 'Español', fr: 'Français', de: 'Deutsch', ko: '한국어', ar: 'العربية', pt: 'Português', it: 'Italiano' };

        function getL(obj) { const l = (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : (localStorage.getItem('preferredLanguage') || 'en'); return obj[l] || obj.en || ''; }

        function renderStatic() {
            ['pageTitle', 'pageSubtitle', 'secBasic', 'labelDisplayName', 'labelBio', 'labelYears', 'labelResponse',
             'secSpecs', 'secLangs', 'langsHint', 'labelNative', 'btnSubmit', 'btnBack',
             'successTitle', 'successDesc', 'btnGoDirectory'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el && uiText[id]) el.textContent = getL(uiText[id]);
            });
            document.title = getL(uiText.pageTitle) + ' - AuctLect';

            // 専門分野チェックボックス
            var sg = document.getElementById('specGrid');
            sg.innerHTML = Object.keys(SPECS).map(function(k) {
                var checked = document.getElementById('spec-' + k) && document.getElementById('spec-' + k).checked;
                return '<label class="form-check"><input class="form-check-input" type="checkbox" id="spec-' + k + '" value="' + k + '"' + (checked ? ' checked' : '') + '> <span>' + getL(SPECS[k]) + '</span></label>';
            }).join('');

            // 対応言語チェックボックス + ネイティブ言語セレクト
            var lg = document.getElementById('langGrid');
            lg.innerHTML = Object.keys(LANGS).map(function(k) {
                var checked = document.getElementById('lang-' + k) && document.getElementById('lang-' + k).checked;
                return '<label class="form-check"><input class="form-check-input" type="checkbox" id="lang-' + k + '" value="' + k + '"' + (checked ? ' checked' : '') + '> <span>' + LANGS[k] + '</span></label>';
            }).join('');
            var nl = document.getElementById('native-lang');
            var cur = nl.value;
            nl.innerHTML = Object.keys(LANGS).map(function(k) {
                return '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + LANGS[k] + '</option>';
            }).join('');
            // 選択肢を入れ直した後なので、文字方向を選び直された言語に合わせる
            if (typeof applyLangSelectDir === 'function') applyLangSelectDir(nl);
        }

        async function submitRegistration() {
            var token = localStorage.getItem('token');
            if (!token) {
                alert(getL(uiText.alertLoginRequired));
                window.location.href = '../login.html';
                return;
            }
            var displayName = document.getElementById('display-name').value.trim();
            if (!displayName) { alert(getL(uiText.alertNeedName)); return; }

            var nativeLang = document.getElementById('native-lang').value;
            var languages = [];
            Object.keys(LANGS).forEach(function(k) {
                var cb = document.getElementById('lang-' + k);
                if (cb && cb.checked) languages.push({ language: k, isNative: k === nativeLang });
            });
            if (!languages.length) { alert(getL(uiText.alertNeedLang)); return; }

            var specializations = [];
            Object.keys(SPECS).forEach(function(k) {
                var cb = document.getElementById('spec-' + k);
                if (cb && cb.checked) specializations.push(k);
            });

            try {
                var resp = await fetch(API_BASE + '/editors/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({
                        displayName: displayName,
                        bio: document.getElementById('bio').value,
                        yearsExperience: parseInt(document.getElementById('years-experience').value) || 0,
                        specializations: specializations,
                        avgResponseHours: parseInt(document.getElementById('response-hours').value) || 24,
                        languages: languages
                    })
                });
                var data = null;
                try { data = await resp.json(); } catch (e) {}
                if (!resp.ok) throw new Error((data && data.error) || ('HTTP ' + resp.status));
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('successView').style.display = '';
                window.scrollTo(0, 0);
            } catch (err) {
                alert(getL(uiText.alertRegFailed) + ': ' + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', renderStatic);
        document.addEventListener('languageChanged', renderStatic);
    </script>
</body>
</html>
