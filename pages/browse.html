<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="browse.title">Browse Works - Publisher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/style-new.css" rel="stylesheet">
    <link href="../css/mobile-fixes.css" rel="stylesheet">
    <style>
        .language-selector { position: fixed; top: 80px; right: 20px; z-index: 1000; }
        .language-selector select { padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-card); font-size: var(--font-size-sm); cursor: pointer; }
        .browse-container { padding: var(--spacing-xl) 0; }
        .page-header { margin-bottom: var(--spacing-xl); }
        .page-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .filter-sidebar { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-lg); }
        .filter-section { margin-bottom: var(--spacing-lg); }
        .filter-section h3 { font-size: var(--font-size-base); margin-bottom: var(--spacing-md); }
        .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--spacing-lg); }
        .work-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition-fast); }
        .work-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .work-cover { height: 280px; background: var(--color-bg-hover); display: flex; align-items: center; justify-content: center; }
        .work-cover i { font-size: 4rem; color: var(--color-accent-light); }
        .work-info { padding: var(--spacing-md); }
        .work-title { font-weight: 600; margin-bottom: var(--spacing-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .work-author { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--spacing-sm); }
        .work-meta { display: flex; justify-content: space-between; align-items: center; font-size: var(--font-size-sm); }
        .work-price { font-weight: 600; color: var(--color-accent); }
        .work-rating { color: var(--color-warning); }
        .results-count { margin-bottom: var(--spacing-md); color: var(--color-text-secondary); font-size: var(--font-size-sm); }
        .no-results { text-align: center; padding: var(--spacing-2xl); color: var(--color-text-secondary); }
        @media (max-width: 768px) { .filter-sidebar { margin-bottom: var(--spacing-lg); } }
        @media (max-width: 576px) { .language-selector { top: 70px; right: 10px; } .work-grid { grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md); } .work-cover { height: 180px; } }
    </style>
</head>
<body>
    <div class="language-selector">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="en">🇬🇧 English</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="ar">🇸🇦 العربية</option>
            <option value="pt">🇧🇷 Português</option>
        </select>
    </div>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="fas fa-book-open"></i> Publisher</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-th-large me-1"></i> <span data-i18n="nav.dashboard">Dashboard</span></a></li>
                    <li class="nav-item"><a class="nav-link active" href="browse.html"><i class="fas fa-compass me-1"></i> <span data-i18n="nav.browse">Browse</span></a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="notifications.html" class="btn btn-soft-custom position-relative"><i class="fas fa-bell"></i><span id="notificationBadge" class="position-absolute badge rounded-pill bg-danger" style="font-size:0.55rem;display:none;top:0;right:0;">0</span></a>
                    <div class="dropdown">
                        <button class="btn btn-soft-custom dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="fas fa-user-circle me-1"></i><span id="userName">User</span></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="account-settings.html"><i class="fas fa-cog me-2"></i><span data-i18n="nav.settings">Settings</span></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i><span data-i18n="nav.logout">Logout</span></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main class="browse-container">
        <div class="container">
            <div class="page-header">
                <h1><i class="fas fa-compass me-2 text-accent"></i><span data-i18n="browse.title">Browse Works</span></h1>
                <p data-i18n="browse.subtitle">Discover amazing stories from creators worldwide</p>
            </div>
            <div class="row">
                <div class="col-lg-3 col-md-4">
                    <div class="filter-sidebar">
                        <div class="filter-section">
                            <h3 data-i18n="browse.category">Category</h3>
                            <select class="form-select" id="categoryFilter">
                                <option value="" data-i18n="browse.allCategories">All Categories</option>
                                <option value="fiction" data-i18n="browse.categories.fiction">Fiction</option>
                                <option value="non-fiction" data-i18n="browse.categories.nonFiction">Non-Fiction</option>
                                <option value="manga" data-i18n="browse.categories.manga">Manga</option>
                                <option value="poetry" data-i18n="browse.categories.poetry">Poetry</option>
                            </select>
                        </div>
                        <div class="filter-section">
                            <h3 data-i18n="browse.language">Language</h3>
                            <select class="form-select" id="languageFilter">
                                <option value="" data-i18n="browse.allLanguages">All Languages</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="zh">中文</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="de">Deutsch</option>
                                <option value="ko">한국어</option>
                                <option value="ar">العربية</option>
                                <option value="pt">Português</option>
                            </select>
                        </div>
                        <div class="filter-section">
                            <h3 data-i18n="browse.sortBy">Sort By</h3>
                            <select class="form-select" id="sortFilter">
                                <option value="popular" data-i18n="browse.mostPopular">Most Popular</option>
                                <option value="newest" data-i18n="browse.newest">Newest</option>
                                <option value="rating" data-i18n="browse.highestRated">Highest Rated</option>
                                <option value="price-low" data-i18n="browse.priceLowHigh">Price: Low to High</option>
                            </select>
                        </div>
                        <button class="btn btn-custom w-100" onclick="applyFilters()" data-i18n="browse.applyFilters">Apply Filters</button>
                    </div>
                </div>
                <div class="col-lg-9 col-md-8">
                    <div class="results-count"><span id="resultsCount">4</span> <span data-i18n="browse.worksFound">works found</span></div>
                    <div class="work-grid" id="workGrid">
                        <!-- Works will be loaded dynamically -->
                    </div>
                    <div class="no-results" id="noResults" style="display:none;">
                        <i class="fas fa-search fa-3x mb-3"></i>
                        <p data-i18n="browse.noResults">No works found matching your criteria</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer-custom">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <p class="small mb-0">&copy; 2025 Publisher. All rights reserved.</p>
                <div class="d-flex gap-3">
                    <a href="support/faq.html" class="text-secondary" data-i18n="footer.help">Help</a>
                    <a href="terms.html" class="text-secondary" data-i18n="footer.terms">Terms</a>
                    <a href="privacy.html" class="text-secondary" data-i18n="footer.privacy">Privacy</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/language-switcher.js"></script>
    <script src="../js/header-notification.js"></script>
    <script>
        // i18n helper
        function t(key) {
            const lang = localStorage.getItem('publisher_language') || 'en';
            const keys = key.split('.');
            let value = translations[lang];
            for (const k of keys) {
                if (value && value[k] !== undefined) {
                    value = value[k];
                } else {
                    value = translations['en'];
                    for (const k2 of keys) {
                        if (value && value[k2] !== undefined) value = value[k2];
                        else return key;
                    }
                    break;
                }
            }
            return typeof value === 'string' ? value : key;
        }

        // Sample works data
        const sampleWorks = [
            { id: 1, title: 'The Adventure of Magic Academy', author: 'Sarah Chen', price: 4.99, rating: 4.8, category: 'fiction', language: 'en' },
            { id: 2, title: 'Whispers of Tomorrow', author: 'James Miller', price: 3.99, rating: 4.6, category: 'fiction', language: 'en' },
            { id: 3, title: 'Digital Dreams', author: 'Yuki Tanaka', price: 5.99, rating: 4.9, category: 'manga', language: 'ja' },
            { id: 4, title: 'The Last Kingdom', author: 'Maria Garcia', price: 2.99, rating: 4.5, category: 'fiction', language: 'es' },
            { id: 5, title: '月光の詩', author: '田中花子', price: 0, rating: 4.7, category: 'poetry', language: 'ja' },
            { id: 6, title: 'Le Monde Nouveau', author: 'Pierre Dubois', price: 3.49, rating: 4.4, category: 'non-fiction', language: 'fr' }
        ];

        function renderWorks(works) {
            const grid = document.getElementById('workGrid');
            const noResults = document.getElementById('noResults');
            const countEl = document.getElementById('resultsCount');
            
            if (works.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                countEl.textContent = '0';
                return;
            }
            
            grid.style.display = 'grid';
            noResults.style.display = 'none';
            countEl.textContent = works.length;
            
            grid.innerHTML = works.map(work => `
                <div class="work-card" onclick="viewWork(${work.id})">
                    <div class="work-cover"><i class="fas fa-book"></i></div>
                    <div class="work-info">
                        <div class="work-title">${escapeHtml(work.title)}</div>
                        <div class="work-author">${t('browse.by')} ${escapeHtml(work.author)}</div>
                        <div class="work-meta">
                            <span class="work-price">${work.price === 0 ? t('common.free') : '$' + work.price.toFixed(2)}</span>
                            <span class="work-rating"><i class="fas fa-star"></i> ${work.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const category = document.getElementById('categoryFilter').value;
            const language = document.getElementById('languageFilter').value;
            const sort = document.getElementById('sortFilter').value;
            
            let filtered = [...sampleWorks];
            
            if (category) filtered = filtered.filter(w => w.category === category);
            if (language) filtered = filtered.filter(w => w.language === language);
            
            switch(sort) {
                case 'newest': filtered.reverse(); break;
                case 'rating': filtered.sort((a, b) => b.rating - a.rating); break;
                case 'price-low': filtered.sort((a, b) => a.price - b.price); break;
                default: filtered.sort((a, b) => b.rating - a.rating);
            }
            
            renderWorks(filtered);
        }

        function viewWork(id) {
            window.location.href = `reader.html?id=${id}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.firstName) document.getElementById('userName').textContent = user.firstName;
            renderWorks(sampleWorks);
        });
    </script>
</body>
</html>
