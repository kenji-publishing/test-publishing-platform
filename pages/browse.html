    <!-- Pattern C Navbar Styles -->
    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }
        
        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1055;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Menu ========== */
        @media (max-width: 991.98px) {

        }
    </style>
    
    <!-- Browse Page Styles -->
    <style>
        .browse-container { padding: var(--spacing-xl) 0; }
        .page-header { margin-bottom: var(--spacing-xl); }
        .page-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .filter-sidebar { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-lg); }
        .filter-section { margin-bottom: var(--spacing-lg); }
        .filter-section h3 { font-size: var(--font-size-base); margin-bottom: var(--spacing-md); }
        .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--spacing-lg); }
        .work-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition-fast); cursor: pointer; }
        .work-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        /* 表紙は縦2:3で表示する（index/libraryと共通。固定の高さだと上下が切れる） */
        .work-cover { aspect-ratio: 2/3; background: var(--color-bg-hover); display: flex; align-items: center; justify-content: center; }
        .work-cover i { font-size: 4rem; color: var(--color-accent-light); }
        .work-info { padding: var(--spacing-md); }
        .work-title { font-weight: 600; margin-bottom: var(--spacing-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .work-author { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--spacing-sm); }
        .work-meta { display: flex; justify-content: space-between; align-items: center; font-size: var(--font-size-sm); }
        .work-price { font-weight: 600; color: var(--color-accent); }
        .work-rating { color: var(--color-warning); }
        .results-count { margin-bottom: var(--spacing-md); color: var(--color-text-secondary); font-size: var(--font-size-sm); }
        .no-results { text-align: center; padding: var(--spacing-2xl); color: var(--color-text-secondary); }
        @media (max-width: 768px) { .filter-sidebar { margin-bottom: var(--spacing-lg); } }
        @media (max-width: 576px) { .work-grid { grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md); } }
    </style>
</head>

<div id="navbar-container"></div>

    <main class="browse-container">
        <div class="container">
            <div class="page-header">
                <h1><i class="fas fa-compass me-2 text-accent"></i><span id="pageTitle" data-i18n="browse.pageTitle">Browse Works</span></h1>
                <p id="pageSubtitle" data-i18n="browse.pageSubtitle">Discover amazing stories from creators worldwide</p>
            </div>
            <div class="row">
                <div class="col-lg-3 col-md-4">
                    <div class="filter-sidebar">
                        <div class="filter-section">
                            <h3 id="filterSearch" data-i18n="browse.filterSearch">Search</h3>
                            <div class="input-group">
                                <input type="text" class="form-control" id="searchInput" data-i18n-placeholder="browse.searchPlaceholder" placeholder="Title or author..." onkeyup="if(event.key==='Enter')applyFilters()">
                                <button class="btn btn-custom" onclick="applyFilters()"><i class="fas fa-search"></i></button>
                            </div>
                        </div>
                        <div class="filter-section">
                            <h3 id="filterCategory" data-i18n="browse.filterCategory">Category</h3>
                            <select class="form-select" id="categoryFilter">
                                <option value="" id="optAllCategories" data-i18n="browse.optAllCategories">All Categories</option>
                                <option value="fiction" id="optFiction" data-i18n="browse.optFiction">Fiction</option>
                                <option value="non-fiction" id="optNonFiction" data-i18n="browse.optNonFiction">Non-Fiction</option>
                                <option value="manga" id="optManga" data-i18n="browse.optManga">Manga</option>
                                <option value="poetry" id="optPoetry" data-i18n="browse.optPoetry">Poetry</option>
                            </select>
                        </div>
                        <div class="filter-section">
                            <h3 id="filterLanguage" data-i18n="browse.filterLanguage">Language</h3>
                            <select class="form-select" id="languageFilter" data-lang-select>
                                <option value="" id="optAllLanguages" data-i18n="browse.optAllLanguages">All Languages</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="zh">中文</option>
                                <option value="es">Español</option>
                                <option value="fr">Français</option>
                                <option value="de">Deutsch</option>
                                <option value="ko">한국어</option>
                                <option value="ar">العربية</option>
                                <option value="pt">Português</option>
                                <option value="it">Italiano</option>
                            </select>
                        </div>
                        <div class="filter-section">
                            <h3 id="filterSortBy" data-i18n="browse.filterSortBy">Sort By</h3>
                            <select class="form-select" id="sortFilter">
                                <option value="popular" id="optPopular" data-i18n="browse.optPopular">Most Popular</option>
                                <option value="newest" id="optNewest" data-i18n="browse.optNewest">Newest</option>
                                <option value="rating" id="optRating" data-i18n="browse.optRating">Highest Rated</option>
                                <option value="price-low" id="optPriceLow" data-i18n="browse.optPriceLow">Price: Low to High</option>
                            </select>
                        </div>
                        <button class="btn btn-custom w-100 mb-2" onclick="applyFilters()" id="btnApplyFilters" data-i18n="browse.btnApplyFilters">Apply Filters</button>
                        <button class="btn btn-outline-custom w-100" onclick="showRecommended()" id="btnRecommended">
                            <i class="fas fa-magic me-1"></i><span id="btnRecommendedText" data-i18n="browse.btnRecommended">Recommended for You</span>
                        </button>
                    </div>
                </div>
                <div class="col-lg-9 col-md-8">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="results-count"><span id="resultsCount">0</span> <span id="worksFoundLabel" data-i18n="browse.worksFound">works found</span></div>
                        <div id="recommendedBadge" style="display:none;">
                            <span class="badge bg-accent text-white"><i class="fas fa-magic me-1"></i><span id="recommendedLabel">Recommended for You</span></span>
                        </div>
                    </div>
                    <div class="work-grid" id="workGrid"></div>
                    <div class="no-results" id="noResults" style="display:none;">
                        <i class="fas fa-search fa-3x mb-3"></i>
                        <p id="noResultsText" data-i18n="browse.noResults">No works found matching your criteria</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pattern C Navbar Script -->
    <script>
        // ========== 多言語対応テキスト（9言語）==========
// Navbar initialization
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                // User dropdown close on outside click
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.user-dropdown')) {
                        const dropdown = document.getElementById('userDropdown');
                        const dropdownMenu = document.getElementById('userMenu');
                        if (dropdown) dropdown.classList.remove('open');
                        if (dropdownMenu) dropdownMenu.classList.remove('show');
                    }
                });
                
                // Mobile overlay

                
                if (navbarOverlay) {
                    navbarOverlay.addEventListener('click', function() {
                        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                        if (bsCollapse) bsCollapse.hide();
                    });
                }
            });
            
            document.addEventListener('languageChanged', function() {
            });
        })();
    </script>

            free: { en: 'Free', ja: '無料', zh: '免费', es: 'Gratis', fr: 'Gratuit', de: 'Kostenlos', ko: '무료', ar: 'مجاني', pt: 'Grátis', it: 'Gratuito' },
            footerHelp: { en: 'Help', ja: 'ヘルプ', zh: '帮助', es: 'Ayuda', fr: 'Aide', de: 'Hilfe', ko: '도움말', ar: 'مساعدة', pt: 'Ajuda', it: 'Aiuto' },
            footerTerms: { en: 'Terms', ja: '利用規約', zh: '条款', es: 'Términos', fr: 'Conditions', de: 'Bedingungen', ko: '약관', ar: 'الشروط', pt: 'Termos', it: 'Termini' },
            footerPrivacy: { en: 'Privacy', ja: 'プライバシー', zh: '隐私', es: 'Privacidad', fr: 'Confidentialité', de: 'Datenschutz', ko: '개인정보', ar: 'الخصوصية', pt: 'Privacidade', it: 'Privacy' },
        };

        // Sample works data
        let sampleWorks = [];

        async function loadWorksFromApi() {
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/works?limit=100');
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
                sampleWorks = (data.works || []).map(function(w) {
                    return {
                        id: w.work_id,
                        title: w.title,
                        author: w.author_name || 'Unknown',
                        price: Number(w.price) || 0,
                        currency: w.currency || 'USD',
                        rating: w.rating_average != null ? Number(w.rating_average) : 0,
                        category: w.genre || 'general',
                        language: w.language || w.original_language || 'en',
                        cover: w.cover_image || w.cover_image_url || null,
                        aiText: w.ai_text_usage || 'none',
                        aiCover: w.ai_cover_usage || 'none',
                        tags: [],
                        description: w.description || '',
                        reviews: ''
                    };
                });
            } catch (err) {
                console.error('Failed to load works:', err);
            }
            applyFilters();
        }
function updateAllText() {
            document.title = getL(uiText.pageTitle) + ' - AuctLect';
            if (typeof i18n !== 'undefined') i18n.applyToDOM();
            // Re-render works to update "by" and "Free" text
            applyFilters();
        }
        function renderWorks(works) {
            const grid = document.getElementById('workGrid');
            const noResults = document.getElementById('noResults');
            const countEl = document.getElementById('resultsCount');
            
            if (works.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                countEl.textContent = '0';
                return;
            }
            
            grid.style.display = 'grid';
            noResults.style.display = 'none';
            countEl.textContent = works.length;
            
            grid.innerHTML = works.map(work => `
                <div class="work-card" onclick="viewWork('${work.id}')">
                    <div class="work-cover" style="position:relative;">
                        ${work.cover
                            ? '<img src="' + work.cover + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
                            : '<i class="fas fa-book"></i>'}
                        ${(function() {
                            var l = getAiBadgeLabel(work.aiText, work.aiCover);
                            return l ? '<span style="position:absolute; bottom:6px; left:6px; right:6px; text-align:center; padding:0.2rem 0.4rem; border-radius:6px; font-size:0.7rem; font-weight:600; background:rgba(40,50,80,0.85); color:#fff;"><i class=\'fas fa-robot me-1\'></i>' + l + '</span>' : '';
                        })()}
                    </div>
                    <div class="work-info">
                        <div class="work-title" dir="auto">${escapeHtml(work.title)}</div>
                        <div class="work-author">${getL(uiText.by)} <span dir="auto">${escapeHtml(work.author)}</span></div>
                        <div class="work-meta">
                            <span class="work-price">${Number(work.price) > 0 ? formatWorkPrice(work.price, work.currency) : getL(uiText.free)}</span>
                            <span class="work-rating"><i class="fas fa-star"></i> ${work.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            document.getElementById('recommendedBadge').style.display = 'none';
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const language = document.getElementById('languageFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let filtered = [...sampleWorks];

            if (searchQuery) filtered = filtered.filter(w =>
                w.title.toLowerCase().includes(searchQuery) ||
                w.author.toLowerCase().includes(searchQuery) ||
                (w.description && w.description.toLowerCase().includes(searchQuery)) ||
                (w.reviews && w.reviews.toLowerCase().includes(searchQuery))
            );
            if (category) filtered = filtered.filter(w => w.category === category);
            if (language) filtered = filtered.filter(w => w.language === language);

            switch(sort) {
                case 'newest': filtered.reverse(); break;
                case 'rating': filtered.sort((a, b) => b.rating - a.rating); break;
                case 'price-low': filtered.sort((a, b) => a.price - b.price); break;
                default: filtered.sort((a, b) => b.rating - a.rating);
            }

            renderWorks(filtered);
        }

        function showRecommended() {
            // Reset filters
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('languageFilter').value = '';
            document.getElementById('sortFilter').value = 'popular';

            const isLoggedIn = document.body.classList.contains('logged-in');
            const badge = document.getElementById('recommendedBadge');
            const label = document.getElementById('recommendedLabel');

            if (isLoggedIn) {
                // Logged in: personalized recommendations based on user preferences
                const userLang = getCurrentLang();
                const userPrefs = JSON.parse(localStorage.getItem('userPreferences') || '{}');
                const favCategories = userPrefs.categories || ['fiction', 'manga'];
                const favTags = userPrefs.tags || ['fantasy', 'adventure', 'cyberpunk'];

                let scored = sampleWorks.map(w => {
                    let score = 0;
                    if (favCategories.includes(w.category)) score += 3;
                    if (w.language === userLang) score += 2;
                    if (w.tags) w.tags.forEach(t => { if (favTags.includes(t)) score += 2; });
                    score += w.rating;
                    return { ...w, score };
                });
                scored.sort((a, b) => b.score - a.score);

                label.textContent = getL(uiText.btnRecommended);
                badge.style.display = 'block';
                renderWorks(scored);
            } else {
                // Not logged in: AuctLect's random picks
                let shuffled = [...sampleWorks].sort(() => Math.random() - 0.5);

                label.textContent = getL(uiText.publisherPicks);
                badge.style.display = 'block';
                renderWorks(shuffled);
            }
        }

        function viewWork(id) {
            window.location.href = `work-detail.html?id=${id}`;
        }

        // getAiBadgeLabel は navbar.js の共通版を使用

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateAllText();
            loadWorksFromApi();
        });

        document.addEventListener('languageChanged', function(e) {
            const l = e.detail.language || e.detail.lang;
            if (l) { const d = document.getElementById('languageSelector'), m = document.getElementById('languageSelectorMobile'); if (d) d.value = l; if (m) m.value = l; }
            updateAllText();
        });

        if (typeof i18n !== 'undefined') {
            i18n.onLanguageChange(function() {
                i18n.applyToDOM();
                applyFilters();
            });
        }
    </script>
</body>
</html>
