    <!-- Pattern C Navbar Styles -->
    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }
        
        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1055;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Menu ========== */
        @media (max-width: 991.98px) {

        }
    </style>
    
    <!-- Browse Page Styles -->
    <style>
        .browse-container { padding: var(--spacing-xl) 0; }
        .page-header { margin-bottom: var(--spacing-xl); }
        .page-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .filter-sidebar { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-lg); }
        .filter-section { margin-bottom: var(--spacing-lg); }
        .filter-section h3 { font-size: var(--font-size-base); margin-bottom: var(--spacing-md); }
        .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--spacing-lg); }
        .work-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition-fast); cursor: pointer; }
        .work-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .work-cover { height: 280px; background: var(--color-bg-hover); display: flex; align-items: center; justify-content: center; }
        .work-cover i { font-size: 4rem; color: var(--color-accent-light); }
        .work-info { padding: var(--spacing-md); }
        .work-title { font-weight: 600; margin-bottom: var(--spacing-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .work-author { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--spacing-sm); }
        .work-meta { display: flex; justify-content: space-between; align-items: center; font-size: var(--font-size-sm); }
        .work-price { font-weight: 600; color: var(--color-accent); }
        .work-rating { color: var(--color-warning); }
        .results-count { margin-bottom: var(--spacing-md); color: var(--color-text-secondary); font-size: var(--font-size-sm); }
        .no-results { text-align: center; padding: var(--spacing-2xl); color: var(--color-text-secondary); }
        @media (max-width: 768px) { .filter-sidebar { margin-bottom: var(--spacing-lg); } }
        @media (max-width: 576px) { .work-grid { grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md); } .work-cover { height: 180px; } }
    </style>
</head>

    <!-- Pattern C Navbar Script -->
    <script>
        // ========== 多言語対応テキスト（9言語）==========
// Navbar initialization
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                loadUserInfo();
                
                // User dropdown close on outside click
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.user-dropdown')) {
                        const dropdown = document.getElementById('userDropdown');
                        const dropdownMenu = document.getElementById('userMenu');
                        if (dropdown) dropdown.classList.remove('open');
                        if (dropdownMenu) dropdownMenu.classList.remove('show');
                    }
                });
                
                // Mobile overlay
                const navbarCollapse = document.getElementById('navbarNav');
                const navbarOverlay = document.getElementById('navbarOverlay');
                
                if (navbarCollapse) {
                    navbarCollapse.addEventListener('show.bs.collapse', function() {
                        if (navbarOverlay) navbarOverlay.classList.add('show');
                    });
                    navbarCollapse.addEventListener('hide.bs.collapse', function() {
                        if (navbarOverlay) navbarOverlay.classList.remove('show');
                    });
                }
                
                if (navbarOverlay) {
                    navbarOverlay.addEventListener('click', function() {
                        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                        if (bsCollapse) bsCollapse.hide();
                    });
                }
            });
            
            document.addEventListener('languageChanged', function() {
            });
        })();
    </script>

            { id: 4, title: 'The Last Kingdom', author: 'Maria Garcia', price: 2.99, rating: 4.5, category: 'fiction', language: 'es', tags: ['historical', 'romance', 'medieval'], description: 'Una épica historia medieval sobre el último reino que resiste la invasión. Amor, traición y valentía se entrelazan en esta saga histórica llena de batallas y romance.', reviews: 'Historia épica con personajes memorables. Great historical fiction with vivid battle scenes. Medieval romance at its finest. La mejor novela histórica del año.' },
            { id: 5, title: '月光の詩', author: '田中花子', price: 0, rating: 4.7, category: 'poetry', language: 'ja', tags: ['nature', 'love', 'seasons'], description: '四季の移ろいと人生の美しさを詠んだ現代詩集。月の光に照らされた日本の風景と心の機微を繊細な言葉で紡ぐ。自然、愛、孤独をテーマにした珠玉の詩篇。', reviews: '心に染みる美しい詩集。読むたびに新しい発見がある。日本語の美しさを再認識させてくれる。Hauntingly beautiful poetry collection.' },
            { id: 6, title: 'Le Monde Nouveau', author: 'Pierre Dubois', price: 3.49, rating: 4.4, category: 'non-fiction', language: 'fr', tags: ['philosophy', 'society', 'climate'], description: 'Une exploration fascinante de la mondialisation et son impact sur les cultures locales. Essai philosophique sur le changement climatique, la technologie et l\'avenir de l\'humanité.', reviews: 'Brillante analyse sociologique. Eye-opening perspective on globalization. Un essai incontournable pour comprendre notre époque. Climate change discussion is particularly compelling.' },

function updateAllText() {
            document.title = getL(uiText.pageTitle) + ' - Publisher';
            if (typeof i18n !== 'undefined') i18n.applyToDOM();
            // Re-render works to update "by" and "Free" text
            applyFilters();
        }
        function renderWorks(works) {
            const grid = document.getElementById('workGrid');
            const noResults = document.getElementById('noResults');
            const countEl = document.getElementById('resultsCount');
            
            if (works.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                countEl.textContent = '0';
                return;
            }
            
            grid.style.display = 'grid';
            noResults.style.display = 'none';
            countEl.textContent = works.length;
            
            grid.innerHTML = works.map(work => `
                <div class="work-card" onclick="viewWork(${work.id})">
                    <div class="work-cover"><i class="fas fa-book"></i></div>
                    <div class="work-info">
                        <div class="work-title">${escapeHtml(work.title)}</div>
                        <div class="work-author">${getL(uiText.by)} ${escapeHtml(work.author)}</div>
                        <div class="work-meta">
                            <span class="work-price">${work.price === 0 ? getL(uiText.free) : '$' + work.price.toFixed(2)}</span>
                            <span class="work-rating"><i class="fas fa-star"></i> ${work.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            document.getElementById('recommendedBadge').style.display = 'none';
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const language = document.getElementById('languageFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let filtered = [...sampleWorks];

            if (searchQuery) filtered = filtered.filter(w =>
                w.title.toLowerCase().includes(searchQuery) ||
                w.author.toLowerCase().includes(searchQuery) ||
                (w.description && w.description.toLowerCase().includes(searchQuery)) ||
                (w.reviews && w.reviews.toLowerCase().includes(searchQuery))
            );
            if (category) filtered = filtered.filter(w => w.category === category);
            if (language) filtered = filtered.filter(w => w.language === language);

            switch(sort) {
                case 'newest': filtered.reverse(); break;
                case 'rating': filtered.sort((a, b) => b.rating - a.rating); break;
                case 'price-low': filtered.sort((a, b) => a.price - b.price); break;
                default: filtered.sort((a, b) => b.rating - a.rating);
            }

            renderWorks(filtered);
        }

        function showRecommended() {
            // Reset filters
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('languageFilter').value = '';
            document.getElementById('sortFilter').value = 'popular';

            const isLoggedIn = document.body.classList.contains('logged-in');
            const badge = document.getElementById('recommendedBadge');
            const label = document.getElementById('recommendedLabel');

            if (isLoggedIn) {
                // Logged in: personalized recommendations based on user preferences
                const userLang = getCurrentLang();
                const userPrefs = JSON.parse(localStorage.getItem('userPreferences') || '{}');
                const favCategories = userPrefs.categories || ['fiction', 'manga'];
                const favTags = userPrefs.tags || ['fantasy', 'adventure', 'cyberpunk'];

                let scored = sampleWorks.map(w => {
                    let score = 0;
                    if (favCategories.includes(w.category)) score += 3;
                    if (w.language === userLang) score += 2;
                    if (w.tags) w.tags.forEach(t => { if (favTags.includes(t)) score += 2; });
                    score += w.rating;
                    return { ...w, score };
                });
                scored.sort((a, b) => b.score - a.score);

                label.textContent = getL(uiText.btnRecommended);
                badge.style.display = 'block';
                renderWorks(scored);
            } else {
                // Not logged in: Publisher's random picks
                let shuffled = [...sampleWorks].sort(() => Math.random() - 0.5);

                label.textContent = getL(uiText.publisherPicks);
                badge.style.display = 'block';
                renderWorks(shuffled);
            }
        }

        function viewWork(id) {
            window.location.href = `work-detail.html?id=${id}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateAllText();
            applyFilters();
        });

        document.addEventListener('languageChanged', function(e) {
            const l = e.detail.language || e.detail.lang;
            if (l) { const d = document.getElementById('languageSelector'), m = document.getElementById('languageSelectorMobile'); if (d) d.value = l; if (m) m.value = l; }
            updateAllText();
        });

        if (typeof i18n !== 'undefined') {
            i18n.onLanguageChange(function() {
                i18n.applyToDOM();
                applyFilters();
            });
        }
    </script>
</body>
