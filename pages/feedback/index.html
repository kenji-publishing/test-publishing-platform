    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }
        
        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1001;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Adjustments ========== */
        @media (max-width: 991.98px) {

        }

        /* ========== Page Specific Styles ========== */
        .page-header { background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%); color: white; padding: var(--spacing-xl) 0; margin-bottom: var(--spacing-xl); }
        .page-header h1 { color: white; font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .page-header p { color: rgba(255,255,255,0.9); margin: 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-md); margin-bottom: var(--spacing-xl); }
        .stat-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-lg); text-align: center; }
        .stat-card .stat-value { font-family: var(--font-heading); font-size: var(--font-size-2xl); font-weight: 700; color: var(--color-text-primary); }
        .stat-card .stat-label { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
        .stat-card.warning .stat-value { color: var(--color-warning); }
        .stat-card.success .stat-value { color: var(--color-success); }
        .feedback-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-lg); margin-bottom: var(--spacing-md); transition: all var(--transition-fast); }
        .feedback-card:hover { box-shadow: var(--shadow-md); }
        .feedback-card.high-priority { border-left: 4px solid var(--color-warning); }
        .feedback-text { background: var(--color-bg-hover); border-radius: var(--radius-md); padding: var(--spacing-md); margin: var(--spacing-md) 0; font-family: var(--font-body); }
        .feedback-text .original { color: var(--color-text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--spacing-sm); }
        .feedback-text .translated { color: var(--color-text-primary); border-left: 3px solid var(--color-warning); padding-left: var(--spacing-sm); }
        .category-badge { display: inline-block; padding: 4px 12px; border-radius: var(--radius-full); font-size: var(--font-size-xs); font-weight: 500; }
        .category-badge.mistranslation { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .category-badge.unnatural { background: rgba(241, 196, 15, 0.1); color: #f1c40f; }
        .category-badge.unclear { background: rgba(52, 152, 219, 0.1); color: #3498db; }
        .category-badge.typo { background: rgba(155, 89, 182, 0.1); color: #9b59b6; }
        .category-badge.cultural { background: rgba(230, 126, 34, 0.1); color: #e67e22; }
        .category-badge.other { background: rgba(149, 165, 166, 0.1); color: #95a5a6; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: var(--radius-full); font-size: var(--font-size-xs); font-weight: 500; }
        .status-badge.pending { background: rgba(241, 196, 15, 0.1); color: #f1c40f; }
        .status-badge.reviewing { background: rgba(52, 152, 219, 0.1); color: #3498db; }
        .status-badge.accepted { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        .status-badge.rejected { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .status-badge.fixed { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        .agree-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: var(--radius-full); font-size: var(--font-size-sm); cursor: pointer; transition: all var(--transition-fast); border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text-secondary); }
        .agree-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
        .agree-btn.agreed { background: rgba(139, 115, 85, 0.1); border-color: var(--color-accent); color: var(--color-accent); }
        .agree-btn .count { font-weight: 600; }
        .filter-bar { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-md); margin-bottom: var(--spacing-lg); }
        .empty-state { text-align: center; padding: var(--spacing-2xl); color: var(--color-text-secondary); }
        .empty-state i { font-size: 4rem; margin-bottom: var(--spacing-md); opacity: 0.3; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>

<body>
    <!-- Navbar Overlay -->
    <div id="navbar-container"></div>

<div class="page-header">
        <div class="container">
            <h1><i class="fas fa-comments me-2"></i><span id="pageTitle" data-i18n="feedback.pageTitle">Translation Feedback</span></h1>
            <p id="pageSubtitle" data-i18n="feedback.pageSubtitle">Review and manage translation feedback from readers</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="filter-bar">
            <div class="row align-items-center">
                <div class="col-md-4"><label class="form-label mb-0" id="labelSelectWork" data-i18n="feedback.labelSelectWork">Select Work</label></div>
                <div class="col-md-8">
                    <select class="form-select" id="work-select" onchange="loadFeedback()">
                        <option value="" id="optSelectWork" data-i18n="feedback.optSelectWork">Select a work</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="stats-grid" id="stats-grid" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label" id="labelTotalFeedback" data-i18n="feedback.labelTotalFeedback">Total Feedback</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-value" id="stat-priority">0</div>
                <div class="stat-label" id="labelNeedsAction" data-i18n="feedback.labelNeedsAction">Needs Action (3+ agrees)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-pending">0</div>
                <div class="stat-label" id="labelPending" data-i18n="feedback.labelPending">Pending</div>
            </div>
            <div class="stat-card success">
                <div class="stat-value" id="stat-fixed">0</div>
                <div class="stat-label" id="labelFixed" data-i18n="feedback.labelFixed">Fixed</div>
            </div>
        </div>

        <div class="filter-bar" id="filter-bar" style="display: none;">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <select class="form-select" id="filter-status" onchange="loadFeedback()">
                        <option value="" id="optAllStatuses" data-i18n="feedback.optAllStatuses">All Statuses</option>
                        <option value="pending" id="optPending" data-i18n="feedback.optPending">Pending</option>
                        <option value="reviewing" id="optReviewing" data-i18n="feedback.optReviewing">Reviewing</option>
                        <option value="accepted" id="optAccepted" data-i18n="feedback.optAccepted">Accepted</option>
                        <option value="fixed" id="optFixed" data-i18n="feedback.optFixed">Fixed</option>
                        <option value="rejected" id="optRejected" data-i18n="feedback.optRejected">Rejected</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filter-category" onchange="loadFeedback()">
                        <option value="" id="optAllCategories" data-i18n="feedback.optAllCategories">All Categories</option>
                        <option value="mistranslation" id="optMistranslation" data-i18n="feedback.optMistranslation">Mistranslation</option>
                        <option value="unnatural" id="optUnnatural" data-i18n="feedback.optUnnatural">Unnatural</option>
                        <option value="unclear" id="optUnclear" data-i18n="feedback.optUnclear">Unclear</option>
                        <option value="typo" id="optTypo" data-i18n="feedback.optTypo">Typo</option>
                        <option value="cultural" id="optCultural" data-i18n="feedback.optCultural">Cultural Issue</option>
                        <option value="other" id="optOther" data-i18n="feedback.optOther">Other</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filter-sort" onchange="loadFeedback()">
                        <option value="newest" id="optNewest" data-i18n="feedback.optNewest">Newest First</option>
                        <option value="oldest" id="optOldest" data-i18n="feedback.optOldest">Oldest First</option>
                        <option value="agrees" id="optAgrees" data-i18n="feedback.optAgrees">Most Agrees</option>
                    </select>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-soft-custom" onclick="resetFilters()">
                        <i class="fas fa-redo me-1"></i><span id="btnReset" data-i18n="feedback.btnReset">Reset</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="feedback-list"></div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <h4 id="emptyTitle" data-i18n="feedback.emptyTitle">No feedback</h4>
            <p id="emptyDesc" data-i18n="feedback.emptyDesc">No translation feedback has been reported for this work</p>
        </div>

        <div id="loading" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-accent" role="status"></div>
        </div>

        <div id="pagination" class="d-flex justify-content-center mt-4"></div>
    </div>

    <div class="modal fade" id="feedbackModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-comment-alt me-2"></i><span id="modalTitle" data-i18n="feedback.modalTitle">Feedback Details</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="feedback-detail-content">
                    <div class="text-center py-4"><div class="spinner-border text-accent"></div></div>
                </div>
                <div class="modal-footer" id="feedback-modal-footer" style="display: none;">
                    <button type="button" class="btn btn-soft-custom" data-bs-dismiss="modal" id="btnClose" data-i18n="feedback.btnClose">Close</button>
                    <div class="btn-group" id="resolve-buttons">
                        <button class="btn btn-outline-secondary" onclick="resolveFeedback('reviewing')">
                            <i class="fas fa-eye me-1"></i><span id="btnReviewing" data-i18n="feedback.btnReviewing">Reviewing</span>
                        </button>
                        <button class="btn btn-outline-success" onclick="resolveFeedback('fixed')">
                            <i class="fas fa-check me-1"></i><span id="btnFixed" data-i18n="feedback.btnFixed">Fixed</span>
                        </button>
                        <button class="btn btn-outline-danger" onclick="resolveFeedback('rejected')">
                            <i class="fas fa-times me-1"></i><span id="btnRejected" data-i18n="feedback.btnRejected">Reject</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/i18n.js?v=202608271617"></script>

    <script src="../../js/navbar.js?v=202608271617"></script>
    <script src="../../js/translations.js?v=202608271617"></script>

            { feedback_id: 'fb-5', category: 'unclear', status: 'pending', original_text: 'The device hummed with an otherworldly energy.', translated_text: 'デバイスは異世界のエネルギーでハミングした。', description: '"hummed" here means vibrating/buzzing, not the musical meaning. Also "otherworldly" is more like 不思議な or 異様な in this sci-fi context.', suggested_correction: 'その装置は不思議なエネルギーを帯びて低く唸っていた。', agree_count: 4, hasUserAgreed: false, reporter_name: 'Takeshi R.', created_at: '2026-03-06T12:00:00Z' },
            { feedback_id: 'fb-6', category: 'mistranslation', status: 'rejected', original_text: 'He felt blue.', translated_text: '彼は憂鬱だった。', description: 'Should be translated as 青く感じた', agree_count: 0, hasUserAgreed: false, reporter_name: 'Guest User', created_at: '2026-03-05T09:30:00Z', resolved_by: 'translator-1', resolver_name: 'Hana K.', resolved_at: '2026-03-06T11:00:00Z', resolution_note: '"Felt blue" is an idiom meaning feeling sad/depressed. 憂鬱 is the correct translation.' }
        ];

        async function loadUserWorks() {
            const token = localStorage.getItem('token');
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 2000);
                const response = await fetch(`${API_BASE}/works/my`, { headers: token ? { 'Authorization': 'Bearer ' + token } : {}, signal: controller.signal });
                clearTimeout(timeout);
                const data = await response.json();
                const select = document.getElementById('work-select');
                if (data.works && data.works.length > 0) {
                    data.works.forEach(work => {
                        const option = document.createElement('option');
                        option.value = work.work_id;
                        option.textContent = work.title;
                        select.appendChild(option);
                    });
                    return;
                }
            } catch (error) { console.log('API unavailable, switching to demo mode'); }
            // Demo mode fallback
            isDemo = true;
            const select = document.getElementById('work-select');
            DEMO_WORKS.forEach(work => {
                const option = document.createElement('option');
                option.value = work.work_id;
                option.textContent = work.title;
                select.appendChild(option);
            });
        }

        async function loadFeedback(page = 1) {
            currentWorkId = document.getElementById('work-select').value;
            if (!currentWorkId) {
                document.getElementById('stats-grid').style.display = 'none';
                document.getElementById('filter-bar').style.display = 'none';
                document.getElementById('feedback-list').innerHTML = '';
                document.getElementById('empty-state').style.display = 'none';
                return;
            }
            currentPage = page;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('feedback-list').innerHTML = '';
            document.getElementById('empty-state').style.display = 'none';

            if (isDemo) {
                loadDemoFeedback();
                return;
            }

            await loadStats();
            const status = document.getElementById('filter-status').value;
            const category = document.getElementById('filter-category').value;
            const sort = document.getElementById('filter-sort').value;
            const params = new URLSearchParams({ status, category, sort, page, limit: 10 });
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/feedback/work/${currentWorkId}?${params}`, { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stats-grid').style.display = 'grid';
                document.getElementById('filter-bar').style.display = 'block';
                if (data.feedback && data.feedback.length > 0) {
                    document.getElementById('feedback-list').innerHTML = data.feedback.map(f => renderFeedbackCard(f)).join('');
                    renderPagination(data.pagination);
                } else {
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('pagination').innerHTML = '';
                }
            } catch (error) {
                console.error('Failed to load feedback:', error);
                // Fallback to demo
                isDemo = true;
                loadDemoFeedback();
            }
        }

        function loadDemoFeedback() {
            const statusFilter = document.getElementById('filter-status').value;
            const categoryFilter = document.getElementById('filter-category').value;
            const sortVal = document.getElementById('filter-sort').value;

            let filtered = DEMO_FEEDBACK.slice();
            if (statusFilter) filtered = filtered.filter(f => f.status === statusFilter);
            if (categoryFilter) filtered = filtered.filter(f => f.category === categoryFilter);

            if (sortVal === 'oldest') filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            else if (sortVal === 'agrees') filtered.sort((a, b) => b.agree_count - a.agree_count);
            else filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const total = DEMO_FEEDBACK.length;
            const pending = DEMO_FEEDBACK.filter(f => f.status === 'pending').length;
            const fixed = DEMO_FEEDBACK.filter(f => f.status === 'fixed').length;
            const priority = DEMO_FEEDBACK.filter(f => f.agree_count >= 3 && f.status === 'pending').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-priority').textContent = priority;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-fixed').textContent = fixed;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('stats-grid').style.display = 'grid';
            document.getElementById('filter-bar').style.display = 'block';

            if (filtered.length > 0) {
                document.getElementById('feedback-list').innerHTML = filtered.map(f => renderFeedbackCard(f)).join('');
                document.getElementById('pagination').innerHTML = '';
            } else {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('pagination').innerHTML = '';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/feedback/stats/work/${currentWorkId}`);
                const data = await response.json();
                document.getElementById('stat-total').textContent = data.total || 0;
                document.getElementById('stat-priority').textContent = data.highPriority || 0;
                document.getElementById('stat-pending').textContent = data.byStatus?.pending || 0;
                document.getElementById('stat-fixed').textContent = data.byStatus?.fixed || 0;
            } catch (error) { console.error('Failed to load stats:', error); }
        }

        function renderFeedbackCard(feedback) {
            const isHighPriority = feedback.agree_count >= 3 && feedback.status === 'pending';
            return `
                <div class="feedback-card ${isHighPriority ? 'high-priority' : ''}">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="category-badge ${feedback.category}">${getCatName(feedback.category)}</span>
                            <span class="status-badge ${feedback.status} ms-2">${getStatusName(feedback.status)}</span>
                            ${isHighPriority ? '<span class="badge bg-warning text-dark ms-2"><i class="fas fa-exclamation-triangle me-1"></i>' + getL(uiText.needsAction) + '</span>' : ''}
                        </div>
                        <small class="text-secondary">${new Date(feedback.created_at).toLocaleDateString()}</small>
                    </div>
                    <div class="feedback-text">
                        ${feedback.original_text ? `<div class="original"><i class="fas fa-file-alt me-1"></i>${getL(uiText.original)}: ${escapeHtml(feedback.original_text)}</div>` : ''}
                        <div class="translated"><i class="fas fa-language me-1"></i>${escapeHtml(feedback.translated_text)}</div>
                    </div>
                    ${feedback.description ? `<p class="small text-secondary mb-2">${escapeHtml(feedback.description)}</p>` : ''}
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <button class="agree-btn ${feedback.hasUserAgreed ? 'agreed' : ''}" onclick="toggleAgree('${feedback.feedback_id}', this)">
                                <i class="fas fa-thumbs-up"></i><span class="count">${feedback.agree_count}</span> ${getL(uiText.agree)}
                            </button>
                            <small class="text-secondary ms-3">${getL(uiText.reporter)}: ${escapeHtml(feedback.reporter_name || getL(uiText.anonymous))}</small>
                        </div>
                        <button class="btn btn-soft-custom btn-sm" onclick="viewFeedbackDetail('${feedback.feedback_id}')">
                            <i class="fas fa-expand me-1"></i>${getL(uiText.details)}
                        </button>
                    </div>
                </div>
            `;
        }

        async function toggleAgree(feedbackId, btn) {
            if (isDemo) {
                const isAgreed = btn.classList.contains('agreed');
                const countEl = btn.querySelector('.count');
                let count = parseInt(countEl.textContent);
                count = isAgreed ? count - 1 : count + 1;
                countEl.textContent = count;
                btn.classList.toggle('agreed');
                const df = DEMO_FEEDBACK.find(f => f.feedback_id === feedbackId);
                if (df) { df.agree_count = count; df.hasUserAgreed = !isAgreed; }
                return;
            }
            const token = localStorage.getItem('token');
            if (!token) { alert(getL(uiText.alertLogin)); return; }
            const isAgreed = btn.classList.contains('agreed');
            try {
                const response = await fetch(`${API_BASE}/feedback/${feedbackId}/agree`, { method: isAgreed ? 'DELETE' : 'POST', headers: { 'Authorization': 'Bearer ' + token } });
                const data = await response.json();
                if (response.ok) { btn.classList.toggle('agreed'); btn.querySelector('.count').textContent = data.agreeCount; }
                else { alert(data.error || getL(uiText.alertError)); }
            } catch (error) { alert(getL(uiText.alertError)); }
        }

        async function viewFeedbackDetail(feedbackId) {
            currentFeedbackId = feedbackId;
            const modal = new bootstrap.Modal(document.getElementById('feedbackModal'));
            const content = document.getElementById('feedback-detail-content');
            const footer = document.getElementById('feedback-modal-footer');
            content.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-accent"></div></div>';
            footer.style.display = 'none';
            modal.show();

            if (isDemo) {
                const f = DEMO_FEEDBACK.find(fb => fb.feedback_id === feedbackId);
                if (!f) { content.innerHTML = '<div class="alert alert-danger">Not found</div>'; return; }
                const workTitle = DEMO_WORKS.find(w => w.work_id === currentWorkId)?.title || '';
                renderDetailModal(f, workTitle, content, footer);
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/feedback/${feedbackId}`, { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
                const data = await response.json();
                const f = data.feedback;
                const workTitle = f.work_title || '';
                renderDetailModal(f, workTitle, content, footer);
            } catch (error) { content.innerHTML = '<div class="alert alert-danger">' + getL(uiText.loadFailed) + '</div>'; }
        }

        function renderDetailModal(f, workTitle, content, footer) {
            content.innerHTML = `
                <div class="mb-4"><span class="category-badge ${f.category}">${getCatName(f.category)}</span><span class="status-badge ${f.status} ms-2">${getStatusName(f.status)}</span></div>
                <h6>${getL(uiText.work)}</h6><p>${escapeHtml(workTitle)}${f.chapter_title ? ` - ${escapeHtml(f.chapter_title)}` : ''}</p>
                <h6>${getL(uiText.translation)}</h6>
                <div class="feedback-text">
                    ${f.original_text ? `<div class="original"><strong>${getL(uiText.original)}:</strong> ${escapeHtml(f.original_text)}</div>` : ''}
                    <div class="translated"><strong>${getL(uiText.translation)}:</strong> ${escapeHtml(f.translated_text)}</div>
                </div>
                ${f.description ? `<h6>${getL(uiText.description)}</h6><p>${escapeHtml(f.description)}</p>` : ''}
                ${f.suggested_correction ? `<h6>${getL(uiText.suggestion)}</h6><p class="text-success">${escapeHtml(f.suggested_correction)}</p>` : ''}
                <div class="row mt-4"><div class="col-6"><h6>${getL(uiText.reporter)}</h6><p>${escapeHtml(f.reporter_name || getL(uiText.anonymous))}</p></div><div class="col-6"><h6>${getL(uiText.reportedAt)}</h6><p>${new Date(f.created_at).toLocaleString()}</p></div></div>
                <div class="d-flex align-items-center mt-3">
                    <button class="agree-btn ${f.hasUserAgreed ? 'agreed' : ''}" onclick="toggleAgree('${f.feedback_id}', this)"><i class="fas fa-thumbs-up"></i><span class="count">${f.agree_count}</span> ${getL(uiText.agree)}</button>
                    <span class="text-secondary ms-3">${f.agreers?.length > 0 ? f.agreers.map(a => a.pen_name).join(', ') + ' ' + getL(uiText.agreedBy) : ''}</span>
                </div>
                ${f.resolved_by ? `<div class="alert alert-info mt-4"><strong>${getL(uiText.resolved)}:</strong> ${escapeHtml(f.resolver_name)} (${new Date(f.resolved_at).toLocaleString()})${f.resolution_note ? `<br><small>${escapeHtml(f.resolution_note)}</small>` : ''}</div>` : ''}
            `;
            if (f.status === 'pending' || f.status === 'reviewing') footer.style.display = 'flex';
        }

        async function resolveFeedback(status) {
            if (isDemo) {
                const df = DEMO_FEEDBACK.find(f => f.feedback_id === currentFeedbackId);
                if (df) {
                    df.status = status;
                    if (status === 'rejected') df.resolution_note = prompt(getL(uiText.promptReject)) || '';
                    df.resolved_by = 'demo-user';
                    df.resolver_name = 'Demo User';
                    df.resolved_at = new Date().toISOString();
                }
                bootstrap.Modal.getInstance(document.getElementById('feedbackModal')).hide();
                loadFeedback(currentPage);
                return;
            }
            const token = localStorage.getItem('token');
            if (!token || !currentFeedbackId) return;
            const note = status === 'rejected' ? prompt(getL(uiText.promptReject)) : null;
            try {
                const response = await fetch(`${API_BASE}/feedback/${currentFeedbackId}/resolve`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ status, resolutionNote: note })
                });
                if (response.ok) { bootstrap.Modal.getInstance(document.getElementById('feedbackModal')).hide(); loadFeedback(currentPage); }
                else { const data = await response.json(); alert(data.error || getL(uiText.alertError)); }
            } catch (error) { alert(getL(uiText.alertError)); }
        }

        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            if (pagination.totalPages <= 1) { container.innerHTML = ''; return; }
            let html = '<nav><ul class="pagination">';
            html += `<li class="page-item ${pagination.page === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadFeedback(${pagination.page - 1})">&laquo;</a></li>`;
            for (let i = 1; i <= pagination.totalPages; i++) {
                if (i === 1 || i === pagination.totalPages || (i >= pagination.page - 2 && i <= pagination.page + 2)) {
                    html += `<li class="page-item ${i === pagination.page ? 'active' : ''}"><a class="page-link" href="#" onclick="loadFeedback(${i})">${i}</a></li>`;
                } else if (i === pagination.page - 3 || i === pagination.page + 3) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }
            html += `<li class="page-item ${pagination.page === pagination.totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="loadFeedback(${pagination.page + 1})">&raquo;</a></li>`;
            html += '</ul></nav>';
            container.innerHTML = html;
        }

        function resetFilters() {
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-category').value = '';
            document.getElementById('filter-sort').value = 'newest';
            loadFeedback();
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    </script>
