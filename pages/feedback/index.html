<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻訳フィードバック - Publisher</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link href="../../css/style-new.css" rel="stylesheet">
    
    <style>
        .page-header {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            color: white;
            padding: var(--spacing-xl) 0;
            margin-bottom: var(--spacing-xl);
        }
        .page-header h1 { color: white; font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .page-header p { color: rgba(255,255,255,0.9); margin: 0; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        .stat-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            text-align: center;
        }
        .stat-card .stat-value {
            font-family: var(--font-heading);
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-text-primary);
        }
        .stat-card .stat-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }
        .stat-card.warning .stat-value { color: var(--color-warning); }
        .stat-card.success .stat-value { color: var(--color-success); }
        
        .feedback-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            transition: all var(--transition-fast);
        }
        .feedback-card:hover {
            box-shadow: var(--shadow-md);
        }
        .feedback-card.high-priority {
            border-left: 4px solid var(--color-warning);
        }
        
        .feedback-text {
            background: var(--color-bg-hover);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin: var(--spacing-md) 0;
            font-family: var(--font-body);
        }
        .feedback-text .original {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-sm);
        }
        .feedback-text .translated {
            color: var(--color-text-primary);
            border-left: 3px solid var(--color-warning);
            padding-left: var(--spacing-sm);
        }
        
        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 500;
        }
        .category-badge.mistranslation { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .category-badge.unnatural { background: rgba(241, 196, 15, 0.1); color: #f1c40f; }
        .category-badge.unclear { background: rgba(52, 152, 219, 0.1); color: #3498db; }
        .category-badge.typo { background: rgba(155, 89, 182, 0.1); color: #9b59b6; }
        .category-badge.cultural { background: rgba(230, 126, 34, 0.1); color: #e67e22; }
        .category-badge.other { background: rgba(149, 165, 166, 0.1); color: #95a5a6; }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 500;
        }
        .status-badge.pending { background: rgba(241, 196, 15, 0.1); color: #f1c40f; }
        .status-badge.reviewing { background: rgba(52, 152, 219, 0.1); color: #3498db; }
        .status-badge.accepted { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        .status-badge.rejected { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .status-badge.fixed { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        
        .agree-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            border: 1px solid var(--color-border);
            background: var(--color-bg-card);
            color: var(--color-text-secondary);
        }
        .agree-btn:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }
        .agree-btn.agreed {
            background: rgba(139, 115, 85, 0.1);
            border-color: var(--color-accent);
            color: var(--color-accent);
        }
        .agree-btn .count {
            font-weight: 600;
        }
        
        .filter-bar {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-text-secondary);
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
            opacity: 0.3;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../../index.html">
                <i class="fas fa-book-open"></i>
                Publisher
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="../dashboard.html"><i class="fas fa-th-large me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="../browse.html"><i class="fas fa-compass me-1"></i>Browse</a></li>
                    <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-comments me-1"></i>フィードバック</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <button class="btn btn-soft-custom dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span id="userName">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="../profile.html"><i class="fas fa-user me-2"></i>Profile</a></li>
                            <li><a class="dropdown-item" href="../settings.html"><i class="fas fa-cog me-2"></i>Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Sign Out</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-comments me-2"></i>翻訳フィードバック</h1>
            <p>読者からの翻訳に関するフィードバックを確認・管理できます</p>
        </div>
    </div>

    <div class="container mb-5">
        <!-- Work Selection (for authors/translators) -->
        <div class="filter-bar">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <label class="form-label mb-0">作品を選択</label>
                </div>
                <div class="col-md-8">
                    <select class="form-select" id="work-select" onchange="loadFeedback()">
                        <option value="">作品を選択してください</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">総フィードバック</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-value" id="stat-priority">0</div>
                <div class="stat-label">要対応（3件以上同意）</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-pending">0</div>
                <div class="stat-label">未対応</div>
            </div>
            <div class="stat-card success">
                <div class="stat-value" id="stat-fixed">0</div>
                <div class="stat-label">修正済み</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-bar" id="filter-bar" style="display: none;">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <select class="form-select" id="filter-status" onchange="loadFeedback()">
                        <option value="">すべてのステータス</option>
                        <option value="pending">未対応</option>
                        <option value="reviewing">確認中</option>
                        <option value="accepted">承認済み</option>
                        <option value="fixed">修正済み</option>
                        <option value="rejected">却下</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filter-category" onchange="loadFeedback()">
                        <option value="">すべてのカテゴリ</option>
                        <option value="mistranslation">誤訳</option>
                        <option value="unnatural">不自然な表現</option>
                        <option value="unclear">意味不明</option>
                        <option value="typo">誤字・脱字</option>
                        <option value="cultural">文化的な問題</option>
                        <option value="other">その他</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="filter-sort" onchange="loadFeedback()">
                        <option value="newest">新しい順</option>
                        <option value="oldest">古い順</option>
                        <option value="agrees">同意数順</option>
                    </select>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-soft-custom" onclick="resetFilters()">
                        <i class="fas fa-redo me-1"></i>リセット
                    </button>
                </div>
            </div>
        </div>

        <!-- Feedback List -->
        <div id="feedback-list"></div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <h4>フィードバックはありません</h4>
            <p>この作品にはまだ翻訳フィードバックが報告されていません</p>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-accent" role="status"></div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="d-flex justify-content-center mt-4"></div>
    </div>

    <!-- Feedback Detail Modal -->
    <div class="modal fade" id="feedbackModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-comment-alt me-2"></i>フィードバック詳細</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="feedback-detail-content">
                    <div class="text-center py-4"><div class="spinner-border text-accent"></div></div>
                </div>
                <div class="modal-footer" id="feedback-modal-footer" style="display: none;">
                    <button type="button" class="btn btn-soft-custom" data-bs-dismiss="modal">閉じる</button>
                    <div class="btn-group" id="resolve-buttons">
                        <button class="btn btn-outline-secondary" onclick="resolveFeedback('reviewing')">
                            <i class="fas fa-eye me-1"></i>確認中
                        </button>
                        <button class="btn btn-outline-success" onclick="resolveFeedback('fixed')">
                            <i class="fas fa-check me-1"></i>修正済み
                        </button>
                        <button class="btn btn-outline-danger" onclick="resolveFeedback('rejected')">
                            <i class="fas fa-times me-1"></i>却下
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <p class="small mb-0">&copy; 2024 Publisher. All rights reserved.</p>
                <div class="d-flex gap-3">
                    <a href="../help.html" class="text-secondary">Help</a>
                    <a href="../legal/terms.html" class="text-secondary">Terms</a>
                    <a href="../legal/privacy.html" class="text-secondary">Privacy</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentWorkId = null;
        let currentFeedbackId = null;
        let currentPage = 1;
        
        const CATEGORY_NAMES = {
            'mistranslation': '誤訳',
            'unnatural': '不自然な表現',
            'unclear': '意味不明',
            'typo': '誤字・脱字',
            'cultural': '文化的な問題',
            'other': 'その他'
        };
        
        const STATUS_NAMES = {
            'pending': '未対応',
            'reviewing': '確認中',
            'accepted': '承認済み',
            'rejected': '却下',
            'fixed': '修正済み'
        };
        
        // Load user's works on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.firstName) document.getElementById('userName').textContent = user.firstName;
            
            await loadUserWorks();
        });
        
        async function loadUserWorks() {
            const userId = localStorage.getItem('userId');
            if (!userId) return;
            
            try {
                const response = await fetch(`${API_BASE}/works?author_id=${userId}`);
                const data = await response.json();
                
                const select = document.getElementById('work-select');
                if (data.works && data.works.length > 0) {
                    data.works.forEach(work => {
                        const option = document.createElement('option');
                        option.value = work.work_id;
                        option.textContent = work.title;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load works:', error);
            }
        }
        
        async function loadFeedback(page = 1) {
            currentWorkId = document.getElementById('work-select').value;
            if (!currentWorkId) {
                document.getElementById('stats-grid').style.display = 'none';
                document.getElementById('filter-bar').style.display = 'none';
                document.getElementById('feedback-list').innerHTML = '';
                document.getElementById('empty-state').style.display = 'none';
                return;
            }
            
            currentPage = page;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('feedback-list').innerHTML = '';
            document.getElementById('empty-state').style.display = 'none';
            
            // Load stats
            await loadStats();
            
            // Load feedback list
            const status = document.getElementById('filter-status').value;
            const category = document.getElementById('filter-category').value;
            const sort = document.getElementById('filter-sort').value;
            
            const params = new URLSearchParams({
                status, category, sort,
                page: page,
                limit: 10
            });
            
            try {
                const userId = localStorage.getItem('userId');
                const response = await fetch(`${API_BASE}/feedback/work/${currentWorkId}?${params}`, {
                    headers: userId ? { 'X-User-ID': userId } : {}
                });
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stats-grid').style.display = 'grid';
                document.getElementById('filter-bar').style.display = 'block';
                
                if (data.feedback && data.feedback.length > 0) {
                    document.getElementById('feedback-list').innerHTML = 
                        data.feedback.map(f => renderFeedbackCard(f)).join('');
                    renderPagination(data.pagination);
                } else {
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('pagination').innerHTML = '';
                }
            } catch (error) {
                console.error('Failed to load feedback:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('feedback-list').innerHTML = 
                    '<div class="alert alert-danger">フィードバックの読み込みに失敗しました</div>';
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/feedback/stats/work/${currentWorkId}`);
                const data = await response.json();
                
                document.getElementById('stat-total').textContent = data.total || 0;
                document.getElementById('stat-priority').textContent = data.highPriority || 0;
                document.getElementById('stat-pending').textContent = data.byStatus?.pending || 0;
                document.getElementById('stat-fixed').textContent = data.byStatus?.fixed || 0;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }
        
        function renderFeedbackCard(feedback) {
            const isHighPriority = feedback.agree_count >= 3 && feedback.status === 'pending';
            
            return `
                <div class="feedback-card ${isHighPriority ? 'high-priority' : ''}">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="category-badge ${feedback.category}">${CATEGORY_NAMES[feedback.category] || feedback.category}</span>
                            <span class="status-badge ${feedback.status} ms-2">${STATUS_NAMES[feedback.status] || feedback.status}</span>
                            ${isHighPriority ? '<span class="badge bg-warning text-dark ms-2"><i class="fas fa-exclamation-triangle me-1"></i>要対応</span>' : ''}
                        </div>
                        <small class="text-secondary">${new Date(feedback.created_at).toLocaleDateString('ja-JP')}</small>
                    </div>
                    
                    <div class="feedback-text">
                        ${feedback.original_text ? `<div class="original"><i class="fas fa-file-alt me-1"></i>原文: ${escapeHtml(feedback.original_text)}</div>` : ''}
                        <div class="translated"><i class="fas fa-language me-1"></i>${escapeHtml(feedback.translated_text)}</div>
                    </div>
                    
                    ${feedback.description ? `<p class="small text-secondary mb-2">${escapeHtml(feedback.description)}</p>` : ''}
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <button class="agree-btn ${feedback.hasUserAgreed ? 'agreed' : ''}" onclick="toggleAgree('${feedback.feedback_id}', this)">
                                <i class="fas fa-thumbs-up"></i>
                                <span class="count">${feedback.agree_count}</span>
                                同意
                            </button>
                            <small class="text-secondary ms-3">報告者: ${escapeHtml(feedback.reporter_name || '匿名')}</small>
                        </div>
                        <button class="btn btn-soft-custom btn-sm" onclick="viewFeedbackDetail('${feedback.feedback_id}')">
                            <i class="fas fa-expand me-1"></i>詳細
                        </button>
                    </div>
                </div>
            `;
        }
        
        async function toggleAgree(feedbackId, btn) {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert('ログインが必要です');
                return;
            }
            
            const isAgreed = btn.classList.contains('agreed');
            const method = isAgreed ? 'DELETE' : 'POST';
            
            try {
                const response = await fetch(`${API_BASE}/feedback/${feedbackId}/agree`, {
                    method,
                    headers: { 'X-User-ID': userId }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    btn.classList.toggle('agreed');
                    btn.querySelector('.count').textContent = data.agreeCount;
                } else {
                    alert(data.error || '操作に失敗しました');
                }
            } catch (error) {
                alert('エラーが発生しました');
            }
        }
        
        async function viewFeedbackDetail(feedbackId) {
            currentFeedbackId = feedbackId;
            const modal = new bootstrap.Modal(document.getElementById('feedbackModal'));
            const content = document.getElementById('feedback-detail-content');
            const footer = document.getElementById('feedback-modal-footer');
            
            content.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-accent"></div></div>';
            footer.style.display = 'none';
            modal.show();
            
            try {
                const userId = localStorage.getItem('userId');
                const response = await fetch(`${API_BASE}/feedback/${feedbackId}`, {
                    headers: userId ? { 'X-User-ID': userId } : {}
                });
                const data = await response.json();
                const f = data.feedback;
                
                content.innerHTML = `
                    <div class="mb-4">
                        <span class="category-badge ${f.category}">${CATEGORY_NAMES[f.category]}</span>
                        <span class="status-badge ${f.status} ms-2">${STATUS_NAMES[f.status]}</span>
                    </div>
                    
                    <h6>作品</h6>
                    <p>${escapeHtml(f.work_title)}${f.chapter_title ? ` - ${escapeHtml(f.chapter_title)}` : ''}</p>
                    
                    <h6>問題の翻訳</h6>
                    <div class="feedback-text">
                        ${f.original_text ? `<div class="original"><strong>原文:</strong> ${escapeHtml(f.original_text)}</div>` : ''}
                        <div class="translated"><strong>翻訳:</strong> ${escapeHtml(f.translated_text)}</div>
                    </div>
                    
                    ${f.description ? `<h6>説明</h6><p>${escapeHtml(f.description)}</p>` : ''}
                    ${f.suggested_correction ? `<h6>修正提案</h6><p class="text-success">${escapeHtml(f.suggested_correction)}</p>` : ''}
                    
                    <div class="row mt-4">
                        <div class="col-6">
                            <h6>報告者</h6>
                            <p>${escapeHtml(f.reporter_name || '匿名')}</p>
                        </div>
                        <div class="col-6">
                            <h6>報告日時</h6>
                            <p>${new Date(f.created_at).toLocaleString('ja-JP')}</p>
                        </div>
                    </div>
                    
                    <div class="d-flex align-items-center mt-3">
                        <button class="agree-btn ${f.hasUserAgreed ? 'agreed' : ''}" onclick="toggleAgree('${f.feedback_id}', this)">
                            <i class="fas fa-thumbs-up"></i>
                            <span class="count">${f.agree_count}</span>
                            同意
                        </button>
                        <span class="text-secondary ms-3">${f.agreers?.length > 0 ? f.agreers.map(a => a.pen_name).join(', ') + 'が同意' : ''}</span>
                    </div>
                    
                    ${f.resolved_by ? `
                        <div class="alert alert-info mt-4">
                            <strong>対応済み:</strong> ${escapeHtml(f.resolver_name)} (${new Date(f.resolved_at).toLocaleString('ja-JP')})
                            ${f.resolution_note ? `<br><small>${escapeHtml(f.resolution_note)}</small>` : ''}
                        </div>
                    ` : ''}
                `;
                
                // Show resolve buttons for author/translator
                if (f.status === 'pending' || f.status === 'reviewing') {
                    footer.style.display = 'flex';
                }
                
            } catch (error) {
                content.innerHTML = '<div class="alert alert-danger">詳細の読み込みに失敗しました</div>';
            }
        }
        
        async function resolveFeedback(status) {
            const userId = localStorage.getItem('userId');
            if (!userId || !currentFeedbackId) return;
            
            const note = status === 'rejected' ? prompt('却下理由を入力してください（任意）:') : null;
            
            try {
                const response = await fetch(`${API_BASE}/feedback/${currentFeedbackId}/resolve`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userId
                    },
                    body: JSON.stringify({ status, resolutionNote: note })
                });
                
                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('feedbackModal')).hide();
                    loadFeedback(currentPage);
                } else {
                    const data = await response.json();
                    alert(data.error || '操作に失敗しました');
                }
            } catch (error) {
                alert('エラーが発生しました');
            }
        }
        
        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            if (pagination.totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '<nav><ul class="pagination">';
            html += `<li class="page-item ${pagination.page === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadFeedback(${pagination.page - 1})">&laquo;</a></li>`;
            
            for (let i = 1; i <= pagination.totalPages; i++) {
                if (i === 1 || i === pagination.totalPages || (i >= pagination.page - 2 && i <= pagination.page + 2)) {
                    html += `<li class="page-item ${i === pagination.page ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadFeedback(${i})">${i}</a></li>`;
                } else if (i === pagination.page - 3 || i === pagination.page + 3) {
                    html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                }
            }
            
            html += `<li class="page-item ${pagination.page === pagination.totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadFeedback(${pagination.page + 1})">&raquo;</a></li>`;
            html += '</ul></nav>';
            container.innerHTML = html;
        }
        
        function resetFilters() {
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-category').value = '';
            document.getElementById('filter-sort').value = 'newest';
            loadFeedback();
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }
    </script>
</body>
</html>
