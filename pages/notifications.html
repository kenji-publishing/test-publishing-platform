    <!-- Pattern C Navbar Styles -->
    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }
        
        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1055;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Menu ========== */
        @media (max-width: 991.98px) {

        }
    </style>
    
    <!-- Notifications Page Styles -->
    <style>
        .notification-container { padding: var(--spacing-xl) 0; min-height: calc(100vh - 200px); }
        .page-header { margin-bottom: var(--spacing-xl); }
        .page-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .page-header p { color: var(--color-text-secondary); }
        .filter-bar { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-md) var(--spacing-lg); margin-bottom: var(--spacing-lg); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--spacing-md); }
        .filter-left { display: flex; align-items: center; gap: var(--spacing-md); flex-wrap: wrap; }
        .filter-right { display: flex; align-items: center; gap: var(--spacing-sm); }
        .notification-list { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
        .notification-item { display: flex; align-items: flex-start; padding: var(--spacing-lg); border-bottom: 1px solid var(--color-border); transition: all var(--transition-fast); cursor: pointer; background: var(--color-bg-card); position: relative; }
        .notification-item:last-child { border-bottom: none; }
        .notification-item:hover { background: var(--color-bg-hover); }
        .notification-item.unread { background: rgba(139, 115, 85, 0.05); }
        .notification-item.unread::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-accent); }
        .notification-icon { width: 48px; height: 48px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; margin-right: var(--spacing-md); flex-shrink: 0; }
        .notification-icon.success { background: rgba(93, 156, 89, 0.1); color: var(--color-success); }
        .notification-icon.info { background: rgba(93, 139, 199, 0.1); color: var(--color-info); }
        .notification-icon.warning { background: rgba(212, 168, 83, 0.1); color: var(--color-warning); }
        .notification-icon.primary { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .notification-content { flex: 1; min-width: 0; word-wrap: break-word; }
        .notification-title { font-weight: 600; color: var(--color-text-primary); margin-bottom: 4px; display: flex; align-items: center; gap: var(--spacing-sm); flex-wrap: wrap; }
        .notification-message { color: var(--color-text-secondary); font-size: var(--font-size-sm); line-height: 1.5; margin-bottom: var(--spacing-xs); }
        .notification-meta { display: flex; align-items: center; gap: var(--spacing-md); font-size: var(--font-size-xs); color: var(--color-text-muted); flex-wrap: wrap; }
        .notification-actions { display: flex; align-items: center; gap: var(--spacing-sm); margin-left: var(--spacing-md); flex-shrink: 0; }
        .notification-actions .btn { opacity: 0; transition: opacity var(--transition-fast); }
        .notification-item:hover .notification-actions .btn { opacity: 1; }
        .empty-state { text-align: center; padding: var(--spacing-3xl) var(--spacing-xl); }
        .empty-state i { font-size: 4rem; color: var(--color-border); margin-bottom: var(--spacing-lg); }
        .pagination-container { display: flex; justify-content: center; align-items: center; padding: var(--spacing-lg); gap: var(--spacing-sm); }
        .type-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-full); font-size: var(--font-size-xs); font-weight: 500; }
        .type-badge.sale { background: rgba(93, 156, 89, 0.1); color: var(--color-success); }
        .type-badge.translation_complete { background: rgba(93, 139, 199, 0.1); color: var(--color-info); }
        .type-badge.comment { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .type-badge.feedback { background: rgba(212, 168, 83, 0.1); color: var(--color-warning); }
        .type-badge.system { background: rgba(108, 117, 125, 0.1); color: var(--color-text-secondary); }
        .type-badge.agreement_request { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .type-badge.agreement_signed { background: rgba(93, 156, 89, 0.1); color: var(--color-success); }
        .type-badge.agreement_expired { background: rgba(212, 168, 83, 0.1); color: var(--color-warning); }
        .type-badge.progress_report { background: rgba(93, 139, 199, 0.1); color: var(--color-info); }
        .type-badge.deadline_warning { background: rgba(212, 168, 83, 0.1); color: var(--color-warning); }
        .type-badge.message_received { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .type-badge.price_changed { background: rgba(93, 139, 199, 0.1); color: var(--color-info); }
        .type-badge.translation_request { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .type-badge.editing_request { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-md); margin-bottom: var(--spacing-xl); }
        .stat-mini { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--spacing-md); text-align: center; }
        .stat-mini .stat-value { font-size: var(--font-size-xl); font-weight: 700; color: var(--color-accent); }
        .stat-mini .stat-label { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
        @media (max-width: 768px) { .notification-actions .btn { opacity: 1; } .stats-row { grid-template-columns: repeat(2, 1fr); } }
    </style>
    
    <!-- ログインチェック（ページ表示前にリダイレクト） -->
    <script>
        (function() {
            // デモモードの場合はスキップ
            var isDemo = new URLSearchParams(window.location.search).get('demo') === 'true';
            if (isDemo) return;
            
            // 未ログインならログインページへリダイレクト
            var token = localStorage.getItem('token');
            var user = localStorage.getItem('user');
            
            if (!token || !user) {
                // リダイレクト先を保存（ログイン後に戻れるように）
                sessionStorage.setItem('redirectAfterLogin', window.location.href);
                window.location.replace('login.html');
            }
        })();
    </script>

    <!-- Pattern C Navbar Script -->
    <script>
        // ========== 多言語対応テキスト（9言語）==========
// Navbar initialization
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                loadUserInfo();
                
                // User dropdown close on outside click
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.user-dropdown')) {
                        const dropdown = document.getElementById('userDropdown');
                        const dropdownMenu = document.getElementById('userMenu');
                        if (dropdown) dropdown.classList.remove('open');
                        if (dropdownMenu) dropdownMenu.classList.remove('show');
                    }
                });
                
                // Mobile overlay
                const navbarCollapse = document.getElementById('navbarNav');
                const navbarOverlay = document.getElementById('navbarOverlay');
                
                if (navbarCollapse) {
                    navbarCollapse.addEventListener('show.bs.collapse', function() {
                        if (navbarOverlay) navbarOverlay.classList.add('show');
                    });
                    navbarCollapse.addEventListener('hide.bs.collapse', function() {
                        if (navbarOverlay) navbarOverlay.classList.remove('show');
                    });
                }
                
                if (navbarOverlay) {
                    navbarOverlay.addEventListener('click', function() {
                        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                        if (bsCollapse) bsCollapse.hide();
                    });
                }
            });
            
            document.addEventListener('languageChanged', function() {
            });
        })();
    </script>

            { notification_id: '10', notification_type: 'deadline_warning', params: { work: 'Magic Academy Adventure', days: '3' }, icon: 'fa-exclamation-triangle', icon_color: 'warning', is_read: false, created_at: new Date(Date.now() - 1*60*60*1000).toISOString() },
            { notification_id: '11', notification_type: 'message_received', params: { name: 'Tanaka Yuki' }, icon: 'fa-envelope', icon_color: 'primary', is_read: false, created_at: new Date(Date.now() - 15*60*1000).toISOString() },
            { notification_id: '12', notification_type: 'price_changed', params: { work: 'Starlight Symphony', price: '$12.99' }, icon: 'fa-tag', icon_color: 'info', is_read: true, created_at: new Date(Date.now() - 3*24*60*60*1000).toISOString() },
            { notification_id: '13', notification_type: 'translation_request', params: { name: 'Hans Mueller', work: 'Digital Dreams' }, icon: 'fa-language', icon_color: 'primary', is_read: false, created_at: new Date(Date.now() - 6*60*60*1000).toISOString() },
            { notification_id: '14', notification_type: 'editing_request', params: { name: 'Emily Chen', work: 'Magic Academy Adventure' }, icon: 'fa-pen', icon_color: 'primary', is_read: false, created_at: new Date(Date.now() - 8*60*60*1000).toISOString() }
        ];
        
        // 初期化（遅延実行で言語設定の読み込みを待つ）
        document.addEventListener('DOMContentLoaded', function() { 
            setupEventListeners(); 
            loadUnreadCount();
            
            // 言語設定が確実に読み込まれてから実行
            setTimeout(function() {
                loadNotifications();
            }, 100);
        });
        
        // 言語変更時に再読み込み
        document.addEventListener('languageChanged', function() {
            loadNotifications();
        });
        
        // 言語セレクター変更時も再読み込み
        (function() {
            const setupLangReload = function() {
                const desktopSelector = document.getElementById('languageSelector');
                const mobileSelector = document.getElementById('languageSelectorMobile');
                
                if (desktopSelector) {
                    desktopSelector.addEventListener('change', function() {
                        setTimeout(loadNotifications, 50);
                    });
                }
                if (mobileSelector) {
                    mobileSelector.addEventListener('change', function() {
                        setTimeout(loadNotifications, 50);
                    });
                }
            };
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupLangReload);
            } else {
                setupLangReload();
            }
        })();
        
        // initUser関数はPattern CのloadUserInfo()と統合
        async function loadNotifications() {
            const listContainer = document.getElementById('notificationList');
            if (isDemo) { renderNotifications(filterDemoData()); updateStats(); return; }
            const token = localStorage.getItem('token');
            if (!token) { listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-lock"></i><h3>${getPageL('loginRequired')}</h3><a href="login.html" class="btn btn-custom mt-3">${getPageL('login')}</a></div>`; return; }
            try {
                const params = new URLSearchParams({ page: currentPage, limit: 20 });
                if (currentFilter.type) params.append('type', currentFilter.type);
                if (currentFilter.unreadOnly) params.append('unread_only', 'true');
                const response = await fetch(`${API_BASE}?${params}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) throw new Error('Failed');
                const data = await response.json();
                if (data.success) { renderNotifications(data.notifications); updatePagination(data.pagination); }
            } catch (error) { listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>${getPageL('loadError')}</h3><button class="btn btn-custom mt-3" onclick="loadNotifications()">${getPageL('retry')}</button></div>`; }
        }
        function filterDemoData() { let f = [...DEMO_NOTIFICATIONS]; if (currentFilter.type) f = f.filter(n => n.notification_type === currentFilter.type); if (currentFilter.unreadOnly) f = f.filter(n => !n.is_read); return f; }
        function renderNotifications(notifications) {
            const listContainer = document.getElementById('notificationList');
            if (!notifications || notifications.length === 0) { 
                listContainer.innerHTML = `<div class="empty-state"><i class="fas fa-bell-slash"></i><h3>${getPageL('noNotifications')}</h3></div>`; 
                return; 
            }
            
            listContainer.innerHTML = notifications.map(n => {
                // テンプレートから翻訳を取得（paramsがあればテンプレート使用、なければ直接値を使用）
                const title = n.params ? getNotificationText(n.notification_type, 'title', n.params) : (n.title || '');
                const message = n.params ? getNotificationText(n.notification_type, 'message', n.params) : (n.message || '');
                
                return `<div class="notification-item ${n.is_read ? '' : 'unread'}" data-id="${n.notification_id}" onclick="handleNotificationClick('${n.notification_id}')">
                    <div class="notification-icon ${n.icon_color || 'primary'}">
                        <i class="fas ${n.icon || 'fa-bell'} fa-lg"></i>
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">${title} ${!n.is_read ? '<span class="badge bg-accent">NEW</span>' : ''}</div>
                        <div class="notification-message">${message}</div>
                        <div class="notification-meta">
                            <span class="type-badge ${n.notification_type}">${getTypeLabel(n.notification_type)}</span>
                            <span><i class="fas fa-clock me-1"></i>${formatTimeAgo(n.created_at)}</span>
                            ${NOTIFICATION_LINKS[n.notification_type] ? '<span style="color:var(--color-accent);"><i class="fas fa-external-link-alt me-1"></i>' + getNotificationLinkLabel(n.notification_type) + '</span>' : ''}
                        </div>
                    </div>
                    <div class="notification-actions">
                        ${!n.is_read ? `<button class="btn btn-sm btn-outline-custom" onclick="event.stopPropagation(); markAsRead('${n.notification_id}')"><i class="fas fa-check"></i></button>` : ''}
                        <button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); deleteNotification('${n.notification_id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            }).join('');
        }
        // getTypeLabel と formatTimeAgo は上部で定義済み（テンプレートシステム使用）
        function updateStats() { document.getElementById('totalCount').textContent = DEMO_NOTIFICATIONS.length; document.getElementById('unreadCount').textContent = DEMO_NOTIFICATIONS.filter(n => !n.is_read).length; document.getElementById('todayCount').textContent = DEMO_NOTIFICATIONS.filter(n => new Date(n.created_at).toDateString() === new Date().toDateString()).length; document.getElementById('weekCount').textContent = DEMO_NOTIFICATIONS.filter(n => new Date(n.created_at) >= new Date(Date.now() - 7*24*60*60*1000)).length; }
        async function loadUnreadCount() { if (isDemo) { updateUnreadBadge(DEMO_NOTIFICATIONS.filter(n => !n.is_read).length); return; } const token = localStorage.getItem('token'); if (!token) return; try { const r = await fetch(`${API_BASE}/unread-count`, { headers: { 'Authorization': `Bearer ${token}` } }); if (r.ok) { const d = await r.json(); updateUnreadBadge(d.count); } } catch (e) {} }
        function updateUnreadBadge(count) { 
            const b = document.getElementById('navUnreadBadge'); 
            if (b) {
                if (count > 0) { 
                    b.textContent = count > 99 ? '99+' : count; 
                    b.style.display = 'inline-block'; 
                } else { 
                    b.style.display = 'none'; 
                }
            }
            const u = document.getElementById('unreadCount'); 
            if (u) u.textContent = count; 
        }
        // 通知クリック時の移動先ラベル（9言語）
        var linkLabels = {
            dashboard: { en: 'Dashboard', ja: 'ダッシュボード', zh: '控制台', es: 'Panel', fr: 'Tableau de bord', de: 'Dashboard', ko: '대시보드', ar: 'لوحة التحكم', pt: 'Painel' },
            messages: { en: 'Messages', ja: 'メッセージ', zh: '消息', es: 'Mensajes', fr: 'Messages', de: 'Nachrichten', ko: '메시지', ar: 'الرسائل', pt: 'Mensagens' },
            agreements: { en: 'Agreements', ja: '同意書', zh: '协议', es: 'Acuerdos', fr: 'Accords', de: 'Vereinbarungen', ko: '동의서', ar: 'الاتفاقيات', pt: 'Acordos' },
            workDetail: { en: 'Work Detail', ja: '作品詳細', zh: '作品详情', es: 'Detalle de obra', fr: "Détail de l'œuvre", de: 'Werkdetails', ko: '작품 상세', ar: 'تفاصيل العمل', pt: 'Detalhes da obra' }
        };
        var linkTypeMap = {
            sale: 'dashboard', translation_complete: 'dashboard',
            feedback: 'workDetail', comment: 'workDetail',
            agreement_request: 'agreements', agreement_signed: 'agreements', agreement_expired: 'agreements',
            progress_report: 'dashboard', deadline_warning: 'dashboard',
            message_received: 'messages', price_changed: 'dashboard',
            translation_request: 'messages', editing_request: 'messages'
        };
        function getNotificationLinkLabel(type) {
            var key = linkTypeMap[type];
            if (!key || !linkLabels[key]) return '';
            var lang = (localStorage.getItem('preferredLanguage') || 'en');
            return linkLabels[key][lang] || linkLabels[key]['en'] || '';
        }

        // 通知タイプ → 移動先のマッピング
        var NOTIFICATION_LINKS = {
            sale: 'dashboard.html',
            translation_complete: 'dashboard.html',
            feedback: 'work-detail.html?id={workId}',
            comment: 'work-detail.html?id={workId}',
            system: '',
            agreement_request: 'agreements.html',
            agreement_signed: 'agreements.html',
            agreement_expired: 'agreements.html',
            progress_report: 'dashboard.html?tab=collabs',
            deadline_warning: 'dashboard.html?tab=collabs',
            message_received: 'messages.html',
            price_changed: 'dashboard.html',
            translation_request: 'messages.html',
            editing_request: 'messages.html'
        };

        function handleNotificationClick(id) {
            var n = DEMO_NOTIFICATIONS.find(function(item) { return item.notification_id === id; });
            markAsRead(id);
            if (n) {
                var link = NOTIFICATION_LINKS[n.notification_type] || '';
                if (link) {
                    window.location.href = link;
                }
            }
        }
        async function markAsRead(id) { if (isDemo) { const n = DEMO_NOTIFICATIONS.find(n => n.notification_id === id); if (n) n.is_read = true; loadNotifications(); loadUnreadCount(); return; } const token = localStorage.getItem('token'); if (!token) return; try { await fetch(`${API_BASE}/${id}/read`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } }); loadNotifications(); loadUnreadCount(); } catch (e) {} }
        async function markAllAsRead() { if (isDemo) { DEMO_NOTIFICATIONS.forEach(n => n.is_read = true); loadNotifications(); loadUnreadCount(); showToast('All marked as read'); return; } const token = localStorage.getItem('token'); if (!token) return; try { await fetch(`${API_BASE}/read-all`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } }); loadNotifications(); loadUnreadCount(); showToast('All marked as read'); } catch (e) {} }
        async function deleteNotification(id) { if (!confirm('Delete?')) return; if (isDemo) { const i = DEMO_NOTIFICATIONS.findIndex(n => n.notification_id === id); if (i > -1) DEMO_NOTIFICATIONS.splice(i, 1); loadNotifications(); loadUnreadCount(); showToast('Deleted'); return; } const token = localStorage.getItem('token'); if (!token) return; try { await fetch(`${API_BASE}/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadNotifications(); loadUnreadCount(); showToast('Deleted'); } catch (e) {} }
        async function clearNotifications(readOnly = false) { if (!confirm(readOnly ? 'Delete read?' : 'Delete all?')) return; if (isDemo) { if (readOnly) { const u = DEMO_NOTIFICATIONS.filter(n => !n.is_read); DEMO_NOTIFICATIONS.length = 0; DEMO_NOTIFICATIONS.push(...u); } else { DEMO_NOTIFICATIONS.length = 0; } loadNotifications(); loadUnreadCount(); showToast('Deleted'); return; } const token = localStorage.getItem('token'); if (!token) return; try { await fetch(`${API_BASE}/clear-all${readOnly ? '?read_only=true' : ''}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadNotifications(); loadUnreadCount(); showToast('Deleted'); } catch (e) {} }
        function updatePagination(p) { const c = document.getElementById('paginationContainer'); if (p.totalPages <= 1) { c.style.display = 'none'; return; } c.style.display = 'flex'; totalPages = p.totalPages; document.getElementById('pageInfo').textContent = `${p.page} / ${p.totalPages}`; document.getElementById('prevPageBtn').disabled = !p.hasPrev; document.getElementById('nextPageBtn').disabled = !p.hasNext; }
        function goToPage(d) { if (d === 'prev' && currentPage > 1) currentPage--; else if (d === 'next' && currentPage < totalPages) currentPage++; loadNotifications(); }
        function setupEventListeners() { document.getElementById('typeFilter').addEventListener('change', (e) => { currentFilter.type = e.target.value; currentPage = 1; loadNotifications(); }); document.getElementById('unreadOnly').addEventListener('change', (e) => { currentFilter.unreadOnly = e.target.checked; currentPage = 1; loadNotifications(); }); document.getElementById('markAllReadBtn').addEventListener('click', markAllAsRead); document.getElementById('clearReadBtn').addEventListener('click', () => clearNotifications(true)); document.getElementById('clearAllBtn').addEventListener('click', () => clearNotifications(false)); document.getElementById('prevPageBtn').addEventListener('click', () => goToPage('prev')); document.getElementById('nextPageBtn').addEventListener('click', () => goToPage('next')); }
        function showToast(message) { const t = document.createElement('div'); t.className = 'position-fixed bottom-0 end-0 p-3'; t.style.zIndex = '9999'; t.innerHTML = `<div class="toast show"><div class="toast-body"><i class="fas fa-check-circle text-success me-2"></i>${message}</div></div>`; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
        // logout関数はPattern CのhandleLogout()を使用
    </script>
</body>
</html>
