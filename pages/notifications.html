<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知センター - Publisher</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link href="../css/style-new.css" rel="stylesheet">
    
    <style>
        .notification-container {
            padding: var(--spacing-xl) 0;
            min-height: calc(100vh - 200px);
        }

        .page-header {
            margin-bottom: var(--spacing-xl);
        }

        .page-header h1 {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--spacing-xs);
        }

        .page-header p {
            color: var(--color-text-secondary);
        }

        /* フィルターバー */
        .filter-bar {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .filter-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .filter-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        /* 通知リスト */
        .notification-list {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .notification-item {
            display: flex;
            align-items: flex-start;
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            transition: all var(--transition-fast);
            cursor: pointer;
        }

        .notification-item:last-child {
            border-bottom: none;
        }

        .notification-item:hover {
            background: var(--color-bg-hover);
        }

        .notification-item.unread {
            background: rgba(139, 115, 85, 0.05);
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--color-accent);
        }

        .notification-item {
            position: relative;
        }

        /* 通知アイコン */
        .notification-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--spacing-md);
            flex-shrink: 0;
        }

        .notification-icon.success { background: rgba(93, 156, 89, 0.1); color: var(--color-success); }
        .notification-icon.info { background: rgba(93, 139, 199, 0.1); color: var(--color-info); }
        .notification-icon.warning { background: rgba(212, 168, 83, 0.1); color: var(--color-warning); }
        .notification-icon.primary { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .notification-icon.secondary { background: rgba(108, 117, 125, 0.1); color: var(--color-text-secondary); }

        /* 通知コンテンツ */
        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-title {
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .notification-title .badge {
            font-size: 0.7rem;
            font-weight: 500;
        }

        .notification-message {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            line-height: 1.5;
            margin-bottom: var(--spacing-xs);
        }

        .notification-meta {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
        }

        /* 通知アクション */
        .notification-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-left: var(--spacing-md);
        }

        .notification-actions .btn {
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .notification-item:hover .notification-actions .btn {
            opacity: 1;
        }

        /* 空の状態 */
        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl) var(--spacing-xl);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--color-border);
            margin-bottom: var(--spacing-lg);
        }

        .empty-state h3 {
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .empty-state p {
            color: var(--color-text-muted);
        }

        /* ページネーション */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-lg);
            gap: var(--spacing-sm);
        }

        /* タイプバッジ */
        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 500;
        }

        .type-badge.sale { background: rgba(93, 156, 89, 0.1); color: var(--color-success); }
        .type-badge.translation_complete { background: rgba(93, 139, 199, 0.1); color: var(--color-info); }
        .type-badge.comment { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }
        .type-badge.feedback { background: rgba(212, 168, 83, 0.1); color: var(--color-warning); }
        .type-badge.system { background: rgba(108, 117, 125, 0.1); color: var(--color-text-secondary); }
        .type-badge.ticket_reply { background: rgba(93, 139, 199, 0.1); color: var(--color-info); }
        .type-badge.account { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }

        /* 統計カード */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .stat-mini {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            text-align: center;
        }

        .stat-mini .stat-value {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-accent);
        }

        .stat-mini .stat-label {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-left, .filter-right {
                justify-content: center;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .notification-actions .btn {
                opacity: 1;
            }
        }

        @media (max-width: 576px) {
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-book-open"></i>
                Publisher
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="fas fa-th-large me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="my-works.html">
                            <i class="fas fa-book me-1"></i> My Works
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="earnings.html">
                            <i class="fas fa-coins me-1"></i> Earnings
                        </a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center gap-3">
                    <a href="notifications.html" class="btn btn-soft-custom position-relative active">
                        <i class="fas fa-bell"></i>
                        <span id="navUnreadBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem; display: none;">
                            0
                        </span>
                    </a>
                    
                    <div class="dropdown">
                        <button class="btn btn-soft-custom dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span id="userName">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="account-settings.html"><i class="fas fa-cog me-2"></i>設定</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>ログアウト</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="notification-container">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                    <div>
                        <h1><i class="fas fa-bell me-2 text-accent"></i>通知センター</h1>
                        <p>売上、翻訳完了、コメントなどの通知を確認できます</p>
                    </div>
                    <a href="account-settings.html#notifications" class="btn btn-outline-custom">
                        <i class="fas fa-cog me-1"></i> 通知設定
                    </a>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="stats-row" id="statsRow">
                <div class="stat-mini">
                    <div class="stat-value" id="totalCount">-</div>
                    <div class="stat-label">全通知</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-value" id="unreadCount">-</div>
                    <div class="stat-label">未読</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-value" id="todayCount">-</div>
                    <div class="stat-label">今日</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-value" id="weekCount">-</div>
                    <div class="stat-label">今週</div>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-left">
                    <select class="form-select form-select-sm" id="typeFilter" style="width: auto;">
                        <option value="">すべてのタイプ</option>
                        <option value="sale">💰 売上</option>
                        <option value="translation_complete">🌐 翻訳完了</option>
                        <option value="comment">💬 コメント</option>
                        <option value="feedback">⭐ フィードバック</option>
                        <option value="ticket_reply">🎧 サポート</option>
                        <option value="system">🔔 システム</option>
                        <option value="account">👤 アカウント</option>
                    </select>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="unreadOnly">
                        <label class="form-check-label" for="unreadOnly">
                            未読のみ
                        </label>
                    </div>
                </div>

                <div class="filter-right">
                    <button class="btn btn-sm btn-outline-custom" id="markAllReadBtn">
                        <i class="fas fa-check-double me-1"></i> すべて既読
                    </button>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-custom dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" id="clearReadBtn"><i class="fas fa-broom me-2"></i>既読を削除</a></li>
                            <li><a class="dropdown-item text-danger" href="#" id="clearAllBtn"><i class="fas fa-trash me-2"></i>すべて削除</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Notification List -->
            <div class="notification-list" id="notificationList">
                <!-- Loading State -->
                <div class="text-center py-5" id="loadingState">
                    <div class="spinner-border text-accent" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-muted">通知を読み込み中...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination-container" id="paginationContainer" style="display: none;">
                <button class="btn btn-sm btn-outline-custom" id="prevPageBtn" disabled>
                    <i class="fas fa-chevron-left"></i> 前へ
                </button>
                <span class="text-muted" id="pageInfo">1 / 1</span>
                <button class="btn btn-sm btn-outline-custom" id="nextPageBtn" disabled>
                    次へ <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <p class="small mb-0">&copy; 2024 Publisher. All rights reserved.</p>
                <div class="d-flex gap-3">
                    <a href="support/faq.html" class="text-secondary">ヘルプ</a>
                    <a href="terms.html" class="text-secondary">利用規約</a>
                    <a href="privacy.html" class="text-secondary">プライバシー</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==================================================
        // 設定
        // ==================================================
        const API_BASE = '/api/notifications';
        let currentPage = 1;
        let totalPages = 1;
        let currentFilter = { type: '', unreadOnly: false };
        let isDemo = new URLSearchParams(window.location.search).get('demo') === 'true';

        // ==================================================
        // デモデータ
        // ==================================================
        const DEMO_NOTIFICATIONS = [
            {
                notification_id: '1',
                notification_type: 'sale',
                title: '作品が購入されました！ 💰',
                message: '「魔法学園の冒険」がJohnさんに購入されました。¥980の収益が発生しました。',
                icon: 'fa-dollar-sign',
                icon_color: 'success',
                action_url: '/pages/earnings.html',
                is_read: false,
                created_at: new Date(Date.now() - 30 * 60 * 1000).toISOString()
            },
            {
                notification_id: '2',
                notification_type: 'translation_complete',
                title: '翻訳が完了しました',
                message: '「魔法学園の冒険」の英語翻訳が完了しました。',
                icon: 'fa-language',
                icon_color: 'info',
                action_url: '/pages/translation-status.html',
                is_read: false,
                created_at: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString()
            },
            {
                notification_id: '3',
                notification_type: 'feedback',
                title: '読者フィードバック ⭐',
                message: '「未来への囁き」に★5の評価がつきました！「感動的なストーリーでした」',
                icon: 'fa-star',
                icon_color: 'warning',
                action_url: '/pages/feedback/author.html',
                is_read: false,
                created_at: new Date(Date.now() - 5 * 60 * 60 * 1000).toISOString()
            },
            {
                notification_id: '4',
                notification_type: 'comment',
                title: '新しいコメント',
                message: '「デジタルドリーム」に新しいコメントがあります。',
                icon: 'fa-comment',
                icon_color: 'primary',
                action_url: '/pages/dashboard.html',
                is_read: true,
                created_at: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()
            },
            {
                notification_id: '5',
                notification_type: 'ticket_reply',
                title: 'サポートから返信',
                message: 'お問い合わせ #12345 にサポートチームから返信がありました。',
                icon: 'fa-headset',
                icon_color: 'info',
                action_url: '/pages/support/tickets.html',
                is_read: true,
                created_at: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString()
            },
            {
                notification_id: '6',
                notification_type: 'system',
                title: 'Publisherへようこそ！ 🎉',
                message: 'アカウントの作成が完了しました。作品をアップロードして世界中の読者に届けましょう！',
                icon: 'fa-rocket',
                icon_color: 'primary',
                action_url: '/pages/upload-work.html',
                is_read: true,
                created_at: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString()
            }
        ];

        // ==================================================
        // 初期化
        // ==================================================
        document.addEventListener('DOMContentLoaded', function() {
            initUser();
            loadNotifications();
            setupEventListeners();
            loadUnreadCount();
        });

        function initUser() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.firstName) {
                document.getElementById('userName').textContent = user.firstName;
            }

            if (isDemo) {
                console.log('📋 デモモードで動作中');
            }
        }

        // ==================================================
        // 通知取得
        // ==================================================
        async function loadNotifications() {
            const listContainer = document.getElementById('notificationList');
            
            if (isDemo) {
                renderNotifications(filterDemoData());
                updateStats();
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-lock"></i>
                        <h3>ログインが必要です</h3>
                        <p>通知を確認するにはログインしてください</p>
                        <a href="login.html" class="btn btn-custom mt-3">ログイン</a>
                    </div>
                `;
                return;
            }

            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    limit: 20
                });

                if (currentFilter.type) {
                    params.append('type', currentFilter.type);
                }
                if (currentFilter.unreadOnly) {
                    params.append('unread_only', 'true');
                }

                const response = await fetch(`${API_BASE}?${params}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load notifications');

                const data = await response.json();
                
                if (data.success) {
                    renderNotifications(data.notifications);
                    updatePagination(data.pagination);
                    loadStats();
                }

            } catch (error) {
                console.error('Load notifications error:', error);
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>読み込みエラー</h3>
                        <p>通知の読み込みに失敗しました</p>
                        <button class="btn btn-custom mt-3" onclick="loadNotifications()">再試行</button>
                    </div>
                `;
            }
        }

        function filterDemoData() {
            let filtered = [...DEMO_NOTIFICATIONS];
            
            if (currentFilter.type) {
                filtered = filtered.filter(n => n.notification_type === currentFilter.type);
            }
            if (currentFilter.unreadOnly) {
                filtered = filtered.filter(n => !n.is_read);
            }
            
            return filtered;
        }

        // ==================================================
        // 通知レンダリング
        // ==================================================
        function renderNotifications(notifications) {
            const listContainer = document.getElementById('notificationList');
            
            if (!notifications || notifications.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bell-slash"></i>
                        <h3>通知はありません</h3>
                        <p>新しい通知があるとここに表示されます</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = notifications.map(n => `
                <div class="notification-item ${n.is_read ? '' : 'unread'}" 
                     data-id="${n.notification_id}"
                     onclick="handleNotificationClick('${n.notification_id}', '${n.action_url || ''}')">
                    <div class="notification-icon ${n.icon_color || 'primary'}">
                        <i class="fas ${n.icon || 'fa-bell'} fa-lg"></i>
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">
                            ${n.title}
                            ${!n.is_read ? '<span class="badge bg-accent">NEW</span>' : ''}
                        </div>
                        <div class="notification-message">${n.message}</div>
                        <div class="notification-meta">
                            <span class="type-badge ${n.notification_type}">
                                ${getTypeLabel(n.notification_type)}
                            </span>
                            <span><i class="fas fa-clock me-1"></i>${formatTimeAgo(n.created_at)}</span>
                        </div>
                    </div>
                    <div class="notification-actions">
                        ${!n.is_read ? `
                            <button class="btn btn-sm btn-outline-custom" 
                                    onclick="event.stopPropagation(); markAsRead('${n.notification_id}')"
                                    title="既読にする">
                                <i class="fas fa-check"></i>
                            </button>
                        ` : ''}
                        <button class="btn btn-sm btn-outline-danger" 
                                onclick="event.stopPropagation(); deleteNotification('${n.notification_id}')"
                                title="削除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getTypeLabel(type) {
            const labels = {
                'sale': '💰 売上',
                'translation_complete': '🌐 翻訳',
                'translation_request': '📤 翻訳依頼',
                'comment': '💬 コメント',
                'feedback': '⭐ フィードバック',
                'system': '🔔 システム',
                'ticket_reply': '🎧 サポート',
                'account': '👤 アカウント'
            };
            return labels[type] || type;
        }

        function formatTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'たった今';
            if (minutes < 60) return `${minutes}分前`;
            if (hours < 24) return `${hours}時間前`;
            if (days < 7) return `${days}日前`;
            
            return date.toLocaleDateString('ja-JP');
        }

        // ==================================================
        // 統計情報
        // ==================================================
        function updateStats() {
            // デモ用統計
            const total = DEMO_NOTIFICATIONS.length;
            const unread = DEMO_NOTIFICATIONS.filter(n => !n.is_read).length;
            const today = DEMO_NOTIFICATIONS.filter(n => {
                const d = new Date(n.created_at);
                const now = new Date();
                return d.toDateString() === now.toDateString();
            }).length;
            const week = DEMO_NOTIFICATIONS.filter(n => {
                const d = new Date(n.created_at);
                const now = new Date();
                const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
                return d >= weekAgo;
            }).length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('unreadCount').textContent = unread;
            document.getElementById('todayCount').textContent = today;
            document.getElementById('weekCount').textContent = week;
        }

        async function loadStats() {
            // 実際のAPIから統計を取得（将来実装）
            // 現在はtotalとunreadのみAPIから取得可能
        }

        // ==================================================
        // 未読数取得（ヘッダーバッジ用）
        // ==================================================
        async function loadUnreadCount() {
            if (isDemo) {
                const count = DEMO_NOTIFICATIONS.filter(n => !n.is_read).length;
                updateUnreadBadge(count);
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/unread-count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    updateUnreadBadge(data.count);
                }
            } catch (error) {
                console.error('Load unread count error:', error);
            }
        }

        function updateUnreadBadge(count) {
            const badge = document.getElementById('navUnreadBadge');
            if (count > 0) {
                badge.textContent = count > 99 ? '99+' : count;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
            
            // 統計も更新
            const unreadEl = document.getElementById('unreadCount');
            if (unreadEl) unreadEl.textContent = count;
        }

        // ==================================================
        // アクション
        // ==================================================
        function handleNotificationClick(id, actionUrl) {
            markAsRead(id);
            
            if (actionUrl) {
                window.location.href = actionUrl;
            }
        }

        async function markAsRead(id) {
            if (isDemo) {
                const n = DEMO_NOTIFICATIONS.find(n => n.notification_id === id);
                if (n) n.is_read = true;
                loadNotifications();
                loadUnreadCount();
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/${id}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadNotifications();
                    loadUnreadCount();
                }
            } catch (error) {
                console.error('Mark as read error:', error);
            }
        }

        async function markAllAsRead() {
            if (isDemo) {
                DEMO_NOTIFICATIONS.forEach(n => n.is_read = true);
                loadNotifications();
                loadUnreadCount();
                showToast('すべての通知を既読にしました');
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/read-all`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadNotifications();
                    loadUnreadCount();
                    showToast('すべての通知を既読にしました');
                }
            } catch (error) {
                console.error('Mark all as read error:', error);
            }
        }

        async function deleteNotification(id) {
            if (!confirm('この通知を削除しますか？')) return;

            if (isDemo) {
                const idx = DEMO_NOTIFICATIONS.findIndex(n => n.notification_id === id);
                if (idx > -1) DEMO_NOTIFICATIONS.splice(idx, 1);
                loadNotifications();
                loadUnreadCount();
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadNotifications();
                    loadUnreadCount();
                    showToast('通知を削除しました');
                }
            } catch (error) {
                console.error('Delete notification error:', error);
            }
        }

        async function clearNotifications(readOnly = false) {
            const message = readOnly 
                ? '既読の通知をすべて削除しますか？' 
                : 'すべての通知を削除しますか？この操作は取り消せません。';
            
            if (!confirm(message)) return;

            if (isDemo) {
                if (readOnly) {
                    const unread = DEMO_NOTIFICATIONS.filter(n => !n.is_read);
                    DEMO_NOTIFICATIONS.length = 0;
                    DEMO_NOTIFICATIONS.push(...unread);
                } else {
                    DEMO_NOTIFICATIONS.length = 0;
                }
                loadNotifications();
                loadUnreadCount();
                showToast('通知を削除しました');
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const url = readOnly 
                    ? `${API_BASE}/clear-all?read_only=true`
                    : `${API_BASE}/clear-all`;
                    
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadNotifications();
                    loadUnreadCount();
                    showToast('通知を削除しました');
                }
            } catch (error) {
                console.error('Clear notifications error:', error);
            }
        }

        // ==================================================
        // ページネーション
        // ==================================================
        function updatePagination(pagination) {
            const container = document.getElementById('paginationContainer');
            
            if (pagination.totalPages <= 1) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'flex';
            totalPages = pagination.totalPages;

            document.getElementById('pageInfo').textContent = 
                `${pagination.page} / ${pagination.totalPages}`;
            
            document.getElementById('prevPageBtn').disabled = !pagination.hasPrev;
            document.getElementById('nextPageBtn').disabled = !pagination.hasNext;
        }

        function goToPage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            }
            loadNotifications();
        }

        // ==================================================
        // イベントリスナー
        // ==================================================
        function setupEventListeners() {
            // フィルター
            document.getElementById('typeFilter').addEventListener('change', (e) => {
                currentFilter.type = e.target.value;
                currentPage = 1;
                loadNotifications();
            });

            document.getElementById('unreadOnly').addEventListener('change', (e) => {
                currentFilter.unreadOnly = e.target.checked;
                currentPage = 1;
                loadNotifications();
            });

            // アクションボタン
            document.getElementById('markAllReadBtn').addEventListener('click', markAllAsRead);
            document.getElementById('clearReadBtn').addEventListener('click', () => clearNotifications(true));
            document.getElementById('clearAllBtn').addEventListener('click', () => clearNotifications(false));

            // ページネーション
            document.getElementById('prevPageBtn').addEventListener('click', () => goToPage('prev'));
            document.getElementById('nextPageBtn').addEventListener('click', () => goToPage('next'));
        }

        // ==================================================
        // ユーティリティ
        // ==================================================
        function showToast(message) {
            // 簡易トースト表示
            const toast = document.createElement('div');
            toast.className = 'position-fixed bottom-0 end-0 p-3';
            toast.style.zIndex = '9999';
            toast.innerHTML = `
                <div class="toast show" role="alert">
                    <div class="toast-body">
                        <i class="fas fa-check-circle text-success me-2"></i>
                        ${message}
                    </div>
                </div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
