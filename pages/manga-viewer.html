<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="mangaViewer.pageTitle">Manga Viewer - Publisher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/mobile-fixes.css" rel="stylesheet">
    <style>
        body {
            background: #000;
            color: #fff;
        }
        .viewer-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .viewer-header {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem;
            border-bottom: 1px solid #333;
        }
        .viewer-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .manga-page {
            max-width: 100%;
            max-height: calc(100vh - 140px);
            object-fit: contain;
            cursor: pointer;
        }
        .viewer-controls {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-nav {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .reading-mode-switch {
            display: flex;
            gap: 0.5rem;
        }
        .mode-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn:hover {
            background: #333;
        }
        .mode-btn.active {
            background: #0d6efd;
            border-color: #0d6efd;
        }
        .page-counter {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .thumbnail-strip {
            position: absolute;
            bottom: 80px;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            display: none;
            overflow-x: auto;
            white-space: nowrap;
        }
        .thumbnail-strip.show {
            display: block;
        }
        .thumbnail {
            display: inline-block;
            width: 80px;
            height: 120px;
            margin: 0 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
            background: #333;
        }
        .thumbnail:hover {
            border-color: #0d6efd;
            transform: scale(1.05);
        }
        .thumbnail.active {
            border-color: #0d6efd;
        }
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Notification badge styles */
        .notification-btn {
            position: relative;
        }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.6rem;
            padding: 2px 5px;
        }
        
        /* Page loading indicator */
        .page-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .page-loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .page-loading p {
            margin-top: 1rem;
            color: #888;
        }
        
        /* Preload progress bar */
        .preload-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #0d6efd, #20c997);
            transition: width 0.3s ease;
            z-index: 1000;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .viewer-controls {
                flex-direction: column;
                gap: 1rem;
                padding: 0.75rem;
            }
            .reading-mode-switch {
                order: 2;
                flex-wrap: wrap;
                justify-content: center;
            }
            .mode-btn {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }
            .page-nav {
                order: 1;
            }
            .viewer-controls > .d-flex:last-child {
                order: 3;
            }
            .viewer-header h5 {
                font-size: 0.9rem;
            }
            .viewer-header .d-flex {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Preload Progress Bar -->
    <div class="preload-progress" id="preloadProgress" style="width: 0%;"></div>

    <div class="viewer-container">
        <!-- Header -->
        <div class="viewer-header">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-0">The Last Samurai - Chapter 1</h5>
                    <small class="text-muted">by Kenji Tanaka</small>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm" onclick="toggleFullscreen()">
                        <i class="fas fa-expand"></i> <span class="d-none d-md-inline" data-i18n="mangaViewer.fullscreen">Fullscreen</span>
                    </button>
                    <button class="btn btn-outline-light btn-sm" onclick="showThumbnails()">
                        <i class="fas fa-th"></i> <span class="d-none d-md-inline" data-i18n="mangaViewer.pages">Pages</span>
                    </button>
                    <!-- Notification Bell -->
                    <a href="notifications.html" class="btn btn-outline-light btn-sm notification-btn" title="通知" id="notificationBellContainer">
                        <i class="fas fa-bell"></i>
                        <span id="notificationBadge" class="badge rounded-pill bg-danger notification-badge" style="display: none;">0</span>
                    </a>
                    <a href="dashboard.html" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-times"></i> <span class="d-none d-md-inline" data-i18n="mangaViewer.close">Close</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Viewer Content -->
        <div class="viewer-content" id="viewerContent">
            <!-- Loading indicator (shown initially) -->
            <div class="page-loading" id="pageLoading">
                <div class="spinner"></div>
                <p data-i18n="mangaViewer.loadingPage">Loading page...</p>
            </div>
            
            <!-- Manga page with lazy loading -->
            <img src="" 
                 class="manga-page lazy-image" 
                 id="mangaPage"
                 alt="Manga Page"
                 onclick="nextPage()"
                 style="display: none;">
            
            <!-- Navigation arrows -->
            <button class="btn btn-dark position-absolute start-0 top-50 translate-middle-y ms-3" 
                    style="z-index: 10; opacity: 0.7;"
                    onclick="previousPage()">
                <i class="fas fa-chevron-left fa-2x"></i>
            </button>
            <button class="btn btn-dark position-absolute end-0 top-50 translate-middle-y me-3" 
                    style="z-index: 10; opacity: 0.7;"
                    onclick="nextPage()">
                <i class="fas fa-chevron-right fa-2x"></i>
            </button>
        </div>

        <!-- Thumbnail Strip -->
        <div class="thumbnail-strip" id="thumbnailStrip">
            <!-- Thumbnails will be generated here with lazy loading -->
        </div>

        <!-- Controls -->
        <div class="viewer-controls">
            <div class="reading-mode-switch">
                <button class="mode-btn active" id="ltrBtn" onclick="setReadingMode('ltr')">
                    <i class="fas fa-arrow-right"></i> <span class="d-none d-sm-inline" data-i18n="mangaViewer.leftToRight">Left to Right</span>
                </button>
                <button class="mode-btn" id="rtlBtn" onclick="setReadingMode('rtl')">
                    <i class="fas fa-arrow-left"></i> <span class="d-none d-sm-inline" data-i18n="mangaViewer.rightToLeft">Right to Left</span>
                </button>
                <button class="mode-btn" id="verticalBtn" onclick="setReadingMode('vertical')">
                    <i class="fas fa-arrow-down"></i> <span class="d-none d-sm-inline" data-i18n="mangaViewer.vertical">Vertical</span>
                </button>
            </div>

            <div class="page-nav">
                <button class="btn btn-light" onclick="previousPage()">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <span class="page-counter">
                    <span id="currentPage">1</span> / <span id="totalPages">24</span>
                </span>
                <button class="btn btn-light" onclick="nextPage()">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-light" onclick="zoomIn()">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button class="btn btn-outline-light" onclick="zoomOut()">
                    <i class="fas fa-search-minus"></i>
                </button>
                <button class="btn btn-outline-light" onclick="resetZoom()">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="../js/translations.js"></script>
    <script src="../js/lazy-loader.js"></script>
    <script>
        // =====================================================
        // =====================================================
        // Translation Functions
        // =====================================================
        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });
            document.title = t('mangaViewer.pageTitle');
        }
        // Configuration
        // =====================================================
        const totalPages = 24;
        let currentPage = 1;
        let readingMode = 'ltr';
        let zoomLevel = 1;
        
        // Page URLs (in production, these would come from API)
        // Using placeholder images for demo
        const pageUrls = [];
        const thumbnailUrls = [];
        
        for (let i = 1; i <= totalPages; i++) {
            pageUrls.push(`https://via.placeholder.com/800x1200/333/fff?text=Manga+Page+${i}`);
            thumbnailUrls.push(`https://via.placeholder.com/80x120/333/fff?text=P${i}`);
        }

        // Preloaded pages cache
        const preloadedPages = new Map();
        const PRELOAD_AHEAD = 3; // Number of pages to preload ahead

        // =====================================================
        // Initialization
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            applyTranslations();
            initThumbnails();
            loadPage(1);
            preloadPages(1);
        });

        // =====================================================
        // Page Loading with Lazy Loading
        // =====================================================
        function loadPage(pageNum) {
            const mangaPage = document.getElementById('mangaPage');
            const loading = document.getElementById('pageLoading');
            
            // Show loading indicator
            loading.style.display = 'block';
            mangaPage.style.display = 'none';
            
            const url = pageUrls[pageNum - 1];
            
            // Check if already preloaded
            if (preloadedPages.has(pageNum)) {
                // Use cached image
                mangaPage.src = url;
                mangaPage.style.display = 'block';
                loading.style.display = 'none';
                mangaPage.classList.add('lazy-loaded');
            } else {
                // Load image
                const img = new Image();
                img.onload = function() {
                    mangaPage.src = url;
                    mangaPage.style.display = 'block';
                    loading.style.display = 'none';
                    mangaPage.classList.add('lazy-loaded');
                    preloadedPages.set(pageNum, true);
                };
                img.onerror = function() {
                    loading.innerHTML = `
                        <i class="fas fa-exclamation-triangle fa-3x text-warning"></i>
                        <p>${t('mangaViewer.loadFailed')} <a href="#" onclick="loadPage(${pageNum})" class="text-info">${t('mangaViewer.retry')}</a></p>
                    `;
                };
                img.src = url;
            }
            
            // Update UI
            document.getElementById('currentPage').textContent = pageNum;
            updateThumbnailActive(pageNum);
            
            // Preload surrounding pages
            preloadPages(pageNum);
        }

        // =====================================================
        // Preloading Logic
        // =====================================================
        function preloadPages(currentPageNum) {
            const pagesToPreload = [];
            
            // Preload ahead
            for (let i = 1; i <= PRELOAD_AHEAD; i++) {
                if (currentPageNum + i <= totalPages) {
                    pagesToPreload.push(currentPageNum + i);
                }
            }
            
            // Preload one behind
            if (currentPageNum > 1) {
                pagesToPreload.push(currentPageNum - 1);
            }
            
            // Filter out already preloaded
            const toLoad = pagesToPreload.filter(p => !preloadedPages.has(p));
            
            // Update progress bar
            updatePreloadProgress();
            
            // Preload images
            toLoad.forEach(pageNum => {
                const img = new Image();
                img.onload = function() {
                    preloadedPages.set(pageNum, true);
                    updatePreloadProgress();
                };
                img.src = pageUrls[pageNum - 1];
            });
        }

        function updatePreloadProgress() {
            const progress = (preloadedPages.size / totalPages) * 100;
            document.getElementById('preloadProgress').style.width = progress + '%';
            
            // Hide when complete
            if (progress >= 100) {
                setTimeout(() => {
                    document.getElementById('preloadProgress').style.opacity = '0';
                }, 500);
            }
        }

        // =====================================================
        // Thumbnail Initialization with Lazy Loading
        // =====================================================
        function initThumbnails() {
            const strip = document.getElementById('thumbnailStrip');
            strip.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const thumb = document.createElement('div');
                thumb.className = 'thumbnail' + (i === 1 ? ' active' : '');
                thumb.dataset.page = i;
                
                // Use lazy loading for thumbnails
                thumb.innerHTML = `
                    <img class="lazy-image" 
                         src="" 
                         data-src="${thumbnailUrls[i - 1]}" 
                         alt="Page ${i}"
                         loading="lazy">
                `;
                
                thumb.onclick = () => goToPage(i);
                strip.appendChild(thumb);
            }
            
            // Initialize thumbnail lazy loader
            if (typeof ThumbnailLazyLoader !== 'undefined') {
                ThumbnailLazyLoader.init(strip);
            }
        }

        function updateThumbnailActive(pageNum) {
            document.querySelectorAll('.thumbnail').forEach((thumb, index) => {
                thumb.classList.toggle('active', index + 1 === pageNum);
            });
            
            // Scroll thumbnail into view
            const activeThumb = document.querySelector('.thumbnail.active');
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function showThumbnails() {
            const strip = document.getElementById('thumbnailStrip');
            strip.classList.toggle('show');
            
            // Trigger lazy loading of visible thumbnails
            if (strip.classList.contains('show') && typeof LazyLoader !== 'undefined') {
                LazyLoader.observeNew(strip);
            }
        }

        // =====================================================
        // Navigation
        // =====================================================
        function goToPage(page) {
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                loadPage(page);
                document.getElementById('thumbnailStrip').classList.remove('show');
            }
        }

        function nextPage() {
            if (readingMode === 'rtl') {
                if (currentPage > 1) {
                    currentPage--;
                    loadPage(currentPage);
                }
            } else {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadPage(currentPage);
                }
            }
        }

        function previousPage() {
            if (readingMode === 'rtl') {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadPage(currentPage);
                }
            } else {
                if (currentPage > 1) {
                    currentPage--;
                    loadPage(currentPage);
                }
            }
        }

        // =====================================================
        // Reading Mode
        // =====================================================
        function setReadingMode(mode) {
            readingMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(mode + 'Btn').classList.add('active');
            
            if (mode === 'vertical') {
                // Switch to vertical scrolling mode (future implementation)
                alert(t('mangaViewer.verticalComingSoon'));
            }
        }

        // =====================================================
        // Zoom Controls
        // =====================================================
        function zoomIn() {
            zoomLevel = Math.min(zoomLevel + 0.1, 3);
            applyZoom();
        }

        function zoomOut() {
            zoomLevel = Math.max(zoomLevel - 0.1, 0.5);
            applyZoom();
        }

        function resetZoom() {
            zoomLevel = 1;
            applyZoom();
        }

        function applyZoom() {
            document.getElementById('mangaPage').style.transform = `scale(${zoomLevel})`;
        }

        // =====================================================
        // Fullscreen
        // =====================================================
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // =====================================================
        // Keyboard Navigation
        // =====================================================
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowRight':
                case 'ArrowDown':
                    nextPage();
                    break;
                case 'ArrowLeft':
                case 'ArrowUp':
                    previousPage();
                    break;
                case 'f':
                    toggleFullscreen();
                    break;
                case '+':
                case '=':
                    zoomIn();
                    break;
                case '-':
                    zoomOut();
                    break;
                case '0':
                    resetZoom();
                    break;
                case 'Escape':
                    document.getElementById('thumbnailStrip').classList.remove('show');
                    break;
            }
        });

        // =====================================================
        // Touch Gestures (for mobile)
        // =====================================================
        let touchStartX = 0;
        let touchEndX = 0;

        document.getElementById('viewerContent').addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.getElementById('viewerContent').addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchEndX - touchStartX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe right
                    previousPage();
                } else {
                    // Swipe left
                    nextPage();
                }
            }
        }
    </script>
    <!-- Notification Badge -->
    <script src="../js/header-notification.js"></script>
</body>
</html>
