<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202608061951">
    <title>Work Detail - AuctLect</title>
    <script src="../js/config.js?v=202608061951"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/variables.css?v=202608061951" rel="stylesheet">
    <link href="../css/style-new.css?v=202608061951" rel="stylesheet">
    <link href="../css/components.css?v=202608061951" rel="stylesheet">
    <link href="../css/mobile-fixes.css?v=202608061951" rel="stylesheet">
    <link href="../css/navbar.css?v=202608061951" rel="stylesheet">
<!-- Work Detail Page Styles -->
    <style>
        .work-detail-container { padding: var(--spacing-xl) 0; }

        /* Work header - side-by-side layout */
        .work-header {
            display: flex;
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
        }

        /* Cover image area */
        .work-detail-cover {
            flex-shrink: 0;
            width: 280px;
            height: 400px;
            background: var(--color-bg-hover);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .work-detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .work-detail-cover i {
            font-size: 5rem;
            color: var(--color-accent-light);
        }

        /* Work info section */
        .work-detail-info { flex: 1; }
        .work-detail-title {
            font-family: var(--font-heading);
            font-size: var(--font-size-3xl);
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            color: var(--color-text-primary);
        }
        .work-detail-author {
            font-size: var(--font-size-lg);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-md);
        }
        .work-detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            align-items: center;
        }
        .genre-badge {
            background: rgba(139, 115, 85, 0.1);
            color: var(--color-accent);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            font-weight: 500;
        }
        .rating-display {
            color: var(--color-warning);
            font-size: var(--font-size-base);
        }
        .rating-display .rating-number {
            color: var(--color-text-primary);
            font-weight: 600;
            margin-left: 0.25rem;
        }
        .price-display {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-accent);
        }
        .language-badge {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }
        .btn-read {
            background: var(--color-accent);
            color: #FFFFFF;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-read:hover { background: var(--color-accent-hover); color: #FFFFFF; }
        .btn-purchase {
            background: var(--color-success);
            color: #FFFFFF;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-purchase:hover { background: #4a8a47; color: #FFFFFF; }
        .btn-gift {
            background: transparent;
            color: var(--color-accent);
            border: 1px solid var(--color-accent);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-gift:hover { background: var(--color-accent); color: #FFFFFF; }
        .age-badge {
            display: inline-flex; align-items: center; gap: 0.3rem;
            padding: 0.2rem 0.7rem; border-radius: 999px;
            font-size: 0.78rem; font-weight: 700;
            background: rgba(179,71,71,0.12); color: #b34747; border: 1px solid rgba(179,71,71,0.35);
        }
        .content-warnings {
            margin-top: 0.5rem; font-size: 0.8rem; color: var(--color-text-secondary);
            display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
        }
        .content-warnings .cw {
            background: var(--color-bg-secondary, #f2efe9); border: 1px solid var(--color-border);
            border-radius: 6px; padding: 0.1rem 0.5rem;
        }
        .btn-report {
            background: none; border: none; color: var(--color-text-secondary);
            font-size: 0.8rem; cursor: pointer; padding: 0.25rem 0.5rem; border-radius: 6px;
        }
        .btn-report:hover { color: #b34747; background: rgba(179,71,71,0.08); }
        .gift-suggest { max-height: 220px; overflow-y: auto; }
        .collab-request-buttons { display: flex; gap: var(--spacing-sm); flex-wrap: wrap; }
        .btn-collab-request {
            background: transparent; color: var(--color-accent); border: 1px solid var(--color-accent);
            padding: 0.5rem 1rem; border-radius: var(--radius-md); font-size: var(--font-size-sm);
            font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.25rem;
        }
        .btn-collab-request:hover { background: var(--color-accent); color: #FFFFFF; }
        .badge-in-library {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: var(--font-size-base);
            color: var(--color-success);
            background: rgba(74, 138, 71, 0.1);
            border: 1px solid rgba(74, 138, 71, 0.3);
        }
        /* Section cards */
        .detail-section {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
        }
        .detail-section h2 {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        .detail-section h2 i { color: var(--color-accent); }
        .synopsis-text {
            font-size: var(--font-size-base);
            line-height: 1.8;
            color: var(--color-text-primary);
            white-space: pre-wrap;
        }

        /* Work metadata */
        .work-metadata {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--spacing-md);
        }
        .metadata-item {
            display: flex;
            flex-direction: column;
        }
        .metadata-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-xs);
        }
        .metadata-value {
            font-weight: 500;
            color: var(--color-text-primary);
        }

        /* Reviews section */
        .rating-summary {
            display: flex;
            align-items: center;
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
        }
        .rating-big {
            text-align: center;
        }
        .rating-big .number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--color-text-primary);
            line-height: 1;
        }
        .rating-big .stars {
            color: var(--color-warning);
            font-size: var(--font-size-lg);
            margin: var(--spacing-xs) 0;
        }
        .rating-big .count {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        /* Review item */
        .review-item {
            padding: var(--spacing-lg) 0;
            border-bottom: 1px solid var(--color-border);
        }
        .review-item:last-child { border-bottom: none; }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }
        .review-user {
            font-weight: 600;
            color: var(--color-text-primary);
        }
        .review-date {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }
        .review-stars {
            color: var(--color-warning);
            margin-bottom: var(--spacing-sm);
        }
        .review-text {
            color: var(--color-text-primary);
            line-height: 1.6;
        }

        /* Write review form */
        .review-form {
            background: var(--color-bg-main);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }
        .review-form h3 {
            font-size: var(--font-size-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }
        .star-selector {
            display: flex;
            gap: 0.25rem;
            margin-bottom: var(--spacing-md);
            font-size: 1.5rem;
        }
        .star-selector i {
            cursor: pointer;
            color: var(--color-border);
            transition: color 0.2s;
        }
        .star-selector i.active,
        .star-selector i:hover {
            color: var(--color-warning);
        }
        .review-form textarea {
            width: 100%;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            font-family: var(--font-primary);
            resize: vertical;
            min-height: 100px;
        }
        .review-form textarea:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        /* Guest review prompt */
        .guest-review-prompt {
            text-align: center;
            padding: var(--spacing-lg);
            color: var(--color-text-secondary);
            background: var(--color-bg-main);
            border-radius: var(--radius-md);
            margin-top: var(--spacing-lg);
        }

        /* Breadcrumb */
        .breadcrumb {
            background: transparent;
            padding: 0;
            margin-bottom: var(--spacing-md);
        }
        .breadcrumb a {
            color: var(--color-accent);
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .work-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .work-detail-cover { width: 200px; height: 300px; }
            .work-detail-meta { justify-content: center; }
            .action-buttons { justify-content: center; }
            .rating-summary { flex-direction: column; text-align: center; }
            .work-metadata { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 576px) {
            .work-detail-cover { width: 160px; height: 240px; }
            .work-detail-title { font-size: var(--font-size-xl); }
            .action-buttons { flex-direction: column; }
            .action-buttons .btn-purchase { width: 100%; justify-content: center; }
            .work-metadata { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="navbar-container"></div>

    <main class="work-detail-container">
        <div class="container" style="max-width: 900px;">

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="browse.html" id="breadcrumbBrowse" data-i18n="workDetail.breadcrumbBrowse">Browse</a></li>
                    <li class="breadcrumb-item active" id="breadcrumbTitle">Work Title</li>
                </ol>
            </nav>

            <!-- Work Header Card -->
            <div class="work-header">
                <div class="work-detail-cover" id="workCover">
                    <i class="fas fa-book"></i>
                </div>
                <div class="work-detail-info">
                    <h1 class="work-detail-title" id="workTitle"></h1>
                    <p class="work-detail-author" id="workAuthor"></p>
                    <div class="work-detail-meta">
                        <span class="genre-badge" id="workGenre"></span>
                        <span class="rating-display" id="workRating"></span>
                        <span class="price-display" id="workPrice"></span>
                        <span class="language-badge" id="workLanguage">
                            <i class="fas fa-globe me-1"></i>
                        </span>
                        <span class="age-badge" id="workAgeRating" style="display:none;"></span>
                    </div>
                    <div id="workWarnings" class="content-warnings" style="display:none;"></div>
                    <div class="action-buttons">
                        <button class="btn-purchase" id="btnPurchase" onclick="purchaseWork()" style="display:none;">
                            <i class="fas fa-shopping-cart"></i>
                            <span id="btnPurchaseText" data-i18n="workDetail.purchase">Purchase</span>
                        </button>
                        <button class="btn-purchase" id="btnGetFree" onclick="getFreeWork()" style="display:none;">
                            <i class="fas fa-plus-circle"></i>
                            <span id="btnGetFreeText" data-i18n="workDetail.getFree">Get Free</span>
                        </button>
                        <button class="btn-gift" id="btnGift" onclick="openGiftModal()" style="display:none;">
                            <i class="fas fa-gift"></i>
                            <span id="btnGiftText">Gift this work</span>
                        </button>
                        <a class="btn-read" id="btnReadNow" href="#" style="display:none;">
                            <i class="fas fa-book-open"></i>
                            <span id="btnReadText" data-i18n="workDetail.readNow">Read Now</span>
                        </a>
                        <span class="badge-in-library" id="badgeInLibrary" style="display:none;">
                            <i class="fas fa-check-circle"></i>
                            <span id="badgeInLibraryText" data-i18n="workDetail.inLibrary">In Library</span>
                        </span>
                    </div>
                    <!-- Translate/Edit Request Buttons (auth-only) -->
                    <div class="collab-request-buttons auth-only" style="margin-top: 0.75rem;">
                        <button class="btn-collab-request" id="btnWantTranslate" onclick="requestCollaboration('translate')">
                            <i class="fas fa-language me-1"></i>
                            <span id="btnWantTranslateText" data-i18n="workDetail.wantTranslate">I want to translate this work</span>
                        </button>
                        <button class="btn-collab-request" id="btnWantEdit" onclick="requestCollaboration('edit')">
                            <i class="fas fa-pen-fancy me-1"></i>
                            <span id="btnWantEditText" data-i18n="workDetail.wantEdit">I'd like to edit this author's next work</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 通報導線: 目立たせすぎず、必要な人には見つかる位置に置く -->
            <div style="text-align:right; margin-top:-0.5rem;">
                <button class="btn-report" id="btnReport" onclick="openReportModal()" style="display:none;">
                    <i class="fas fa-flag me-1"></i><span id="btnReportText">Report this work</span>
                </button>
            </div>

            <!-- Synopsis Section -->
            <div class="detail-section">
                <h2><i class="fas fa-align-left"></i> <span id="synopsisTitle" data-i18n="workDetail.synopsis">Synopsis</span></h2>
                <div class="synopsis-text" id="synopsisContent"></div>
            </div>

            <!-- Work Details / Metadata Section -->
            <div class="detail-section">
                <h2><i class="fas fa-info-circle"></i> <span id="detailsTitle" data-i18n="workDetail.details">Details</span></h2>
                <div class="work-metadata">
                    <div class="metadata-item">
                        <span class="metadata-label" id="labelContentType" data-i18n="workDetail.contentType">Content Type</span>
                        <span class="metadata-value" id="valueContentType"></span>
                    </div>
                    <div class="metadata-item">
                        <span class="metadata-label" id="labelOriginalLang" data-i18n="workDetail.originalLanguage">Original Language</span>
                        <span class="metadata-value" id="valueOriginalLang"></span>
                    </div>
                    <div class="metadata-item">
                        <span class="metadata-label" id="labelTranslations" data-i18n="workDetail.translationsAvailable">Translations Available</span>
                        <span class="metadata-value" id="valueTranslations"></span>
                    </div>
                    <div class="metadata-item">
                        <span class="metadata-label" id="labelCategory" data-i18n="workDetail.category">Category</span>
                        <span class="metadata-value" id="valueCategory"></span>
                    </div>
                </div>
            </div>

            <!-- Reviews Section -->
            <div class="detail-section">
                <h2><i class="fas fa-star"></i> <span id="reviewsTitle" data-i18n="workDetail.reviews">Reviews</span></h2>

                <!-- 翻訳フィードバック一覧への入口（報告の閲覧・同感・作者の対応管理） -->
                <a id="translationFeedbackLink" href="#" class="btn btn-soft-custom btn-sm mb-3" style="display:none;">
                    <i class="fas fa-comment-dots me-1"></i><span id="translationFeedbackLinkText">Translation Feedback</span>
                </a>

                <!-- Rating Summary -->
                <div class="rating-summary">
                    <div class="rating-big">
                        <div class="number" id="avgRating">4.8</div>
                        <div class="stars" id="avgStars"></div>
                        <div class="count" id="reviewCount"></div>
                    </div>
                </div>

                <!-- Review List -->
                <div id="reviewList"></div>

                <!-- Write Review Form (auth-only) -->
                <div class="review-form auth-only" id="reviewForm">
                    <h3 id="writeReviewTitle" data-i18n="workDetail.writeReview">Write a Review</h3>
                    <div class="star-selector" id="starSelector">
                        <i class="far fa-star" data-value="1"></i>
                        <i class="far fa-star" data-value="2"></i>
                        <i class="far fa-star" data-value="3"></i>
                        <i class="far fa-star" data-value="4"></i>
                        <i class="far fa-star" data-value="5"></i>
                    </div>
                    <textarea id="reviewTextarea" rows="4" placeholder="Share your thoughts..." data-i18n-placeholder="workDetail.reviewPlaceholder"></textarea>
                    <button class="btn-read mt-3" onclick="submitReview()" id="btnSubmitReview">
                        <i class="fas fa-paper-plane"></i>
                        <span id="btnSubmitText" data-i18n="workDetail.submitReview">Submit Review</span>
                    </button>
                </div>

                <!-- Guest prompt -->
                <div class="guest-review-prompt guest-only">
                    <p id="loginToReview" data-i18n="workDetail.loginToReview">Sign in to write a review</p>
                    <a href="login.html" class="btn-read" style="display:inline-flex;">
                        <i class="fas fa-sign-in-alt"></i>
                        <span id="btnSignInReview" data-i18n="workDetail.signIn">Sign In</span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- ========== 通報モーダル ========== -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-flag me-2" style="color:#b34747;"></i><span id="reportModalTitle">Report this work</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted" style="font-size:0.87rem;" id="reportIntro"></p>
                    <div class="mb-3">
                        <label class="form-label" for="reportReason" id="reportReasonLabel">Reason</label>
                        <select class="form-select" id="reportReason">
                            <option value="sexual">Sexual content</option>
                            <option value="violence">Excessive violence</option>
                            <option value="hate">Discrimination or hate</option>
                            <option value="illegal">Illegal or dangerous</option>
                            <option value="wrong_rating">Age rating looks wrong</option>
                            <option value="copyright">Possible copyright infringement</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="reportDetails" id="reportDetailsLabel">Details (optional)</label>
                        <textarea class="form-control" id="reportDetails" rows="4" maxlength="2000"></textarea>
                    </div>
                    <p class="text-muted" style="font-size:0.78rem;" id="reportPrivacyNote"></p>
                    <div class="alert alert-danger" id="reportError" style="display:none; font-size:0.85rem;"></div>
                    <div class="alert alert-success" id="reportSent" style="display:none; font-size:0.88rem;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="reportCancelBtn">Cancel</button>
                    <button type="button" class="btn btn-danger" id="reportSubmitBtn" onclick="submitReport()">
                        <i class="fas fa-flag me-1"></i><span id="reportSubmitText">Send report</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== プレゼント用モーダル ========== -->
    <div class="modal fade" id="giftModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-gift me-2" style="color:var(--color-accent);"></i><span id="giftModalTitle">Gift this work</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted" style="font-size:0.87rem;" id="giftIntro"></p>

                    <div class="mb-3 position-relative">
                        <label class="form-label" for="giftRecipient" id="giftRecipientLabel">Recipient</label>
                        <input type="text" class="form-control" id="giftRecipient" autocomplete="off">
                        <div class="list-group position-absolute w-100 shadow gift-suggest" id="giftSuggest" style="display:none; z-index:10;"></div>
                        <div class="form-text" id="giftRecipientHelp"></div>
                        <div class="mt-2" id="giftSelected" style="display:none;">
                            <span class="badge bg-success"><i class="fas fa-check me-1"></i><span id="giftSelectedName"></span></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="giftMessage" id="giftMessageLabel">Message (optional)</label>
                        <textarea class="form-control" id="giftMessage" rows="3" maxlength="500"></textarea>
                    </div>

                    <div class="alert alert-light border" style="font-size:0.83rem;" id="giftNote"></div>

        // ========== サンプル作品データ（browse.htmlの6作品を拡張）==========
        const workDetails = {}; // populated from the API by loadWork()

        // ========== ヘルパー関数 ==========
function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getWorkIdFromUrl() {
            // 作品IDはUUID文字列（parseIntすると壊れる）
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || '';
        }

        // getAiBadgeLabel は navbar.js の共通版を使用

        function renderStars(rating) {
            let html = '';
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.3;
            const empty = 5 - full - (half ? 1 : 0);
            for (let i = 0; i < full; i++) html += '<i class="fas fa-star"></i>';
            if (half) html += '<i class="fas fa-star-half-alt"></i>';
            for (let i = 0; i < empty; i++) html += '<i class="far fa-star"></i>';
            return html;
        }

        function getLanguageName(code) {
            const names = { en: 'English', ja: '日本語', zh: '中文', es: 'Español', fr: 'Français', de: 'Deutsch', ko: '한국어', ar: 'العربية', pt: 'Português', it: 'Italiano' };
            return names[code] || code;
        }

        function getGenreLabel(genre) {
            const genreLabels = {
                fiction: { en: 'Fiction', ja: '小説', zh: '小说', es: 'Ficción', fr: 'Fiction', de: 'Belletristik', ko: '소설', ar: 'خيال', pt: 'Ficção', it: 'Narrativa' },
                'non-fiction': { en: 'Non-Fiction', ja: 'ノンフィクション', zh: '非虚构', es: 'No ficción', fr: 'Non-fiction', de: 'Sachbuch', ko: '논픽션', ar: 'غير خيالي', pt: 'Não ficção', it: 'Saggistica' },
                manga: { en: 'Manga', ja: 'マンガ', zh: '漫画', es: 'Manga', fr: 'Manga', de: 'Manga', ko: '만화', ar: 'مانغا', pt: 'Mangá', it: 'Manga' },
                poetry: { en: 'Poetry', ja: '詩', zh: '诗歌', es: 'Poesía', fr: 'Poésie', de: 'Poesie', ko: '시', ar: 'شعر', pt: 'Poesia', it: 'Poesia' }
            };
            return genreLabels[genre] ? getL(genreLabels[genre]) : genre;
        }

        function getContentTypeLabel(type) {
            const labels = {
                novel: { en: 'Novel', ja: '小説', zh: '小说', es: 'Novela', fr: 'Roman', de: 'Roman', ko: '소설', ar: 'رواية', pt: 'Romance', it: 'Romanzo' },
                'short-story': { en: 'Short Story', ja: '短編', zh: '短篇小说', es: 'Cuento', fr: 'Nouvelle', de: 'Kurzgeschichte', ko: '단편', ar: 'قصة قصيرة', pt: 'Conto', it: 'Racconto' },
                article: { en: 'Article', ja: '記事', zh: '文章', es: 'Artículo', fr: 'Article', de: 'Artikel', ko: '기사', ar: 'مقال', pt: 'Artigo', it: 'Articolo' },
                manga: { en: 'Manga', ja: 'マンガ', zh: '漫画', es: 'Manga', fr: 'Manga', de: 'Manga', ko: '만화', ar: 'مانغا', pt: 'Mangá', it: 'Manga' },
                poetry: { en: 'Poetry', ja: '詩', zh: '诗歌', es: 'Poesía', fr: 'Poésie', de: 'Poesie', ko: '시', ar: 'شعر', pt: 'Poesia', it: 'Poesia' }
            };

        // ========== メインの描画関数 ==========
        async function loadWork() {
            const id = getWorkIdFromUrl();

            if (!workDetails[id]) {
                try {
                    const resp = await fetch((window.API_ORIGIN || '') + '/api/works/' + encodeURIComponent(id));
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
                    const w = data.work;
                    workDetails[id] = {
                        id: w.work_id,
                        title: w.title,
                        author: w.author_name || ((w.first_name || '') + ' ' + (w.last_name || '')).trim() || 'Unknown',
                        price: Number(w.price) || 0,
                        currency: w.currency || 'USD',
                        rating: w.rating_average != null ? Number(w.rating_average) : 0,
                        category: w.genre || 'general',
                        language: w.language || w.original_language || 'en',
                        contentType: w.content_type || 'text',
                        originalLanguage: w.original_language || 'en',
                        translationsAvailable: [],
                        description: w.description || w.synopsis || '',
                        reviews: [],
                        aiTextUsage: w.ai_text_usage || 'none',
                        aiCoverUsage: w.ai_cover_usage || 'none',
                        cover: w.cover_image || w.cover_image_url || null,
                        authorId: w.author_id || null,
                        ageRating: w.age_rating || 'all',
                        contentWarnings: Array.isArray(w.content_warnings) ? w.content_warnings : []
                    };
                } catch (err) {
                    console.error('Failed to load work:', err);
                    window.location.href = 'browse.html';
                    return;
                }
            }

            const work = workDetails[id];

            // ページタイトル
            document.title = `${work.title} - AuctLect`;

            // パンくずリスト
            document.getElementById('breadcrumbBrowse').textContent = getL(uiText.breadcrumbBrowse);
            document.getElementById('breadcrumbTitle').textContent = work.title;

            // 作品ヘッダー
            document.getElementById('workTitle').textContent = work.title;
            document.getElementById('workAuthor').textContent = `${getL(uiText.by)} ${work.author}`;

            // ジャンルバッジ
            document.getElementById('workGenre').textContent = getGenreLabel(work.category);

            // 評価
            const ratingEl = document.getElementById('workRating');
            ratingEl.innerHTML = renderStars(work.rating) + ` <span class="rating-number">${work.rating}</span>`;

            // 価格（DBのDECIMALは文字列で届くため必ず数値化する）
            const priceEl = document.getElementById('workPrice');
            const priceNum = Number(work.price) || 0;
            if (priceNum === 0) {
                priceEl.textContent = getL(uiText.free);
            } else {
                priceEl.textContent = formatWorkPrice(priceNum, work.currency);
            }

            // 表紙画像 + AI利用バッジ
            const coverBox = document.getElementById('workCover');
            if (coverBox) {
                coverBox.style.position = 'relative';
                coverBox.innerHTML = work.cover
                    ? '<img src="' + work.cover + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
                    : '<i class="fas fa-book"></i>';
                const aiLabel = getAiBadgeLabel(work.aiTextUsage, work.aiCoverUsage);
                if (aiLabel) {
                    const badge = document.createElement('div');
                    badge.style.cssText = 'position:absolute; bottom:8px; left:8px; right:8px; text-align:center; padding:0.3rem 0.5rem; border-radius:6px; font-size:0.75rem; font-weight:600; background:rgba(40,50,80,0.85); color:#fff;';
                    badge.innerHTML = '<i class="fas fa-robot me-1"></i>' + aiLabel;
                    coverBox.appendChild(badge);
                }
            }

            // 言語
            document.getElementById('workLanguage').innerHTML =
                `<i class="fas fa-globe me-1"></i>${getLanguageName(work.language)}`;

            // 対象年齢と内容の注意表示
            var ageEl = document.getElementById('workAgeRating');
            if (work.ageRating === '15' || work.ageRating === '18') {
                ageEl.textContent = work.ageRating === '18' ? '18+' : '15+';
                ageEl.style.display = 'inline-flex';
            } else {
                ageEl.style.display = 'none';
            }
            var warnEl = document.getElementById('workWarnings');
            var warns = work.contentWarnings || [];
            if (warns.length) {
                warnEl.innerHTML = '<i class="fas fa-triangle-exclamation"></i><span>' + getL(uiText.contentNotice) + '</span>' +
                    warns.map(function (w) {
                        return '<span class="cw">' + escapeHtml(getL(uiText['warn_' + w] || { en: w })) + '</span>';
                    }).join('');
                warnEl.style.display = 'flex';
            } else {
                warnEl.style.display = 'none';
            }

            // プレゼントボタン: 有料作品なら所有の有無に関わらず出す
            // （持っている本を人に贈るのは自然な行為）。自分の作品と未ログインは除く
            var myId = (JSON.parse(localStorage.getItem('user') || '{}') || {}).id;
            var canGift = priceNum > 0 && !!localStorage.getItem('token') &&
                String(work.authorId || '') !== String(myId || '');
            document.getElementById('btnGift').style.display = canGift ? 'inline-flex' : 'none';
            document.getElementById('btnGiftText').textContent = getL(uiText.giftThis);

            // 通報ボタン: 自分の作品には出さない（未ログインには出す＝押すとログインへ）
            var isMine = String(work.authorId || '') === String(myId || '') && !!myId;
            document.getElementById('btnReport').style.display = isMine ? 'none' : 'inline-flex';
            document.getElementById('btnReportText').textContent = getL(uiText.reportTitle);

            // 購入/ライブラリボタン
            // 有料作品の所有判定は**サーバーの購入記録**が正
            // （localStorageだけだと別ブラウザで「購入する」が再表示され二重課金になる）。
            // 無料作品は従来どおりlocalStorage管理
            await fetchServerOwned();
            var owned = priceNum > 0
                ? serverOwnedIds.has(String(id))
                : isInLibrary(id);
            if (owned) {
                document.getElementById('btnPurchase').style.display = 'none';
                document.getElementById('btnGetFree').style.display = 'none';
                document.getElementById('btnReadNow').style.display = 'inline-flex';
                document.getElementById('btnReadText').textContent = getL(uiText.readNow);
                document.getElementById('btnReadNow').href = 'reader.html?id=' + id;
                document.getElementById('badgeInLibrary').style.display = 'inline-flex';
                document.getElementById('badgeInLibraryText').textContent = getL(uiText.inLibrary);
            } else if (priceNum > 0) {
                document.getElementById('btnPurchase').style.display = 'inline-flex';
                document.getElementById('btnPurchaseText').textContent =
                    `${getL(uiText.purchase)} - ${formatWorkPrice(priceNum, work.currency)}`;
                document.getElementById('btnGetFree').style.display = 'none';
                document.getElementById('btnReadNow').style.display = 'none';
                document.getElementById('badgeInLibrary').style.display = 'none';
            } else {
                document.getElementById('btnPurchase').style.display = 'none';
                document.getElementById('btnGetFree').style.display = 'inline-flex';
                document.getElementById('btnGetFreeText').textContent = getL(uiText.getFree);
                document.getElementById('btnReadNow').style.display = 'none';
                document.getElementById('badgeInLibrary').style.display = 'none';
            }

            // あらすじ
            document.getElementById('synopsisTitle').textContent = getL(uiText.synopsis);
            document.getElementById('synopsisContent').textContent = work.description;

            // 詳細情報
            document.getElementById('detailsTitle').textContent = getL(uiText.details);
            document.getElementById('labelContentType').textContent = getL(uiText.contentType);
            document.getElementById('valueContentType').textContent = getContentTypeLabel(work.contentType);
            document.getElementById('labelOriginalLang').textContent = getL(uiText.originalLanguage);
            document.getElementById('valueOriginalLang').textContent = getLanguageName(work.originalLanguage);
            document.getElementById('labelTranslations').textContent = getL(uiText.translationsAvailable);
            document.getElementById('valueTranslations').textContent =
                work.translationsAvailable.map(getLanguageName).join(', ');
            document.getElementById('labelCategory').textContent = getL(uiText.category);
            document.getElementById('valueCategory').textContent = getGenreLabel(work.category);

            // レビュー
            document.getElementById('reviewsTitle').textContent = getL(uiText.reviews);
            // 翻訳フィードバック一覧への入口（実作品IDがある時だけ表示）
            var fbLink = document.getElementById('translationFeedbackLink');
            if (fbLink) {
                var fbWorkId = getWorkIdFromUrl();
                if (fbWorkId) {
                    fbLink.href = 'feedback/index.html?workId=' + encodeURIComponent(fbWorkId);
                    fbLink.style.display = '';
                }
                document.getElementById('translationFeedbackLinkText').textContent = getL(uiText.translationFeedback);
            }
            renderReviews(work.reviews, work.rating);

            // レビューフォーム
            document.getElementById('writeReviewTitle').textContent = getL(uiText.writeReview);
            document.getElementById('btnSubmitText').textContent = getL(uiText.submitReview);
            document.getElementById('reviewTextarea').placeholder = getL(uiText.reviewPlaceholder);
            document.getElementById('loginToReview').textContent = getL(uiText.loginToReview);
            document.getElementById('btnSignInReview').textContent = getL(uiText.signIn);

            // 翻訳/編集依頼ボタン
            document.getElementById('btnWantTranslateText').textContent = getL(uiText.wantTranslate);
            document.getElementById('btnWantEditText').textContent = getL(uiText.wantEdit);

            // フッター
            document.getElementById('footerHelp').textContent = getL(uiText.footerHelp);
            document.getElementById('footerTerms').textContent = getL(uiText.footerTerms);
            document.getElementById('footerPrivacy').textContent = getL(uiText.footerPrivacy);
        }

        function renderReviews(reviews, avgRating) {
            document.getElementById('avgRating').textContent = avgRating.toFixed(1);
            document.getElementById('avgStars').innerHTML = renderStars(avgRating);
            document.getElementById('reviewCount').textContent =
                `${reviews.length} ${getL(uiText.reviewCount)}`;

            const listEl = document.getElementById('reviewList');
            listEl.innerHTML = reviews.map(review => `
                <div class="review-item">
                    <div class="review-header">
                        <span class="review-user"><i class="fas fa-user-circle me-1"></i>${escapeHtml(review.user)}</span>
                        <span class="review-date">${review.date}</span>
                    </div>
                    <div class="review-stars">${renderStars(review.rating)}</div>
                    <div class="review-text">${escapeHtml(review.text)}</div>
                </div>
            `).join('');
        }

        // ========== 星セレクター ==========
        let selectedRating = 0;

        function initStarSelector() {
            const stars = document.querySelectorAll('#starSelector i');

            stars.forEach(star => {
                star.addEventListener('mouseenter', function() {
                    const val = parseInt(this.getAttribute('data-value'));
                    stars.forEach(s => {
                        const sv = parseInt(s.getAttribute('data-value'));
                        s.className = sv <= val ? 'fas fa-star active' : 'far fa-star';
                    });
                });

                star.addEventListener('mouseleave', function() {
                    stars.forEach(s => {
                        const sv = parseInt(s.getAttribute('data-value'));
                        s.className = sv <= selectedRating ? 'fas fa-star active' : 'far fa-star';
                    });
                });

                star.addEventListener('click', function() {
                    selectedRating = parseInt(this.getAttribute('data-value'));
                    stars.forEach(s => {
                        const sv = parseInt(s.getAttribute('data-value'));
                        s.className = sv <= selectedRating ? 'fas fa-star active' : 'far fa-star';
                    });
                });
            });
        }

        // ========== ライブラリ管理（localStorage）==========
        function getLibrary() {
            try { return JSON.parse(localStorage.getItem('publisherLibrary') || '[]'); }
            catch(e) { return []; }
        }
        function isInLibrary(workId) {
            return getLibrary().some(function(item) { return String(item.id) === String(workId); });
        }
        function addToLibrary(workId) {
            var lib = getLibrary();
            if (!lib.some(function(item) { return String(item.id) === String(workId); })) {
                var work = workDetails[workId];
                lib.push({ id: String(workId), title: work ? work.title : '', addedAt: new Date().toISOString() });
                localStorage.setItem('publisherLibrary', JSON.stringify(lib));
            }
        }

        // ========== アクションハンドラー ==========
        // サーバー上の購入済み作品ID（有料作品の所有判定の正）。ページ表示ごとに1回取得
        var serverOwnedIds = new Set();
        var serverOwnedLoaded = false;
        async function fetchServerOwned() {
            if (serverOwnedLoaded) return;
            serverOwnedLoaded = true;
            var token = localStorage.getItem('token');
            if (!token) return;
            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/users/purchases', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!resp.ok) return;
                ((await resp.json()).purchases || []).forEach(function (p) {
                    if (p.work_id && p.payment_status === 'completed') serverOwnedIds.add(String(p.work_id));
                });
            } catch (e) { /* 取得失敗時は未所有扱い（購入時はサーバーが二重課金を止める） */ }
        }

        async function purchaseWork() {
            const id = getWorkIdFromUrl();
            const token = localStorage.getItem('token');
            if (!token) {
                alert(getL({ en: 'Please log in to purchase.', ja: '購入にはログインが必要です。' }));
                window.location.href = 'login.html';
                return;
            }
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/payments/create-checkout-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ workId: id })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    if (data.code === 'ALREADY_OWNED') {
                        alert(getL({
                            en: 'You already own this work. It is available in your library.',
                            ja: 'この作品はすでにご購入済みです。ライブラリからお読みいただけます。'
                        }));
                        serverOwnedLoaded = false; // 再取得してボタンを「読む」に切り替える
                        loadWork();
                        return;
                    }
                    throw new Error(data.error || ('HTTP ' + resp.status));
                }
                // Stripeがホストする決済ページへ移動
                window.location.href = data.url;
            } catch (err) {
                alert(getL({ en: 'Purchase failed: ', ja: '購入処理に失敗しました: ' }) + err.message);
            }
        }

        // ========== 通報 ==========
        // 読者が「おかしい」と思った描写を知らせる。管理者が確認して
        // 却下／著者へ警告／作品を非公開、のいずれかを選ぶ
        const REPORT_REASONS = ['sexual', 'violence', 'hate', 'illegal', 'wrong_rating', 'copyright', 'other'];

        function openReportModal() {
            if (!localStorage.getItem('token')) {
                alert(getL(uiText.reportLoginRequired));
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('reportError').style.display = 'none';
            document.getElementById('reportSent').style.display = 'none';
            document.getElementById('reportDetails').value = '';
            document.getElementById('reportSubmitBtn').style.display = '';
            applyReportModalText();
            new bootstrap.Modal(document.getElementById('reportModal')).show();
        }

        function applyReportModalText() {
            document.getElementById('reportModalTitle').textContent = getL(uiText.reportTitle);
            document.getElementById('reportIntro').textContent = getL(uiText.reportIntro);
            document.getElementById('reportReasonLabel').textContent = getL(uiText.reportReason);
            document.getElementById('reportDetailsLabel').textContent = getL(uiText.reportDetails);
            document.getElementById('reportPrivacyNote').textContent = getL(uiText.reportPrivacyNote);
            document.getElementById('reportSubmitText').textContent = getL(uiText.reportSubmit);
            document.getElementById('reportCancelBtn').textContent = getL(uiText.cancel);
            const sel = document.getElementById('reportReason');
            REPORT_REASONS.forEach(function (r, i) {
                if (sel.options[i]) sel.options[i].textContent = getL(uiText['reason_' + r]);
            });
        }

        async function submitReport() {
            const err = document.getElementById('reportError');
            const ok = document.getElementById('reportSent');
            err.style.display = 'none';
            const btn = document.getElementById('reportSubmitBtn');
            btn.disabled = true;
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/reports', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({
                        workId: getWorkIdFromUrl(),
                        reason: document.getElementById('reportReason').value,
                        details: document.getElementById('reportDetails').value
                    })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.code === 'OWN_WORK' ? getL(uiText.reportOwnWork) : (data.error || ('HTTP ' + resp.status)));
                }
                ok.textContent = data.alreadyReported ? getL(uiText.reportAlready) : getL(uiText.reportThanks);
                ok.style.display = '';
                btn.style.display = 'none'; // 二度押しさせない
            } catch (e) {
                err.textContent = e.message;
                err.style.display = '';
            } finally {
                btn.disabled = false;
            }
        }

        // ========== プレゼント ==========
        // 相手は必ず候補リストから選ばせる（打ち間違いで別人に贈らないため）。
        // 支払い自体は通常購入と同じStripe Checkout
        let giftRecipientId = null;
        let giftSearchTimer = null;

        function openGiftModal() {
            const t = localStorage.getItem('token');
            if (!t) { window.location.href = 'login.html'; return; }
            giftRecipientId = null;
            document.getElementById('giftRecipient').value = '';
            document.getElementById('giftMessage').value = '';
            document.getElementById('giftSelected').style.display = 'none';
            document.getElementById('giftSuggest').style.display = 'none';
            document.getElementById('giftError').style.display = 'none';
            applyGiftModalText();
            new bootstrap.Modal(document.getElementById('giftModal')).show();
        }

        function applyGiftModalText() {
            document.getElementById('giftModalTitle').textContent = getL(uiText.giftThis);
            document.getElementById('giftIntro').textContent = getL(uiText.giftIntro);
            document.getElementById('giftRecipientLabel').textContent = getL(uiText.giftRecipient);
            document.getElementById('giftRecipientHelp').textContent = getL(uiText.giftRecipientHelp);
            document.getElementById('giftMessageLabel').textContent = getL(uiText.giftMessageLabel);
            document.getElementById('giftNote').textContent = getL(uiText.giftNote);
            document.getElementById('giftSubmitText').textContent = getL(uiText.giftContinue);
            document.getElementById('giftCancelBtn').textContent = getL(uiText.cancel);
        }

        async function searchGiftRecipient(q) {
            const box = document.getElementById('giftSuggest');
            const token = localStorage.getItem('token');
            if (!token || q.length < 2) { box.style.display = 'none'; return; }
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/users/lookup/search?q=' + encodeURIComponent(q), {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!resp.ok) { box.style.display = 'none'; return; }
                const users = (await resp.json()).users || [];
                if (!users.length) {
                    // メールアドレスを入れたのに0件、は原因が分かる文言にする
                    const msg = q.indexOf('@') >= 0 ? getL(uiText.giftNoAccountForEmail) : getL(uiText.giftNoUsers);
                    box.innerHTML = '<div class="list-group-item text-muted small">' + escapeHtml(msg) + '</div>';
                    box.style.display = '';
                    return;
                }
                // メールアドレスは1人に確定する情報なので、候補クリックを待たずに選択済みにする
                // （「入力したのに認識されない」という詰まりをなくす）
                if (users.length === 1 && q.indexOf('@') >= 0) {
                    pickGiftRecipient(users[0]);
                    return;
                }
                box.innerHTML = '<div class="list-group-item text-muted small py-1">' + escapeHtml(getL(uiText.giftPickHint)) + '</div>' +
                    users.map((u, i) =>
                        '<button type="button" class="list-group-item list-group-item-action" data-idx="' + i + '">' +
                        '<i class="fas fa-user me-2 text-muted"></i>' + escapeHtml(u.display_name) + '</button>'
                    ).join('');
                Array.from(box.querySelectorAll('button')).forEach(btn => {
                    btn.addEventListener('click', () => pickGiftRecipient(users[parseInt(btn.dataset.idx, 10)]));
                });
                box.style.display = '';
            } catch (e) {
                box.style.display = 'none';
            }
        }

        function pickGiftRecipient(u) {
            giftRecipientId = u.user_id;
            document.getElementById('giftRecipient').value = u.display_name;
            document.getElementById('giftSelectedName').textContent = u.display_name;
            document.getElementById('giftSelected').style.display = '';
            document.getElementById('giftSuggest').style.display = 'none';
            document.getElementById('giftError').style.display = 'none';
        }

        // 候補を選ばずに送信された時の救済: 入力そのものが
        // メールアドレス/ペンネームと完全一致するなら、それを宛先とみなす
        async function resolveTypedRecipient() {
            const typed = document.getElementById('giftRecipient').value.trim();
            if (typed.length < 2) return null;
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/users/lookup/by-identifier?identifier=' + encodeURIComponent(typed), {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                if (!resp.ok) return null;
                return (await resp.json()).user || null;
            } catch (e) { return null; }
        }

        async function submitGift() {
            const err = document.getElementById('giftError');
            err.style.display = 'none';
            const btn = document.getElementById('giftSubmitBtn');
            if (!giftRecipientId) {
                btn.disabled = true;
                const u = await resolveTypedRecipient();
                btn.disabled = false;
                if (u) {
                    pickGiftRecipient(u);
                } else {
                    err.textContent = getL(uiText.giftPickRecipient);
                    err.style.display = '';
                    return;
                }
            }
            btn.disabled = true;
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/payments/create-checkout-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({
                        workId: getWorkIdFromUrl(),
                        giftTo: giftRecipientId,
                        giftMessage: document.getElementById('giftMessage').value
                    })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    const known = {
                        GIFT_ALREADY_OWNED: getL(uiText.giftAlreadyOwned),
                        GIFT_SELF: getL(uiText.giftSelfError),
                        GIFT_RECIPIENT_NOT_FOUND: getL(uiText.giftPickRecipient)
                    };
                    throw new Error(known[data.code] || data.error || ('HTTP ' + resp.status));
                }
                window.location.href = data.url; // Stripeの決済ページへ
            } catch (e) {
                err.textContent = e.message;
                err.style.display = '';
            } finally {
                btn.disabled = false;
            }
        }

        // モーダルを開いたまま言語を変えても文言が追従するように
        document.addEventListener('languageChanged', function () {
            if (document.getElementById('giftModal').classList.contains('show')) applyGiftModalText();
        });

        document.addEventListener('DOMContentLoaded', function () {
            const input = document.getElementById('giftRecipient');
            if (!input) return;
            input.addEventListener('input', function () {
                // 入力し直したら選択を解除（表示名だけ残って別人に贈るのを防ぐ）
                giftRecipientId = null;
                document.getElementById('giftSelected').style.display = 'none';
                clearTimeout(giftSearchTimer);
                const q = this.value.trim();
                giftSearchTimer = setTimeout(() => searchGiftRecipient(q), 250);
            });
        });

        function getFreeWork() {
            const id = getWorkIdFromUrl();
            addToLibrary(id);
            alert(getL(uiText.addedToLibrary));
            loadWork();
        }

        async function requestCollaboration(type) {
            var id = getWorkIdFromUrl();
            var token = localStorage.getItem('token');
            if (!token) {
                alert(getL({ en: 'Please log in to apply.', ja: '申請にはログインが必要です。' }));
                window.location.href = 'login.html';
                return;
            }
            var role = (type === 'translate') ? 'translator' : 'editor';
            var targetLanguage = null;
            if (role === 'translator') {
                var input = prompt(getL({
                    en: 'Which language will you translate into? Enter a code:\nen, ja, zh, es, fr, de, ko, ar, pt, it',
                    ja: 'どの言語に翻訳しますか？コードを入力してください：\nen, ja, zh, es, fr, de, ko, ar, pt, it'
                }), 'en');
                if (input === null) return; // キャンセル
                input = input.trim().toLowerCase();
                if (['en','ja','zh','es','fr','de','ko','ar','pt','it'].indexOf(input) === -1) {
                    alert(getL({ en: 'Invalid language code.', ja: '言語コードが正しくありません。' }));
                    return;
                }
                targetLanguage = input;
            }
            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/works/' + encodeURIComponent(id) + '/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ role: role, targetLanguage: targetLanguage })
                });
                var data = await resp.json();
                if (!resp.ok) {
                    if (data.code === 'ROLE_TAKEN') {
                        alert(getL({
                            en: 'This work already has an applicant or collaborator for this role.',
                            ja: 'この作品にはすでにこの役割の申請者またはコラボレーターがいます。'
                        }));
                        return;
                    }
                    throw new Error(data.error || ('HTTP ' + resp.status));
                }
                alert(role === 'editor'
                    ? getL({
                        en: 'Your request to edit this author\'s next work has been sent. If approved, you will discuss the project via messages; the agreement and revenue share are issued when the next work is uploaded.',
                        ja: 'この著者の次回作を編集したいという申請を送信しました。承認されるとメッセージで相談でき、同意書と収益分配は次回作のアップロード時に発行されます。'
                    })
                    : getL({
                        en: 'Your application has been sent to the author. You will be notified when the author responds.',
                        ja: '著者に申請を送信しました。著者が承認・却下すると通知が届きます。'
                    }));
            } catch (err) {
                alert(getL({ en: 'Failed to send application: ', ja: '申請の送信に失敗しました: ' }) + err.message);
            }
        }

        function submitReview() {
            const text = document.getElementById('reviewTextarea').value.trim();

            if (selectedRating === 0) {
                alert(getL(uiText.selectRating));
                return;
            }
            if (!text) {
                alert(getL(uiText.writeComment));
                return;
            }

            // デモ：レビューをリストに追加
            const id = getWorkIdFromUrl();
            const work = workDetails[id];
            if (work) {
                work.reviews.unshift({
                    user: 'You',
                    rating: selectedRating,
                    date: new Date().toISOString().split('T')[0],
                    text: text
                });

                const avg = work.reviews.reduce((sum, r) => sum + r.rating, 0) / work.reviews.length;
                renderReviews(work.reviews, avg);
            }

            // フォームリセット
            document.getElementById('reviewTextarea').value = '';
            selectedRating = 0;
            document.querySelectorAll('#starSelector i').forEach(s => {
                s.className = 'far fa-star';
            });

            alert(getL(uiText.reviewSubmitted));
        }

        // ========== 言語切替・初期化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof i18n !== 'undefined') { i18n.applyToDOM(); }
            loadWork();
            initStarSelector();
        });

        document.addEventListener('languageChanged', function(e) {
            const l = e.detail && (e.detail.language || e.detail.lang);
            if (l) {
                const d = document.getElementById('languageSelector');
                const m = document.getElementById('languageSelectorMobile');
                if (d) d.value = l;
                if (m) m.value = l;
            }
            if (typeof i18n !== 'undefined') { i18n.applyToDOM(); }
            loadWork();
        });
    </script>
</body>
</html>
