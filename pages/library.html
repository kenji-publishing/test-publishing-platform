    <style>
        :root {
            --color-bg: #FAF8F5;
            --color-bg-card: #FFFFFF;
            --color-bg-main: #FAF8F5;
            --color-bg-hover: rgba(139, 115, 85, 0.05);
            --color-accent: #8B7355;
            --color-text: #2D2A26;
            --color-text-secondary: #6B6560;
            --color-border: #E8E4E0;
            --color-success: #5D9C59;
            --color-warning: #D4A853;
            --color-error: #C75D5D;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
        }

        
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Adjustments ========== */
        @media (max-width: 991.98px) {

        }
        
        /* Main Content */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-text);
            margin: 0;
        }
        
        /* Tabs */
        .library-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 0;
            overflow-x: auto;
        }
        
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            position: relative;
            white-space: nowrap;
        }
        
        .tab-btn:hover {
            color: var(--color-accent);
        }
        
        .tab-btn.active {
            color: var(--color-accent);
        }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-accent);
        }
        
        .tab-count {
            background: var(--color-bg);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }
        
        /* Book Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }
        
        .book-card {
            background: var(--color-bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        
        .book-cover {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, var(--color-accent) 0%, #A68B6A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .book-cover-placeholder {
            color: white;
            font-size: 3rem;
            opacity: 0.5;
        }
        
        .reading-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.3);
        }
        
        .reading-progress-bar {
            height: 100%;
            background: var(--color-success);
        }
        
        .book-info {
            padding: 1rem;
        }
        
        .book-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .book-author {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }

        .gift-from {
            font-size: 0.72rem;
            color: var(--color-accent);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }
        
        .book-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
        }
        
        .book-status {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .status-reading { color: var(--color-accent); }
        .status-completed { color: var(--color-success); }
        .status-new { color: var(--color-warning); }
        
        .book-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .book-action-btn {
            background: transparent;
            border: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            padding: 0.25rem;
            font-size: 0.9rem;
        }
        
        .book-action-btn:hover {
            color: var(--color-accent);
        }
        
        .book-action-btn.favorited {
            color: var(--color-warning);
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-text-secondary);
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
        
        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--color-text);
        }
        
        .btn-primary {
            background: var(--color-accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }
        
        .btn-primary:hover {
            background: #7A6548;
            color: white;
        }
        
        /* Search & Filter */
        .search-filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .search-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--color-bg-card);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--color-accent);
        }
        
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-secondary);
        }
        
        .filter-select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--color-bg-card);
            cursor: pointer;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
            
            .library-tabs {
                gap: 0;
            }
            
            .tab-btn {
                padding: 0.6rem 0.75rem;
                font-size: 0.85rem;
            }
        }
        
        @media (max-width: 480px) {
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
    </style>
</head>

        <div class="search-filter-bar">

            <select class="filter-select" id="sortSelect" onchange="sortBooks()">
                <option value="recent" id="sortRecent" data-i18n="library.recentlyRead">Recently Read</option>

        </div>

        <!-- Tabs -->
        <div class="library-tabs">
            <button class="tab-btn active" onclick="showTab('all')" id="tabAll">
                <i class="fas fa-book me-1"></i><span id="tabAllText" data-i18n="library.all">All</span>
                <span class="tab-count" id="countAll">0</span>
            </button>
            <button class="tab-btn" onclick="showTab('reading')" id="tabReading">
                <i class="fas fa-bookmark me-1"></i><span id="tabReadingText" data-i18n="library.reading">Reading</span>

            <button class="tab-btn" onclick="showTab('completed')" id="tabCompleted">
                <i class="fas fa-check-circle me-1"></i><span id="tabCompletedText" data-i18n="library.completed">Completed</span>
                <span class="tab-count" id="countCompleted">0</span>

            <button class="tab-btn" onclick="showTab('favorites')" id="tabFavorites">

                <span class="tab-count" id="countFavorites">0</span>
            </button>
            <button class="tab-btn" onclick="showTab('wishlist')" id="tabWishlist">
                <i class="fas fa-star me-1"></i><span id="tabWishlistText" data-i18n="library.wishlist">Wishlist</span>
                <span class="tab-count" id="countWishlist">0</span>
            </button>
        </div>

        <!-- Books Grid -->
        <div class="books-grid" id="booksGrid">
            <!-- Books will be rendered here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-books"></i>
            <h3 id="emptyTitle" data-i18n="library.noBooksYet">No books yet</h3>
            <p id="emptyText" data-i18n="library.startExploring">Start exploring and add books to your library</p>
            <a href="browse.html" class="btn-primary" id="emptyBtn">
                <i class="fas fa-search me-2"></i><span id="emptyBtnText" data-i18n="library.browseBooks">Browse Books</span>
            </a>
        </div>
    </div>

            myTickets: { en: 'My Tickets', ja: 'マイチケット', zh: '我的工单', 'zh-TW': '我的工單', es: 'Mis tickets', fr: 'Mes tickets', de: 'Meine Tickets', ko: '내 티켓', ar: 'تذاكري', pt: 'Meus tickets', it: 'I miei ticket' },
            signIn: { en: 'Sign In', ja: 'ログイン', zh: '登录', 'zh-TW': '登入', es: 'Iniciar sesión', fr: 'Se connecter', de: 'Anmelden', ko: '로그인', ar: 'تسجيل الدخول', pt: 'Entrar', it: 'Accedi' },
            getStarted: { en: 'Get Started', ja: '新規登録', zh: '开始使用', 'zh-TW': '開始使用', es: 'Comenzar', fr: 'Commencer', de: 'Loslegen', ko: '시작하기', ar: 'ابدأ الآن', pt: 'Começar', it: 'Inizia' },
            // --- Footer ---
            footerHelp: { en: 'Help', ja: 'ヘルプ', zh: '帮助', 'zh-TW': '幫助', es: 'Ayuda', fr: 'Aide', de: 'Hilfe', ko: '도움말', ar: 'مساعدة', pt: 'Ajuda', it: 'Aiuto' },
            footerTerms: { en: 'Terms', ja: '利用規約', zh: '条款', 'zh-TW': '條款', es: 'Términos', fr: 'Conditions', de: 'Bedingungen', ko: '약관', ar: 'الشروط', pt: 'Termos', it: 'Termini' },
            footerPrivacy: { en: 'Privacy', ja: 'プライバシー', zh: '隐私', 'zh-TW': '隱私', es: 'Privacidad', fr: 'Confidentialité', de: 'Datenschutz', ko: '개인정보', ar: 'الخصوصية', pt: 'Privacidade', it: 'Privacy' }
        };
        
        let currentLang = localStorage.getItem('preferredLanguage') || 'en';
        let currentTab = 'all';
        
        // Demo books data
        let books = [];

        // Load purchased works from the API into the library list
        async function loadLibraryFromApi() {
            var token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/users/purchases', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var data = await resp.json();
                if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
                (data.purchases || []).forEach(function(p) {
                    if (!p.work_id) return;
                    var cover = p.cover_image || p.cover_image_url || null;
                    // localStorage経由（購入完了ページ）で先に追加された分には
                    // 表紙・著者名が無いので、API側の情報で補完する
                    var existing = books.find(function(b) { return String(b.id) === String(p.work_id); });
                    if (existing) {
                        if (!existing.cover && cover) existing.cover = cover;
                        if (!existing.author && p.author_name) existing.author = p.author_name;
                        existing.purchased = true;
                        existing.giftFrom = p.gift_from || null;
                        return;
                    }
                    books.push({
                        id: String(p.work_id),
                        title: p.work_title || 'Untitled',
                        author: p.author_name || '',
                        cover: p.cover_image || p.cover_image_url || null,
                        status: 'new',
                        progress: 0,
                        favorite: false,
                        wishlist: false,
                        lastRead: null,
                        addedAt: p.purchased_at || new Date().toISOString(),
                        purchased: true,
                        giftFrom: p.gift_from || null
                    });
                });
                // サーバーの購入記録が正になった時点で、ブラウザ側の控えを掃除する
                prunePurchasedLibrary((data.purchases || []).map(function(p) { return String(p.work_id); }));
            } catch (err) {
                console.error('Failed to load library:', err);
            }
            renderBooks();
        }

        // 購入直後は publisherLibrary（ブラウザ側の控え）だけに載る時間があるため、
        // サーバーが知らない項目をすぐ消すと、買ったばかりの本が消えてしまう。
        // 一方、試験中に足された項目などがずっと残ると、開けない本が並び続ける。
        // そこで「24時間経ってもサーバーが知らない項目」だけを取り除く。
        var LIBRARY_GRACE_MS = 24 * 60 * 60 * 1000;
        function prunePurchasedLibrary(serverIds) {
            var known = {};
            serverIds.forEach(function(id) { known[id] = true; });
            var kept = [], removed = [];
            try {
                var items = JSON.parse(localStorage.getItem('publisherLibrary') || '[]');
                if (!Array.isArray(items)) return;
                var now = Date.now();
                items.forEach(function(item) {
                    if (!item || item.id == null) { removed.push(item); return; }
                    var added = Date.parse(item.addedAt || '') || 0;
                    if (known[String(item.id)] || (now - added) < LIBRARY_GRACE_MS) kept.push(item);
                    else removed.push(item);
                });
                if (removed.length) {
                    localStorage.setItem('publisherLibrary', JSON.stringify(kept));
                    // 消えた本があったことは記録に残す（問い合わせ時に追える）
                    console.info('ライブラリから外した項目（サーバーに購入記録なし）:',
                        removed.map(function(r) { return (r && r.title) || r; }));
                    books = books.filter(function(b) {
                        return known[String(b.id)] || !removed.some(function(r) { return r && String(r.id) === String(b.id); });
                    });
                }
            } catch (e) {
                console.error('Failed to prune library:', e);
            }
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text == null ? '' : String(text);
            return d.innerHTML;
        }

        // Merge purchased works (written to localStorage 'publisherLibrary' by
        // checkout / work-detail / payment-success) into the library list.
        // Without this, bought works never appeared on this page at all.
        function loadPurchasedBooks() {
            let purchased = [];
            try { purchased = JSON.parse(localStorage.getItem('publisherLibrary') || '[]'); }
            catch (e) { console.error('Failed to read purchased library:', e); }
            purchased.forEach(item => {
                if (!item || item.id == null) return;
                if (books.some(b => String(b.id) === String(item.id))) return;
                books.push({
                    id: String(item.id),
                    title: item.title || 'Untitled',
                    author: item.author || '',
                    cover: null,
                    status: 'new',
                    progress: 0,
                    favorite: false,
                    wishlist: false,
                    lastRead: null,
                    addedAt: item.addedAt || new Date().toISOString(),
                    purchased: true
                });
            });
        }
        loadPurchasedBooks();

        // ========== Shared Helpers ==========
function getL(obj, replacements = {}) {
            if (!obj) return '';
            const lang = getCurrentLanguage();
            let text = obj[lang] || obj['en'] || '';
            Object.keys(replacements).forEach(key => {
                text = text.replace(`{${key}}`, replacements[key]);
            });
            return text;
        }
        
        // ========== Navbar Functions (Pattern C) ==========
        // updateUIText removed - handled by i18n.js

        // ========== Library Page Functions ==========
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLanguage', lang);
            const desktopSel = document.getElementById('languageSelector');
            const mobileSel = document.getElementById('languageSelectorMobile');
            if (desktopSel) desktopSel.value = lang;
            if (mobileSel) mobileSel.value = lang;
            updateAllText();
        }
        
        function updateAllText() {
            document.title = getL(uiText.myLibrary) + ' - AuctLect';
            if (typeof i18n !== 'undefined') i18n.applyToDOM();
            renderBooks();
        }
        
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            renderBooks();
        }
        
        function filterBooks() {
            renderBooks();
        }
        
        function sortBooks() {
            renderBooks();
        }
        
        function getFilteredBooks() {
            let filtered = [...books];
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            if (currentTab === 'reading') {
                filtered = filtered.filter(b => b.status === 'reading');
            } else if (currentTab === 'completed') {
                filtered = filtered.filter(b => b.status === 'completed');
            } else if (currentTab === 'favorites') {
                filtered = filtered.filter(b => b.favorite);
            } else if (currentTab === 'wishlist') {
                filtered = filtered.filter(b => b.wishlist);
            }
            
            if (searchQuery) {
                filtered = filtered.filter(b => 
                    b.title.toLowerCase().includes(searchQuery) ||
                    b.author.toLowerCase().includes(searchQuery)
                );
            }
            
            const sortBy = document.getElementById('sortSelect').value;
            if (sortBy === 'title') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            } else if (sortBy === 'author') {
                filtered.sort((a, b) => a.author.localeCompare(b.author));
            } else if (sortBy === 'added') {
                filtered.sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));
            } else {
                filtered.sort((a, b) => {
                    if (!a.lastRead) return 1;
                    if (!b.lastRead) return -1;
                    return new Date(b.lastRead) - new Date(a.lastRead);
                });
            }
            
            return filtered;
        }
        
        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const emptyState = document.getElementById('emptyState');
            const filtered = getFilteredBooks();
            
            document.getElementById('countAll').textContent = books.filter(b => !b.wishlist).length;
            document.getElementById('countReading').textContent = books.filter(b => b.status === 'reading').length;
            document.getElementById('countCompleted').textContent = books.filter(b => b.status === 'completed').length;
            document.getElementById('countFavorites').textContent = books.filter(b => b.favorite).length;
            document.getElementById('countWishlist').textContent = books.filter(b => b.wishlist).length;
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            // Note: ids are quoted in the onclick handlers (purchased works have
            // string ids), and title/author are escaped — they now come from
            // localStorage, so they must be treated as untrusted input.
            grid.innerHTML = filtered.map(book => `
                <div class="book-card" onclick="openBook('${escapeHtml(book.id)}')">
                    <div class="book-cover">
                        ${book.cover
                            ? `<img src="${escapeHtml(book.cover)}" alt="${escapeHtml(book.title)}">`
                            : `<i class="fas fa-book book-cover-placeholder"></i>`
                        }
                        ${book.progress > 0 && book.progress < 100 ? `
                            <div class="reading-progress">
                                <div class="reading-progress-bar" style="width: ${book.progress}%"></div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="book-info">
                        <div class="book-title" dir="auto">${escapeHtml(book.title)}</div>
                        <div class="book-author" dir="auto">${escapeHtml(book.author)}</div>
                        ${book.giftFrom ? `<div class="gift-from"><i class="fas fa-gift me-1"></i>${getL(uiText.giftFrom).replace('{name}', escapeHtml(book.giftFrom))}</div>` : ''}
                        <div class="book-meta">
                            <span class="book-status ${book.status === 'reading' ? 'status-reading' : book.status === 'completed' ? 'status-completed' : 'status-new'}">
                                ${book.status === 'reading'
                                    ? `<i class="fas fa-bookmark"></i> ${book.progress}%`
                                    : book.status === 'completed'
                                    ? `<i class="fas fa-check-circle"></i> ${getL(uiText.completed)}`
                                    : `<i class="fas fa-plus-circle"></i> ${book.wishlist ? getL(uiText.wishlist) : 'New'}`
                                }
                            </span>
                            <div class="book-actions" onclick="event.stopPropagation()">
                                <button class="book-action-btn ${book.favorite ? 'favorited' : ''}"
                                        onclick="toggleFavorite('${escapeHtml(book.id)}')"
                                        title="${book.favorite ? getL(uiText.removeFromFavorites) : getL(uiText.addToFavorites)}">
                                    <i class="fas fa-heart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // String() comparison: demo ids are numbers, purchased ids are strings
        function openBook(id) {
            const book = books.find(b => String(b.id) === String(id));
            if (book) {
                window.location.href = `reader.html?workId=${encodeURIComponent(id)}&title=${encodeURIComponent(book.title)}`;
            }
        }

        function toggleFavorite(id) {
            const book = books.find(b => String(b.id) === String(id));
            if (book) {
                book.favorite = !book.favorite;
                renderBooks();
            }
        }
        
        // ========== Initialization ==========
        document.addEventListener('DOMContentLoaded', function() {
            const desktopSelector = document.getElementById('languageSelector');
            const mobileSelector = document.getElementById('languageSelectorMobile');
            
            if (desktopSelector && mobileSelector) {
                const savedLang = localStorage.getItem('preferredLanguage') || 'en';
                desktopSelector.value = savedLang;
                mobileSelector.value = savedLang;
                
                mobileSelector.addEventListener('change', function() {
                    desktopSelector.value = this.value;
                    if (typeof changeLanguage === 'function') changeLanguage(this.value);
                });

                desktopSelector.addEventListener('change', function() {
                    mobileSelector.value = this.value;
                    if (typeof changeLanguage === 'function') changeLanguage(this.value);
                });
            }

            updateAllText();
            loadLibraryFromApi();

            // Close user dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.user-dropdown')) {
                    const dropdown = document.getElementById('userDropdown');
                    const dropdownMenu = document.getElementById('userMenu');
                    if (dropdown) dropdown.classList.remove('open');
                    if (dropdownMenu) dropdownMenu.classList.remove('show');
                }
            });
            
            // (Navbar overlay wiring removed — navbar.js attaches its own
            //  handlers after it renders the navbar.)

            // Listen for language changes from other components
            document.addEventListener('languageChanged', function() {
                updateAllText();
            });

            if (typeof i18n !== 'undefined') {
                i18n.onLanguageChange(function() {
                    i18n.applyToDOM();
                    renderBooks();
                });
            }
        });
    </script>
</body>
