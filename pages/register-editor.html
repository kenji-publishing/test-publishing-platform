<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="registerEditor.pageTitle">Editor Registration - Publisher</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style-new.css">
    <link rel="stylesheet" href="../css/mobile-fixes.css">
    
    <style>
        .navbar-lang-selector { display: flex; align-items: center; margin-right: 0.5rem; }
        @media (max-width: 991.98px) { .navbar-lang-selector { order: 1; } .navbar-toggler { order: 2; } }
        .register-container { padding: var(--spacing-xl) 0; max-width: 800px; margin: 0 auto; }
        .register-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-xl); }
        .register-header { text-align: center; margin-bottom: var(--spacing-xl); }
        .register-header .icon { font-size: 4rem; color: var(--color-info, #17a2b8); margin-bottom: var(--spacing-md); }
        .register-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .register-header p { color: var(--color-text-secondary); }
        .form-section { margin-bottom: var(--spacing-xl); }
        .form-section h5 { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--spacing-md); display: flex; align-items: center; gap: var(--spacing-sm); }
        .form-section h5 i { color: var(--color-accent); }
        .form-label { font-weight: 500; margin-bottom: var(--spacing-xs); }
        .form-text { font-size: var(--font-size-sm); color: var(--color-text-muted); }
        .form-check-label { font-weight: 400; }
        .btn-register { padding: var(--spacing-md) var(--spacing-xl); font-size: var(--font-size-lg); }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-book-open"></i> Publisher
            </a>
            <!-- Mobile Language Selector -->
            <div class="navbar-lang-selector d-lg-none">
                <select class="language-selector" id="languageSelectorMobile">
                    <option value="en">🇬🇧 English</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="pt">🇧🇷 Português</option>
                </select>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html" data-i18n="nav.home">Home</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <!-- Desktop Language Selector -->
                    <select class="language-selector d-none d-lg-block" id="languageSelector">
                        <option value="en">🇬🇧 English</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="zh">🇨🇳 中文</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="ar">🇸🇦 العربية</option>
                        <option value="pt">🇧🇷 Português</option>
                    </select>
                    <a href="login.html" class="btn btn-outline-custom" data-i18n="nav.login">Sign In</a>
                    <a href="register.html" class="btn btn-custom" data-i18n="nav.register">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="register-container">
        <div class="container">
            <div class="register-card">
                <div class="register-header">
                    <div class="icon">
                        <i class="fas fa-edit"></i>
                    </div>
                    <h1 data-i18n="registerEditor.title">Editor Registration</h1>
                    <p data-i18n="registerEditor.subtitle">Help polish great stories to perfection</p>
                </div>

                <form id="editorRegistrationForm">
                    <!-- Personal Information -->
                    <div class="form-section">
                        <h5><i class="fas fa-user"></i> <span data-i18n="registerEditor.personalInfo">Personal Information</span></h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label" data-i18n="registerEditor.firstName">First Name *</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label" data-i18n="registerEditor.lastName">Last Name *</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label" data-i18n="registerEditor.email">Email Address *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="country" class="form-label" data-i18n="registerEditor.country">Country *</label>
                            <select class="form-select" id="country" required>
                                <option value="" data-i18n="registerEditor.selectCountry">Select your country</option>
                                <option value="US" data-i18n="registerEditor.countries.us">United States</option>
                                <option value="GB" data-i18n="registerEditor.countries.gb">United Kingdom</option>
                                <option value="JP" data-i18n="registerEditor.countries.jp">Japan</option>
                                <option value="DE" data-i18n="registerEditor.countries.de">Germany</option>
                                <option value="FR" data-i18n="registerEditor.countries.fr">France</option>
                                <option value="ES" data-i18n="registerEditor.countries.es">Spain</option>
                                <option value="CN" data-i18n="registerEditor.countries.cn">China</option>
                                <option value="other" data-i18n="registerEditor.countries.other">Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Language Proficiency -->
                    <div class="form-section">
                        <h5><i class="fas fa-language"></i> <span data-i18n="registerEditor.languageProficiency">Language Proficiency</span></h5>
                        
                        <div class="mb-3">
                            <label class="form-label" data-i18n="registerEditor.languagesCanEdit">Languages I Can Edit *</label>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="en" id="edit-en">
                                        <label class="form-check-label" for="edit-en" data-i18n="registerEditor.languages.en">English</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="es" id="edit-es">
                                        <label class="form-check-label" for="edit-es" data-i18n="registerEditor.languages.es">Spanish</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="de" id="edit-de">
                                        <label class="form-check-label" for="edit-de" data-i18n="registerEditor.languages.de">German</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="fr" id="edit-fr">
                                        <label class="form-check-label" for="edit-fr" data-i18n="registerEditor.languages.fr">French</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="ja" id="edit-ja">
                                        <label class="form-check-label" for="edit-ja" data-i18n="registerEditor.languages.ja">Japanese</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="zh" id="edit-zh">
                                        <label class="form-check-label" for="edit-zh" data-i18n="registerEditor.languages.zh">Chinese</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Editing Expertise -->
                    <div class="form-section">
                        <h5><i class="fas fa-star"></i> <span data-i18n="registerEditor.editingExpertise">Editing Expertise</span></h5>
                        
                        <div class="mb-3">
                            <label class="form-label" data-i18n="registerEditor.typeOfEditing">Type of Editing *</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="developmental" id="type-dev">
                                <label class="form-check-label" for="type-dev" data-i18n="registerEditor.editingTypes.developmental">Developmental Editing (structure, plot, character development)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="copy" id="type-copy">
                                <label class="form-check-label" for="type-copy" data-i18n="registerEditor.editingTypes.copy">Copy Editing (grammar, style, consistency)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="proof" id="type-proof">
                                <label class="form-check-label" for="type-proof" data-i18n="registerEditor.editingTypes.proof">Proofreading (spelling, punctuation, formatting)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="line" id="type-line">
                                <label class="form-check-label" for="type-line" data-i18n="registerEditor.editingTypes.line">Line Editing (sentence structure, word choice)</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="experience" class="form-label" data-i18n="registerEditor.yearsExperience">Years of Editing Experience *</label>
                            <select class="form-select" id="experience" required>
                                <option value="" data-i18n="registerEditor.selectExperience">Select experience level</option>
                                <option value="0-2" data-i18n="registerEditor.experience.years02">0-2 years</option>
                                <option value="3-5" data-i18n="registerEditor.experience.years35">3-5 years</option>
                                <option value="6-10" data-i18n="registerEditor.experience.years610">6-10 years</option>
                                <option value="10+" data-i18n="registerEditor.experience.years10plus">10+ years</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="genres" class="form-label" data-i18n="registerEditor.genreExpertise">Genre Expertise *</label>
                            <select class="form-select" id="genres" multiple size="5" required>
                                <option value="fiction" data-i18n="registerEditor.genres.fiction">Fiction</option>
                                <option value="nonfiction" data-i18n="registerEditor.genres.nonfiction">Non-Fiction</option>
                                <option value="manga" data-i18n="registerEditor.genres.manga">Manga/Comics</option>
                                <option value="poetry" data-i18n="registerEditor.genres.poetry">Poetry</option>
                                <option value="scifi" data-i18n="registerEditor.genres.scifi">Science Fiction</option>
                                <option value="fantasy" data-i18n="registerEditor.genres.fantasy">Fantasy</option>
                                <option value="romance" data-i18n="registerEditor.genres.romance">Romance</option>
                                <option value="mystery" data-i18n="registerEditor.genres.mystery">Mystery/Thriller</option>
                                <option value="horror" data-i18n="registerEditor.genres.horror">Horror</option>
                                <option value="academic" data-i18n="registerEditor.genres.academic">Academic</option>
                                <option value="technical" data-i18n="registerEditor.genres.technical">Technical</option>
                            </select>
                            <div class="form-text" data-i18n="registerEditor.selectMultipleHint">Hold Ctrl (Cmd on Mac) to select multiple</div>
                        </div>

                        <div class="mb-3">
                            <label for="qualifications" class="form-label" data-i18n="registerEditor.qualifications">Qualifications &amp; Education (Optional)</label>
                            <textarea class="form-control" id="qualifications" rows="3" data-i18n-placeholder="registerEditor.qualificationsPlaceholder" placeholder="Degrees, certifications, professional memberships..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="portfolio" class="form-label" data-i18n="registerEditor.portfolio">Portfolio/Website (Optional)</label>
                            <input type="url" class="form-control" id="portfolio" placeholder="https://">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="registerEditor.styleGuides">Familiar Style Guides</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="chicago" id="style-chicago">
                                <label class="form-check-label" for="style-chicago" data-i18n="registerEditor.styles.chicago">Chicago Manual of Style</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="ap" id="style-ap">
                                <label class="form-check-label" for="style-ap" data-i18n="registerEditor.styles.ap">AP Stylebook</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="mla" id="style-mla">
                                <label class="form-check-label" for="style-mla" data-i18n="registerEditor.styles.mla">MLA Style</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="apa" id="style-apa">
                                <label class="form-check-label" for="style-apa" data-i18n="registerEditor.styles.apa">APA Style</label>
                            </div>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                        <label class="form-check-label" for="agreeTerms">
                            <span data-i18n="registerEditor.agreeToTerms">I agree to the</span>
                            <a href="terms.html" data-i18n="registerEditor.termsOfService">Terms of Service</a>
                            <span data-i18n="registerEditor.and">and</span>
                            <a href="revenue-sharing.html" data-i18n="registerEditor.revenueSharing">Revenue Sharing Agreement</a> *
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-custom btn-register">
                            <i class="fas fa-user-plus me-2"></i><span data-i18n="registerEditor.createAccount">Create Editor Account</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <p class="small mb-0" data-i18n="footer.copyright">&copy; 2024 Publisher. All rights reserved.</p>
                <div class="d-flex gap-3">
                    <a href="support/faq.html" class="text-secondary" data-i18n="footer.help">Help</a>
                    <a href="terms.html" class="text-secondary" data-i18n="footer.terms">Terms</a>
                    <a href="privacy.html" class="text-secondary" data-i18n="footer.privacy">Privacy</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/language-switcher.js"></script>
    <script>
        // Language switching
        function switchLanguage(lang) {
            localStorage.setItem('preferredLanguage', lang);
            
            // Update both selectors
            document.getElementById('languageSelector').value = lang;
            document.getElementById('languageSelectorMobile').value = lang;
            
            // Use LanguageSwitcher if available
            if (typeof LanguageSwitcher !== 'undefined') {
                LanguageSwitcher.changeLanguage(lang);
            } else if (typeof loadLanguage === 'function') {
                loadLanguage(lang);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set current language
            const currentLang = localStorage.getItem('preferredLanguage') || 'en';
            const desktopSelector = document.getElementById('languageSelector');
            const mobileSelector = document.getElementById('languageSelectorMobile');
            
            if (desktopSelector) {
                desktopSelector.value = currentLang;
                desktopSelector.addEventListener('change', function() {
                    switchLanguage(this.value);
                });
            }
            
            if (mobileSelector) {
                mobileSelector.value = currentLang;
                mobileSelector.addEventListener('change', function() {
                    switchLanguage(this.value);
                });
            }
        });

        // Form submission
        document.getElementById('editorRegistrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registration submitted! (This will connect to backend in production)');
        });
    </script>
</body>
</html>
