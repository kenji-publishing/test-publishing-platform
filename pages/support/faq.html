    <style>
    /* ========== Mobile Language Selector ========== */
    .navbar-lang-selector {
        display: flex;
        align-items: center;
        margin-right: 0.5rem;
    }
    
    @media (max-width: 991.98px) {
        .navbar-lang-selector {
            order: 1;
        }
        .navbar-toggler {
            order: 2;
        }
    }
    
    /* ========== PC Navbar - 横並び維持 ========== */
    @media (min-width: 992px) {
        .navbar-nav {
            flex-wrap: nowrap !important;
            flex-direction: row !important;
        }
        .navbar-nav .nav-item {
            white-space: nowrap !important;
        }
        .navbar-nav .nav-link {
            white-space: nowrap !important;
            padding: 0.5rem 0.6rem !important;
            font-size: 0.9rem;
        }

        .dropdown-menu {
            white-space: nowrap;
        }
        .navbar-buttons-guest {
            display: flex !important;
            flex-wrap: nowrap !important;
            gap: 0.5rem;
        }
        .navbar-buttons-guest .btn {
            white-space: nowrap !important;
            flex-shrink: 0;
        }
    }
    
    /* ========== Auth Visibility Control ========== */
    .auth-only {
        display: none !important;
    }
    .guest-only {
        display: block;
    }
    body.logged-in .auth-only {
        display: block !important;
    }
    body.logged-in .auth-only.nav-item {
        display: list-item !important;
    }
    body.logged-in .auth-only.dropdown {
        display: block !important;
    }
    body.logged-in .guest-only {
        display: none !important;
    }
    @media (min-width: 992px) {
        body.logged-in .navbar-buttons-guest {
            display: none !important;
        }
    }
    
    /* ========== User Dropdown Menu ========== */
    .user-dropdown {
        position: relative;
    }
    .user-dropdown-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: transparent;
        border: 1px solid var(--color-border);
        border-radius: 25px;
        padding: 0.4rem 0.75rem;
        cursor: pointer;
        color: var(--color-text);
        transition: all 0.2s;
    }
    .user-dropdown-toggle:hover {
        border-color: var(--color-accent);
        background: rgba(139, 115, 85, 0.05);
    }
    .user-dropdown-toggle i:first-child {
        font-size: 1.25rem;
        color: var(--color-accent);
    }
    .user-name {
        font-weight: 500;
        font-size: 0.9rem;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .user-chevron {
        font-size: 0.7rem;
        color: var(--color-text-secondary);
        transition: transform 0.2s;
    }
    .user-dropdown.open .user-chevron {
        transform: rotate(180deg);
    }
    .user-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        min-width: 240px;
        z-index: 1001;
        display: none;
        overflow: hidden;
    }
    .user-menu.show {
        display: block;
    }
    .user-menu-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem;
        background: var(--color-bg-main);
    }
    .user-avatar {
        font-size: 2.5rem;
        color: var(--color-accent);
    }
    .user-info {
        flex: 1;
        min-width: 0;
    }
    .user-display-name {
        font-weight: 600;
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .user-email {
        font-size: 0.8rem;
        color: var(--color-text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .user-menu-divider {
        height: 1px;
        background: var(--color-border);
    }
    .user-menu-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        color: var(--color-text);
        text-decoration: none;
        font-size: 0.9rem;
        cursor: pointer;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
    }
    .user-menu-item:hover {
        background: var(--color-bg-hover);
        color: var(--color-accent);
    }
    .user-menu-item i {
        width: 20px;
        text-align: center;
        color: var(--color-text-secondary);
    }
    .user-menu-item:hover i {
        color: var(--color-accent);
    }
    .logout-btn {
        color: var(--color-error);
    }
    .logout-btn i {
        color: var(--color-error);
    }
    .logout-btn:hover {
        background: rgba(199, 93, 93, 0.1);
        color: var(--color-error);
    }

    <style>
        .faq-hero { background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%); padding: var(--spacing-2xl) 0; color: white; text-align: center; }
        .faq-hero h1 { color: white; font-size: var(--font-size-3xl); margin-bottom: var(--spacing-sm); }

        .faq-search { max-width: 500px; margin: 0 auto; position: relative; }

        .category-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-lg); text-align: center; cursor: pointer; transition: all var(--transition-fast); }
        .category-card:hover { border-color: var(--color-accent); box-shadow: var(--shadow-md); transform: translateY(-3px); }
        .category-card.active { border-color: var(--color-accent); background: rgba(139, 115, 85, 0.05); }
        .category-card .icon { width: 50px; height: 50px; border-radius: var(--radius-md); background: rgba(139, 115, 85, 0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--spacing-sm); color: var(--color-accent); font-size: 1.25rem; }
        .category-card h3 { font-size: var(--font-size-base); margin-bottom: var(--spacing-xs); }

        .faq-accordion .accordion-item:last-child { border-bottom: none; }

        .faq-accordion .accordion-button:not(.collapsed) { background: var(--color-bg-hover); color: var(--color-accent); box-shadow: none; }
        .faq-accordion .accordion-button:focus { box-shadow: none; }
        .faq-accordion .accordion-button::after { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%238B7355'%3e%3cpath fill-rule='evenodd' d='M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z'/%3e%3c/svg%3e"); }
        .faq-accordion .accordion-body { padding: 0 var(--spacing-lg) var(--spacing-lg); color: var(--color-text-secondary); line-height: 1.7; }
        .helpful-section { border-top: 1px solid var(--color-border); padding-top: var(--spacing-md); margin-top: var(--spacing-md); display: flex; align-items: center; gap: var(--spacing-md); }
        .helpful-section span { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
        .helpful-btn { padding: 4px 12px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background: transparent; font-size: var(--font-size-sm); cursor: pointer; transition: all var(--transition-fast); }
        .helpful-btn:hover { background: var(--color-bg-hover); }
        .helpful-btn.voted { background: var(--color-accent); color: white; border-color: var(--color-accent); }
        .search-results { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); margin-bottom: var(--spacing-xl); overflow: hidden; }
        .search-result-item { padding: var(--spacing-lg); border-bottom: 1px solid var(--color-border); cursor: pointer; transition: background var(--transition-fast); }
        .search-result-item:hover { background: var(--color-bg-hover); }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item h4 { font-size: var(--font-size-base); margin-bottom: var(--spacing-xs); color: var(--color-text-primary); }
        .search-result-item p { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin: 0; }
        .troubleshoot-cta { background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%); border-radius: var(--radius-lg); padding: var(--spacing-xl); text-align: center; color: white; }
        .troubleshoot-cta h3 { margin-bottom: var(--spacing-sm); color: white; }
        .troubleshoot-cta p { color: rgba(255, 255, 255, 0.9); margin-bottom: var(--spacing-lg); }
        .troubleshoot-cta .btn { background: white; color: var(--color-accent); border: none; font-weight: 600; }
        .troubleshoot-cta .btn:hover { background: var(--color-cream); }
        @media (max-width: 992px) { .category-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 576px) { .category-grid { grid-template-columns: 1fr; } .faq-section-header { flex-direction: column; gap: var(--spacing-md); } }
    </style>

<body>
<!-- ========== NAVBAR HTML START ========== -->

<!-- Navbar Overlay -->
<div id="navbar-container"></div>

    <!-- Hero Section -->
    <section class="faq-hero">
        <div class="container">
            <h1><i class="fas fa-question-circle me-2"></i><span data-i18n="support.faq.heroTitle">Frequently Asked Questions</span></h1>
            <p data-i18n="support.faq.heroSubtitle">Find answers to common questions about AuctLect</p>
            <div class="faq-search">
                <i class="fas fa-search"></i>
                <input type="text" id="faqSearch" data-i18n-placeholder="support.faq.searchPlaceholder" placeholder="Search for answers...">
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container py-5">
        <!-- Search Results (Hidden by default) -->
        <div id="searchResultsSection" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3><i class="fas fa-search me-2 text-accent"></i><span data-i18n="support.faq.searchResults">Search Results</span>: <span id="searchQuery"></span></h3>
                <button class="btn btn-soft-custom btn-sm" id="clearSearch">
                    <i class="fas fa-times me-1"></i> <span data-i18n="support.faq.clear">Clear</span>
                </button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- Categories Section -->
        <section id="categoriesSection" class="fade-in">
            <h2 class="mb-4"><i class="fas fa-th-large me-2 text-accent"></i><span data-i18n="support.faq.browseByCategory">Browse by Category</span></h2>
            <div class="category-grid" id="categoriesList"></div>
        </section>

        <!-- FAQ Section -->
        <section id="faqSection" class="fade-in">
            <div class="faq-section">
                <div class="faq-section-header">
                    <h2><i class="fas fa-list me-2 text-accent"></i><span data-i18n="support.faq.allQuestions">All Questions</span></h2>
                    <select class="form-select" style="width: auto;" id="categoryFilter">
                        <option value="all" data-i18n="support.faq.allCategories">All Categories</option>
                    </select>
                </div>
                <div class="accordion faq-accordion" id="faqAccordion"></div>
            </div>
        </section>

        <!-- Troubleshoot CTA -->
        <section class="troubleshoot-cta fade-in">
            <h3><i class="fas fa-tools me-2"></i><span data-i18n="support.faq.notResolved">Still have questions?</span></h3>
            <p data-i18n="support.faq.tryTroubleshoot">Find solutions with our troubleshooting wizard</p>
            <a href="troubleshoot.html" class="btn btn-lg">
                <i class="fas fa-magic me-2"></i><span data-i18n="support.faq.startTroubleshoot">Start Troubleshooting</span>
            </a>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../js/lang/fr.js"></script>
    <script src="../../js/lang/de.js"></script>
    <script src="../../js/lang/ko.js"></script>

    <script>
        // ========== Pattern C: 多言語対応テキスト（9言語） ==========
        const uiText = {
        };

        // ========== Pattern C: ヘルパー関数 ==========
        // updateUIText removed - handled by i18n.js

        // ========== Pattern C: ユーザードロップダウン ==========
        // ========== Pattern C: ログアウト ==========

        // ========== Pattern C: ユーザー情報読み込み ==========
        // ========== FAQ固有: 変数 ==========
        const API_BASE = 'http://localhost:3000/api';
        let categories = [];
        let faqs = [];
        let currentCategory = 'all';
        let isLoggedIn = false;
        const categoryIcons = { 1: 'fa-user-circle', 2: 'fa-credit-card', 3: 'fa-book', 4: 'fa-language', 5: 'fa-pen-fancy', 6: 'fa-globe', 7: 'fa-cog', 8: 'fa-question-circle' };

        // ========== FAQ固有: 多言語テキスト取得 ==========
        function getLocalizedText(item, field) {
            const lang = getCurrentLanguage();
            const key = `${field}_${lang}`;
            const fallbackKey = `${field}_en`;
            const jaKey = `${field}_ja`;
            if (item[key] && item[key].trim() !== '') return item[key];
            if (item[fallbackKey] && item[fallbackKey].trim() !== '') return item[fallbackKey];
            if (item[jaKey] && item[jaKey].trim() !== '') return item[jaKey];
            return '';
        }

        function updatePlaceholders() {
            const searchInput = document.getElementById('faqSearch');
            if (searchInput) {
                searchInput.placeholder = t('support.faq.searchPlaceholder');
            }
        }

        // ========== Pattern C + FAQ: DOMContentLoaded ==========
        document.addEventListener('DOMContentLoaded', function() {
            // --- Pattern C: 言語セレクター同期 ---
            const desktopSelector = document.getElementById('languageSelector');
            const mobileSelector = document.getElementById('languageSelectorMobile');

            if (desktopSelector && mobileSelector) {
                const savedLang = localStorage.getItem('preferredLanguage') || 'en';
                desktopSelector.value = savedLang;
                mobileSelector.value = savedLang;

                mobileSelector.addEventListener('change', function() {
                    desktopSelector.value = this.value;
                    if (typeof changeLanguage === 'function') changeLanguage(this.value);
                    updateUIText();
                });

                desktopSelector.addEventListener('change', function() {
                    mobileSelector.value = this.value;
                    updateUIText();
                });
            }

            // --- Pattern C: UI初期化 ---
            updateUIText();
// --- Pattern C: ドロップダウン外クリックで閉じる ---
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.user-dropdown')) {
                    const dropdown = document.getElementById('userDropdown');
                    const dropdownMenu = document.getElementById('userMenu');
                    if (dropdown) dropdown.classList.remove('open');
                    if (dropdownMenu) dropdownMenu.classList.remove('show');
                }
            });

            // --- Pattern C: ハンバーガーメニュー & オーバーレイ ---


            if (navbarOverlay) {
                navbarOverlay.addEventListener('click', function() {
                    const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                    if (bsCollapse) bsCollapse.hide();
                });
            }

            // --- Pattern C: 言語変更イベント ---
            document.addEventListener('languageChanged', function(e) {
                updateUIText();
                // FAQ固有: コンテンツ再描画
                renderCategories();
                renderCategoryFilter();
                renderFaqs();
                updatePlaceholders();
            });

            // --- FAQ固有: データ読み込み ---
            loadCategories();
            loadFaqs();
            setupSearchHandler();
        });

        // ========== FAQ固有: カテゴリ ==========
        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/support/faq/categories`);
                const data = await response.json();
                if (data.success) { 
                    categories = data.categories; 
                    renderCategories(); 
                    renderCategoryFilter(); 
                }
            } catch (error) { 
                console.error('Error loading categories:', error); 
                renderFallbackCategories(); 
            }
        }

        function renderFallbackCategories() {
            const defaultCategories = [
                { id: 1, name_en: 'Account', name_ja: 'アカウント', name_zh: '账户', name_es: 'Cuenta', name_fr: 'Compte', name_de: 'Konto', name_ko: '계정', name_ar: 'الحساب', name_pt: 'Conta', name_it: 'Account', item_count: 3 },
                { id: 2, name_en: 'Payment', name_ja: 'お支払い', name_zh: '付款', name_es: 'Pago', name_fr: 'Paiement', name_de: 'Zahlung', name_ko: '결제', name_ar: 'الدفع', name_pt: 'Pagamento', name_it: 'Pagamento', item_count: 2 },
                { id: 3, name_en: 'Works', name_ja: '作品について', name_zh: '作品', name_es: 'Obras', name_fr: 'Œuvres', name_de: 'Werke', name_ko: '작품', name_ar: 'الأعمال', name_pt: 'Obras', name_it: 'Opere', item_count: 0 },
                { id: 4, name_en: 'Translation', name_ja: '翻訳サービス', name_zh: '翻译服务', name_es: 'Traducción', name_fr: 'Traduction', name_de: 'Übersetzung', name_ko: '번역 서비스', name_ar: 'الترجمة', name_pt: 'Tradução', name_it: 'Traduzione', item_count: 2 },
                { id: 5, name_en: 'For Authors', name_ja: '著者向け', name_zh: '作者专区', name_es: 'Para Autores', name_fr: 'Pour les Auteurs', name_de: 'Für Autoren', name_ko: '저자용', name_ar: 'للمؤلفين', name_pt: 'Para Autores', name_it: 'Per gli Autori', item_count: 0 },
                { id: 6, name_en: 'For Translators', name_ja: '翻訳者向け', name_zh: '译者专区', name_es: 'Para Traductores', name_fr: 'Pour les Traducteurs', name_de: 'Für Übersetzer', name_ko: '번역가용', name_ar: 'للمترجمين', name_pt: 'Para Tradutores', name_it: 'Per i Traduttori', item_count: 0 },
                { id: 7, name_en: 'Technical Issues', name_ja: '技術的な問題', name_zh: '技术问题', name_es: 'Problemas Técnicos', name_fr: 'Problèmes Techniques', name_de: 'Technische Probleme', name_ko: '기술 문제', name_ar: 'مشاكل تقنية', name_pt: 'Problemas Técnicos', name_it: 'Problemi Tecnici', item_count: 2 },
                { id: 8, name_en: 'Other', name_ja: 'その他', name_zh: '其他', name_es: 'Otros', name_fr: 'Autres', name_de: 'Sonstiges', name_ko: '기타', name_ar: 'أخرى', name_pt: 'Outros', name_it: 'Altro', item_count: 0 }
            ];
            categories = defaultCategories;
            renderCategories();
            renderCategoryFilter();
        }

        function renderCategories() {
            const container = document.getElementById('categoriesList');
            const questionsLabel = t('support.faq.questions');
            container.innerHTML = categories.map(cat => {
                const categoryName = getLocalizedText(cat, 'name');
                return `
                    <div class="category-card ${currentCategory == cat.id ? 'active' : ''}" onclick="filterByCategory(${cat.id})">
                        <div class="icon"><i class="fas ${categoryIcons[cat.id] || 'fa-folder'}"></i></div>
                        <h3>${categoryName}</h3>
                        <div class="count">${cat.item_count || 0} ${questionsLabel}</div>
                    </div>
                `;
            }).join('');
        }

        function renderCategoryFilter() {
            const select = document.getElementById('categoryFilter');
            const allCatLabel = t('support.faq.allCategories');
            const options = categories.map(cat => {
                const categoryName = getLocalizedText(cat, 'name');
                return `<option value="${cat.id}">${categoryName}</option>`;
            }).join('');
            select.innerHTML = `<option value="all">${allCatLabel}</option>${options}`;
            select.value = currentCategory;
            select.addEventListener('change', function() { currentCategory = this.value; renderFaqs(); renderCategories(); });
        }

        // ========== FAQ固有: FAQ読み込み・描画 ==========
        async function loadFaqs() {
            try {
                const response = await fetch(`${API_BASE}/support/faq`);
                const data = await response.json();
                if (data.success) { 
                    faqs = data.faqs; 
                    renderFaqs(); 
                }
            } catch (error) { 
                console.error('Error loading FAQs:', error); 
                renderFallbackFaqs(); 
            }
        }

        function renderFallbackFaqs() {
            if (typeof faqMultilingualData !== 'undefined') {
                faqs = faqMultilingualData;
            } else {
                faqs = [];
            }
            renderFaqs();
        }

        function renderEmptyFaqs() {
            const container = document.getElementById('faqAccordion');
            container.innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-database fa-3x mb-3"></i><p>${t('support.faq.loadError')}</p></div>`;
        }

        function renderFaqs() {
            const container = document.getElementById('faqAccordion');
            let filteredFaqs = faqs;
            if (currentCategory !== 'all') { 
                filteredFaqs = faqs.filter(faq => faq.category_id == currentCategory); 
            }
            if (filteredFaqs.length === 0) {
                container.innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-inbox fa-3x mb-3"></i><p>${t('support.faq.noQuestions')}</p></div>`;
                return;
            }
            const wasHelpful = t('support.faq.wasHelpful');
            const yesLabel = t('support.faq.yes');
            const noLabel = t('support.faq.no');
            
            container.innerHTML = filteredFaqs.map((faq, index) => {
                const question = getLocalizedText(faq, 'question');
                const answer = getLocalizedText(faq, 'answer');
                const categoryName = getLocalizedText(faq, 'category_name');
                
                return `
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq${faq.id}">
                                <span class="badge badge-soft me-2">${categoryName || 'General'}</span> ${question}
                            </button>
                        </h2>
                        <div id="faq${faq.id}" class="accordion-collapse collapse">
                            <div class="accordion-body">
                                ${answer}
                                <div class="helpful-section">
                                    <span>${wasHelpful}</span>
                                    <button class="helpful-btn" onclick="voteFaq(${faq.id}, true, event)"><i class="fas fa-thumbs-up me-1"></i> ${yesLabel} (${faq.helpful_count || 0})</button>
                                    <button class="helpful-btn" onclick="voteFaq(${faq.id}, false, event)"><i class="fas fa-thumbs-down me-1"></i> ${noLabel} (${faq.not_helpful_count || 0})</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== FAQ固有: フィルター・検索・投票 ==========
        function filterByCategory(categoryId) {
            currentCategory = categoryId;
            document.getElementById('categoryFilter').value = categoryId;
            renderFaqs();
            renderCategories();
            document.getElementById('faqSection').scrollIntoView({ behavior: 'smooth' });
        }

        function setupSearchHandler() {
            const searchInput = document.getElementById('faqSearch');
            let debounceTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                const query = this.value.trim();
                if (query.length < 2) { hideSearchResults(); return; }
                debounceTimer = setTimeout(() => searchFaqs(query), 300);
            });
            document.getElementById('clearSearch').addEventListener('click', function() { searchInput.value = ''; hideSearchResults(); });
        }

        async function searchFaqs(query) {
            try {
                const response = await fetch(`${API_BASE}/support/faq/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data.success) { showSearchResults(query, data.faqs); }
            } catch (error) { 
                console.error('Search error:', error);
                const results = faqs.filter(faq => {
                    const question = getLocalizedText(faq, 'question').toLowerCase();
                    const answer = getLocalizedText(faq, 'answer').toLowerCase();
                    return question.includes(query.toLowerCase()) || answer.includes(query.toLowerCase());
                });
                showSearchResults(query, results);
            }
        }

        function showSearchResults(query, results) {
            document.getElementById('searchQuery').textContent = `"${query}"`;
            const container = document.getElementById('searchResults');
            if (results.length === 0) {
                const noResultsMsg = t('support.faq.noResults');
                const tryTroubleshoot = t('support.faq.startTroubleshoot');
                container.innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-search fa-3x mb-3"></i><p>${noResultsMsg} "${query}"</p><a href="troubleshoot.html" class="btn btn-primary-custom mt-2"><i class="fas fa-tools me-2"></i>${tryTroubleshoot}</a></div>`;
            } else {
                container.innerHTML = results.map(faq => {
                    const question = getLocalizedText(faq, 'question');
                    const answer = getLocalizedText(faq, 'answer');
                    const categoryName = getLocalizedText(faq, 'category_name');
                    return `
                        <div class="search-result-item" onclick="showFaqDetail(${faq.id})">
                            <span class="badge badge-soft mb-2">${categoryName || 'General'}</span>
                            <h4>${question}</h4>
                            <p>${answer.substring(0, 150)}...</p>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('searchResultsSection').style.display = 'block';
            document.getElementById('categoriesSection').style.display = 'none';
            document.getElementById('faqSection').style.display = 'none';
        }

        function hideSearchResults() {
            document.getElementById('searchResultsSection').style.display = 'none';
            document.getElementById('categoriesSection').style.display = 'block';
            document.getElementById('faqSection').style.display = 'block';
        }

        function showFaqDetail(faqId) {
            hideSearchResults();
            const accordion = document.getElementById(`faq${faqId}`);
            if (accordion) { 
                new bootstrap.Collapse(accordion, { toggle: true }); 
                setTimeout(() => { 
                    accordion.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                }, 300); 
            }
        }

        async function voteFaq(faqId, helpful, event) {
            event.stopPropagation();
            try {
                const response = await fetch(`${API_BASE}/support/faq/${faqId}/vote`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ helpful }) 
                });
                const data = await response.json();
                if (data.success) {
                    const faq = faqs.find(f => f.id === faqId);
                    if (faq) { 
                        faq.helpful_count = data.helpful_count; 
                        faq.not_helpful_count = data.not_helpful_count; 
                        renderFaqs(); 
                    }
                    alert(t('support.faq.thanksFeedback'));
                }
            } catch (error) { console.error('Vote error:', error); }
        }
    </script>
</body>
</html>
