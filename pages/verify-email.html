<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="verifyEmail.pageTitle">メールアドレスの確認 - AuctLect</title>
    <script src="../js/config.js?v=202608291436"></script>
    <link rel="icon" href="../favicon.svg?v=202608291436" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/variables.css?v=202608291436" rel="stylesheet">
    <link href="../css/style-new.css?v=202608291436" rel="stylesheet">
    <link href="../css/components.css?v=202608291436" rel="stylesheet">
    <link href="../css/navbar.css?v=202608291436" rel="stylesheet">
    <link href="../css/mobile-fixes.css?v=202608291436" rel="stylesheet">
    <style>
        .verify-wrap { max-width: 520px; margin: 8vh auto; padding: 0 1rem; }
        .verify-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 2.5rem 2rem; text-align: center; }
        .verify-icon { font-size: 3rem; margin-bottom: 1rem; }
        .verify-icon.ok { color: #2e7d32; }
        .verify-icon.ng { color: #dc3545; }
        .verify-icon.wait { color: var(--color-accent); }
        .verify-card h1 { font-size: 1.35rem; margin-bottom: 0.75rem; }
        .verify-card p { color: var(--color-text-secondary); }
        .verify-actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="verify-wrap">
        <div class="verify-card" id="verifyCard">
            <div class="verify-icon wait"><i class="fas fa-spinner fa-spin"></i></div>
            <h1 id="vTitle">メールアドレスを確認しています...</h1>
            <p id="vDesc">しばらくお待ちください。 / Verifying your email...</p>
            <div class="verify-actions" id="vActions" style="display:none;"></div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/i18n.js?v=202608291436"></script>
    <script src="../js/navbar.js?v=202608291436"></script>
    <script src="../js/lang/ja.js?v=202608291436"></script>
    <script src="../js/lang/en.js?v=202608291436"></script>
    <script>
        function show(state, title, desc, actionsHtml) {
            var iconMap = { ok: '<i class="fas fa-circle-check"></i>', ng: '<i class="fas fa-circle-xmark"></i>', wait: '<i class="fas fa-spinner fa-spin"></i>' };
            document.querySelector('.verify-icon').className = 'verify-icon ' + state;
            document.querySelector('.verify-icon').innerHTML = iconMap[state];
            document.getElementById('vTitle').textContent = title;
            document.getElementById('vDesc').innerHTML = desc;
            var actions = document.getElementById('vActions');
            if (actionsHtml) { actions.innerHTML = actionsHtml; actions.style.display = 'flex'; }
            else { actions.style.display = 'none'; }
        }

        async function resendVerification(email) {
            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/auth/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                var data = await resp.json();
                if (resp.status === 429) { alert(data.error || 'Too many requests'); return; }
                alert('確認メールを再送しました。受信トレイ（迷惑メールフォルダも）をご確認ください。\nA new verification email has been sent.');
            } catch (e) {
                alert('再送に失敗しました: ' + e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var email = params.get('email');

            if (!token || !email) {
                show('ng', 'リンクが正しくありません',
                    '確認リンクが不完全です。メール内のリンクをそのまま開いてください。<br>The verification link is incomplete.',
                    '<a href="login.html" class="btn btn-soft-custom">ログインへ / Log in</a>');
                return;
            }

            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/auth-magic/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, email: email })
                });
                var data = await resp.json();

                if (resp.ok && data.token) {
                    // 確認成功 → そのままログイン状態にしてダッシュボードへ
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.user.userId,
                        email: data.user.email,
                        firstName: data.user.firstName,
                        lastName: data.user.lastName,
                        role: data.user.role
                    }));
                    show('ok', 'メールアドレスを確認しました！',
                        'ようこそAuctLectへ。まもなくダッシュボードへ移動します。<br>Your email is verified. Redirecting...',
                        '<a href="dashboard.html" class="btn btn-custom">ダッシュボードへ / Go to dashboard</a>');
                    setTimeout(function () { window.location.href = 'dashboard.html'; }, 2500);
                } else {
                    show('ng', '確認リンクが無効か期限切れです',
                        'リンクの有効期限（24時間）が切れているか、既に使用されています。<br>The link is invalid or expired. You can request a new one.',
                        '<button class="btn btn-custom" onclick="resendVerification(' + JSON.stringify(email).replace(/"/g, '&quot;') + ')">確認メールを再送 / Resend email</button>' +
                        '<a href="login.html" class="btn btn-soft-custom">ログインへ / Log in</a>');
                }
            } catch (e) {
                show('ng', '確認に失敗しました',
                    '通信エラーが発生しました。時間をおいて再度お試しください。<br>' + e.message,
                    '<a href="login.html" class="btn btn-soft-custom">ログインへ / Log in</a>');
            }
        });
    </script>
</body>
</html>
