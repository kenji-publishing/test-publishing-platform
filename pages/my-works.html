    <style>
        /* ========== My Works Page Specific Styles ========== */
        .myworks-container { padding: var(--spacing-xl) 0; min-height: 60vh; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        .page-header h1 {
            font-size: var(--font-size-2xl);
            margin-bottom: 0;
            font-weight: 700;
            color: var(--color-text-primary);
        }
        .btn-create {
            background: var(--color-accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all var(--transition-fast);
        }
        .btn-create:hover {
            background: #7A6548;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .stat-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            text-align: center;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .stat-icon {
            font-size: 1.5rem;
            color: var(--color-accent);
            margin-bottom: 0.4rem;
        }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-text-primary);
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-top: 0.15rem;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }
        .search-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-wrapper i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-secondary);
        }
        .search-wrapper input {
            width: 100%;
            padding: 0.6rem 0.9rem 0.6rem 2.4rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-card);
            font-size: 0.9rem;
            color: var(--color-text-primary);
            transition: border-color var(--transition-fast);
        }
        .search-wrapper input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
        }
        .filter-select {
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg-card);
            font-size: 0.9rem;
            color: var(--color-text-primary);
            min-width: 150px;
            cursor: pointer;
        }
        .filter-select:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        /* Works Grid */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
        }
        .work-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .work-cover {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, var(--color-accent) 0%, #A68B6A 50%, #C4A97D 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .work-cover-placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-size: 3rem;
        }
        .work-status-badge {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .badge-published {
            background: rgba(93, 156, 89, 0.9);
            color: #fff;
        }
        .badge-draft {
            background: rgba(212, 168, 83, 0.9);
            color: #fff;
        }
        .badge-review {
            background: rgba(82, 139, 190, 0.9);
            color: #fff;
        }
        .work-body {
            padding: var(--spacing-md) var(--spacing-lg);
        }
        .work-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .work-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }
        .work-stats span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .work-updated {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            margin-bottom: 0.75rem;
        }
        .work-actions {
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid var(--color-border);
            padding-top: 0.75rem;
        }
        .work-action-btn {
            flex: 1;
            padding: 0.45rem 0.5rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--color-text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: all var(--transition-fast);
            text-decoration: none;
        }
        .work-action-btn:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .work-action-btn.btn-delete:hover {
            border-color: var(--color-error);
            color: var(--color-error);
            background: rgba(199, 93, 93, 0.05);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-text-secondary);
        }
        .empty-state i.empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
            display: block;
        }
        .empty-state h3 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--color-text-primary);
        }
        .empty-state p {
            margin-bottom: 1.5rem;
        }
        .empty-state .btn-create {
            display: inline-flex;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .works-grid {
                grid-template-columns: 1fr;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: var(--spacing-sm);
            }
            .stat-card {
                padding: var(--spacing-sm) var(--spacing-md);
            }
            .stat-value {
                font-size: 1.4rem;
            }
            .filter-bar {
                flex-direction: column;
            }
        }

            </div>
        </div>

            getStarted: { en: 'Get Started', ja: '新規登録', zh: '开始使用', es: 'Comenzar', fr: 'Commencer', de: 'Loslegen', ko: '시작하기', ar: 'ابدأ الآن', pt: 'Começar', it: 'Inizia' },
            // --- Dropdown menu items ---
            // --- Footer ---
            footerHelp: { en: 'Help', ja: 'ヘルプ', zh: '帮助', es: 'Ayuda', fr: 'Aide', de: 'Hilfe', ko: '도움말', ar: 'مساعدة', pt: 'Ajuda', it: 'Aiuto' },
            footerTerms: { en: 'Terms', ja: '利用規約', zh: '条款', es: 'Términos', fr: 'Conditions', de: 'Bedingungen', ko: '약관', ar: 'الشروط', pt: 'Termos', it: 'Termini' },
            footerPrivacy: { en: 'Privacy', ja: 'プライバシー', zh: '隐私', es: 'Privacidad', fr: 'Confidentialité', de: 'Datenschutz', ko: '개인정보', ar: 'الخصوصية', pt: 'Privacidade', it: 'Privacy' }
        };

        // ========== Works Data ==========
        let works = [];

        // ========== Shared Helpers ==========
        function getL(obj, replacements) {
            if (!obj) return '';
            var lang = getCurrentLanguage();
            var text = obj[lang] || obj['en'] || '';
            if (replacements) {
                Object.keys(replacements).forEach(function(key) {
                    text = text.replace('{' + key + '}', replacements[key]);
                });
            }
            return text;
        }

        // ========== Navbar Functions (Pattern C) ==========
        function updateUIText() {




            var els = {














            };
            Object.keys(els).forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.textContent = getL(els[id]);
            });
        }

        // ========== Page Functions ==========
        function changeLanguage(lang) {
            localStorage.setItem('preferredLanguage', lang);
            var desktopSel = document.getElementById('languageSelector');
            var mobileSel = document.getElementById('languageSelectorMobile');
            if (desktopSel) desktopSel.value = lang;
            if (mobileSel) mobileSel.value = lang;
            updateAllText();
            updateUIText();
        }

        function updateAllText() {
            document.title = getL(uiText.pageTitle) + ' - AuctLect';
            if (typeof i18n !== 'undefined') i18n.applyToDOM();
            renderWorks();
        }

        // ========== Demo Data ==========
        function getDemoWorks() {
            return [
                {
                    id: 1,
                    title: 'The Midnight Garden',
                    status: 'published',
                    views: 12450,
                    likes: 834,
                    chapters: 24,
                    updatedAt: '2026-02-28',
                    cover: null
                },
                {
                    id: 2,
                    title: '星降る夜の物語',
                    status: 'published',
                    views: 8920,
                    likes: 612,
                    chapters: 18,
                    updatedAt: '2026-03-01',
                    cover: null
                },
                {
                    id: 3,
                    title: 'Digital Horizons',
                    status: 'draft',
                    views: 0,
                    likes: 0,
                    chapters: 7,
                    updatedAt: '2026-03-04',
                    cover: null
                },
                {
                    id: 4,
                    title: 'Crimson Echoes',
                    status: 'review',
                    views: 340,
                    likes: 28,
                    chapters: 12,
                    updatedAt: '2026-02-20',
                    cover: null
                }
            ];
        }

        // getAiBadgeLabel は navbar.js の共通版を使用

        // ========== Load Works ==========
        async function loadMyWorks() {
            var isDemo = window.location.search.indexOf('demo') !== -1;
            if (isDemo) {
                works = getDemoWorks();
                updateStats();
                renderWorks();
                return;
            }

            var token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/works/my', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.error || ('HTTP ' + resp.status));
                }
                works = (data.works || []).map(function(w) {
                    return {
                        id: w.work_id,
                        title: w.title,
                        status: w.status,
                        cover: w.cover_image || w.cover_image_url || null,
                        views: w.view_count || 0,
                        likes: w.like_count || 0,
                        chapters: w.page_count || 0,
                        aiText: w.ai_text_usage || 'none',
                        aiCover: w.ai_cover_usage || 'none',
                        updatedAt: w.updated_at ? String(w.updated_at).slice(0, 10) : '-'
                    };
                });
            } catch (err) {
                console.error('Failed to load works:', err);
                alert(getL({ en: 'Failed to load your works: ', ja: '作品の読み込みに失敗しました: ' }) + err.message);
                works = [];
            }
            updateStats();
            renderWorks();
        }

        // ========== Update Stats ==========
        function updateStats() {
            var total = works.length;
            var publishedCount = works.filter(function(w) { return w.status === 'published'; }).length;
            var draftCount = works.filter(function(w) { return w.status === 'draft'; }).length;
            var totalViews = works.reduce(function(sum, w) { return sum + (w.views || 0); }, 0);

            var statTotalValue = document.getElementById('statTotalValue');
            var statPublishedValue = document.getElementById('statPublishedValue');
            var statDraftValue = document.getElementById('statDraftValue');
            var statViewsValue = document.getElementById('statViewsValue');

            if (statTotalValue) statTotalValue.textContent = total;
            if (statPublishedValue) statPublishedValue.textContent = publishedCount;
            if (statDraftValue) statDraftValue.textContent = draftCount;
            if (statViewsValue) statViewsValue.textContent = totalViews.toLocaleString();
        }

        // ========== Render Works ==========
        function renderWorks() {
            var grid = document.getElementById('worksGrid');
            var emptyState = document.getElementById('emptyState');
            var filtered = getFilteredWorks();

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            grid.innerHTML = filtered.map(function(work) {
                var statusClass = work.status === 'published' ? 'badge-published'
                    : work.status === 'draft' ? 'badge-draft' : 'badge-review';
                var statusText = work.status === 'published' ? getL(uiText.published)
                    : work.status === 'draft' ? getL(uiText.draft) : getL(uiText.filterReview);
                var coverIcon = work.status === 'draft' ? 'fa-pencil-alt'
                    : work.status === 'review' ? 'fa-hourglass-half' : 'fa-book-open';

                var aiLabel = getAiBadgeLabel(work.aiText, work.aiCover);
                return '<div class="work-card">'
                    + '<div class="work-cover" style="position:relative;">'
                    + (work.cover
                        ? '<img src="' + work.cover + '" alt="' + work.title + '" style="width:100%;height:100%;object-fit:cover;">'
                        : '<i class="fas ' + coverIcon + ' work-cover-placeholder"></i>')
                    + '<span class="work-status-badge ' + statusClass + '">' + statusText + '</span>'
                    + (aiLabel
                        ? '<span style="position:absolute; bottom:8px; left:8px; right:8px; text-align:center; padding:0.25rem 0.4rem; border-radius:6px; font-size:0.72rem; font-weight:600; background:rgba(40,50,80,0.85); color:#fff;"><i class="fas fa-robot me-1"></i>' + aiLabel + '</span>'
                        : '')
                    + '</div>'
                    + '<div class="work-body">'
                    + '<div class="work-title" dir="auto" title="' + work.title + '">' + work.title + '</div>'
                    + '<div class="work-stats">'
                    + '<span><i class="fas fa-eye"></i> ' + (work.views || 0).toLocaleString() + ' ' + getL(uiText.views) + '</span>'
                    + '<span><i class="fas fa-heart"></i> ' + (work.likes || 0).toLocaleString() + ' ' + getL(uiText.likes) + '</span>'
                    + '<span><i class="fas fa-list-ol"></i> ' + (work.chapters || 0) + ' ' + getL(uiText.chapters) + '</span>'
                    + '</div>'
                    + '<div class="work-updated"><i class="fas fa-clock me-1"></i>' + getL(uiText.lastUpdated) + ': ' + (work.updatedAt || '-') + '</div>'
                    + '<div class="work-actions">'
                    + '<a href="upload.html?edit=' + work.id + '" class="work-action-btn"><i class="fas fa-edit"></i> ' + getL(uiText.edit) + '</a>'
                    + '<a href="reader.html?workId=' + work.id + '" class="work-action-btn"><i class="fas fa-external-link-alt"></i> ' + getL(uiText.view) + '</a>'
                    + '<a href="feedback/index.html?workId=' + work.id + '" class="work-action-btn"><i class="fas fa-comment-dots"></i> ' + getL(uiText.feedbackBtn) + '</a>'
                    + '<button class="work-action-btn btn-delete" onclick="deleteWork(\'' + work.id + '\')"><i class="fas fa-trash-alt"></i> ' + getL(uiText.deleteBtn) + '</button>'
                    + '</div>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        // ========== Filter Works ==========
        function getFilteredWorks() {
            var filtered = works.slice();
            var searchQuery = (document.getElementById('searchInput').value || '').toLowerCase();
            var statusFilter = (document.getElementById('statusFilter').value || 'all');

            if (statusFilter !== 'all') {
                filtered = filtered.filter(function(w) { return w.status === statusFilter; });
            }

            if (searchQuery) {
                filtered = filtered.filter(function(w) {
                    return w.title.toLowerCase().indexOf(searchQuery) !== -1;
                });
            }

            return filtered;
        }

        function filterWorks() {
            renderWorks();
        }

        // ========== Delete Work ==========
        async function deleteWork(id) {
            var confirmMsg = getL(uiText.deleteConfirm);
            if (!confirm(confirmMsg)) return;

            try {
                var token = localStorage.getItem('token');
                var resp = await fetch((window.API_ORIGIN || '') + '/api/works/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.error || ('HTTP ' + resp.status));
                }
                works = works.filter(function(w) { return w.id !== id; });
                updateStats();
                renderWorks();
            } catch (err) {
                alert(getL({ en: 'Delete failed: ', ja: '削除に失敗しました: ' }) + err.message);
            }
        }

        // ========== Initialization ==========
        document.addEventListener('DOMContentLoaded', function() {
            var desktopSelector = document.getElementById('languageSelector');
            var mobileSelector = document.getElementById('languageSelectorMobile');

            if (desktopSelector && mobileSelector) {
                var savedLang = localStorage.getItem('preferredLanguage') || 'en';
                desktopSelector.value = savedLang;
                mobileSelector.value = savedLang;

                mobileSelector.addEventListener('change', function() {
                    desktopSelector.value = this.value;
                    if (typeof changeLanguage === 'function') changeLanguage(this.value);
                    updateUIText();
                });

                desktopSelector.addEventListener('change', function() {
                    mobileSelector.value = this.value;
                    if (typeof changeLanguage === 'function') changeLanguage(this.value);
                    updateUIText();
                });
            }

            loadMyWorks();
            updateAllText();
            updateUIText();
document.addEventListener('languageChanged', function() {
                updateAllText();
                updateUIText();
            });

            if (typeof i18n !== 'undefined') {
                i18n.onLanguageChange(function() {
                    i18n.applyToDOM();
                    renderWorks();
                });
            }

            // Close user dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.user-dropdown')) {
                    var dropdown = document.getElementById('userDropdown');
                    var dropdownMenu = document.getElementById('userMenu');
                    if (dropdown) dropdown.classList.remove('open');
                    if (dropdownMenu) dropdownMenu.classList.remove('show');
                }
            });

            // Navbar mobile menu overlay
            var navbarCollapse = document.getElementById('navbarNav');
            var navbarOverlay = document.getElementById('navbarOverlay');
            if (navbarCollapse && navbarOverlay) {
                navbarCollapse.addEventListener('show.bs.collapse', function() {
                    navbarOverlay.classList.add('active');
                });
                navbarCollapse.addEventListener('hide.bs.collapse', function() {
                    navbarOverlay.classList.remove('active');
                });
                navbarOverlay.addEventListener('click', function() {
                    var bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                    if (bsCollapse) bsCollapse.hide();
                });
            }
        });
    </script>
</body>
</html>
