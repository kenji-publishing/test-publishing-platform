    <style>
        /* ========== Pattern C: Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }

        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }

        /* ========== Pattern C: PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }

        /* ========== Pattern C: Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }

        /* ========== Pattern C: User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1001;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {

        }

        .logout-btn:hover {

    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-md);
            padding-top: calc(56px + var(--spacing-xl));
        }

        .register-card {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 480px;
            padding: var(--spacing-2xl);
        }

        .register-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .register-header .logo {
            font-family: var(--font-heading);
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--color-accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .register-header h1 {
            font-size: var(--font-size-xl);
            margin-bottom: var(--spacing-xs);
        }

        .register-header p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin: 0;
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
        }

        .form-control {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 16px;
            color: var(--color-text-primary);
            transition: all var(--transition-fast);
        }

        .form-control:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: var(--color-text-light);
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-light);
        }

        .input-group .form-control {
            padding-left: 2.5rem;
        }

        .password-toggle {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-light);
            cursor: pointer;
            padding: 0;
        }

        .password-toggle:hover {
            color: var(--color-accent);
        }

        .role-selector {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .role-option {
            flex: 1;
            text-align: center;
            padding: var(--spacing-md);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .role-option:hover {
            border-color: var(--color-accent-light);
            background-color: var(--color-bg-hover);
        }

        .role-option.selected {
            border-color: var(--color-accent);
            background-color: rgba(139, 115, 85, 0.1);
        }

        .role-option i {
            font-size: 1.5rem;
            color: var(--color-accent);
            margin-bottom: var(--spacing-xs);
        }

        .role-option .role-title {
            font-weight: 600;
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
        }

        .role-option .role-desc {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
        }

        .form-check-input:checked {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
        }

        .form-check-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .form-check-label a {
            color: var(--color-accent);
        }

        .btn-register {
            width: 100%;
            background-color: var(--color-accent);
            border: none;
            color: white;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: var(--font-size-base);
            transition: all var(--transition-fast);
        }

        .btn-register:hover {
            background-color: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: var(--spacing-lg) 0;
            color: var(--color-text-light);
            font-size: var(--font-size-sm);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--color-border);
        }

        .divider span {
            padding: 0 var(--spacing-md);
        }

        .social-buttons {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: var(--color-bg-card);
            color: var(--color-text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: var(--font-size-sm);
            transition: all var(--transition-fast);
        }

        .btn-social:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background-color: var(--color-bg-hover);
        }

        .login-link {
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .login-link a {
            color: var(--color-accent);
            font-weight: 500;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-strength {
            height: 4px;
            background-color: var(--color-border);
            border-radius: 2px;
            margin-top: var(--spacing-xs);
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all var(--transition-fast);
        }

        .password-strength-bar.strength-weak {
            width: 33%;
            background-color: var(--color-error);
        }

        .password-strength-bar.strength-medium {
            width: 66%;
            background-color: var(--color-warning);
        }

        .password-strength-bar.strength-strong {
            width: 100%;
            background-color: var(--color-success);
        }

        @media (max-width: 576px) {
            .register-card {
                padding: var(--spacing-lg);
            }

            .role-selector {
                flex-direction: column;
            }
        }
    </style>
</head>

    <div class="register-container">
        <div class="register-card">
            <!-- Header -->
            <div class="register-header">
                <a href="../index.html" class="logo">
                    <i class="fas fa-book-open"></i>

                </a>
                <h1 data-i18n="register.title">Create Your Account</h1>
                <p data-i18n="register.subtitle">Join thousands of readers and creators worldwide</p>

            <!-- Role Selector -->
            <div class="role-selector">
                <div class="role-option selected" data-role="reader" onclick="selectRole('reader')">
                    <i class="fas fa-book-reader d-block"></i>
                    <div class="role-title" data-i18n="register.roles.reader">Reader</div>
                    <div class="role-desc" data-i18n="register.roles.readerDesc">Discover stories</div>
                </div>
                <div class="role-option" data-role="author" onclick="selectRole('author')">

                    <div class="role-desc" data-i18n="register.roles.authorDesc">Write & publish</div>

                    <div class="role-desc" data-i18n="register.roles.translatorDesc">Translate works</div>

            </p>

            <form id="registerForm">

                <div class="row">
                    <div class="col-6">
                        <div class="form-group">

                            <input type="text" class="form-control" id="firstName" data-i18n-placeholder="register.firstNamePlaceholder" placeholder="First name" required>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group">
                            <label class="form-label" for="lastName" data-i18n="register.lastName">Last Name</label>
                            <input type="text" class="form-control" id="lastName" data-i18n-placeholder="register.lastNamePlaceholder" placeholder="Last name" required>

                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="login.email">Email Address</label>

                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            data-i18n-placeholder="login.emailPlaceholder"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="login.password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>

                            placeholder="Create a password"

                        <option value="fr">🇫🇷 Français</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="ar">🇸🇦 العربية</option>

    <!-- 翻訳ベース（共通関数） -->
    <!-- 言語切替機能 -->
    
    
    <!-- (Broken "Navbar Script (Simplified)" block removed: stray braces made
         it a SyntaxError and navbar.js already handles selector sync.) -->

    <script>
        // Preferred Language Selector Sync
        document.addEventListener('DOMContentLoaded', function() {
            const currentLang = localStorage.getItem('preferredLanguage') || 'en';
            const prefLangSelector = document.getElementById('preferredLanguage');
            
            if (prefLangSelector) {
                prefLangSelector.value = currentLang;
            }
        });

        // Role selection
        function selectRole(role) {
            document.querySelectorAll('.role-option').forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`[data-role="${role}"]`).classList.add('selected');
            document.getElementById('selectedRole').value = role;
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Password strength checker
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('strengthBar');
            
            strengthBar.className = 'password-strength-bar';
            
            if (password.length === 0) {
                strengthBar.style.width = '0%';
                return;
            }
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            if (strength <= 1) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 2) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        }

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('selectedRole').value,
                preferredLanguage: document.getElementById('preferredLanguage').value
            };
            
            try {
                const response = await fetch((window.API_ORIGIN || '') + '/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();

                if (response.ok) {
                    if (data.emailSent === false) {
                        // アカウントは作成済みだが確認メールの送信に失敗（ログイン画面から再送可能）
                        alert('アカウントを作成しましたが、確認メールの送信に失敗しました。ログイン画面の「確認メールを再送」からお試しください。\n\nYour account was created but the verification email failed to send. Use "Resend verification email" on the login page.');
                    } else {
                        alert('確認メールを ' + formData.email + ' に送信しました。\nメール内のリンクをクリックすると登録が完了し、ログインできるようになります。\n（迷惑メールフォルダもご確認ください）\n\nA verification email has been sent. Click the link in the email to activate your account.');
                    }
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('Connection error. Please make sure the server is running.');
            }
        });
    </script>

    <!-- ========== Google Sign-In ==========
         login.htmlと同じIDトークン方式。新規・既存どちらでも同じエンドポイントが
         受け付ける（未登録なら自動でアカウント作成、既存なら紐付けてログイン）。 -->
    <script>
    (function () {
        var L = { ja: 'ja', en: 'en', zh: 'zh_CN', es: 'es', fr: 'fr', de: 'de', ko: 'ko', ar: 'ar', pt: 'pt_BR', it: 'it' };

        function currentLang() {
            try {
                if (typeof getCurrentLanguage === 'function') return getCurrentLanguage();
            } catch (e) {}
            return localStorage.getItem('preferredLanguage') || 'en';
        }

        function showError(msg) {
            var el = document.getElementById('googleError');
            if (el) { el.textContent = msg; el.style.display = ''; }
        }

        window.handleGoogleCredential = async function (response) {
            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                var data = await resp.json();
                if (!resp.ok) {
                    showError(data.message || data.error || 'Google sign-in failed');
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'dashboard.html';
            } catch (e) {
                showError('Connection error. Please try again later.');
            }
        };

        function initGoogle() {
            if (!window.google || !google.accounts || !google.accounts.id) return;
            var clientId = window.GOOGLE_CLIENT_ID;
            if (!clientId) return;
            try {
                google.accounts.id.initialize({
                    client_id: clientId,
                    callback: window.handleGoogleCredential
                });
                google.accounts.id.renderButton(document.getElementById('googleBtn'), {
                    theme: 'outline',
                    size: 'large',
                    width: 320,
                    text: 'signup_with',
                    locale: L[currentLang()] || 'en'
                });
                document.getElementById('googleBlock').style.display = '';
            } catch (e) {
                console.warn('Google Sign-In init failed:', e);
            }
        }

        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.defer = true;
        s.onload = initGoogle;
        s.onerror = function () { console.warn('Google Sign-In script could not be loaded'); };
        document.head.appendChild(s);
    })();
    </script>
