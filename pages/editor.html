    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        @media (max-width: 1199.98px) {
            .navbar-lang-selector { order: 1; }
            .navbar-toggler { order: 2; }
        }

        /* ========== PC Navbar ========== */
        @media (min-width: 1200px) {
            .navbar-nav { flex-wrap: wrap !important; flex-direction: row !important; }
            .navbar-nav .nav-item { white-space: nowrap !important; }
            .navbar-nav .nav-link { white-space: nowrap !important; padding: 0.5rem 0.6rem !important; font-size: 0.9rem; }

            .dropdown-menu { white-space: nowrap; }
            .navbar-buttons-guest { display: flex !important; flex-wrap: nowrap !important; gap: 0.5rem; }
            .navbar-buttons-guest .btn { white-space: nowrap !important; flex-shrink: 0; }
        }

        /* ========== Auth Visibility Control ========== */
        .auth-only { display: none !important; }
        .guest-only { display: block; }
        body.logged-in .auth-only { display: block !important; }
        body.logged-in .auth-only.nav-item { display: list-item !important; }
        body.logged-in .auth-only.dropdown { display: block !important; }
        body.logged-in .guest-only { display: none !important; }
        @media (min-width: 1200px) {
            body.logged-in .navbar-buttons-guest { display: none !important; }
        }

        /* ========== User Dropdown Menu ========== */
        .user-dropdown { position: relative; }
        .user-dropdown-toggle {
            display: flex; align-items: center; gap: 0.5rem;
            background: transparent; border: 1px solid var(--color-border);
            border-radius: 25px; padding: 0.4rem 0.75rem;
            cursor: pointer; color: var(--color-text); transition: all 0.2s;
        }
        .user-dropdown-toggle:hover { border-color: var(--color-accent); background: rgba(139, 115, 85, 0.05); }
        .user-dropdown-toggle i:first-child { font-size: 1.25rem; color: var(--color-accent); }
        .user-name { font-weight: 500; font-size: 0.9rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-chevron { font-size: 0.7rem; color: var(--color-text-secondary); transition: transform 0.2s; }
        .user-dropdown.open .user-chevron { transform: rotate(180deg); }
        .user-menu {
            position: absolute; top: calc(100% + 0.5rem); right: 0;
            background: var(--color-bg-card); border: 1px solid var(--color-border);
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px; z-index: 1001; display: none; overflow: hidden;
        }
        .user-menu.show { display: block; }
        .user-menu-header { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: var(--color-bg-main); }
        .user-avatar { font-size: 2.5rem; color: var(--color-accent); }
        .user-info { flex: 1; min-width: 0; }
        .user-display-name { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-email { font-size: 0.8rem; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-menu-divider { height: 1px; background: var(--color-border); }
        .user-menu-item {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
            color: var(--color-text); text-decoration: none; font-size: 0.9rem;
            cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
        }
        .user-menu-item:hover { background: var(--color-bg-hover); color: var(--color-accent); }
        .user-menu-item i { width: 20px; text-align: center; color: var(--color-text-secondary); }
        .user-menu-item:hover i { color: var(--color-accent); }
        .logout-btn { color: var(--color-error); }
        .logout-btn i { color: var(--color-error); }
        .logout-btn:hover { background: rgba(199, 93, 93, 0.1); color: var(--color-error); }

        /* ===== Editor Mobile Responsive ===== */
        @media (max-width: 1199.98px) {

            .secondary-toolbar { padding: 0.5rem 0.5rem; }
            .editor-footer { padding: 0.4rem 0.5rem; }
            .editor-main { max-width: 100%; }
        }
        /* Ensure navbar stays above overlay */
        .navbar-custom { z-index: 1050; }

        .editor-toolbar {
            position: sticky; top: 56px; z-index: 1030; background: #fff;
            border-bottom: 1px solid #dee2e6; padding: 0.4rem 1rem;
            display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem;
            max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .toolbar-group {
            display: flex; align-items: center; gap: 2px;
            padding: 0 0.4rem; border-right: 1px solid #e0e0e0;
        }
        .toolbar-group:last-child { border-right: none; }
        .toolbar-btn {
            width: 32px; height: 32px; border: none; background: none; border-radius: 4px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 0.85rem; transition: background 0.15s, color 0.15s;
        }
        .toolbar-btn:hover { background: #e9ecef; color: #333; }
        .toolbar-btn.active { background: #d4edda; color: #155724; }
        .toolbar-select {
            height: 32px; font-size: 0.8rem; border: 1px solid #dee2e6;
            border-radius: 4px; padding: 0 0.5rem; background: #fff; cursor: pointer;
        }

        .secondary-toolbar {
            position: sticky; top: 100px; z-index: 1029; background: #f8f9fa;
            border-bottom: 1px solid #dee2e6; padding: 0.5rem 1rem;
            display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
            overflow: hidden; max-width: 100%; box-sizing: border-box;
        }
        .title-input {
            flex: 1; min-width: 0; border: 1px solid transparent; background: transparent;

            outline: none; transition: border-color 0.2s;
        }
        .title-input:focus { border-color: #8B7355; background: #fff; }
        .save-status { font-size: 0.8rem; color: #6c757d; white-space: nowrap; }
        .save-status i { margin-right: 4px; }
        .save-status.saved { color: #28a745; }
        .save-status.saving { color: #ffc107; }
        .save-status.error { color: #dc3545; }

        .editor-content-area { flex: 1; padding: 2rem; max-width: 100%; min-width: 0; }

    <!-- ========== STEP 3: MINIMAL EDITOR (all functions called by HTML onclick) ========== -->
    <script>
    /* Editor command - called by toolbar onclick */
    function execCmd(cmd, val) {
        document.execCommand(cmd, false, val || null);
        document.getElementById('editorArea').focus();
        countWords();
        showUnsaved();
    }

    /* Word count - no regex, pure char-code loop */
    function countWords() {
        var area = document.getElementById('editorArea');
        if (!area) return;
        var text = area.innerText || '';
        var chars = text.length;
        var trimmed = text.trim();
        var words = 0;
        if (trimmed.length > 0) {
            var inWord = false;
            for (var i = 0; i < trimmed.length; i++) {
                var ch = trimmed.charCodeAt(i);
                var isSpace = (ch === 32 || ch === 10 || ch === 13 || ch === 9);
                if (!isSpace && !inWord) { words++; inWord = true; }
                if (isSpace) { inWord = false; }
            }
        }
        var pages = Math.max(1, Math.ceil(words / 250));
        var cc = document.getElementById('charCount');
        var wc = document.getElementById('wordCount');
        var pc = document.getElementById('pageCount');
        if (cc) cc.textContent = chars;
        if (wc) wc.textContent = words;
        if (pc) pc.textContent = pages;
    }

    /* Save status */
    var _saveTimer = null;
    function showUnsaved() {
        var st = document.getElementById('saveStatus');
        var tx = document.getElementById('saveStatusText');
        if (!st || !tx) return;
        st.className = 'save-status';
        tx.textContent = (window.i18n ? i18n.t('editor.unsaved') : 'Unsaved');
        st.querySelector('i').className = 'fas fa-exclamation-circle';
        clearTimeout(_saveTimer);
        _saveTimer = setTimeout(doAutoSave, 2000);
    }
    function doAutoSave() {
        var st = document.getElementById('saveStatus');
        var tx = document.getElementById('saveStatusText');
        if (!st || !tx) return;
        st.className = 'save-status saving';
        tx.textContent = (window.i18n ? i18n.t('editor.saving') : 'Saving...');
        st.querySelector('i').className = 'fas fa-spinner fa-spin';
        // 下書きをブラウザ（localStorage）に保存。次回開いたとき復元される
        try {
            var area = document.getElementById('editorArea');
            localStorage.setItem('editorDraft', JSON.stringify({
                title: document.getElementById('workTitle').value || '',
                html: area ? area.innerHTML : '',
                updatedAt: new Date().toISOString()
            }));
        } catch (e) { console.error('Draft save failed:', e); }
        setTimeout(function() {
            st.className = 'save-status saved';
            tx.textContent = (window.i18n ? i18n.t('editor.saved') : 'Saved');
            st.querySelector('i').className = 'fas fa-check-circle';
        }, 600);
    }

    /* 前回の下書きを復元 */
    function restoreDraft() {
        try {
            var draft = JSON.parse(localStorage.getItem('editorDraft') || 'null');
            if (!draft) return;
            if (draft.title) document.getElementById('workTitle').value = draft.title;
            if (draft.html) document.getElementById('editorArea').innerHTML = draft.html;
        } catch (e) { console.error('Draft restore failed:', e); }
    }

    /* Export as plain text - called by Export button onclick */
    function doExportTXT() {
        var title = document.getElementById('workTitle').value || (window.i18n ? i18n.t('editor.untitled') : 'Untitled');
        var area = document.getElementById('editorArea');
        var NL = String.fromCharCode(10);
        var text = title + NL + NL + (area ? area.innerText : '');
        var blob = new Blob([text], { type: 'text/plain' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = title + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    }

    /* Publish - 原稿をアップロードページへ引き渡す */
    function doPublish() {
        var area = document.getElementById('editorArea');
        var text = area ? area.innerText.trim() : '';
        if (!text) {
            alert(window.i18n ? i18n.t('editor.placeholder') : 'Start writing your story...');
            return;
        }
        try {
            localStorage.setItem('editorDraftForUpload', JSON.stringify({
                title: document.getElementById('workTitle').value || '',
                text: text
            }));
        } catch (e) {
            console.error('Handoff failed:', e);
            return;
        }
        window.location.href = 'upload.html?from=editor';
    }

    /* Initial word count on page load */
    document.addEventListener('DOMContentLoaded', function() {
        restoreDraft();
        countWords();
    });
    </script>

</body>
