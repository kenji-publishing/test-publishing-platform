    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Noto+Serif+JP:wght@400;600;700&amp;display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        @media (max-width: 991.98px) {
            .navbar-lang-selector { order: 1; }
            .navbar-toggler { order: 2; }
        }

        /* ========== PC Navbar ========== */
        @media (min-width: 992px) {
            .navbar-nav { flex-wrap: nowrap !important; flex-direction: row !important; }
            .navbar-nav .nav-item { white-space: nowrap !important; }
            .navbar-nav .nav-link { white-space: nowrap !important; padding: 0.5rem 0.6rem !important; font-size: 0.9rem; }

            .dropdown-menu { white-space: nowrap; }
            .navbar-buttons-guest { display: flex !important; flex-wrap: nowrap !important; gap: 0.5rem; }
            .navbar-buttons-guest .btn { white-space: nowrap !important; flex-shrink: 0; }
        }

        /* ========== Auth Visibility Control ========== */
        .auth-only { display: none !important; }
        .guest-only { display: block; }
        body.logged-in .auth-only { display: block !important; }
        body.logged-in .auth-only.nav-item { display: list-item !important; }
        body.logged-in .auth-only.dropdown { display: block !important; }
        body.logged-in .guest-only { display: none !important; }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest { display: none !important; }
        }

        /* ========== User Dropdown Menu ========== */
        .user-dropdown { position: relative; }
        .user-dropdown-toggle {
            display: flex; align-items: center; gap: 0.5rem;
            background: transparent; border: 1px solid var(--color-border);
            border-radius: 25px; padding: 0.4rem 0.75rem;
            cursor: pointer; color: var(--color-text); transition: all 0.2s;
        }
        .user-dropdown-toggle:hover { border-color: var(--color-accent); background: rgba(139, 115, 85, 0.05); }
        .user-dropdown-toggle i:first-child { font-size: 1.25rem; color: var(--color-accent); }
        .user-name { font-weight: 500; font-size: 0.9rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-chevron { font-size: 0.7rem; color: var(--color-text-secondary); transition: transform 0.2s; }
        .user-dropdown.open .user-chevron { transform: rotate(180deg); }
        .user-menu {
            position: absolute; top: calc(100% + 0.5rem); right: 0;
            background: var(--color-bg-card); border: 1px solid var(--color-border);
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px; z-index: 1001; display: none; overflow: hidden;
        }
        .user-menu.show { display: block; }
        .user-menu-header { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: var(--color-bg-main); }
        .user-avatar { font-size: 2.5rem; color: var(--color-accent); }
        .user-info { flex: 1; min-width: 0; }
        .user-display-name { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-email { font-size: 0.8rem; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-menu-divider { height: 1px; background: var(--color-border); }
        .user-menu-item {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
            color: var(--color-text); text-decoration: none; font-size: 0.9rem;
            cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
        }
        .user-menu-item:hover { background: var(--color-bg-hover); color: var(--color-accent); }
        .user-menu-item i { width: 20px; text-align: center; color: var(--color-text-secondary); }
        .user-menu-item:hover i { color: var(--color-accent); }
        .logout-btn { color: var(--color-error); }
        .logout-btn i { color: var(--color-error); }
        .logout-btn:hover { background: rgba(199, 93, 93, 0.1); color: var(--color-error); }

        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Adjustments ========== */
        @media (max-width: 991.98px) {

        }

        /* ========================================================
           EDITOR STYLES
           ======================================================== */
        /* ===== Editor Mobile Responsive ===== */
        @media (max-width: 991.98px) {
            .editor-content-area { padding: 1rem 0.5rem; }
            .editor-paper { padding: 1.5rem 1rem; max-width: 100%; word-wrap: break-word; }
            .editor-toolbar { padding: 0.4rem 0.25rem; }
            .secondary-toolbar { padding: 0.5rem 0.5rem; }
            .editor-footer { padding: 0.4rem 0.5rem; }
            .editor-main { max-width: 100%; }
        }
        /* Ensure navbar stays above overlay */
        .navbar-custom { z-index: 1050; }

        .editor-toolbar {
            position: sticky; top: 56px; z-index: 1030; background: #fff;
            border-bottom: 1px solid #dee2e6; padding: 0.4rem 1rem;
            display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem;
            max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .toolbar-group {
            display: flex; align-items: center; gap: 2px;
            padding: 0 0.4rem; border-right: 1px solid #e0e0e0;
        }
        .toolbar-group:last-child { border-right: none; }
        .toolbar-btn {
            width: 32px; height: 32px; border: none; background: none; border-radius: 4px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 0.85rem; transition: background 0.15s, color 0.15s;
        }
        .toolbar-btn:hover { background: #e9ecef; color: #333; }
        .toolbar-btn.active { background: #d4edda; color: #155724; }
        .toolbar-select {
            height: 32px; font-size: 0.8rem; border: 1px solid #dee2e6;
            border-radius: 4px; padding: 0 0.5rem; background: #fff; cursor: pointer;
        }

        .secondary-toolbar {
            position: sticky; top: 100px; z-index: 1029; background: #f8f9fa;
            border-bottom: 1px solid #dee2e6; padding: 0.5rem 1rem;
            display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
            overflow: hidden; max-width: 100%; box-sizing: border-box;
        }
        .title-input {
            flex: 1; min-width: 0; border: 1px solid transparent; background: transparent;
            font-size: 1rem; font-weight: 600; padding: 0.3rem 0.5rem; border-radius: 4px;
            outline: none; transition: border-color 0.2s;
        }
        .title-input:focus { border-color: #8B7355; background: #fff; }
        .save-status { font-size: 0.8rem; color: #6c757d; white-space: nowrap; }
        .save-status i { margin-right: 4px; }
        .save-status.saved { color: #28a745; }
        .save-status.saving { color: #ffc107; }
        .save-status.error { color: #dc3545; }

        .editor-main { display: flex; flex: 1; max-width: 100%; overflow: hidden; }
        .editor-content-area { flex: 1; padding: 2rem; max-width: 100%; min-width: 0; }
        .editor-paper {
            max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #dee2e6;
            border-radius: 8px; padding: 3rem 2.5rem; min-height: 600px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06); outline: none;
            font-family: 'Noto Serif JP', serif; font-size: 1.05rem; line-height: 1.8; color: #333;
        }
        .editor-paper:focus { border-color: #8B7355; box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.15); }
        .editor-paper:empty::before { content: attr(data-placeholder); color: #adb5bd; pointer-events: none; }

        .editor-footer { background: #fff; border-top: 1px solid #dee2e6; padding: 0.4rem 1rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #6c757d; overflow: hidden; }
        .footer-stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }

        @media (max-width: 991.98px) {
            .editor-paper { padding: 1.5rem 1rem; }
            .toolbar-group { padding: 0 0.2rem; }
        }
        @media (max-width: 575.98px) {
            .secondary-toolbar { flex-direction: column; align-items: stretch; }
            .title-input { min-width: auto; }
        }

        @keyframes pulse-save { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .save-status.saving i { animation: pulse-save 1s infinite; }
    </style>
</head>
<body>
    <!-- ========== NAVBAR OVERLAY ========== -->
    <div id="navbar-container"></div>

<!-- ========== EDITOR TOOLBAR (onclick direct binding) ========== -->
    <div class="editor-toolbar" id="editorToolbar">
        <div class="toolbar-group">
            <select class="toolbar-select" id="headingSelect" title="Heading" onchange="execCmd('formatBlock', this.value)">
                <option value="p" id="opt-paragraph" data-i18n="editor.paragraph">Paragraph</option>
                <option value="h1" id="opt-h1" data-i18n="editor.h1">Heading 1</option>
                <option value="h2" id="opt-h2" data-i18n="editor.h2">Heading 2</option>
                <option value="h3" id="opt-h3" data-i18n="editor.h3">Heading 3</option>
            </select>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('bold')" title="Bold"><i class="fas fa-bold"></i></button>
            <button class="toolbar-btn" onclick="execCmd('italic')" title="Italic"><i class="fas fa-italic"></i></button>
            <button class="toolbar-btn" onclick="execCmd('underline')" title="Underline"><i class="fas fa-underline"></i></button>
            <button class="toolbar-btn" onclick="execCmd('strikeThrough')" title="Strikethrough"><i class="fas fa-strikethrough"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('justifyLeft')" title="Align Left"><i class="fas fa-align-left"></i></button>
            <button class="toolbar-btn" onclick="execCmd('justifyCenter')" title="Align Center"><i class="fas fa-align-center"></i></button>
            <button class="toolbar-btn" onclick="execCmd('justifyRight')" title="Align Right"><i class="fas fa-align-right"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="Bullet List"><i class="fas fa-list-ul"></i></button>
            <button class="toolbar-btn" onclick="execCmd('insertOrderedList')" title="Numbered List"><i class="fas fa-list-ol"></i></button>
            <button class="toolbar-btn" onclick="execCmd('outdent')" title="Outdent"><i class="fas fa-outdent"></i></button>
            <button class="toolbar-btn" onclick="execCmd('indent')" title="Indent"><i class="fas fa-indent"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('insertHorizontalRule')" title="Horizontal Rule"><i class="fas fa-minus"></i></button>
            <button class="toolbar-btn" onclick="execCmd('formatBlock', 'blockquote')" title="Blockquote"><i class="fas fa-quote-right"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('undo')" title="Undo"><i class="fas fa-undo"></i></button>
            <button class="toolbar-btn" onclick="execCmd('redo')" title="Redo"><i class="fas fa-redo"></i></button>
        </div>
    </div>

    <!-- ========== SECONDARY TOOLBAR ========== -->
    <div class="secondary-toolbar" id="secondaryToolbar">
        <input type="text" class="title-input" id="workTitle" placeholder="Untitled" value="">
        <span class="save-status saved" id="saveStatus">
            <i class="fas fa-check-circle"></i> <span id="saveStatusText" data-i18n="editor.saved">Saved</span>
        </span>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" onclick="doExportTXT()" id="btnExport"><i class="fas fa-file-export me-1"></i><span data-i18n="editor.exportBtn">Export</span></button>
            <button class="btn btn-primary-custom btn-sm" onclick="doPublish()" id="btnPublish"><i class="fas fa-paper-plane me-1"></i><span data-i18n="editor.publishBtn">Publish</span></button>
        </div>
    </div>

    <!-- ========== MAIN EDITOR AREA ========== -->
    <div class="editor-main">
        <div class="editor-content-area">
            <div class="editor-paper" id="editorArea" contenteditable="true" data-placeholder="Start writing your story..." spellcheck="true" oninput="countWords(); showUnsaved();"></div>
        </div>
    </div>

    <!-- ========== EDITOR FOOTER ========== -->
    <div class="editor-footer" id="editorFooter">
        <div class="footer-stats">
            <span><span id="labelChars" data-i18n="editor.characters">Characters</span>: <strong id="charCount">0</strong></span>
            <span><span id="labelWords" data-i18n="editor.words">Words</span>: <strong id="wordCount">0</strong></span>
            <span><span id="labelPages" data-i18n="editor.pages">Pages</span>: <strong id="pageCount">0</strong></span>
        </div>
        <span id="labelLastEdit" data-i18n="editor.lastEdit">Last edit: just now</span>
    </div>

    <div id="footer-container"></div>

    <!-- ========== EXTERNAL SCRIPTS ========== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/lang/ja.js"></script>
    <script src="../js/lang/en.js"></script>
    <script src="../js/lang/zh.js"></script>
    <script src="../js/lang/es.js"></script>
    <script src="../js/lang/fr.js"></script>
    <script src="../js/lang/de.js"></script>
    <script src="../js/lang/ko.js"></script>
    <script src="../js/lang/ar.js"></script>
    <script src="../js/lang/pt.js"></script>
    <script src="../js/lang/it.js"></script>
    <script src="../js/lang/editor-translations.js"></script>
    

    <!-- ========== NAVBAR SCRIPT (Pattern C) ========== -->
    <script>
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.user-dropdown')) {
                var dd = document.getElementById('userDropdown');
                var dm = document.getElementById('userMenu');
                if (dd) dd.classList.remove('open');
                if (dm) dm.classList.remove('show');
            }
        });
        var nc = document.getElementById('navbarNav');
        var no = document.getElementById('navbarOverlay');
        if (nc) {
            nc.addEventListener('show.bs.collapse', function() { if (no) no.classList.add('show'); });
            nc.addEventListener('hide.bs.collapse', function() { if (no) no.classList.remove('show'); });
        }
        if (no) { no.addEventListener('click', function() { var bc = bootstrap.Collapse.getInstance(nc); if (bc) bc.hide(); }); }
    </script>

        lastEdit:       { en: 'Last edit: just now', ja: '\u6700\u7D42\u7DE8\u96C6: \u305F\u3063\u305F\u4ECA', zh: '\u6700\u540E\u7F16\u8F91\uFF1A\u521A\u521A', es: '\u00DAltima edici\u00F3n: ahora', fr: 'Derni\u00E8re modification: maintenant', de: 'Letzte Bearbeitung: gerade eben', ko: '\uB9C8\uC9C0\uB9C9 \uD3B8\uC9D1: \uBC29\uAE08', ar: '\u0622\u062E\u0631 \u062A\u0639\u062F\u064A\u0644: \u0627\u0644\u0622\u0646', pt: '\u00DAltima edi\u00E7\u00E3o: agora' },
    };

    /* ===== Apply placeholder from i18n ===== */
    function applyEditorPlaceholder() {
        var ea = document.getElementById('editorArea');
        if (ea && window.i18n) { ea.setAttribute('data-placeholder', i18n.t('editor.placeholder')); }
    }
    document.addEventListener('DOMContentLoaded', function() { applyEditorPlaceholder(); });
    document.addEventListener('languageChanged', function() { applyEditorPlaceholder(); });
    </script>

    <!-- ========== STEP 3: MINIMAL EDITOR (all functions called by HTML onclick) ========== -->
    <script>
    /* Editor command - called by toolbar onclick */
    function execCmd(cmd, val) {
        document.execCommand(cmd, false, val || null);
        document.getElementById('editorArea').focus();
        countWords();
        showUnsaved();
    }

    /* Word count - no regex, pure char-code loop */
    function countWords() {
        var area = document.getElementById('editorArea');
        if (!area) return;
        var text = area.innerText || '';
        var chars = text.length;
        var trimmed = text.trim();
        var words = 0;
        if (trimmed.length > 0) {
            var inWord = false;
            for (var i = 0; i < trimmed.length; i++) {
                var ch = trimmed.charCodeAt(i);
                var isSpace = (ch === 32 || ch === 10 || ch === 13 || ch === 9);
                if (!isSpace && !inWord) { words++; inWord = true; }
                if (isSpace) { inWord = false; }
            }
        }
        var pages = Math.max(1, Math.ceil(words / 250));
        var cc = document.getElementById('charCount');
        var wc = document.getElementById('wordCount');
        var pc = document.getElementById('pageCount');
        if (cc) cc.textContent = chars;
        if (wc) wc.textContent = words;
        if (pc) pc.textContent = pages;
    }

    /* Save status */
    var _saveTimer = null;
    function showUnsaved() {
        var st = document.getElementById('saveStatus');
        var tx = document.getElementById('saveStatusText');
        if (!st || !tx) return;
        st.className = 'save-status';
        tx.textContent = (window.i18n ? i18n.t('editor.unsaved') : 'Unsaved');
        st.querySelector('i').className = 'fas fa-exclamation-circle';
        clearTimeout(_saveTimer);
        _saveTimer = setTimeout(doAutoSave, 2000);
    }
    function doAutoSave() {
        var st = document.getElementById('saveStatus');
        var tx = document.getElementById('saveStatusText');
        if (!st || !tx) return;
        st.className = 'save-status saving';
        tx.textContent = (window.i18n ? i18n.t('editor.saving') : 'Saving...');
        st.querySelector('i').className = 'fas fa-spinner fa-spin';
        // 下書きをブラウザ（localStorage）に保存。次回開いたとき復元される
        try {
            var area = document.getElementById('editorArea');
            localStorage.setItem('editorDraft', JSON.stringify({
                title: document.getElementById('workTitle').value || '',
                html: area ? area.innerHTML : '',
                updatedAt: new Date().toISOString()
            }));
        } catch (e) { console.error('Draft save failed:', e); }
        setTimeout(function() {
            st.className = 'save-status saved';
            tx.textContent = (window.i18n ? i18n.t('editor.saved') : 'Saved');
            st.querySelector('i').className = 'fas fa-check-circle';
        }, 600);
    }

    /* 前回の下書きを復元 */
    function restoreDraft() {
        try {
            var draft = JSON.parse(localStorage.getItem('editorDraft') || 'null');
            if (!draft) return;
            if (draft.title) document.getElementById('workTitle').value = draft.title;
            if (draft.html) document.getElementById('editorArea').innerHTML = draft.html;
        } catch (e) { console.error('Draft restore failed:', e); }
    }

    /* Export as plain text - called by Export button onclick */
    function doExportTXT() {
        var title = document.getElementById('workTitle').value || (window.i18n ? i18n.t('editor.untitled') : 'Untitled');
        var area = document.getElementById('editorArea');
        var NL = String.fromCharCode(10);
        var text = title + NL + NL + (area ? area.innerText : '');
        var blob = new Blob([text], { type: 'text/plain' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = title + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    }

    /* Publish - 原稿をアップロードページへ引き渡す */
    function doPublish() {
        var area = document.getElementById('editorArea');
        var text = area ? area.innerText.trim() : '';
        if (!text) {
            alert(window.i18n ? i18n.t('editor.placeholder') : 'Start writing your story...');
            return;
        }
        try {
            localStorage.setItem('editorDraftForUpload', JSON.stringify({
                title: document.getElementById('workTitle').value || '',
                text: text
            }));
        } catch (e) {
            console.error('Handoff failed:', e);
            return;
        }
        window.location.href = 'upload.html?from=editor';
    }

    /* Initial word count on page load */
    document.addEventListener('DOMContentLoaded', function() {
        restoreDraft();
        countWords();
    });
    </script>
