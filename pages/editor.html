    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* ===== Navbar Overlay ===== */
        .navbar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1040; }
        .navbar-overlay.show { display: block; }
        body.menu-open { overflow: hidden; }

        /* ===== Editor Layout ===== */
        body {
            overflow-x: hidden;
            background: #f8f9fa;
        }

        .editor-wrapper {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 56px);
        }

        /* ===== Editor Toolbar ===== */
        .editor-toolbar {
            position: sticky;
            top: 56px;
            z-index: 1030;
            background: #fff;
            border-bottom: 1px solid #dee2e6;
            padding: 0.4rem 1rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 0.4rem;
            border-right: 1px solid #e0e0e0;
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.85rem;
            transition: background 0.15s, color 0.15s;
        }

        .toolbar-btn:hover {
            background: #e9ecef;
            color: #333;
        }

        .toolbar-btn.active {
            background: #d4edda;
            color: #155724;
        }

        .toolbar-select {
            height: 32px;
            font-size: 0.8rem;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 0 0.5rem;
            background: #fff;
            cursor: pointer;
        }

        /* ===== Secondary Toolbar ===== */
        .secondary-toolbar {
            position: sticky;
            top: 100px;
            z-index: 1029;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .title-input {
            flex: 1;
            min-width: 200px;
            border: 1px solid transparent;
            background: transparent;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        .title-input:focus {
            border-color: #8B7355;
            background: #fff;
        }

        .save-status { font-size: 0.8rem; color: #6c757d; white-space: nowrap; }
        .save-status i { margin-right: 4px; }
        .save-status.saved { color: #28a745; }
        .save-status.saving { color: #ffc107; }
        .save-status.error { color: #dc3545; }

        /* ===== Main Editor Area ===== */
        .editor-main { display: flex; flex: 1; }
        .editor-content-area { flex: 1; padding: 2rem; max-width: 100%; }

        .editor-paper {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 3rem 2.5rem;
            min-height: 600px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            outline: none;
            font-family: 'Noto Serif JP', serif;
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
        }

        .editor-paper:focus {
            border-color: #8B7355;
            box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.15);
        }

        .editor-paper:empty::before {
            content: attr(data-placeholder);
            color: #adb5bd;
            pointer-events: none;
        }

        /* ===== Comment Panel ===== */
        .comment-panel { width: 300px; background: #fff; border-left: 1px solid #dee2e6; display: none; flex-direction: column; }
        .comment-panel.open { display: flex; }
        .comment-header { padding: 0.75rem 1rem; border-bottom: 1px solid #dee2e6; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
        .comment-list { flex: 1; overflow-y: auto; padding: 0.75rem; }
        .comment-item { background: #f8f9fa; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .comment-item .comment-author { font-weight: 600; margin-bottom: 0.25rem; color: #8B7355; }
        .comment-item .comment-time { font-size: 0.75rem; color: #999; }
        .comment-input-area { padding: 0.75rem; border-top: 1px solid #dee2e6; }
        .comment-input-area textarea { width: 100%; border: 1px solid #dee2e6; border-radius: 6px; padding: 0.5rem; font-size: 0.85rem; resize: vertical; min-height: 60px; }
        .comment-input-area button { margin-top: 0.5rem; width: 100%; }

        /* ===== Search & Replace Panel ===== */
        .search-panel { display: none; position: fixed; top: 100px; right: 20px; width: 340px; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); z-index: 1035; padding: 1rem; }
        .search-panel.open { display: block; }
        .search-panel .search-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .search-panel input { flex: 1; padding: 0.4rem 0.5rem; border: 1px solid #dee2e6; border-radius: 4px; font-size: 0.85rem; }
        .search-panel .search-info { font-size: 0.8rem; color: #6c757d; margin-bottom: 0.5rem; }

        /* ===== Image Insert Modal ===== */
        .image-modal-preview { max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #dee2e6; display: none; margin-top: 0.5rem; }

        /* ===== Editor Footer ===== */
        .editor-footer { background: #fff; border-top: 1px solid #dee2e6; padding: 0.4rem 1rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #6c757d; }
        .footer-stats { display: flex; gap: 1.5rem; }

        /* ===== Responsive ===== */
        @media (max-width: 991.98px) {
            .comment-panel { position: fixed; top: 56px; right: 0; bottom: 0; z-index: 1038; box-shadow: -4px 0 16px rgba(0, 0, 0, 0.1); }
            .editor-paper { padding: 1.5rem 1rem; }
            .toolbar-group { padding: 0 0.2rem; }
        }

        @media (max-width: 575.98px) {
            .secondary-toolbar { flex-direction: column; align-items: stretch; }
            .title-input { min-width: auto; }
            .comment-panel { width: 100%; }
        }

        @keyframes pulse-save { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .save-status.saving i { animation: pulse-save 1s infinite; }
    </style>
</head>

    <!-- ===== EDITOR TOOLBAR ===== -->
    <div class="editor-toolbar" id="editorToolbar">
        <div class="toolbar-group">
            <select class="toolbar-select" id="headingSelect" title="Heading">
                <option value="p" id="opt-paragraph">Paragraph</option>
                <option value="h1" id="opt-h1">Heading 1</option>
                <option value="h2" id="opt-h2">Heading 2</option>
                <option value="h3" id="opt-h3">Heading 3</option>
            </select>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('bold')" title="Bold"><i class="fas fa-bold"></i></button>
            <button class="toolbar-btn" onclick="execCmd('italic')" title="Italic"><i class="fas fa-italic"></i></button>
            <button class="toolbar-btn" onclick="execCmd('underline')" title="Underline"><i class="fas fa-underline"></i></button>
            <button class="toolbar-btn" onclick="execCmd('strikeThrough')" title="Strikethrough"><i class="fas fa-strikethrough"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('justifyLeft')" title="Align Left"><i class="fas fa-align-left"></i></button>
            <button class="toolbar-btn" onclick="execCmd('justifyCenter')" title="Align Center"><i class="fas fa-align-center"></i></button>
            <button class="toolbar-btn" onclick="execCmd('justifyRight')" title="Align Right"><i class="fas fa-align-right"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="Bullet List"><i class="fas fa-list-ul"></i></button>
            <button class="toolbar-btn" onclick="execCmd('insertOrderedList')" title="Numbered List"><i class="fas fa-list-ol"></i></button>
            <button class="toolbar-btn" onclick="execCmd('outdent')" title="Outdent"><i class="fas fa-outdent"></i></button>
            <button class="toolbar-btn" onclick="execCmd('indent')" title="Indent"><i class="fas fa-indent"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="insertLink()" title="Insert Link"><i class="fas fa-link"></i></button>
            <button class="toolbar-btn" onclick="openImageModal()" title="Insert Image"><i class="fas fa-image"></i></button>
            <button class="toolbar-btn" onclick="execCmd('insertHorizontalRule')" title="Horizontal Rule"><i class="fas fa-minus"></i></button>
            <button class="toolbar-btn" onclick="insertBlockquote()" title="Blockquote"><i class="fas fa-quote-right"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="execCmd('undo')" title="Undo"><i class="fas fa-undo"></i></button>
            <button class="toolbar-btn" onclick="execCmd('redo')" title="Redo"><i class="fas fa-redo"></i></button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="toggleSearchPanel()" title="Search"><i class="fas fa-search"></i></button>
            <button class="toolbar-btn" onclick="toggleCommentPanel()" title="Comments"><i class="fas fa-comment-dots"></i></button>
        </div>
    </div>

    <!-- ===== SECONDARY TOOLBAR ===== -->
    <div class="secondary-toolbar" id="secondaryToolbar">
        <input type="text" class="title-input" id="workTitle" placeholder="Untitled" value="">
        <span class="save-status saved" id="saveStatus">
            <i class="fas fa-check-circle"></i> <span id="saveStatusText">Saved</span>
        </span>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" onclick="exportWork()" id="btnExport">
                <i class="fas fa-file-export me-1"></i><span>Export</span>
            </button>
            <button class="btn btn-primary-custom btn-sm" onclick="publishWork()" id="btnPublish">
                <i class="fas fa-paper-plane me-1"></i><span>Publish</span>
            </button>
        </div>
    </div>

    <!-- ===== SEARCH & REPLACE PANEL ===== -->
    <div class="search-panel" id="searchPanel">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <strong id="searchTitle">Search &amp; Replace</strong>
            <button class="toolbar-btn" onclick="toggleSearchPanel()"><i class="fas fa-times"></i></button>
        </div>
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Search...">
            <button class="btn btn-outline-secondary btn-sm" onclick="findText()"><i class="fas fa-search"></i></button>
        </div>
        <div class="search-row">
            <input type="text" id="replaceInput" placeholder="Replace...">
            <button class="btn btn-outline-secondary btn-sm" onclick="replaceText()" id="btnReplace">Replace</button>
        </div>
        <div class="search-info" id="searchInfo"></div>
    </div>

    <!-- ===== MAIN EDITOR AREA ===== -->
    <div class="editor-main">
        <div class="editor-content-area">
            <div class="editor-paper" id="editorArea" contenteditable="true" data-placeholder="Start writing your story..." spellcheck="true">
            </div>
        </div>

        <!-- Comment Panel -->
        <div class="comment-panel" id="commentPanel">
            <div class="comment-header">
                <span id="commentTitle">Comments</span>
                <button class="toolbar-btn" onclick="toggleCommentPanel()"><i class="fas fa-times"></i></button>
            </div>
            <div class="comment-list" id="commentList">
                <div class="comment-item">
                    <div class="comment-author">Editor</div>
                    <div class="comment-text" id="sampleComment1">Great opening paragraph!</div>
                    <div class="comment-time">2 hours ago</div>
                </div>
                <div class="comment-item">
                    <div class="comment-author">Translator</div>
                    <div class="comment-text" id="sampleComment2">This section may be difficult to translate.</div>
                    <div class="comment-time">1 day ago</div>
                </div>
            </div>
            <div class="comment-input-area">
                <textarea id="newComment" placeholder="Add a comment..."></textarea>
                <button class="btn btn-primary-custom btn-sm" onclick="addComment()" id="btnAddComment">
                    <i class="fas fa-plus me-1"></i><span>Add Comment</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== EDITOR FOOTER ===== -->
    <div class="editor-footer" id="editorFooter">
        <div class="footer-stats">
            <span><span id="labelChars">Characters</span>: <strong id="charCount">0</strong></span>
            <span><span id="labelWords">Words</span>: <strong id="wordCount">0</strong></span>
            <span><span id="labelPages">Pages</span>: <strong id="pageCount">0</strong></span>
        </div>
        <span id="labelLastEdit">Last edit: just now</span>
    </div>

    <!-- ===== IMAGE INSERT MODAL ===== -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-image me-2"></i><span id="imageModalTitle">Insert Image</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" id="imageUrlLabel">Image URL</label>
                        <input type="url" class="form-control" id="imageUrlInput" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" id="imageAltLabel">Alt Text</label>
                        <input type="text" class="form-control" id="imageAltInput" placeholder="Description of the image">
                    </div>
                    <img class="image-modal-preview" id="imagePreview" alt="Preview">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnImageCancel">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" onclick="insertImage()" id="btnImageInsert">
                        <i class="fas fa-plus me-1"></i> Insert
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== EXPORT MODAL ===== -->
    <div class="modal fade" id="exportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-file-export me-2"></i><span id="exportModalTitle">Export</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="list-group">
                        <button class="list-group-item list-group-item-action" onclick="doExport('html')">
                            <i class="fas fa-code me-2"></i> HTML
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="doExport('txt')">
                            <i class="fas fa-file-alt me-2"></i> Plain Text
                        </button>
                        <button class="list-group-item list-group-item-action" onclick="doExport('md')">
                            <i class="fab fa-markdown me-2"></i> Markdown
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    /* =========================================================

       ========================================================= */
    var currentLang = localStorage.getItem('preferredLanguage') || 'en';
    var autoSaveTimer = null;

    function getL(key) {
        var langData = editorUiText[currentLang] || editorUiText['en'];
        return langData[key] || editorUiText['en'][key] || key;
    }

    function applyEditorTranslations() {
        currentLang = localStorage.getItem('preferredLanguage') || 'en';
        document.title = getL('title');
        var paper = document.getElementById('editorArea');
        if (paper) paper.setAttribute('data-placeholder', getL('placeholder'));
        var titleInput = document.getElementById('workTitle');
        if (titleInput && !titleInput.value) titleInput.placeholder = getL('untitled');
        var optP = document.getElementById('opt-paragraph');
        if (optP) optP.textContent = getL('paragraph');
        var optH1 = document.getElementById('opt-h1');
        if (optH1) optH1.textContent = getL('h1');
        var optH2 = document.getElementById('opt-h2');
        if (optH2) optH2.textContent = getL('h2');
        var optH3 = document.getElementById('opt-h3');
        if (optH3) optH3.textContent = getL('h3');
        updateSaveStatusText();
        var btnExport = document.querySelector('#btnExport span');
        var btnPublish = document.querySelector('#btnPublish span');
        if (btnExport) btnExport.textContent = getL('exportBtn');
        if (btnPublish) btnPublish.textContent = getL('publishBtn');
        var el;
        el = document.getElementById('searchTitle'); if (el) el.textContent = getL('searchReplace');
        el = document.getElementById('searchInput'); if (el) el.placeholder = getL('searchPlaceholder');
        el = document.getElementById('replaceInput'); if (el) el.placeholder = getL('replacePlaceholder');
        el = document.getElementById('btnReplace'); if (el) el.textContent = getL('replaceBtn');
        el = document.getElementById('commentTitle'); if (el) el.textContent = getL('comments');
        el = document.getElementById('newComment'); if (el) el.placeholder = getL('commentPlaceholder');
        var addBtn = document.querySelector('#btnAddComment span');
        if (addBtn) addBtn.textContent = getL('addComment');
        el = document.getElementById('sampleComment1'); if (el) el.textContent = getL('sampleComment1');
        el = document.getElementById('sampleComment2'); if (el) el.textContent = getL('sampleComment2');
        el = document.getElementById('labelChars'); if (el) el.textContent = getL('characters');
        el = document.getElementById('labelWords'); if (el) el.textContent = getL('words');
        el = document.getElementById('labelPages'); if (el) el.textContent = getL('pages');
        el = document.getElementById('labelLastEdit'); if (el) el.textContent = getL('lastEdit');
        el = document.getElementById('imageModalTitle'); if (el) el.textContent = getL('insertImage');
        el = document.getElementById('imageUrlLabel'); if (el) el.textContent = getL('imageUrl');
        el = document.getElementById('imageAltLabel'); if (el) el.textContent = getL('imageAlt');
        el = document.getElementById('btnImageCancel'); if (el) el.textContent = getL('cancel');
        el = document.getElementById('btnImageInsert');
        if (el) el.innerHTML = '<i class="fas fa-plus me-1"></i> ' + getL('insert');
        el = document.getElementById('exportModalTitle'); if (el) el.textContent = getL('exportTitle');
    }

    function updateSaveStatusText() {
        var statusEl = document.getElementById('saveStatus');
        var textEl = document.getElementById('saveStatusText');
        if (!statusEl || !textEl) return;
        if (statusEl.classList.contains('saved')) textEl.textContent = getL('saved');
        else if (statusEl.classList.contains('saving')) textEl.textContent = getL('saving');
        else textEl.textContent = getL('unsaved');
    }

    /* =========================================================
       AUTH NAV (Pattern C - matching account-settings.html)
       ========================================================= */
    function getNavText(key) {
        if (typeof translations === 'undefined') return null;
        var langData = translations[currentLang] || translations['en'];
        if (!langData) return null;
        var keys = key.split('.');
        var value = langData;
        for (var i = 0; i < keys.length; i++) {
            if (value && typeof value === 'object' && keys[i] in value) {
                value = value[keys[i]];
            } else { return null; }
        }
        return typeof value === 'string' ? value : null;
    }

    function updateAuthNav() {
        var token = localStorage.getItem('token');
        var userStr = localStorage.getItem('user');
        var authNav = document.getElementById('authNav');
        if (!authNav) return;
        if (token && userStr) {
            try {
                var user = JSON.parse(userStr);
                var displayName = user.display_name || user.displayName || user.firstName || user.email || 'User';
                authNav.innerHTML =
                    '<li class="nav-item dropdown">' +
                    '<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">' +
                    '<i class="fas fa-user-circle me-1"></i>' + displayName +
                    '</a>' +
                    '<ul class="dropdown-menu dropdown-menu-end">' +
                    '<li><a class="dropdown-item" href="dashboard.html"><i class="fas fa-th-large me-2"></i><span data-i18n="nav.dashboard">' + (getNavText('nav.dashboard') || 'Dashboard') + '</span></a></li>' +
                    '<li><a class="dropdown-item" href="account-settings.html"><i class="fas fa-cog me-2"></i><span data-i18n="nav.settings">' + (getNavText('nav.settings') || 'Settings') + '</span></a></li>' +
                    '<li><hr class="dropdown-divider"></li>' +
                    '<li><a class="dropdown-item" href="#" onclick="logout(); return false;"><i class="fas fa-sign-out-alt me-2"></i><span data-i18n="nav.logout">' + (getNavText('nav.logout') || 'Logout') + '</span></a></li>' +
                    '</ul></li>';
                document.body.classList.add('logged-in');
            } catch (e) { console.error('Failed to parse user data:', e); }
        } else {
            document.body.classList.remove('logged-in');
        }
        if (typeof applyTranslations === 'function') applyTranslations();
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    /* =========================================================
       EDITOR COMMANDS
       ========================================================= */
    function execCmd(command, value) {
        document.execCommand(command, false, value || null);
        document.getElementById('editorArea').focus();
        onContentChange();
    }
    function insertLink() { var url = prompt(getL('linkPrompt'), 'https://'); if (url) execCmd('createLink', url); }
    function insertBlockquote() { execCmd('formatBlock', 'blockquote'); }

    /* =========================================================
       IMAGE INSERT
       ========================================================= */
    function openImageModal() {
        document.getElementById('imageUrlInput').value = '';
        document.getElementById('imageAltInput').value = '';
        document.getElementById('imagePreview').style.display = 'none';
        new bootstrap.Modal(document.getElementById('imageModal')).show();
    }
    function insertImage() {
        var url = document.getElementById('imageUrlInput').value;
        var alt = document.getElementById('imageAltInput').value || '';
        if (url) {
            document.getElementById('editorArea').focus();
            document.execCommand('insertHTML', false, '<img src="' + url + '" alt="' + alt + '" style="max-width: 100%; border-radius: 8px; margin: 1rem 0;">');
            bootstrap.Modal.getInstance(document.getElementById('imageModal')).hide();
            onContentChange();
        }
    }

    /* =========================================================
       SEARCH & REPLACE
       ========================================================= */
    function toggleSearchPanel() {
        var panel = document.getElementById('searchPanel');
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) document.getElementById('searchInput').focus();
    }
    function findText() {
        var query = document.getElementById('searchInput').value;
        var infoEl = document.getElementById('searchInfo');
        if (!query) { infoEl.textContent = ''; return; }
        var content = document.getElementById('editorArea').innerText;
        var matches = content.match(new RegExp(query, 'gi'));
        if (matches) { infoEl.textContent = matches.length + ' ' + getL('foundResults'); window.find(query); }
        else { infoEl.textContent = getL('noResults'); }
    }
    function replaceText() {
        var search = document.getElementById('searchInput').value;
        var replace = document.getElementById('replaceInput').value;
        if (!search) return;
        var editor = document.getElementById('editorArea');
        editor.innerHTML = editor.innerHTML.split(search).join(replace);
        onContentChange();
    }

    /* =========================================================
       COMMENT PANEL
       ========================================================= */
    function toggleCommentPanel() { document.getElementById('commentPanel').classList.toggle('open'); }
    function addComment() {
        var textarea = document.getElementById('newComment');
        var text = textarea.value.trim();
        if (!text) return;
        var list = document.getElementById('commentList');
        var item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = '<div class="comment-author">You</div><div class="comment-text">' +
            text.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div><div class="comment-time">' + getL('lastEdit') + '</div>';
        list.appendChild(item);
        textarea.value = '';
        list.scrollTop = list.scrollHeight;
    }

    /* =========================================================
       EXPORT
       ========================================================= */
    function exportWork() { new bootstrap.Modal(document.getElementById('exportModal')).show(); }
    function doExport(format) {
        var title = document.getElementById('workTitle').value || getL('untitled');
        var content = document.getElementById('editorArea');
        var data, mimeType, ext;
        if (format === 'html') {
            data = '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>' + title + '</title></head><body>\n' + content.innerHTML + '\n</body></html>';
            mimeType = 'text/html'; ext = '.html';
        } else if (format === 'txt') {
            data = content.innerText; mimeType = 'text/plain'; ext = '.txt';
        } else {
            data = content.innerHTML
                .replace(/<h1[^>]*>(.*?)<\/h1>/gi, '# $1\n\n')
                .replace(/<h2[^>]*>(.*?)<\/h2>/gi, '## $1\n\n')
                .replace(/<h3[^>]*>(.*?)<\/h3>/gi, '### $1\n\n')
                .replace(/<strong[^>]*>(.*?)<\/strong>/gi, '**$1**')
                .replace(/<b[^>]*>(.*?)<\/b>/gi, '**$1**')
                .replace(/<em[^>]*>(.*?)<\/em>/gi, '*$1*')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<p[^>]*>(.*?)<\/p>/gi, '$1\n\n')
                .replace(/<[^>]+>/g, '').replace(/\n{3,}/g, '\n\n').trim();
            mimeType = 'text/markdown'; ext = '.md';
        }
        var blob = new Blob([data], { type: mimeType });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = title + ext;
        a.click();
        URL.revokeObjectURL(a.href);
        bootstrap.Modal.getInstance(document.getElementById('exportModal')).hide();
    }

    /* =========================================================
       PUBLISH
       ========================================================= */
    function publishWork() {
        var isDemo = new URLSearchParams(window.location.search).get('demo') === 'true';
        if (isDemo) { alert(getL('publishDemoMsg')); return; }
        if (confirm(getL('publishConfirm'))) alert(getL('publishSuccess'));
    }

    /* =========================================================
       CONTENT TRACKING
       ========================================================= */
    function onContentChange() {
        updateCounts();
        var statusEl = document.getElementById('saveStatus');
        statusEl.className = 'save-status';
        statusEl.innerHTML = '<i class="fas fa-circle"></i> <span id="saveStatusText">' + getL('unsaved') + '</span>';
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(autoSave, 2000);
    }
    function updateCounts() {
        var text = document.getElementById('editorArea').innerText || '';
        var chars = text.length;
        var words = text.trim() ? text.trim().split(/\s+/).length : 0;
        var pages = Math.max(1, Math.ceil(chars / 1800));
        document.getElementById('charCount').textContent = chars.toLocaleString();
        document.getElementById('wordCount').textContent = words.toLocaleString();
        document.getElementById('pageCount').textContent = pages;
    }
    function autoSave() {
        var statusEl = document.getElementById('saveStatus');
        statusEl.className = 'save-status saving';
        statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span id="saveStatusText">' + getL('saving') + '</span>';
        setTimeout(function() {
            statusEl.className = 'save-status saved';
            statusEl.innerHTML = '<i class="fas fa-check-circle"></i> <span id="saveStatusText">' + getL('saved') + '</span>';
            try {
                localStorage.setItem('editor_draft_title', document.getElementById('workTitle').value);
                localStorage.setItem('editor_draft_content', document.getElementById('editorArea').innerHTML);
            } catch (e) { /* ignore */ }
        }, 500);
    }

    /* =========================================================
       KEYBOARD SHORTCUTS
       ========================================================= */
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
            if (e.key.toLowerCase() === 's') { e.preventDefault(); autoSave(); }
            if (e.key.toLowerCase() === 'f') { e.preventDefault(); toggleSearchPanel(); }
        }
    });

    /* =========================================================
       INITIALIZATION
       ========================================================= */
    document.addEventListener('DOMContentLoaded', function() {
        updateAuthNav();
        applyEditorTranslations();

        // Load draft
        var savedTitle = localStorage.getItem('editor_draft_title');
        var savedContent = localStorage.getItem('editor_draft_content');
        if (savedTitle) document.getElementById('workTitle').value = savedTitle;
        if (savedContent) document.getElementById('editorArea').innerHTML = savedContent;
        updateCounts();

        // Content change listener
        document.getElementById('editorArea').addEventListener('input', onContentChange);

        // Heading select
        document.getElementById('headingSelect').addEventListener('change', function() {
            execCmd('formatBlock', this.value === 'p' ? 'p' : this.value);
        });

        // Language change event from language-switcher.js
        document.addEventListener('languageChanged', function() {
            applyEditorTranslations();
            updateAuthNav();
        });

        // Fallback: bind language selectors directly
        document.querySelectorAll('#mobileLanguageSelect, #desktopLanguageSelect').forEach(function(select) {
            select.addEventListener('change', function() {
                currentLang = this.value;
                if (typeof LanguageSwitcher !== 'undefined') LanguageSwitcher.changeLanguage(this.value);
                setTimeout(function() { applyEditorTranslations(); updateAuthNav(); }, 100);
            });
        });

        // Image URL preview
        document.getElementById('imageUrlInput').addEventListener('input', function() {
            var preview = document.getElementById('imagePreview');
            if (this.value) { preview.src = this.value; preview.style.display = 'block'; }
            else { preview.style.display = 'none'; }
        });
        document.getElementById('imagePreview').addEventListener('error', function() { this.style.display = 'none'; });

        // Mobile navbar overlay
        var navbarNav = document.getElementById('navbarNav');
        var navbarOverlay = document.getElementById('navbarOverlay');
        if (navbarNav) {
            navbarNav.addEventListener('show.bs.collapse', function() {
                document.body.classList.add('menu-open');
                if (navbarOverlay) navbarOverlay.classList.add('show');
            });
            navbarNav.addEventListener('hide.bs.collapse', function() {
                document.body.classList.remove('menu-open');
                if (navbarOverlay) navbarOverlay.classList.remove('show');
            });
        }
        if (navbarOverlay) {
            navbarOverlay.addEventListener('click', function() {
                var bsCollapse = bootstrap.Collapse.getInstance(navbarNav);
                if (bsCollapse) bsCollapse.hide();
            });
        }
    });
    </script>
</body>
</html>
