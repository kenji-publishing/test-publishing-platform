<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202608251547">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202608251547">
    <title>Reader - AuctLect</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/variables.css?v=202608251547" rel="stylesheet"><!-- navbar.cssが使う--color-*変数の定義（無いとドロップダウンが透明になる） -->
    <link href="../css/navbar.css?v=202608251547" rel="stylesheet">
    <link href="../css/mobile-fixes.css?v=202608251547" rel="stylesheet">

    <style>
        :root {
            --reader-bg: #FFFFFF;
            --reader-text: #2D2A26;
            --reader-secondary: #6B6560;
            --reader-border: #E8E4E0;
            --reader-accent: #8B7355;
            --reader-highlight-yellow: rgba(255, 235, 59, 0.4);
            --reader-highlight-green: rgba(129, 199, 132, 0.4);
            --reader-highlight-blue: rgba(100, 181, 246, 0.4);
            --reader-highlight-pink: rgba(244, 143, 177, 0.4);
            --font-size: 18px;
            --line-height: 1.8;
        }

        .theme-light { --reader-bg: #FFFFFF; --reader-text: #2D2A26; --reader-secondary: #6B6560; --reader-border: #E8E4E0; }
        .theme-dark { --reader-bg: #1A1A1A; --reader-text: #E8E4E0; --reader-secondary: #A0A0A0; --reader-border: #333333; }
        .theme-sepia { --reader-bg: #F4ECD8; --reader-text: #5C4B37; --reader-secondary: #8B7355; --reader-border: #D4C4A8; }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans JP', 'Noto Sans Arabic', sans-serif;
            margin: 0; padding: 0;
            background: var(--reader-bg);
            color: var(--reader-text);
            transition: all 0.3s ease;
            overflow-x: clip;
        }

        .reader-toolbar {
            /* --nav-h はナビバーの実際の高さをJSが測って設定（フォールバック80px） */
            position: fixed; top: var(--nav-h, 80px); left: 0; right: 0;
            background: var(--reader-bg);
            border-bottom: 1px solid var(--reader-border);
            padding: 0.5rem 1rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }

        .toolbar-left, .toolbar-center, .toolbar-right { display: flex; align-items: center; gap: 0.5rem; }

        .btn-toolbar {
            background: transparent;
            border: 1px solid var(--reader-border);
            color: var(--reader-text);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 0.25rem;
            font-size: 0.9rem;
        }

        .btn-toolbar:hover, .btn-toolbar.active { background: var(--reader-accent); color: white; border-color: var(--reader-accent); }

        .back-link { color: var(--reader-text); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: 500; }
        .back-link:hover { color: var(--reader-accent); }

        .work-title { font-weight: 600; font-size: 0.95rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .ai-badge-reader {
            display: none;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            background: rgba(139, 115, 85, 0.12);
            color: var(--reader-accent);
            border: 1px solid var(--reader-accent);
            white-space: nowrap;
        }

        .reader-cover { text-align: center; padding: 2rem 0; }
        .reader-cover img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .reader-cover h1 { margin-top: 1.5rem; font-size: 1.6rem; }

        /* 挿絵・表（Word原稿由来のマーカーから描画） */
        .reader-illustration { margin: 1.2rem 0; }
        .reader-illustration.align-left { text-align: left; }
        .reader-illustration.align-center { text-align: center; }
        .reader-illustration.align-right { text-align: right; }
        .reader-illustration img { max-width: 100%; height: auto; border-radius: 6px; }
        .reader-table-wrap { margin: 1.2rem 0; overflow-x: auto; }
        .reader-table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
        .reader-table th, .reader-table td { border: 1px solid rgba(120, 105, 90, 0.45); padding: 0.4rem 0.6rem; text-align: left; }
        .reader-table th { background: rgba(139, 115, 85, 0.14); font-weight: 600; }
        /* 縦書きモードでも挿絵・表は横書きのまま表示する */
        .writing-vertical .reader-illustration,
        .writing-vertical .reader-table-wrap { writing-mode: horizontal-tb; }

        .toc-item-page { float: right; color: var(--reader-secondary); font-size: 0.8rem; margin-left: 0.5rem; }

        .lang-selector-reader {
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--reader-border);
            border-radius: 6px;
            background: transparent;
            color: var(--reader-text);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .settings-panel, .bookmarks-panel, .search-panel {
            position: fixed; top: calc(var(--nav-h, 80px) + var(--toolbar-h, 55px) + 4px);
            background: var(--reader-bg);
            border: 1px solid var(--reader-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 999;
            display: none;
        }

        .settings-panel.show, .bookmarks-panel.show, .search-panel.show { display: block; }

        .settings-panel { right: 0.5rem; width: 300px; max-width: calc(100vw - 1rem); padding: 1rem; }
        .bookmarks-panel { left: 0.5rem; width: 280px; max-width: calc(100vw - 1rem); max-height: calc(100vh - 250px); overflow: hidden; display: none; }
        .bookmarks-panel.show { display: flex; flex-direction: column; }
        .search-panel { left: 50%; transform: translateX(-50%); width: 350px; max-width: calc(100vw - 1rem); padding: 0.75rem; }

        .settings-section { margin-bottom: 1rem; }
        .settings-label { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--reader-secondary); }
        .settings-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }

        .settings-btn {
            flex: 1; min-width: 60px; padding: 0.5rem;
            border: 1px solid var(--reader-border); border-radius: 6px;
            background: transparent; color: var(--reader-text);
            cursor: pointer; font-size: 0.8rem;
        }
        .settings-btn:hover { border-color: var(--reader-accent); }
        .settings-btn.active { background: var(--reader-accent); color: white; border-color: var(--reader-accent); }

        .theme-btn { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.5rem; }
        .theme-preview { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--reader-border); }
        .theme-preview.light { background: #FFFFFF; }
        .theme-preview.dark { background: #1A1A1A; }
        .theme-preview.sepia { background: #F4ECD8; }

        .reader-main { padding-top: calc(var(--nav-h, 80px) + var(--toolbar-h, 50px) + 10px); padding-bottom: 180px; min-height: 100vh; touch-action: pan-y; }

        .reader-content {
            max-width: 800px; margin: 0 auto; padding: 1.5rem;
            font-size: var(--font-size); line-height: var(--line-height);
            -webkit-user-select: text; user-select: text;
        }

        .writing-horizontal { writing-mode: horizontal-tb; direction: ltr; }
        /* 縦書きの高さは画面から実測した値（--reader-vh）を使う。
           240px固定だと、ツールバーの高さが変わる携帯では下がはみ出して読めなくなる */
        .writing-vertical {
            writing-mode: vertical-rl; direction: ltr;
            height: var(--reader-vh, calc(100vh - 240px));
            overflow-x: auto; padding: 1.5rem;
        }
        /* 横に引く操作をブラウザの「戻る」に取られないようにする。
           これが無いと、前のページに戻そうとしてマイライブラリまで戻ってしまう */
        body, .reader-main, .reader-content { overscroll-behavior-x: contain; }
        .writing-rtl { writing-mode: horizontal-tb; direction: rtl; font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', serif; }

        .text-small { --font-size: 14px; --line-height: 1.7; }
        .text-medium { --font-size: 18px; --line-height: 1.8; }
        .text-large { --font-size: 22px; --line-height: 1.9; }
        .text-xlarge { --font-size: 26px; --line-height: 2.0; }

        .reader-content p { margin-bottom: 1.5em; text-align: justify; }
        .reader-content h1, .reader-content h2, .reader-content h3 { margin-top: 1.5em; margin-bottom: 0.75em; }

        .highlight-yellow { background: var(--reader-highlight-yellow); }
        .highlight-green { background: var(--reader-highlight-green); }
        .highlight-blue { background: var(--reader-highlight-blue); }
        .highlight-pink { background: var(--reader-highlight-pink); }
        .highlighted { cursor: pointer; border-radius: 2px; padding: 0 2px; }

        .highlight-toolbar {
            position: fixed;
            background: var(--reader-bg);
            border: 1px solid var(--reader-border);
            border-radius: 25px;
            padding: 0.5rem 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 1001;
            flex-direction: row;
            gap: 0.5rem;
            align-items: center;
        }
        .highlight-toolbar.show { display: flex; }

        .highlight-color-btn {
            width: 32px; height: 32px;
            border: 2px solid var(--reader-border); border-radius: 50%;
            cursor: pointer; transition: transform 0.2s;
        }
        .highlight-color-btn:hover { transform: scale(1.15); }
        .highlight-color-btn.yellow { background: var(--reader-highlight-yellow); }
        .highlight-color-btn.green { background: var(--reader-highlight-green); }
        .highlight-color-btn.blue { background: var(--reader-highlight-blue); }
        .highlight-color-btn.pink { background: var(--reader-highlight-pink); }

        .highlight-remove-btn, .highlight-report-btn {
            width: 32px; height: 32px;
            border: 1px solid var(--reader-border); border-radius: 50%;
            background: transparent; color: var(--reader-text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
        }
        
        .highlight-report-btn {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }
        .highlight-report-btn:hover {
            background: #c82333;
            transform: scale(1.1);
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--reader-border);
            margin: 0 4px;
        }

        .bookmarks-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--reader-border);
            font-weight: 600; font-size: 0.9rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .bookmarks-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .bookmark-item { padding: 0.6rem; border: 1px solid var(--reader-border); border-radius: 8px; margin-bottom: 0.4rem; cursor: pointer; }
        .bookmark-item:hover { background: rgba(139, 115, 85, 0.1); border-color: var(--reader-accent); }
        .bookmark-title { font-weight: 500; font-size: 0.85rem; margin-bottom: 0.2rem; }
        .bookmark-preview { font-size: 0.75rem; color: var(--reader-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bookmark-delete { float: right; background: none; border: none; color: var(--reader-secondary); cursor: pointer; padding: 0.2rem; }

        .notes-section {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--reader-bg);
            border-top: 1px solid var(--reader-border);
            z-index: 998;
        }
        .notes-header { padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid var(--reader-border); }
        .notes-header h4 { margin: 0; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
        .notes-toggle { background: none; border: none; color: var(--reader-text); cursor: pointer; font-size: 1rem; padding: 0.25rem; }
        .notes-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .notes-content.expanded { max-height: 280px; }
        .notes-inner { padding: 0.75rem; }
        .note-input-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .note-input { flex: 1; padding: 0.6rem; border: 1px solid var(--reader-border); border-radius: 8px; font-size: 16px; background: var(--reader-bg); color: var(--reader-text); resize: none; -webkit-appearance: none; }
        .note-input:focus { outline: none; border-color: var(--reader-accent); }
        .btn-add-note { padding: 0.6rem 0.75rem; background: var(--reader-accent); color: white; border: none; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; }
        .notes-list { max-height: 120px; overflow-y: auto; }
        .note-item { background: rgba(139, 115, 85, 0.1); border-radius: 8px; padding: 0.6rem; margin-bottom: 0.4rem; position: relative; }
        .note-time { font-size: 0.7rem; color: var(--reader-secondary); margin-bottom: 0.2rem; }
        .note-text { font-size: 0.85rem; }
        .note-page { font-size: 0.7rem; color: var(--reader-accent); margin-top: 0.2rem; }
        .note-delete { position: absolute; top: 0.4rem; right: 0.4rem; background: none; border: none; color: var(--reader-secondary); cursor: pointer; padding: 0.2rem; }
        .notes-export { display: flex; gap: 0.4rem; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--reader-border); }
        .btn-export { flex: 1; padding: 0.4rem; border: 1px solid var(--reader-border); border-radius: 6px; background: transparent; color: var(--reader-text); cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 0.2rem; }
        .btn-export:hover { background: var(--reader-accent); color: white; border-color: var(--reader-accent); }

        .page-info { font-size: 0.85rem; color: var(--reader-secondary); }
        .search-input-row { display: flex; gap: 0.4rem; }
        .search-input { flex: 1; padding: 0.6rem; border: 1px solid var(--reader-border); border-radius: 8px; font-size: 16px; background: var(--reader-bg); color: var(--reader-text); -webkit-appearance: none; }
        .search-results { margin-top: 0.5rem; font-size: 0.8rem; color: var(--reader-secondary); }

        .swipe-indicator {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 50px; height: 100px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(139, 115, 85, 0.2);
            color: var(--reader-accent); font-size: 1.5rem;
            opacity: 0; transition: opacity 0.2s;
            pointer-events: none; z-index: 100;
        }
        .swipe-indicator.left { left: 0; border-radius: 0 12px 12px 0; }
        .swipe-indicator.right { right: 0; border-radius: 12px 0 0 12px; }
        .swipe-indicator.show { opacity: 1; }

        .touch-hint {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white;
            padding: 0.5rem 1rem; border-radius: 20px;
            font-size: 0.8rem; z-index: 1002;
            display: none;
        }
        .touch-hint.show { display: block; animation: fadeOut 3s forwards; }
        @keyframes fadeOut { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

        /* Click Zone Navigation */
        .click-zone {
            position: fixed;
            top: 126px;
            bottom: 0;
            z-index: 50;
            cursor: pointer;
        }
        .click-zone-left { left: 0; width: 25%; }
        .click-zone-right { right: 0; width: 25%; }

        /* Reading Progress Bar */
        .reading-progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(0, 0, 0, 0.1);
            z-index: 1100;
            pointer-events: none;
        }
        .reading-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B7355, #A89070);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 0 1.5px 1.5px 0;
        }

        @media (max-width: 768px) {
            .reader-content { padding: 1rem; }
            .work-title { display: none; }
            .toolbar-left .back-link:first-child .work-title { display: none; } /* Hide AuctLect text on mobile */
            #backLinkText { display: none; } /* Hide Library text on mobile */
            .btn-toolbar span { display: none; }
            .toolbar-center { gap: 0.25rem; }
            .page-info { font-size: 0.75rem; }
            .lang-selector-reader { font-size: 0.7rem; padding: 0.25rem 0.4rem; }
            
            /* Hide desktop buttons, show mobile menu */
            .desktop-only { display: none !important; }
            .mobile-only { display: block !important; }
            
            .toolbar-left { gap: 0.25rem !important; }
            .toolbar-left span[style*="color: var(--reader-border)"] { display: none; } /* Hide divider */
        }
        
        /* Mobile Menu Dropdown */
        .mobile-only { display: none; }
        
        .mobile-menu-dropdown {
            position: relative;
        }
        
        .mobile-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--reader-bg);
            border: 1px solid var(--reader-border);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            min-width: 180px;
            z-index: 1002;
            display: none;
            overflow: hidden;
        }
        
        .mobile-menu.show {
            display: block;
        }
        
        .mobile-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: var(--reader-text);
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
        }
        
        .mobile-menu-item:hover {
            background: rgba(139, 115, 85, 0.1);
        }
        
        .mobile-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--reader-accent);
        }

        @media (max-width: 480px) {
            .reader-toolbar { padding: 0.4rem 0.5rem; }
            .btn-toolbar { padding: 0.4rem 0.6rem; }
            .settings-panel, .bookmarks-panel { width: calc(100vw - 1rem); left: 0.5rem; right: 0.5rem; }
            .highlight-toolbar { padding: 0.4rem 0.5rem; gap: 0.3rem; }
            .highlight-color-btn, .highlight-remove-btn, .highlight-report-btn { width: 28px; height: 28px; }
        }

    /* ========== Pattern C Navbar Styles ========== */
    .navbar-custom {
        background-color: var(--reader-bg) !important;
        border-bottom: 1px solid var(--reader-border);
        padding: 1rem 0;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .navbar-custom .navbar-brand {
        font-family: 'Noto Serif JP', Georgia, 'Times New Roman', serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--reader-accent) !important;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .navbar-custom .navbar-brand i { color: var(--reader-accent); }
    /* Language Selector (style-new.css準拠) */
    .language-selector {
        background-color: rgba(139, 115, 85, 0.08);
        border: 1px solid var(--reader-border);
        border-radius: 8px;
        padding: 0.25rem 0.5rem;
        font-size: 0.875rem;
        color: var(--reader-secondary);
        cursor: pointer;
        transition: all 150ms ease;
    }
    .language-selector:hover { border-color: var(--reader-accent); }
    .navbar-lang-selector { display: flex; align-items: center; margin-right: 0.5rem; }
    @media (max-width: 991.98px) {
        .navbar-lang-selector { order: 1; }
        .navbar-toggler { order: 2; }
    }
    @media (min-width: 992px) {
        .navbar-nav { flex-wrap: nowrap !important; flex-direction: row !important; }
        .navbar-nav .nav-item { white-space: nowrap !important; }
        .navbar-nav .nav-link { white-space: nowrap !important; padding: 0.5rem 0.6rem !important; font-size: 0.9rem; }

        .dropdown-menu { white-space: nowrap; }
        .navbar-buttons-guest { display: flex !important; flex-wrap: nowrap !important; gap: 0.5rem; }
        .navbar-buttons-guest .btn { white-space: nowrap !important; flex-shrink: 0; }
    }
    .auth-only { display: none !important; }
    .guest-only { display: block; }
    body.logged-in .auth-only { display: block !important; }
    body.logged-in .auth-only.nav-item { display: list-item !important; }
    body.logged-in .auth-only.dropdown { display: block !important; }
    body.logged-in .guest-only { display: none !important; }
    @media (min-width: 992px) { body.logged-in .navbar-buttons-guest { display: none !important; } }
    .user-dropdown { position: relative; }
    .user-dropdown-toggle { display: flex; align-items: center; gap: 0.5rem; background: transparent; border: 1px solid var(--reader-border); border-radius: 25px; padding: 0.4rem 0.75rem; cursor: pointer; color: var(--reader-text); transition: all 0.2s; }
    .user-dropdown-toggle:hover { border-color: var(--reader-accent); background: rgba(139, 115, 85, 0.05); }
    .user-dropdown-toggle i:first-child { font-size: 1.25rem; color: var(--reader-accent); }
    .user-name-nav { font-weight: 500; font-size: 0.9rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-menu-nav { position: absolute; top: calc(100% + 0.5rem); right: 0; background: var(--reader-bg); border: 1px solid var(--reader-border); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); min-width: 240px; z-index: 1001; display: none; overflow: hidden; }
    .user-menu-nav.show { display: block; }
    .user-menu-item-nav { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--reader-text); text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }

    .viewer-toolbar .toolbar-right { display: flex; align-items: center; gap: 0.5rem; }
    .viewer-toolbar .toolbar-divider { color: var(--reader-border); }
    .viewer-toolbar .work-author { font-size: 0.8rem; color: var(--reader-secondary); }
    .viewer-container {
        position: fixed; top: calc(var(--nav-h, 80px) + var(--toolbar-h, 50px)); left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column;
    }
    .viewer-content {
        flex: 1; display: flex; align-items: center; justify-content: center;

    }
    .manga-img { max-width: 100%; max-height: calc(100vh - var(--nav-h, 80px) - 192px); object-fit: contain; cursor: pointer; transition: transform 0.2s; }
    .viewer-controls {
        background: var(--reader-bg); padding: 0.75rem 1rem;
        border-top: 1px solid var(--reader-border);
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;
    }
    .reading-mode-switch { display: flex; gap: 0.5rem; }
    .mode-btn {
        padding: 0.4rem 0.8rem; border: 1px solid var(--reader-border);
        background: var(--reader-bg); color: var(--reader-text);
        cursor: pointer; transition: all 0.2s; border-radius: 6px; font-size: 0.85rem;
    }
    .mode-btn:hover { border-color: var(--reader-accent); background: rgba(139,115,85,0.05); }
    .mode-btn.active { background: var(--reader-accent); border-color: var(--reader-accent); color: #fff; }
    .page-nav { display: flex; gap: 0.75rem; align-items: center; }
    .page-counter { font-size: 1rem; font-weight: 600; color: var(--reader-text); }
    .btn-page {
        background: var(--reader-bg); border: 1px solid var(--reader-border);
        color: var(--reader-text); border-radius: 6px; padding: 0.4rem 0.6rem; cursor: pointer; transition: all 0.2s;
    }
    .btn-page:hover { background: var(--reader-accent); border-color: var(--reader-accent); color: #fff; }
    .thumbnail-strip {
        position: absolute; bottom: 80px; left: 0; right: 0;
        background: rgba(255,255,255,0.95); border-top: 1px solid var(--reader-border);
        padding: 0.75rem; display: none; overflow-x: auto; white-space: nowrap;
    }
    .thumbnail-strip.show { display: block; }
    .thumb-item {
        display: inline-block; width: 70px; height: 100px; margin: 0 4px;
        cursor: pointer; border: 2px solid var(--reader-border); border-radius: 4px;
        transition: all 0.2s; background: #F5F2ED; overflow: hidden; vertical-align: top;
    }
    .thumb-item:hover, .thumb-item.active { border-color: var(--reader-accent); box-shadow: 0 2px 8px rgba(139,115,85,0.3); }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .page-loading {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center;
    }
    .page-loading .spinner {
        width: 40px; height: 40px; border: 3px solid var(--reader-border);
        border-top-color: var(--reader-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-loading p { color: var(--reader-secondary); font-size: 0.85rem; }
    .preload-progress {
        position: fixed; top: 0; left: 0; height: 3px;
        background: linear-gradient(90deg, var(--reader-accent), #b8956a);
        transition: width 0.3s ease; z-index: 2000;
    }
    .btn-nav-arrow {
        background: rgba(255,255,255,0.85); border: 1px solid var(--reader-border);

        .reading-mode-switch { justify-content: center; flex-wrap: wrap; }

    <script>
        // ===== Mode Detection =====
        const isManga = new URLSearchParams(window.location.search).get('type') === 'manga';
        if (isManga) {
            document.body.classList.add('manga-mode');
            document.getElementById('textModeUI').style.display = 'none';
            document.getElementById('mangaModeUI').style.display = 'block';
        }

        // ===== ナビバーの実際の高さを測り、ツールバー等の位置に反映 =====
        // （言語・フォント・画面幅で高さが変わるため、固定値ではボタンが隠れることがある）
        function syncNavHeight() {
            var nav = document.querySelector('.navbar-custom');
            if (nav && nav.offsetHeight) {
                document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
            }
            // リーダー/ビューアのツールバー実高も測る（ボタンの折返しで高さが変わるため）
            var tb = document.querySelector(isManga ? '.viewer-toolbar' : '.reader-toolbar');
            if (tb && tb.offsetHeight) {
                document.documentElement.style.setProperty('--toolbar-h', tb.offsetHeight + 'px');
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            syncNavHeight();
            setTimeout(syncNavHeight, 300); // navbar.js描画・フォント読込後にもう一度
        });
        window.addEventListener('load', function() { setTimeout(syncNavHeight, 100); });
        window.addEventListener('resize', syncNavHeight);
    </script>

        let currentLang = localStorage.getItem('preferredLanguage') || 'en';
function getL(obj, replacements = {}) {
            if (!obj) return '';
            let text = obj[currentLang] || obj['en'] || '';
            Object.keys(replacements).forEach(key => {
                text = text.replace(`{${key}}`, replacements[key]);
            });
            return text;
        }

        // Get work info from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        // apiWorkId: 実作品ID（あればAPIから読み込む）。無ければデモ表示のまま
        const apiWorkId = urlParams.get('workId') || urlParams.get('work_id') || urlParams.get('id') || null;
        const workId = apiWorkId || 'sample-work-id';
        const workTitle = urlParams.get('title') || document.getElementById('workTitle').textContent;

            document.getElementById('workTitle').textContent = urlParams.get('title');
        }

        // 作品ごとにしおり・メモ・最終ページを分けて保存する
        function storageKey(base) { return base + '_' + workId; }

        // State
        let currentPage = 1;
        let totalPages = 3;
        let loadedWork = null; // APIから読み込んだ作品データ
        // 前回の読書位置（初期表示のupdatePageInfoで上書きされる前に読んでおく）
        const savedLastPage = parseInt(localStorage.getItem(storageKey('reader_lastpage')) || '1', 10);
        let bookmarks = JSON.parse(localStorage.getItem(storageKey('reader_bookmarks')) || '[]');
        let notes = JSON.parse(localStorage.getItem(storageKey('reader_notes')) || '[]');
        let highlights = JSON.parse(localStorage.getItem(storageKey('reader_highlights')) || '[]');

        // ===== 実作品の読み込み（API接続） =====

        async function loadWorkFromApi() {
            var token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            showReaderNotice(getL(uiText.loadingContent));
            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/works/' + encodeURIComponent(apiWorkId) + '/full', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (resp.status === 401) { window.location.href = 'login.html'; return; }
                var data = await resp.json();
                if (resp.status === 403) {
                    showReaderNotice(getL(uiText.purchaseRequired), 'work-detail.html?id=' + encodeURIComponent(apiWorkId), getL(uiText.viewWorkPage));
                    return;
                }
                if (resp.status === 404) {
                    showReaderNotice(getL(uiText.workNotFound), 'browse.html', getL(uiText.viewWorkPage));
                    return;
                }
                if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));

                loadedWork = data.work;

                // マンガ作品はマンガビューアで開き直す（リンク元が?type=mangaを付けていなくても対応）
                if (loadedWork.content_type === 'manga') {
                    var mu = new URL(window.location.href);
                    mu.searchParams.set('type', 'manga');
                    window.location.replace(mu.toString());
                    return;
                }

                document.getElementById('workTitle').textContent = loadedWork.title || '';
                document.title = (loadedWork.title || 'Reader') + ' - AuctLect';
                renderWorkPages(paginateContent(loadedWork.content || ''), loadedWork);

                // アラビア語作品は自動でRTL表示にする
                if ((loadedWork.language || loadedWork.original_language) === 'ar') {
                    var rc = document.getElementById('readerContent');
                    rc.classList.remove('writing-horizontal', 'writing-vertical');
                    rc.classList.add('writing-rtl');
                    updateVerticalCursor();
                }

                // 前回の続きから再開
                if (savedLastPage >= 1 && savedLastPage <= totalPages) currentPage = savedLastPage;

                updateAiBadge();
                updatePageInfo();
            } catch (err) {
                console.error('Failed to load work:', err);
                showReaderNotice(getL(uiText.loadFailed), 'javascript:location.reload()', getL(uiText.retry));
            }
        }

        // ===== 見出し検出 =====

        // 記号だけの行（場面転換の「＊＊＊」等）は見出しにしない
        function isSymbolOnlyLine(s) {
            return /^[\s*＊※◆◇■□▲△●○★☆†‡=＝\-ー―—～〜・．.]+$/.test(s);
        }

        // 'strong': 第○章などの定型見出し / 'weak': 句読点のない短い行 / null: 本文
        //
        // isolated = 前後が空行（または本文の先頭・末尾）であること。
        // 詩や歌詞は「短くて句読点の無い行」が続くため、これを見ないと
        // 一行ごとに大きな見出しになり、そこで改ページまで起きてしまう。
        // 本物の見出しは前後を空けて置かれるので、その一点で見分ける。
        function detectHeading(s, isolated) {
            if (s.length > 35) return null;
            if (/^[「『（("'“‘・…―—]/.test(s)) return null;
            if (isSymbolOnlyLine(s)) return null;
            if (/^(第\s*[0-9０-９一二三四五六七八九十百千]+\s*(章|話|部|幕|節|編)|chapter\s+[0-9ivxlc]+|prologue|epilogue|プロローグ|エピローグ|序章|終章|序幕|終幕|まえがき|あとがき)/i.test(s)) return 'strong';
            if (isolated && s.length <= 25 && !/[。、．，！？!?.,:;：；]/.test(s)) return 'weak';
            return null;
        }

        // 挿絵マーカー: [[img src="/uploads/..." w="100" align="center"]]（1行1マーカー）
        var IMG_MARKER_RE = /^\[\[img\s+src="([^"<>\s]+)"(?:\s+w="(\d{1,3})")?(?:\s+align="(left|center|right)")?\s*\]\]$/;

        // 原稿を行ブロックに分解し見出しを判定する。
        // Word原稿由来の挿絵([[img ...]])・表([[table]]〜[[/table]])マーカーも解釈する
        function parseBlocks(text) {
            // 空行は本文には出さないが、「前後が空いているか」の判定に要るので
            // 捨てる前に覚えておく（詩の行を見出しと取り違えないため）
            var rawLines = String(text).split(/\r?\n/).map(function(s) { return s.trim(); });
            var lines = [], isolatedAt = [];
            rawLines.forEach(function(s, idx) {
                if (!s) return;
                var before = idx === 0 || rawLines[idx - 1] === '';
                var after = idx === rawLines.length - 1 || rawLines[idx + 1] === '';
                lines.push(s);
                isolatedAt.push(before && after);
            });

            var blocks = [];
            var i = 0;
            while (i < lines.length) {
                var s = lines[i];
                var im = s.match(IMG_MARKER_RE);
                if (im) {
                    // 外部サイトのURLは読み込まない（自サイトのアップロード画像のみ）
                    if (/^\/uploads\//.test(im[1])) {
                        blocks.push({ type: 'img', src: im[1], w: Math.min(parseInt(im[2] || '100', 10) || 100, 100), align: im[3] || 'center', heading: null, text: '' });
                    }
                    i++;
                    continue;
                }
                if (s === '[[table]]') {
                    var rows = [];
                    i++;
                    while (i < lines.length && lines[i] !== '[[/table]]') {
                        rows.push(lines[i].split(' | ').map(function(c) { return c.trim(); }));
                        i++;
                    }
                    if (i < lines.length) i++; // [[/table]] を読み飛ばす
                    if (rows.length) blocks.push({ type: 'table', rows: rows, heading: null, text: '' });
                    continue;
                }
                blocks.push({ heading: detectHeading(s, isolatedAt[i]), text: s });
                i++;
            }
            // 短い行が大半を占める作品（詩・歌詞など）では弱い見出し判定を無効化
            var weak = 0, textBlocks = 0;
            blocks.forEach(function(b) { if (!b.type) { textBlocks++; if (b.heading === 'weak') weak++; } });
            if (weak > 30 || weak > textBlocks * 0.2) {
                blocks.forEach(function(b) { if (b.heading === 'weak') b.heading = null; });
            }
            return blocks;
        }

        // 原稿テキストをページ（段落のかたまり）に分割する。見出しは新しいページの先頭から
        // 1文字あたりの「読む量」。日本語・中国語・韓国語の1文字は、
        // 英語の1文字よりずっと多くの内容を運ぶ（同じ小説が日本語2,044字＝英語5,445字）。
        // 文字数だけで区切ると、日本語は1ページに詰め込みすぎ、英語は薄くなる。
        var CJK_RE = /[぀-ヿ㐀-䶿一-鿿豈-﫿가-힯]/;
        var CJK_WEIGHT = 2.6;

        function readingWeight(s) {
            var w = 0;
            for (var i = 0; i < s.length; i++) w += CJK_RE.test(s.charAt(i)) ? CJK_WEIGHT : 1;
            return w;
        }

        function paginateContent(text) {
            var LIMIT = 2000; // 1ページあたりの「読む量」（英語の文字数に換算した目安）
            var blocks = parseBlocks(text);
            var pages = [];
            var cur = [], curLen = 0;

            function flush() {
                if (cur.length) { pages.push(cur); cur = []; curLen = 0; }
            }

            blocks.forEach(function(b) {
                // 挿絵・表はページをまたがない1ブロックとして扱う（文字数換算のコストで詰める）
                if (b.type === 'img' || b.type === 'table') {
                    var cost = b.type === 'img'
                        ? 600
                        : Math.min(200 + b.rows.reduce(function(n, r) { return n + r.join('').length; }, 0), LIMIT);
                    if (curLen > 0 && curLen + cost > LIMIT) flush();
                    cur.push(b);
                    curLen += cost;
                    return;
                }
                if (b.heading) flush(); // 章の始まりで改ページ
                var t = b.text;
                // 1ページを超える長い段落は文末で区切って分割
                while (readingWeight(t) > LIMIT) {
                    // 読む量がLIMITに届く位置を文字数に直してから、近くの文末で切る
                    var approx = Math.max(1, Math.floor(t.length * LIMIT / readingWeight(t)));
                    var cut = approx;
                    for (var i = approx; i > approx - 400 && i > 0; i--) {
                        if ('。．！？!?.'.indexOf(t.charAt(i - 1)) !== -1) { cut = i; break; }
                    }
                    flush();
                    pages.push([{ heading: null, text: t.slice(0, cut) }]);
                    t = t.slice(cut).trim();
                }
                if (!t) return;
                var tWeight = readingWeight(t);
                if (curLen > 0 && curLen + tWeight > LIMIT) flush();
                cur.push({ heading: b.heading, text: t });
                curLen += tWeight;
            });
            flush();
            if (!pages.length) pages.push([{ heading: null, text: '' }]);
            return pages;
        }

        // ===== ページ・表紙・目次の描画 =====

        let tocEntries = []; // [{ title, page }]

        // 分割したページをDOMに描画する（textContentでXSS対策）。表紙があれば1ページ目にする
        function renderWorkPages(pages, work) {
            var container = document.getElementById('readerContent');
            container.innerHTML = '';
            tocEntries = [];
            var pageNum = 1;

            var coverUrl = work && (work.cover_image || work.cover_image_url);
            if (coverUrl) {
                var coverDiv = document.createElement('div');
                coverDiv.className = 'page reader-cover';
                coverDiv.dataset.page = pageNum;
                coverDiv.style.display = 'none';
                var img = document.createElement('img');
                img.src = coverUrl;
                img.alt = work.title || '';
                coverDiv.appendChild(img);
                if (work.title) {
                    var coverTitle = document.createElement('h1');
                    coverTitle.textContent = work.title;
                    coverDiv.appendChild(coverTitle);
                }
                container.appendChild(coverDiv);
                pageNum++;
            }

            pages.forEach(function(blocks, idx) {
                var div = document.createElement('div');
                div.className = 'page';
                div.dataset.page = pageNum;
                div.style.display = 'none';
                // 表紙が無い場合は本文1ページ目の先頭にタイトルを表示
                if (!coverUrl && idx === 0 && work && work.title) {
                    var h1 = document.createElement('h1');
                    h1.textContent = work.title;
                    div.appendChild(h1);
                }
                blocks.forEach(function(b) {
                    var el;
                    if (b.type === 'img') {
                        // 挿絵: DOM生成のみ（innerHTML不使用）。srcは/uploads/配下に限定済み
                        el = document.createElement('div');
                        el.className = 'reader-illustration align-' + b.align;
                        // 挿絵は数枚程度なので全て先読みする（ページをめくった瞬間に表示される）
                        var ilImg = document.createElement('img');
                        ilImg.src = (window.API_ORIGIN || '') + b.src;
                        ilImg.style.width = b.w + '%';
                        ilImg.alt = '';
                        el.appendChild(ilImg);
                        div.appendChild(el);
                        return;
                    }
                    if (b.type === 'table') {
                        el = document.createElement('div');
                        el.className = 'reader-table-wrap';
                        var tb = document.createElement('table');
                        tb.className = 'reader-table';
                        b.rows.forEach(function(r, ri) {
                            var tr = document.createElement('tr');
                            r.forEach(function(c) {
                                var td = document.createElement(ri === 0 ? 'th' : 'td');
                                td.textContent = c;
                                tr.appendChild(td);
                            });
                            tb.appendChild(tr);
                        });
                        el.appendChild(tb);
                        div.appendChild(el);
                        return;
                    }
                    if (b.heading) {
                        el = document.createElement('h2');
                        tocEntries.push({ title: b.text, page: pageNum });
                    } else {
                        el = document.createElement('p');
                    }
                    el.textContent = b.text;
                    div.appendChild(el);
                });
                container.appendChild(div);
                pageNum++;
            });

            totalPages = pageNum - 1;
            currentPage = 1;
            renderToc();
        }

        // 目次パネルを描画。見出しが無い作品ではContentsボタン自体を隠す

        function showTouchHint() {
            if ('ontouchstart' in window) {
                const hint = document.getElementById('touchHint');
                hint.classList.add('show');
                setTimeout(() => hint.classList.remove('show'), 4000);
            }
        }

        function initTouchEvents() {
            const main = document.getElementById('readerMain');
            
            main.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
                isSwiping = false;
                isLongPress = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 500);
            }, { passive: true });

            main.addEventListener('touchmove', function(e) {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                const diffX = e.changedTouches[0].screenX - touchStartX;
                const diffY = Math.abs(e.changedTouches[0].screenY - touchStartY);
                if (Math.abs(diffX) > 30 && diffY < 100) {
                    isSwiping = true;
                    if (diffX > 50 && currentPage > 1) {
                        document.getElementById('swipeLeft').classList.add('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    } else if (diffX < -50 && currentPage < totalPages) {
                        document.getElementById('swipeRight').classList.add('show');
                        document.getElementById('swipeLeft').classList.remove('show');
                    } else {
                        document.getElementById('swipeLeft').classList.remove('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    }
                }
            }, { passive: true });

            main.addEventListener('touchend', function(e) {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                document.getElementById('swipeLeft').classList.remove('show');
                document.getElementById('swipeRight').classList.remove('show');
                touchEndX = e.changedTouches[0].screenX;
                const diffX = touchEndX - touchStartX;
                if (isSwiping && Math.abs(diffX) > 80) {
                    if (diffX > 0) prevPage(); else nextPage();
                }
                if (isLongPress) setTimeout(() => handleTextSelection(), 100);
                isSwiping = false;
            }, { passive: true });

            document.getElementById('readerContent').addEventListener('mouseup', function(e) {
                setTimeout(() => handleTextSelection(), 10);
            });
        }

        function handleTextSelection() {
            const selection = window.getSelection();
            selectedText = selection.toString().trim();
            
            if (selectedText.length > 0) {
                const toolbar = document.getElementById('highlightToolbar');
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();
                
                let top = rect.top - 50 + window.scrollY;
                let left = rect.left + (rect.width / 2) - 110;
                
                if (top < 60) top = rect.bottom + 10 + window.scrollY;
                if (left < 10) left = 10;
                if (left > window.innerWidth - 250) left = window.innerWidth - 250;
                
                toolbar.style.top = top + 'px';
                toolbar.style.left = left + 'px';
                toolbar.classList.add('show');
            } else {
                document.getElementById('highlightToolbar').classList.remove('show');
            }
        }

        function reportTranslationIssue() {
            const selection = window.getSelection();
            const text = selection.toString().trim() || selectedText;
            
            if (!text) {
                alert(getL(uiText.selectText));
                return;
            }
            
            const reportUrl = new URL('feedback/report.html', window.location.origin + '/pages/');
            reportUrl.searchParams.set('workId', workId);
            reportUrl.searchParams.set('text', text);
            reportUrl.searchParams.set('page', currentPage);
            reportUrl.searchParams.set('title', document.getElementById('workTitle').textContent);
            
            document.getElementById('highlightToolbar').classList.remove('show');
            window.location.href = reportUrl.toString();
        }

        function applyHighlight(color) {
            const selection = window.getSelection();
            if (selection.rangeCount > 0 && selection.toString().trim()) {
                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.className = `highlighted highlight-${color}`;
                span.dataset.highlightId = Date.now();
                try {
                    range.surroundContents(span);
                    highlights.push({ id: span.dataset.highlightId, text: selection.toString(), color: color, page: currentPage });
                    localStorage.setItem(storageKey('reader_highlights'), JSON.stringify(highlights));
                } catch (e) { alert(getL(uiText.cannotHighlight)); }
            }
            document.getElementById('highlightToolbar').classList.remove('show');
            window.getSelection().removeAllRanges();
        }

        function removeHighlight() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const parent = selection.anchorNode.parentElement;
                if (parent && parent.classList.contains('highlighted')) {
                    const text = document.createTextNode(parent.textContent);
                    parent.parentNode.replaceChild(text, parent);
                }
            }
            document.getElementById('highlightToolbar').classList.remove('show');
        }

            menu.classList.toggle('show');

            document.querySelectorAll('.settings-section:first-child .settings-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function setTheme(theme) {
            document.body.classList.remove('theme-light', 'theme-dark', 'theme-sepia');
            document.body.classList.add('theme-' + theme);
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.theme-btn').classList.add('active');

            const content = document.getElementById('readerContent');
            content.classList.remove('writing-horizontal', 'writing-vertical', 'writing-rtl');
            content.classList.add('writing-' + mode);
            updateVerticalCursor();
            updateReaderHeight();
            document.querySelectorAll('.settings-section:nth-child(3) .settings-btn').forEach(btn => btn.classList.remove('active'));

        function updatePageInfo() {
            document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
            document.querySelectorAll('.page').forEach(page => {
                page.style.display = page.dataset.page == currentPage ? 'block' : 'none';
            });
            updateReadingProgress();
            // 次回同じページから再開できるよう現在ページを保存
            localStorage.setItem(storageKey('reader_lastpage'), currentPage);
        }

        function updateReadingProgress() {
            const fill = document.getElementById('readingProgressFill');
            if (fill) fill.style.width = (currentPage / totalPages) * 100 + '%';
        }

        function nextPage() { if (currentPage < totalPages) { currentPage++; updatePageInfo(); window.scrollTo(0, 0); } }
        function prevPage() { if (currentPage > 1) { currentPage--; updatePageInfo(); window.scrollTo(0, 0); } }

        function toggleBookmarks() {
            const panel = document.getElementById('bookmarksPanel');
            panel.classList.toggle('show');
            document.getElementById('settingsPanel').classList.remove('show');
            document.getElementById('searchPanel').classList.remove('show');
            document.getElementById('tocPanel').classList.remove('show');

        function addBookmark() {
            const content = document.querySelector(`.page[data-page="${currentPage}"]`);
            const preview = content ? content.textContent.substring(0, 80).trim() + '...' : '';
            const bookmark = { id: Date.now(), page: currentPage, title: `${getL(uiText.page)} ${currentPage}`, preview: preview, createdAt: new Date().toISOString() };
            bookmarks.push(bookmark);
            localStorage.setItem(storageKey('reader_bookmarks'), JSON.stringify(bookmarks));
            renderBookmarks();
            const btn = event.target.closest('.btn-toolbar');

        function renderBookmarks() {
            const list = document.getElementById('bookmarksList');

                list.innerHTML = `<p style="text-align: center; color: var(--reader-secondary); padding: 1rem; font-size: 0.85rem;">${getL(uiText.noBookmarks)}</p>`;
                return;

                <div class="bookmark-item" onclick="goToBookmark(${b.page})">

            list.innerHTML = notes.map(n => `

        function deleteNote(id) { notes = notes.filter(n => n.id !== id); localStorage.setItem(storageKey('reader_notes'), JSON.stringify(notes)); renderNotes(); }

        function exportNotes(format) {
            if (notes.length === 0) { alert(getL(uiText.noNotes)); return; }
            const title = document.getElementById('workTitle').textContent;
            const exportedLabel = getL(uiText.exported);
            const notesLabel = getL(uiText.notes);
            const pageLabel = getL(uiText.page);
            let content = '', filename = '', mimeType = '';
            if (format === 'txt') {
                content = `${notesLabel}: ${title}\n${exportedLabel}: ${new Date().toLocaleString()}\n${'='.repeat(40)}\n\n`;
                notes.forEach((n, i) => { content += `[${i + 1}] ${pageLabel} ${n.page} - ${new Date(n.createdAt).toLocaleString()}\n${n.text}\n\n`; });
                filename = 'notes.txt'; mimeType = 'text/plain';
            } else if (format === 'word') {
                content = `<html><head><meta charset="UTF-8"><style>body{font-family:Arial;}.note{margin:15px 0;padding:10px;background:#f5f5f5;border-left:4px solid #8B7355;}</style></head><body><h1>${notesLabel}: ${title}</h1><p>${exportedLabel}: ${new Date().toLocaleString()}</p>`;
                notes.forEach((n, i) => { content += `<div class="note"><small>${pageLabel} ${n.page} - ${new Date(n.createdAt).toLocaleString()}</small><p>${n.text}</p></div>`; });
                content += '</' + 'body></' + 'html>'; filename = 'notes.doc'; mimeType = 'application/msword';
            } else if (format === 'json') {
                content = JSON.stringify({ workTitle: title, exportedAt: new Date().toISOString(), notes }, null, 2);
                filename = 'notes.json'; mimeType = 'application/json';
            }
            const blob = new Blob([content], { type: mimeType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        // RTL mode check

        /**
         * ページが左へ進む本かどうか。
         *
         * 縦書きの日本語（および中国語）の本は右から左へ読み進むので、
         * 「次のページ」は左側にある。アラビア語も同じ向き。
         * 横書きは英語と同じで右へ進む。
         */
        function isRightToLeftBook() {

        // Click Zone Navigation
        function initClickZones() {
            var leftZone = document.getElementById('clickZoneLeft');
            var rightZone = document.getElementById('clickZoneRight');
            if (leftZone) {
                leftZone.addEventListener('click', function() {
                    if (!hasDragged) { isRightToLeftBook() ? nextPage() : prevPage(); }
                });
            }
            if (rightZone) {
                rightZone.addEventListener('click', function() {
                    if (!hasDragged) { isRightToLeftBook() ? prevPage() : nextPage(); }
                });
            }
        }

        // ===== 縦書きのときの「掴んで動かす」 =====
        // 縦書きは文字が右から左へ流れるため、画面は横方向にスクロールする。
        // マウスの縦回転や下のバーだけでは動かしづらいので、本文を直接掴めるようにする。
        var vPan = null;

        function startVerticalPan(e) {
            var rc = document.getElementById('readerContent');
            if (!rc) return;
            vPan = { startX: e.clientX, startScroll: rc.scrollLeft, moved: false };
            rc.style.cursor = 'grabbing';
            e.preventDefault();   // 掴んでいる間に文字が選択されるのを防ぐ
        }

        function initVerticalPan() {
            var rc = document.getElementById('readerContent');
            if (!rc) return;

            document.addEventListener('mousemove', function (e) {
                if (!vPan) return;
                var dx = e.clientX - vPan.startX;
                if (Math.abs(dx) > 3) vPan.moved = true;
                // 掴んだ場所が指についてくるように、動かした分だけ逆にスクロールする
                rc.scrollLeft = vPan.startScroll - dx;
            });

            ['mouseup', 'mouseleave'].forEach(function (ev) {
                document.addEventListener(ev, function () {
                    if (!vPan) return;
                    vPan = null;
                    rc.style.cursor = isVerticalMode() ? 'grab' : '';
                });
            });

            // 縦書きのときはマウスホイールの上下を横移動に読み替える
            rc.addEventListener('wheel', function (e) {
                if (!isVerticalMode()) return;
                if (e.deltaY === 0) return;
                rc.scrollLeft -= e.deltaY;   // 手前に回すと読み進む向き（左）へ
                e.preventDefault();
            }, { passive: false });
        }

        // 表示モードを変えたら、掴めることが分かるようにカーソルを変える
        function updateVerticalCursor() {
            var rc = document.getElementById('readerContent');
            if (rc) rc.style.cursor = isVerticalMode() ? 'grab' : '';
        }

        /**
         * 縦書きの高さを実際の画面から測って決める。
         * ツールバーの高さは画面幅で変わるので、固定値では携帯で本文が切れる。
         */
        function updateReaderHeight() {
            var rc = document.getElementById('readerContent');
            if (!rc) return;
            var top = rc.getBoundingClientRect().top;                    // 上のツールバー等の分
            var footer = document.querySelector('.reader-footer, .notes-section');
            var bottom = footer ? footer.getBoundingClientRect().height : 0;
            var h = Math.max(240, window.innerHeight - top - bottom - 16);
            document.documentElement.style.setProperty('--reader-vh', h + 'px');
        }
        window.addEventListener('resize', updateReaderHeight);
        window.addEventListener('orientationchange', function () { setTimeout(updateReaderHeight, 200); });

        // Mouse Drag Navigation
        function initMouseDrag() {
            var DRAG_THRESHOLD = 80;

            // 画面全体で受ける。
            // ページ送りの当たり判定（左右25%ずつ）は本文の外側に重ねてあるため、
            // 本文にだけ紐づけていると画面の半分でドラッグが始まらなかった。
            // 動かさずに離せばクリック扱いのままなので、当たり判定の上でも掴んでよい
            document.addEventListener('mousedown', function(e) {
                if (e.target.closest('.reader-toolbar, .notes-section, .settings-panel, .bookmarks-panel, .search-panel, .highlight-toolbar, .navbar, button, a, input, textarea, select')) return;
                if (e.detail >= 2) return; // Allow double-click text selection
                // 縦書きは横スクロールで読む。ページ送りではなく、掴んで動かす操作にする
                // （以前はここで何もせず、画面下のバーでしか移動できなかった）
                if (isVerticalMode()) { startVerticalPan(e); return; }
                isDragging = true;
                hasDragged = false;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var diffX = e.clientX - dragStartX;
                var diffY = Math.abs(e.clientY - dragStartY);

                if (Math.abs(diffX) > 10 && !hasDragged) {
                    window.getSelection().removeAllRanges();
                    hasDragged = true;
                }

                if (hasDragged && Math.abs(diffX) > 30 && diffY < 100) {
                    if (diffX > 50 && currentPage > 1) {
                        document.getElementById('swipeLeft').classList.add('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    } else if (diffX < -50 && currentPage < totalPages) {
                        document.getElementById('swipeRight').classList.add('show');
                        document.getElementById('swipeLeft').classList.remove('show');
                    } else {
                        document.getElementById('swipeLeft').classList.remove('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    }
                }
            });

            document.addEventListener('mouseup', function(e) {
                if (!isDragging) return;
                isDragging = false;
                document.getElementById('swipeLeft').classList.remove('show');
                document.getElementById('swipeRight').classList.remove('show');

                if (hasDragged) {
                    var diffX = e.clientX - dragStartX;
                    if (Math.abs(diffX) > DRAG_THRESHOLD) {
                        var rtl = isRightToLeftBook();
                        if (diffX > 0) { rtl ? nextPage() : prevPage(); }
                        else { rtl ? prevPage() : nextPage(); }
                    }
                    setTimeout(function() { hasDragged = false; }, 50);
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
            else if (e.ctrlKey && e.key === 'f') { e.preventDefault(); toggleSearch(); }
            else if (e.key === 'Escape') {
                document.getElementById('settingsPanel').classList.remove('show');
                document.getElementById('bookmarksPanel').classList.remove('show');
                document.getElementById('searchPanel').classList.remove('show');
                document.getElementById('tocPanel').classList.remove('show');
                document.getElementById('highlightToolbar').classList.remove('show');
            }
        });

        document.addEventListener('click', function(e) {
            if (e.target.closest('.click-zone')) return; // Don't close panels when clicking navigation zones
            if (!e.target.closest('.settings-panel, [onclick*="toggleSettings"]')) document.getElementById('settingsPanel').classList.remove('show');
            if (!e.target.closest('.bookmarks-panel, [onclick*="toggleBookmarks"]')) document.getElementById('bookmarksPanel').classList.remove('show');
            if (!e.target.closest('.search-panel, [onclick*="toggleSearch"]')) document.getElementById('searchPanel').classList.remove('show');
            if (!e.target.closest('#tocPanel, [onclick*="toggleToc"]')) document.getElementById('tocPanel').classList.remove('show');
            if (!e.target.closest('.mobile-menu-dropdown')) document.getElementById('mobileMenu').classList.remove('show');
        });
    </script>
