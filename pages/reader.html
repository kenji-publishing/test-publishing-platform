<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202609112048">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202609112048">
    <title>Reader - AuctLect</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/variables.css?v=202609112048" rel="stylesheet"><!-- navbar.cssが使う--color-*変数の定義（無いとドロップダウンが透明になる） -->
    <link href="../css/navbar.css?v=202609112048" rel="stylesheet">
    <link href="../css/mobile-fixes.css?v=202609112048" rel="stylesheet">

    <style>
        :root {
            --reader-bg: #FFFFFF;
            --reader-text: #2D2A26;
            --reader-secondary: #6B6560;
            --reader-border: #E8E4E0;
            --reader-accent: #8B7355;
            --reader-highlight-yellow: rgba(255, 235, 59, 0.4);
            --reader-highlight-green: rgba(129, 199, 132, 0.4);
            --reader-highlight-blue: rgba(100, 181, 246, 0.4);
            --reader-highlight-pink: rgba(244, 143, 177, 0.4);
            --font-size: 18px;
            --line-height: 1.8;
        }

        .theme-light { --reader-bg: #FFFFFF; --reader-text: #2D2A26; --reader-secondary: #6B6560; --reader-border: #E8E4E0; }
        .theme-dark { --reader-bg: #1A1A1A; --reader-text: #E8E4E0; --reader-secondary: #A0A0A0; --reader-border: #333333; }
        .theme-sepia { --reader-bg: #F4ECD8; --reader-text: #5C4B37; --reader-secondary: #8B7355; --reader-border: #D4C4A8; }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans JP', 'Noto Sans Arabic', sans-serif;
            margin: 0; padding: 0;
            background: var(--reader-bg);
            color: var(--reader-text);
            transition: all 0.3s ease;
            overflow-x: clip;
        }

        .reader-toolbar {
            /* --nav-h はナビバーの実際の高さをJSが測って設定（フォールバック80px） */
            position: fixed; top: var(--nav-h, 80px); left: 0; right: 0;
            background: var(--reader-bg);
            border-bottom: 1px solid var(--reader-border);
            padding: 0.5rem 1rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }

        .toolbar-left, .toolbar-center, .toolbar-right { display: flex; align-items: center; gap: 0.5rem; }

        .btn-toolbar {
            background: transparent;
            border: 1px solid var(--reader-border);
            color: var(--reader-text);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 0.25rem;
            font-size: 0.9rem;
        }

        .btn-toolbar:hover, .btn-toolbar.active { background: var(--reader-accent); color: white; border-color: var(--reader-accent); }

        .back-link { color: var(--reader-text); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: 500; }
        .back-link:hover { color: var(--reader-accent); }

        .work-title { font-weight: 600; font-size: 0.95rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .ai-badge-reader {
            display: none;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            background: rgba(139, 115, 85, 0.12);
            color: var(--reader-accent);
            border: 1px solid var(--reader-accent);
            white-space: nowrap;
        }

        /* 表紙は段の境目で割らせない。段組みは中身を分割してよい決まりなので、
           指定しないと絵が上下（縦書きでは左右）に割れる */
        .reader-cover {
            /* 段の高さちょうどに収める。1pxでもはみ出すと、
               「割らない」指定より「入りきらない」が優先されて2ページに割れる */
            height: 100%; box-sizing: border-box;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 0.5rem 0;
            break-inside: avoid; -webkit-column-break-inside: avoid;
            break-after: column; -webkit-column-break-after: always;
        }
        .reader-cover img {
            max-width: 100%;
            /* 題名と余白のぶんを残して収める */
            max-height: 78%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .reader-cover h1 { margin-top: 1.5rem; font-size: 1.6rem; }

        /* 挿絵・表（Word原稿由来のマーカーから描画） */
        .reader-illustration { margin: 1.2rem 0; }
        .reader-illustration.align-left { text-align: left; }
        .reader-illustration.align-center { text-align: center; }
        .reader-illustration.align-right { text-align: right; }
        .reader-illustration img { max-width: 100%; height: auto; border-radius: 6px; }
        .reader-table-wrap { margin: 1.2rem 0; overflow-x: auto; }
        .reader-table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
        .reader-table th, .reader-table td { border: 1px solid rgba(120, 105, 90, 0.45); padding: 0.4rem 0.6rem; text-align: left; }
        .reader-table th { background: rgba(139, 115, 85, 0.14); font-weight: 600; }
        /* 縦書きモードでも挿絵・表は横書きのまま表示する */
        .writing-vertical .reader-illustration,
        .writing-vertical .reader-table-wrap { writing-mode: horizontal-tb; }

        .toc-item-page { float: right; color: var(--reader-secondary); font-size: 0.8rem; margin-left: 0.5rem; }

        .lang-selector-reader {
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--reader-border);
            border-radius: 6px;
            background: transparent;
            color: var(--reader-text);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .settings-panel, .bookmarks-panel, .search-panel {
            position: fixed; top: calc(var(--nav-h, 80px) + var(--toolbar-h, 55px) + 4px);
            background: var(--reader-bg);
            border: 1px solid var(--reader-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 999;
            display: none;
            /* 画面自体は固定してあるので、パネルの中だけ動かせるようにする。
               これが無いと、項目が画面に収まらない携帯で下の設定に手が届かない */
            max-height: calc(100vh - var(--nav-h, 80px) - var(--toolbar-h, 55px) - var(--notes-h, 0px) - 16px);
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .settings-panel.show, .bookmarks-panel.show, .search-panel.show { display: block; }

        .settings-panel { right: 0.5rem; width: 300px; max-width: calc(100vw - 1rem); padding: 1rem; }
        .bookmarks-panel { left: 0.5rem; width: 280px; max-width: calc(100vw - 1rem); max-height: calc(100vh - 250px); overflow: hidden; display: none; }
        .bookmarks-panel.show { display: flex; flex-direction: column; }
        .search-panel { left: 50%; transform: translateX(-50%); width: 350px; max-width: calc(100vw - 1rem); padding: 0.75rem; }

        .settings-section { margin-bottom: 1rem; }
        .settings-label { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--reader-secondary); }
        .settings-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }

        .settings-btn {
            flex: 1; min-width: 60px; padding: 0.5rem;
            border: 1px solid var(--reader-border); border-radius: 6px;
            background: transparent; color: var(--reader-text);
            cursor: pointer; font-size: 0.8rem;
        }
        .settings-btn:hover { border-color: var(--reader-accent); }
        .settings-btn.active { background: var(--reader-accent); color: white; border-color: var(--reader-accent); }

        .theme-btn { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; padding: 0.5rem; }
        .theme-preview { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--reader-border); }
        .theme-preview.light { background: #FFFFFF; }
        .theme-preview.dark { background: #1A1A1A; }
        .theme-preview.sepia { background: #F4ECD8; }

        /* 画面そのものは動かさない。動くのはページの中身だけ（KindleやGoogle Booksと同じ）。
           上下に払っても画面がついてこないので、ページ送りと取り違えることがなくなる */
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
        .reader-main {
            /* ナビバーは sticky（場所を取る）ので、ここで高さを足すと二重に数えることになり、
               本文の上に2行ぶんほどの空きができる。足すのは固定表示のツールバーの分だけ */
            padding-top: calc(var(--toolbar-h, 50px) + 12px);
            padding-bottom: 0;
            padding-left: 24px; padding-right: 24px;
            height: 100%;
            overflow: hidden;
            touch-action: none;   /* 画面を引きずって動かせないようにする */
        }

        /* 本文の表示領域。ここに入るぶんが1ページで、ページの中は動かさない。
           収まらないぶんは横（次のページ）へ送られ、はみ出した先は隠れている */
        .reader-content {
            position: relative;
            /* 縦書きでは width が「行の流れる向き」ではなく紙の横幅にあたる。
               max-width だけだと中身に合わせて画面より広くなり、両端が切れる。
               100% で画面の幅に固定する */
            width: 100%; max-width: 900px; margin: 0 auto;
            height: var(--reader-vh, calc(100vh - 300px));
            overflow: hidden;
            /* 左右の余白は外側（reader-main）で取る。
               枠の内側に余白を置くと、最後のページまで送りきれない */
            padding: 0;
            font-size: var(--font-size); line-height: var(--line-height);
            -webkit-user-select: text; user-select: text;
            /* 横方向は自分で扱う。ブラウザの「戻る」に取られないようにもする */
            touch-action: pan-y;
            overscroll-behavior-x: contain;
        }
        .reader-flow { height: 100%; }

        /* 連続スクロール表示。ページで区切らず、上下（縦書きは左右）に流す。
           ページ送りが無いので、めくる操作と取り違えることがない */
        body.reader-scroll .reader-content { overflow-y: auto; overflow-x: hidden; }
        body.reader-scroll .writing-vertical { overflow-x: auto; overflow-y: hidden; }
        body.reader-scroll .reader-flow { height: auto; }
        body.reader-scroll .writing-vertical .reader-flow { height: 100%; }
        body.reader-scroll .reader-edge-mask { display: none; }
        body.reader-scroll .page-nav { display: none; }
        /* 指で流せるようにする。ページ送りのときは自前で扱うため止めてある */
        body.reader-scroll .reader-main { touch-action: auto; }
        body.reader-scroll .reader-content { touch-action: pan-y; }
        body.reader-scroll .writing-vertical { touch-action: pan-x; }
        /* ページに入りきらなかった行を隠す。地の色で塗るので余白に見える */
        .reader-edge-mask {
            position: absolute; top: 0; bottom: 0; width: 0;
            background: var(--reader-bg); z-index: 2; pointer-events: none;
        }

        /* 横書き・アラビア語: 1段＝1画面。段の幅と間隔はJSが画面から決める */
        .writing-horizontal .reader-flow,
        .writing-rtl .reader-flow { column-fill: auto; }
        /* 章の始まりは次のページの頭から（縦書きは alignHeadingsToPages が行う） */
        .writing-horizontal .reader-flow h2,
        .writing-rtl .reader-flow h2 { break-before: column; -webkit-column-break-before: always; }
        .reader-flow > :first-child { break-before: auto; -webkit-column-break-before: auto; }
        .reader-flow img, .reader-flow .reader-table-wrap { break-inside: avoid; }

        .writing-horizontal { writing-mode: horizontal-tb; direction: ltr; }
        .writing-vertical { writing-mode: vertical-rl; direction: ltr; }
        .writing-rtl { writing-mode: horizontal-tb; direction: rtl; font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', serif; }
        body, .reader-main { overscroll-behavior-x: contain; }
        /* サイト共通のフッターは本を読む画面には出さない（本文の下に重なって見える） */
        #footer-container { display: none; }

        /* 画面を広げても1行が長くなりすぎないようにする。
           長い行は目が戻る位置を見失うので、読みにくくなる（Google Booksで起きる） */
        .writing-horizontal .reader-flow p,
        .writing-rtl .reader-flow p { max-width: 34em; }
        .writing-vertical .reader-flow p { max-height: 34em; }
        /* 縦書きは行の並びを崩さないことが最優先。段落・見出しの間隔を
           行の整数本ぶんに揃えると、ページの切れ目が必ず行と行の間に来る */
        /* margin-block-* は縦書きでは「行の流れる向き」の余白＝行と行の間隔になる。
           ブラウザの既定（1em）が残っていると、段落の変わり目だけ行の間隔が広がり、
           行の並びがずれてページの切れ目が行の途中に来る */
        /* 大きい文字（見出し）は行の枠から数pxはみ出す。
           読み始めの端で切れないよう、わずかに余裕を持たせる */
        .writing-vertical .reader-flow { padding-block-start: 6px; }
        .writing-vertical .reader-flow p {
            margin-block-start: 0;
            margin-block-end: var(--v-para-gap, 0px);
        }
        .writing-vertical .reader-flow h1,
        .writing-vertical .reader-flow h2,
        .writing-vertical .reader-flow h3 {
            margin-block-start: 0;
            margin-block-end: var(--v-line, 0px);
            /* 大きい文字は枠より数px手前へはみ出す。内側に寄せておかないと、
               章の頭でページを切ったとき、見出しの端が前のページに残る */
            padding-block-start: 6px;
        }

        /* 本だけを見たいときのために、上のバーを隠せるようにする（中央をタップ）。
           下のメモ欄は残す */
        body.reader-immersive #navbar-container,
        body.reader-immersive .navbar-custom,
        body.reader-immersive .reader-toolbar { display: none; }
        /* 全画面のときはバーが無いぶん、1行ぶんの余裕を上に取る。
           上端に貼りついていると1行目が読みにくい */
        body.reader-immersive .reader-main { padding-top: calc(var(--font-size, 18px) * 1.8); }
        /* 全画面ではバーが無いぶん、パネルも上から始めて高さを使える */
        body.reader-immersive .settings-panel,
        body.reader-immersive .bookmarks-panel,
        body.reader-immersive .search-panel {
            top: 8px;
            max-height: calc(100vh - var(--notes-h, 0px) - 24px);
        }
        .immersive-hint {
            position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: #fff; padding: 0.3rem 0.8rem;
            border-radius: 999px; font-size: 0.75rem; z-index: 1200;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .immersive-hint.show { opacity: 1; }

        /* 文字の大きさは行間の「基準」まで。実際の行間は基準×倍率（読者が選ぶ） */
        .text-small { --font-size: 14px; --line-base: 1.7; }
        .text-medium { --font-size: 18px; --line-base: 1.8; }
        .text-large { --font-size: 22px; --line-base: 1.9; }
        .text-xlarge { --font-size: 26px; --line-base: 2.0; }
        body { --leading: 1; --line-height: calc(var(--line-base, 1.8) * var(--leading, 1)); }
        .leading-tight { --leading: 0.86; }
        .leading-normal { --leading: 1; }
        .leading-loose { --leading: 1.18; }

        /* 左右の余白。狭くすれば1行が長くなり、広くすれば本の余白のように見える */
        .margin-narrow .reader-main { padding-left: 8px; padding-right: 8px; }
        .margin-normal .reader-main { padding-left: 24px; padding-right: 24px; }
        .margin-wide .reader-main { padding-left: 48px; padding-right: 48px; }
        @media (max-width: 768px) {
            .margin-narrow .reader-main { padding-left: 4px; padding-right: 4px; }
            .margin-normal .reader-main { padding-left: 16px; padding-right: 16px; }
            .margin-wide .reader-main { padding-left: 32px; padding-right: 32px; }
        }

        .reader-content p { margin-bottom: 1.5em; text-align: justify; }
        /* 段落の見せ方は読者が選ぶ。紙の本は字下げ、ウェブ記事は行あけ、と慣習が違う */
        .para-indent .reader-content p { margin-bottom: 0; text-indent: 1em; }
        .para-spaced .reader-content p { margin-bottom: 1.5em; text-indent: 0; }
        .para-both .reader-content p { margin-bottom: 0.75em; text-indent: 1em; }
        /* 章の書き出しは下げない（本の組版の慣習）。見出しの直後がそれにあたる */
        .para-indent .reader-content :is(h1, h2, h3) + p,
        .para-both .reader-content :is(h1, h2, h3) + p { text-indent: 0; }
        .reader-content h1, .reader-content h2, .reader-content h3 { margin-top: 1.5em; margin-bottom: 0.75em; }

        .highlight-yellow { background: var(--reader-highlight-yellow); }
        .highlight-green { background: var(--reader-highlight-green); }
        .highlight-blue { background: var(--reader-highlight-blue); }
        .highlight-pink { background: var(--reader-highlight-pink); }
        .highlighted { cursor: pointer; border-radius: 2px; padding: 0 2px; }

        .highlight-toolbar {
            position: fixed;
            background: var(--reader-bg);
            border: 1px solid var(--reader-border);
            border-radius: 25px;
            padding: 0.5rem 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 1001;
            flex-direction: row;
            gap: 0.5rem;
            align-items: center;
        }
        .highlight-toolbar.show { display: flex; }

        /* 選んだ範囲の両端につまむ丸を出す。携帯には文字を選ぶ手がかりが要る */
        .sel-handle {
            position: fixed; width: 26px; height: 26px;
            margin-left: -13px; margin-top: -3px;
            border-radius: 50%; background: var(--reader-accent);
            border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            display: none; z-index: 1002; touch-action: none;
        }
        .sel-handle.show { display: block; }

        .highlight-color-btn {
            width: 32px; height: 32px;
            border: 2px solid var(--reader-border); border-radius: 50%;
            cursor: pointer; transition: transform 0.2s;
        }
        .highlight-color-btn:hover { transform: scale(1.15); }
        .highlight-color-btn.yellow { background: var(--reader-highlight-yellow); }
        .highlight-color-btn.green { background: var(--reader-highlight-green); }
        .highlight-color-btn.blue { background: var(--reader-highlight-blue); }
        .highlight-color-btn.pink { background: var(--reader-highlight-pink); }

        .highlight-remove-btn, .highlight-report-btn {
            width: 32px; height: 32px;
            border: 1px solid var(--reader-border); border-radius: 50%;
            background: transparent; color: var(--reader-text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
        }
        
        .highlight-report-btn {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }
        .highlight-report-btn:hover {
            background: #c82333;
            transform: scale(1.1);
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--reader-border);
            margin: 0 4px;
        }

        .bookmarks-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--reader-border);
            font-weight: 600; font-size: 0.9rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .bookmarks-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .bookmark-item { padding: 0.6rem; border: 1px solid var(--reader-border); border-radius: 8px; margin-bottom: 0.4rem; cursor: pointer; }
        .bookmark-item:hover { background: rgba(139, 115, 85, 0.1); border-color: var(--reader-accent); }
        .bookmark-title { font-weight: 500; font-size: 0.85rem; margin-bottom: 0.2rem; }
        .bookmark-preview { font-size: 0.75rem; color: var(--reader-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bookmark-delete { float: right; background: none; border: none; color: var(--reader-secondary); cursor: pointer; padding: 0.2rem; }

        .notes-section {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--reader-bg);
            border-top: 1px solid var(--reader-border);
            z-index: 998;
        }
        .notes-header { padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid var(--reader-border); }
        .notes-header h4 { margin: 0; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
        .notes-toggle { background: none; border: none; color: var(--reader-text); cursor: pointer; font-size: 1rem; padding: 0.25rem; }
        .notes-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .notes-content.expanded { max-height: 280px; }
        .notes-inner { padding: 0.75rem; }
        .note-input-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .note-input { flex: 1; padding: 0.6rem; border: 1px solid var(--reader-border); border-radius: 8px; font-size: 16px; background: var(--reader-bg); color: var(--reader-text); resize: none; -webkit-appearance: none; }

        .swipe-indicator {

        .touch-hint {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);

        /* Click Zone Navigation */
        .click-zone {
            position: fixed;
            top: 126px;
            bottom: 0;
            z-index: 50;
            cursor: pointer;
        }
        .click-zone-left { left: 0; width: 25%; }
        .click-zone-right { right: 0; width: 25%; }

        /* 下部のスライダー。今どこを読んでいるかが見え、つまんで移動できる。
           メモ欄の上に置く（重ねると、めくるつもりでメモ欄を触ってしまう） */
        .reading-progress-bar {
            position: fixed;
            bottom: var(--notes-h, 0px);
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(0, 0, 0, 0.1);
            z-index: 1100;
            /* 指で掴める高さを確保する（見た目は3pxのまま） */
            padding: 12px 0;
            margin-bottom: -12px;
            box-sizing: content-box;
            cursor: pointer;
            touch-action: none;
        }
        .reading-progress-bar.dragging .reading-progress-fill { transition: none; }
        /* つまんでいる位置を示す丸 */
        .progress-knob {
            position: absolute; bottom: 12px; width: 14px; height: 14px;
            margin-left: -7px; margin-bottom: -5px; border-radius: 50%;
            background: var(--reader-accent); border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            opacity: 0; transition: opacity 0.15s;

        .reading-progress-bar.dragging .progress-knob { opacity: 1; }
        /* つまんでいる間に出すページ番号 */
        .progress-tip {
            position: fixed; bottom: calc(var(--notes-h, 0px) + 28px);
            transform: translateX(-50%);
            background: var(--reader-text); color: var(--reader-bg);

            white-space: nowrap; z-index: 1101; display: none;
        }
        .progress-tip.show { display: block; }
        .reading-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8B7355, #A89070);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 0 1.5px 1.5px 0;

        @media (max-width: 768px) {

            .page-info { font-size: 0.75rem; }

            /* Hide desktop buttons, show mobile menu */
            .desktop-only { display: none !important; }
            .mobile-only { display: block !important; }
            
            .toolbar-left { gap: 0.25rem !important; }
            .toolbar-left span[style*="color: var(--reader-border)"] { display: none; } /* Hide divider */
        }
        
        /* Mobile Menu Dropdown */
        .mobile-only { display: none; }
        
        .mobile-menu-dropdown {
            position: relative;
        }
        
        .mobile-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--reader-bg);
            border: 1px solid var(--reader-border);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);

        .mobile-menu.show {

        }
        
        .mobile-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;

            padding: 0.75rem 1rem;

            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
        }
        
        .mobile-menu-item:hover {
            background: rgba(139, 115, 85, 0.1);
        }
        
        .mobile-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--reader-accent);
        }

        @media (max-width: 480px) {
            .reader-toolbar { padding: 0.4rem 0.5rem; }
            .btn-toolbar { padding: 0.4rem 0.6rem; }
            .settings-panel, .bookmarks-panel { width: calc(100vw - 1rem); left: 0.5rem; right: 0.5rem; }
            .highlight-toolbar { padding: 0.4rem 0.5rem; gap: 0.3rem; }

    /* ========== Pattern C Navbar Styles ========== */

    body.manga-mode { overflow: hidden; }

    <script>
        // ===== Mode Detection =====
        const isManga = new URLSearchParams(window.location.search).get('type') === 'manga';
        if (isManga) {
            document.body.classList.add('manga-mode');
            document.getElementById('textModeUI').style.display = 'none';
            document.getElementById('mangaModeUI').style.display = 'block';
        }

        // ===== ナビバーの実際の高さを測り、ツールバー等の位置に反映 =====
        // （言語・フォント・画面幅で高さが変わるため、固定値ではボタンが隠れることがある）
        function syncNavHeight() {
            var nav = document.querySelector('.navbar-custom');
            if (nav && nav.offsetHeight) {
                document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
            }
            // リーダー/ビューアのツールバー実高も測る（ボタンの折返しで高さが変わるため）
            var tb = document.querySelector(isManga ? '.viewer-toolbar' : '.reader-toolbar');
            if (tb && tb.offsetHeight) {
                document.documentElement.style.setProperty('--toolbar-h', tb.offsetHeight + 'px');
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            syncNavHeight();
            setTimeout(syncNavHeight, 300); // navbar.js描画・フォント読込後にもう一度
        });
        window.addEventListener('load', function() { setTimeout(syncNavHeight, 100); });
        window.addEventListener('resize', syncNavHeight);
    </script>

            var token = localStorage.getItem('token');

            showReaderNotice(getL(uiText.loadingContent));

                if (resp.status === 401) { window.location.href = 'login.html'; return; }
                var data = await resp.json();

                if (loadedWork.content_type === 'manga') {

        // ===== 見出し検出 =====

        // 記号だけの行（場面転換の「＊＊＊」等）は見出しにしない
        // ===== 見出しの判定に使う記号 =====
        // 言語ごとに記号を並べていくと、次の言語でまた同じ間違いが起きる
        // （ドイツ語の „ とアラビア語の ؟ で実際に起きた）。
        // 文字を並べるのをやめ、Unicodeが各文字に付けている分類で見る。
        //   Ps=開き括弧「『（(  Pi=開き引用符 „«‘“‹  Pe=閉じ括弧  Pf=閉じ引用符
        //   Po=その他の句読点（。、.,!? ؟ ، । ՞ ; など全言語ぶん）  Pd=ダッシュ — – ‐
        //
        // 古いブラウザは \p{...} を読めず、書いてあるだけでページの処理全体が止まる。
        // 作れなかったときは、これまでどおりの文字の一覧に戻す
        function _re(pattern, flags, fallback) {
            try { return new RegExp(pattern, flags); } catch (e) { return fallback; }
        }

        // 会話・引用で始まる行（見出しではない）
        var QUOTE_OPEN_RE = _re('^[\\p{Pi}\\p{Ps}"\'‘’”〝״»›¿¡・…]', 'u',
            /^[「『（("'“‘„‚«‹»›¿¡・…]/);
        // 文の区切りの記号を含む行（見出しではない）
        var SENTENCE_MARK_RE = _re('[\\p{Po}\\p{Pe}\\p{Pf}]', 'u',
            /[。、．，！？!?.,:;：；،؛؟۔]/);
        // ダッシュ類。スペイン語やポルトガル語は会話をダッシュで始める
        var DASH_START_RE = _re('^\\p{Pd}', 'u', /^[―—–‐-]/);
        var DASH_END_RE = _re('\\p{Pd}$', 'u', /[―—–‐-]$/);

        // 章の言い方は言語ごとに違う。「Chapitre premier」「Capitolo primo」のように
        // 数字を使わない書き方もあるので、章を表す語だけで拾う
        var CHAPTER_RE = _re(
            '^(第\\s*[0-9０-９一二三四五六七八九十百千]+\\s*(章|話|部|幕|節|編)'
            + '|(chapter|kapitel|chapitre|cap[ií]tulo|capitolo|hoofdstuk)\\b'
            // \b は英字にしか効かないので、アラビア語には付けない（付けると一致しない）
            + '|제\\s*[0-9]+\\s*장|الفصل(\\s|$)'
            + '|prologue|epilogue|プロローグ|エピローグ|序章|終章|序幕|終幕|まえがき|あとがき)',
            'ui',
            /^(第\s*[0-9０-９一二三四五六七八九十百千]+\s*(章|話|部|幕|節|編)|(chapter|kapitel|chapitre|cap[ií]tulo|capitolo)\b|제\s*[0-9]+\s*장|prologue|epilogue|プロローグ|エピローグ|序章|終章|序幕|終幕|まえがき|あとがき)/i
        );

        // 中黒（・ · ･）は名前の区切りであって文の区切りではない。
        // 「アンナ・カレーニナ」のような章題を本文に落とさないよう、句読点から外す
        function hasSentenceMark(s) {
            return SENTENCE_MARK_RE.test(String(s).replace(/[・·･]/g, ''));
        }

        function isSymbolOnlyLine(s) {

        // 'strong': 第○章などの定型見出し / 'weak': 句読点のない短い行 / null: 本文
        //

        // 多すぎるときは parseBlocks 側でまとめて取り消す
        function detectHeading(s, isolated) {
            if (s.length > 35) return null;
            if (QUOTE_OPEN_RE.test(s)) return null;
            // ダッシュで始まる行は会話。ただし「‐漂流‐」のように前後を挟む飾りは見出し
            if (DASH_START_RE.test(s) && !DASH_END_RE.test(s)) return null;
            if (isSymbolOnlyLine(s)) return null;
            if (CHAPTER_RE.test(s)) return 'strong';
            if (isolated && s.length <= 25 && !hasSentenceMark(s)) return 'weak';

        // 挿絵マーカー: [[img src="/uploads/..." w="100" align="center"]]（1行1マーカー）
        var IMG_MARKER_RE = /^\[\[img\s+src="([^"<>\s]+)"(?:\s+w="(\d{1,3})")?(?:\s+align="(left|center|right)")?\s*\]\]$/;

        // 原稿を行ブロックに分解し見出しを判定する。

        function parseBlocks(text) {

            // 捨てる前に覚えておく（詩の行を見出しと取り違えないため）
            var rawLines = String(text).split(/\r?\n/).map(function(s) { return s.trim(); });
            var lines = [], isolatedAt = [];
            rawLines.forEach(function(s, idx) {
                if (!s) return;
                var before = idx === 0 || rawLines[idx - 1] === '';
                var after = idx === rawLines.length - 1 || rawLines[idx + 1] === '';
                lines.push(s);
                isolatedAt.push(before && after);

            var blocks = [];
            var i = 0;
            while (i < lines.length) {

                    if (/^\/uploads\//.test(im[1])) {

                    }
                    i++;
                    continue;
                }
                if (s === '[[table]]') {
                    var rows = [];
                    i++;
                    while (i < lines.length && lines[i] !== '[[/table]]') {
                        rows.push(lines[i].split(' | ').map(function(c) { return c.trim(); }));
                        i++;
                    }

        // 1文字あたりの「読む量」。日本語・中国語・韓国語の1文字は、
        // 英語の1文字よりずっと多くの内容を運ぶ（同じ小説が日本語2,044字＝英語5,445字）。

        // ===== ページの組み方 =====

        //

        // 中身が画面に収まらず、指で動かす必要があり、その操作がページ送りと
        // ぶつかっていた（縦書きの両端切れ・横書きで上下に動かすとページが進む）。
        //
        // 横書きは CSS の段組みで「1段＝1画面」にし、1段ぶんずつ横へ送る。
        // 縦書きは writing-mode 自体が同じ形の段を作るので、そのまま送る。
        // 文字を大きくすれば1ページに入る量が自動的に減る。

        var pageStep = 0;       // 1ページぶんの移動量（＝段の並ぶ間隔）
        var verticalLine = 0;   // 縦書きの1行ぶんの幅（行の途中でページを切らないため）
        var pageOffsets = null; // 縦書きで実測したページの切れ目（読み始めからの距離）

        /** n ページ目の位置（読み始めからの距離） */
        function pageOffset(n) {

        }

        function measureScrollSign(el) {

            el.scrollLeft = 999999;  var pos = el.scrollLeft;

            var rel = Math.abs(el.getBoundingClientRect().left - vp.getBoundingClientRect().left + vp.scrollLeft);
            var page;
            if (pageOffsets && pageOffsets.length) {
                // 切れ目の一覧から、その位置を含むページを探す
                page = 1;
                for (var i = pageOffsets.length - 1; i >= 0; i--) {
                    if (rel + 2 >= pageOffsets[i]) { page = i + 1; break; }
                }
            } else {
                page = Math.floor((rel + 2) / pageStep) + 1;
            }
            return Math.min(Math.max(page, 1), totalPages || 1);
        }

        /**
         * スクロール表示で、その段落を画面の先頭に持ってくる。
         *
         * scrollIntoView は縦書きの入れ物では思った位置に来ず、先頭（表紙）へ戻る。
         * 「読み始めからの距離」を自分で出して合わせる
         */
        function scrollToBlock(el) {
            var vp = readerViewport();
            if (!vp || !el) return;
            var vr = vp.getBoundingClientRect(), br = el.getBoundingClientRect();
            if (isVerticalMode()) {
                // 縦書きは右端が読み始め。要素の右端を枠の右端に合わせる
                var d = Math.abs(br.right - vr.right + vp.scrollLeft);
                vp.scrollLeft = scrollSign * d;
            } else {
                vp.scrollTop = Math.abs(br.top - vr.top + vp.scrollTop);
            }
        }

        /**
         * 今のページの先頭にある段落の番号。文字サイズを変えても同じ場所へ戻るための目印。
         *
         * 段落は並び順に位置が進むので、二分探索で見つける。
         * 端から順に測ると、長編（段落数千）では設定を変えるたびに固まる
         */
        function currentAnchorIndex() {
            var flow = readerFlow();
            if (!flow) return -1;
            var els = flow.querySelectorAll('[data-block]');
            if (!els.length) return -1;

            // スクロール表示にページ番号は無い（常に1）。
            // ページ番号から割り出すと、いつも先頭＝表紙が返ってしまう。
            // 今画面に出ている先頭の段落を、位置から探す
            if (isScrollMode()) {
                var svp = readerViewport();
                if (!svp) return -1;
                var sr = svp.getBoundingClientRect();
                for (var si = 0; si < els.length; si++) {
                    var sb = els[si].getBoundingClientRect();
                    // 縦書きは右から左へ読むので、まだ読み終わっていない＝左端が右端より内側
                    var stillAhead = isVerticalMode() ? (sb.left < sr.right - 2) : (sb.bottom > sr.top + 2);
                    if (stillAhead) return parseInt(els[si].getAttribute('data-block'), 10);
                }
                return parseInt(els[els.length - 1].getAttribute('data-block'), 10);
            }
            var lo = 0, hi = els.length - 1, best = 0;
            while (lo <= hi) {
                var mid = (lo + hi) >> 1;
                if (pageOfElement(els[mid]) >= currentPage) { best = mid; hi = mid - 1; }
                else lo = mid + 1;
            }
            return parseInt(els[best].getAttribute('data-block'), 10);
        }

        /**
         * 縦書きのページの切れ目を、実際の行の位置から決める。
         *
         * 行の間隔は段落の変わり目や見出しで動くので、決まった幅で切ると
         * 行の途中に切れ目が来て、次のページの1行目が端からのぞく。
         * 行を1本ずつ見て、収まらなくなったところを次のページの頭にする
         */
        function measureVerticalPages(vp, flow) {
            var vpRight = vp.getBoundingClientRect().right;
            var scroll = vp.scrollLeft;
            var W = vp.clientWidth;
            var lines = [];

            // 表紙は「絵＋題名」でひとつの塊。中の題名を見出しとして扱うと、
            // そこでページが切れて表紙が2枚3枚に割れる（実際に起きた）
            var cover = flow.querySelector('.reader-cover');
            if (cover) {
                var cb = cover.getBoundingClientRect();
                lines.push([vpRight - cb.right - scroll, vpRight - cb.left - scroll, false]);
            }
            function insideCover(el) { return !!(cover && el && cover.contains(el)); }

            var walker = document.createTreeWalker(flow, NodeFilter.SHOW_TEXT);
            var n;
            while ((n = walker.nextNode())) {
                if (!n.nodeValue.trim()) continue;
                var parent = n.parentElement;
                if (insideCover(parent)) continue;   // 表紙の中身は上でまとめて数えた
                var isHead = parent && /^H[1-3]$/.test(parent.tagName);
                var rg = document.createRange();
                rg.selectNodeContents(n);
                var rs = rg.getClientRects();
                for (var i = 0; i < rs.length; i++) {
                    // 読み始め（右端）からの距離。縦書きは左へ進むので符号を反転する
                    var from = vpRight - rs[i].right - scroll;
                    // 章の頭で切るときは、文字の位置ではなく見出しの枠の位置を使う。
                    // 文字は枠の中で少し内側に置かれるので、文字の位置で切ると
                    // 前のページ（表紙など）の端が数pxだけのぞく
                    if (isHead && i === 0) {
                        from = vpRight - parent.getBoundingClientRect().right - scroll;
                    }
                    // 3つ目は「ここでページを切る」印（章の始まり）
                    lines.push([from, vpRight - rs[i].left - scroll, isHead && i === 0]);
                }
            }
            // 挿絵や表も1つの塊として扱う
            Array.prototype.forEach.call(flow.querySelectorAll('img, table'), function (el) {
                if (insideCover(el)) return;         // 表紙の絵も上でまとめて数えた
                var b = el.getBoundingClientRect();
                lines.push([vpRight - b.right - scroll, vpRight - b.left - scroll, false]);
            });
            lines.sort(function (a, b) { return a[0] - b[0]; });

            var offsets = [], limit = 0;
            for (var k = 0; k < lines.length; k++) {
                var start = Math.max(0, lines[k][0]);
                if (!offsets.length) {
                    // 1ページ目は本文の始まりから。0から数え始めると、
                    // 上端の余白のぶんだけ空のページが1枚できてしまう
                    offsets.push(start);
                    limit = start + W;
                    continue;
                }
                // 章の始まりは必ずページの頭から。入りきらない行も次のページへ送る
                if ((lines[k][2] && start > offsets[offsets.length - 1] + 1) || lines[k][1] > limit + 0.5) {
                    if (start >= offsets[offsets.length - 1] + 1) {
                        offsets.push(start);
                        limit = start + W;
                    }
                }
            }
            if (!offsets.length) offsets.push(0);
            return offsets;
        }

        /**
         * 縦書きでは、章の始まりを次のページの頭へ送る。
         * 横書きは段組みの break-before が同じことをしてくれるが、
         * 縦書きは段組みを使わないので、余白を足して押し出す
         */
        function alignHeadingsToPages() {
            var flow = readerFlow();
            if (!flow || !pageStep) return;
            var heads = flow.querySelectorAll('h2');
            for (var i = 0; i < heads.length; i++) {
                heads[i].style.marginBlockStart = '';
            }
            var vpLeft = readerViewport().getBoundingClientRect().left;
            var scroll = readerViewport().scrollLeft;
            for (var j = 0; j < heads.length; j++) {
                var rel = Math.abs(heads[j].getBoundingClientRect().left - vpLeft + scroll);
                var into = rel % pageStep;
                // ページの頭から2px以内なら、すでに頭にある
                if (into > 2) {
                    var need = pageStep - into;
                    // 行の整数本ぶんに切り上げる。半端な量を足すと、そこから先の
                    // 行の並びがずれ、ページの切れ目が行の途中に来るようになる
                    if (verticalLine > 0) need = Math.ceil(need / verticalLine) * verticalLine;
                    heads[j].style.marginBlockStart = need + 'px';
                }
            }
        }

        /**
         * 画面の大きさに合わせて組み直し、ページ数を数える。
         * 文字サイズ・画面の向き・バーの表示が変わるたびに呼ぶ。
         * anchorIndex を渡すと、その段落が見えるページを開く（読んでいた場所を保つ）
         */
        function layoutPages(anchorIndex) {
            var vp = readerViewport(), flow = readerFlow();
            if (!vp || !flow) return;
            updateReaderHeight();

            var width = vp.clientWidth;
            // まだ画面に出ていない（幅が取れない）ときは組まない。
            // ここで測ると段が極端に細くなり、1画面に2段入ってしまう
            if (width < 40) { pendingLayout = anchorIndex; return; }
            pendingLayout = null;

            // 連続スクロール表示はページに区切らない。段組みもページ数も使わない
            if (isScrollMode()) {
                flow.style.columnWidth = '';
                flow.style.columnGap = '';
                flow.style.width = '';
                flow.style.boxSizing = '';
                flow.style.paddingInlineEnd = '';
                flow.style.paddingBlockEnd = '';
                vp.style.width = '';
                pageOffsets = null;
                pageStep = width || 1;
                totalPages = 1;
                currentPage = 1;
                // 進む向きはここでも測る。測らずに前の値を使うと、
                // 縦書きで位置を戻すときに符号が逆になり、先頭（表紙）へ飛ぶ
                scrollSign = measureScrollSign(vp);
                var keep = (typeof anchorIndex === 'number' && anchorIndex >= 0)
                    ? flow.querySelector('[data-block="' + anchorIndex + '"]') : null;
                if (keep) scrollToBlock(keep);
                buildToc();
                updatePageInfo();
                return;
            }

            // 段の幅は枠の幅そのもの。段と段の間（画面には出ない隙間）を足したものが
            // ページの送り幅になる。枠の内側に余白を持たせないので、
            // 「段の並ぶ間隔」と「送り幅」が必ず一致し、ページがずれていかない
            var colW = Math.max(80, width);
            var colGap = 32;

            if (isVerticalMode()) {
                // 縦書きは段組みが使えない（行がただ続く）ので、
                // ページの切れ目が行の途中に来ないよう、送り幅を行の整数本ぶんにする。
                // 行の並びを崩さないため、段落と見出しの間隔も行の整数倍に揃える
                flow.style.columnWidth = '';
                flow.style.columnGap = '';
                flow.style.width = '';
                var lineH = parseFloat(getComputedStyle(flow).lineHeight) || 0;
                if (!lineH) lineH = (parseFloat(getComputedStyle(flow).fontSize) || 18) * 1.8;
                var spaced = document.body.classList.contains('para-spaced')
                          || document.body.classList.contains('para-both');
                flow.style.setProperty('--v-line', lineH + 'px');
                flow.style.setProperty('--v-para-gap', (spaced ? lineH : 0) + 'px');
                verticalLine = lineH;
            } else {
                // 幅は「中身の幅」として扱う。border-box のままだと、この後で足す
                // 端の空きぶんだけ段が細くなり、ページの送り幅と合わなくなる
                flow.style.boxSizing = 'content-box';
                flow.style.width = colW + 'px';
                flow.style.columnWidth = colW + 'px';
                flow.style.columnGap = colGap + 'px';
            }
            // 段の並ぶ間隔（＝1ページぶんの送り幅）。
            // 縦書きは行の整数本ぶんに切り下げる（行を分断しないため）
            pageStep = isVerticalMode()
                ? Math.max(verticalLine || 1, Math.floor((width || 1) / (verticalLine || 1)) * (verticalLine || 1))
                : (colW + colGap);

            if (isVerticalMode()) {
                // 見えている幅も行の整数本ぶんに合わせる。
                // 合わせないと、次のページの1行目が端から少しだけのぞく
                vp.style.width = pageStep + 'px';
            } else {
                vp.style.width = '';
            }

            // 表紙は1ページを丸ごと使う。
            // 縦書きのままだと、絵と題名が横に並んで2ページぶんの幅になり、割れて見える
            var cover = flow.querySelector('.reader-cover');
            if (cover) {
                if (isVerticalMode()) {
                    cover.style.writingMode = 'horizontal-tb';
                    cover.style.width = pageStep + 'px';
                    cover.style.height = vp.clientHeight + 'px';
                } else {
                    cover.style.writingMode = '';
                    cover.style.width = '';
                    cover.style.height = '';
                }
            }
            flow.style.paddingInlineEnd = '';
            flow.style.paddingBlockEnd = '';

            scrollSign = measureScrollSign(vp);

            if (isVerticalMode()) {
                pageOffsets = measureVerticalPages(vp, flow);
                totalPages = Math.max(1, pageOffsets.length);
            } else {
                pageOffsets = null;
                var span = Math.max(vp.scrollWidth - vp.clientWidth, 0);
                totalPages = Math.max(1, Math.round(span / pageStep) + 1);
            }

            var target = currentPage;
            if (typeof anchorIndex === 'number' && anchorIndex >= 0) {
                var el = flow.querySelector('[data-block="' + anchorIndex + '"]');
                if (el) {
                    // 数え直した後の位置で計算する
                    var rel = el.getBoundingClientRect().left - vp.getBoundingClientRect().left + vp.scrollLeft;
                    target = Math.floor((Math.abs(rel) + 2) / pageStep) + 1;
                }
            }
            currentPage = Math.min(Math.max(target, 1), totalPages);
            buildToc();
            updatePageInfo();
        }

        // ===== 本文の描画 =====

        let tocEntries = []; // [{ title, page }]

        /**
         * 本文をひと続きに流し込む（ページで区切らない）。
         * どこがページの切れ目になるかは、上の layoutPages が画面から決める
         */
        function renderWorkPages(text, work) {
            var container = document.getElementById('readerContent');
            container.innerHTML = '';
            tocEntries = [];

            var flow = document.createElement('div');
            flow.className = 'reader-flow';
            flow.id = 'readerFlow';

            // ページに入りきらなかった行を隠す覆い（縦書きで使う）
            var mask = document.createElement('div');
            mask.className = 'reader-edge-mask';
            mask.id = 'readerEdgeMask';
            container.appendChild(mask);

            var blockNo = 0;
            function mark(el) {
                el.setAttribute('data-block', blockNo++);
                return el;
            }

            var coverUrl = work && (work.cover_image || work.cover_image_url);
            if (coverUrl) {
                var coverDiv = document.createElement('div');
                coverDiv.className = 'reader-cover';
                var img = document.createElement('img');
                img.src = coverUrl;
                img.alt = work.title || '';
                coverDiv.appendChild(img);
                if (work.title) {
                    var coverTitle = document.createElement('h1');
                    coverTitle.textContent = work.title;
                    coverDiv.appendChild(coverTitle);
                }
                flow.appendChild(mark(coverDiv));
            } else if (work && work.title) {
                var h1 = document.createElement('h1');
                h1.textContent = work.title;
                flow.appendChild(mark(h1));
            }

            parseBlocks(text).forEach(function(b) {
                var el;
                if (b.type === 'img') {
                    // 挿絵: DOM生成のみ（innerHTML不使用）。srcは/uploads/配下に限定済み
                    el = document.createElement('div');
                    el.className = 'reader-illustration align-' + b.align;
                    var ilImg = document.createElement('img');
                    ilImg.src = (window.API_ORIGIN || '') + b.src;
                    ilImg.style.width = b.w + '%';
                    ilImg.alt = '';
                    el.appendChild(ilImg);
                    flow.appendChild(mark(el));
                    return;
                }
                if (b.type === 'table') {
                    el = document.createElement('div');
                    el.className = 'reader-table-wrap';
                    var tb = document.createElement('table');
                    tb.className = 'reader-table';
                    b.rows.forEach(function(r, ri) {
                        var tr = document.createElement('tr');
                        r.forEach(function(c) {
                            var td = document.createElement(ri === 0 ? 'th' : 'td');
                            td.textContent = c;
                            tr.appendChild(td);
                        });
                        tb.appendChild(tr);
                    });
                    el.appendChild(tb);
                    flow.appendChild(mark(el));
                    return;
                }
                el = document.createElement(b.heading ? 'h2' : 'p');
                el.textContent = b.text;
                flow.appendChild(mark(el));
            });

            container.appendChild(flow);
            currentPage = 1;
            // 画像の読み込みで高さが変わるため、揃ってからもう一度数え直す
            layoutPages();
            waitForImages(flow, function() { layoutPages(currentAnchorIndex()); });
        }

        /** 画像が読み終わるのを待つ（読み込み前後で1ページの量が変わるため） */
        function waitForImages(root, done) {
            var imgs = root.querySelectorAll('img');
            var left = 0;
            Array.prototype.forEach.call(imgs, function(im) {
                if (im.complete) return;
                left++;
                var fire = function() { if (--left <= 0) done(); };
                im.addEventListener('load', fire, { once: true });
                im.addEventListener('error', fire, { once: true });
            });
            if (left === 0) return;
            // 読み込みが終わらないときも、いつまでも待たない
            setTimeout(function() { if (left > 0) { left = 0; done(); } }, 4000);
        }

        /** 見出しの位置から目次を作る（ページ番号は組み直すたびに変わる） */
        function buildToc() {
            var flow = readerFlow();
            tocEntries = [];
            if (flow) {
                Array.prototype.forEach.call(flow.querySelectorAll('h2'), function(h) {
                    tocEntries.push({ title: h.textContent, page: pageOfElement(h), block: h.getAttribute('data-block') });
                });
            }
            renderToc();
        }

        // 目次パネルを描画。見出しが無い作品ではContentsボタン自体を隠す
        function renderToc() {
            var has = tocEntries.length > 0;
            var btn = document.getElementById('btnToc');
            var mobileItem = document.getElementById('mobileTocItem');
            if (btn) btn.style.display = has ? '' : 'none';
            if (mobileItem) mobileItem.style.display = has ? '' : 'none';

            var list = document.getElementById('tocList');
            if (!list) return;
            list.innerHTML = '';
            tocEntries.forEach(function(e) {
                var item = document.createElement('div');
                item.className = 'bookmark-item';
                item.onclick = function() {
                    currentPage = e.page;
                    updatePageInfo();
                    window.scrollTo(0, 0);
                    toggleToc();
                };
                var pg = document.createElement('span');
                pg.className = 'toc-item-page';
                pg.textContent = e.page;
                var title = document.createElement('div');
                title.className = 'bookmark-title';
                title.textContent = e.title;
                item.appendChild(pg);
                item.appendChild(title);
                list.appendChild(item);
            });
        }

        function toggleToc() {
            var panel = document.getElementById('tocPanel');
            panel.classList.toggle('show');
            document.getElementById('settingsPanel').classList.remove('show');
            document.getElementById('bookmarksPanel').classList.remove('show');
            document.getElementById('searchPanel').classList.remove('show');
        }

        // 本文のAI利用のみ表示（表紙のAI利用はReaderには表示しない仕様）
        function updateAiBadge() {
            var el = document.getElementById('readerAiBadge');
            if (!el) return;
            var label = (loadedWork && typeof getAiBadgeLabel === 'function')
                ? getAiBadgeLabel(loadedWork.ai_text_usage, 'na')
                : null;
            if (label) {
                el.textContent = label;
                el.style.display = 'inline-block';
            } else {
                el.style.display = 'none';
            }
        }

        // 本文エリアにメッセージ（読み込み中・購入案内・エラー）を表示する
        function showReaderNotice(message, linkHref, linkText) {
            var container = document.getElementById('readerContent');
            container.innerHTML = '';
            var div = document.createElement('div');
            div.className = 'page';
            div.dataset.page = 1;
            div.style.textAlign = 'center';
            div.style.padding = '4rem 1rem';
            var p = document.createElement('p');
            p.textContent = message;
            p.style.fontSize = '1.1rem';
            p.style.marginBottom = '1.5rem';
            div.appendChild(p);
            if (linkHref && linkText) {
                var a = document.createElement('a');
                a.href = linkHref;
                a.textContent = linkText;
                a.style.cssText = 'display:inline-block; padding:0.6rem 1.5rem; background:var(--reader-accent); color:#fff; border-radius:8px; text-decoration:none;';
                div.appendChild(a);
            }
            container.appendChild(div);
            totalPages = 1;
            currentPage = 1;
            document.getElementById('pageInfo').textContent = '1 / 1';
        }

        function showTouchHint() {
            if ('ontouchstart' in window) {
                const hint = document.getElementById('touchHint');
                hint.classList.add('show');
                setTimeout(() => hint.classList.remove('show'), 4000);
            }
        }

        // 触った直後のマウス操作は、ブラウザが携帯向けに作った偽物なので無視する。
        // これを通すと、つまみで範囲を広げている最中に「掴んで動かす」が働いて選択が消える
        var lastTouchAt = 0;
        function isTouchInput() { return Date.now() - lastTouchAt < 800; }

        var CONTROL_SELECTOR = '.reader-toolbar, .notes-section, .settings-panel, .bookmarks-panel, .search-panel, .highlight-toolbar, .sel-handle, .navbar, button, a, input, textarea, select';

        function initTouchEvents() {
            // 画面全体で受ける。ページ送りの当たり判定は本文の外側に重ねてあるため、
            // 本文にだけ紐づけていると画面の左右25%ずつでスワイプが効かなかった
            document.addEventListener('touchstart', function(e) {
                lastTouchAt = Date.now();
                if (e.target.closest(CONTROL_SELECTOR)) return;
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
                isSwiping = false;
                isLongPress = false;
                touchMoved = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 500);
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                lastTouchAt = Date.now();
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                if (selDrag) return;
                const diffX = e.changedTouches[0].screenX - touchStartX;
                const diffY = Math.abs(e.changedTouches[0].screenY - touchStartY);
                // 横に払ったときだけページ送り。斜めに動いたものは受け付けない
                if (Math.abs(diffX) > 12 || diffY > 12) touchMoved = true;
                if (Math.abs(diffX) > 30 && Math.abs(diffX) > diffY) {
                    isSwiping = true;
                    if (diffX > 50 && currentPage > 1) {
                        document.getElementById('swipeLeft').classList.add('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    } else if (diffX < -50 && currentPage < totalPages) {
                        document.getElementById('swipeRight').classList.add('show');
                        document.getElementById('swipeLeft').classList.remove('show');
                    } else {
                        document.getElementById('swipeLeft').classList.remove('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    }
                }
            }, { passive: true });

            document.addEventListener('touchend', function(e) {
                lastTouchAt = Date.now();
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                document.getElementById('swipeLeft').classList.remove('show');
                document.getElementById('swipeRight').classList.remove('show');

                const diffX = touchEndX - touchStartX;
                if (isSwiping && Math.abs(diffX) > 80 && !isScrollMode()) {
                    // 縦書きの日本語やアラビア語は左へ読み進むので、指の向きも逆になる
                    var rtl = isRightToLeftBook();
                    if (diffX > 0) { rtl ? nextPage() : prevPage(); } else { rtl ? prevPage() : nextPage(); }
                }
                if (isLongPress) setTimeout(() => handleTextSelection(), 100);
                const wasSwiping = isSwiping, wasLongPress = isLongPress, wasMoved = touchMoved;
                isSwiping = false;
                touchMoved = false;
                // 指が動いていたらタップではない。上下に払っただけで
                // バーが消えたりページが変わったりしないようにする
                if (!wasSwiping && !wasLongPress && !wasMoved) handleTap(e.changedTouches[0]);
            }, { passive: true });

            document.getElementById('readerContent').addEventListener('mouseup', function(e) {
                if (isTouchInput()) return;

        }

        // ===== 携帯のタップ =====
        // 1回叩けばページ送り、2回続けて叩けばその単語を選ぶ。
        // どちらか決まるまでの少しの間（300ミリ秒）だけページ送りを待たせる
        var touchMoved = false;   // 指が動いたか（動いていればタップとして扱わない）
        var lastTap = { at: 0, x: 0, y: 0 };
        var pendingTapTimer = null;
        // 2回目を待つ間と、ページ送りを待たせる間は同じ長さにする。
        // ずれていると、2回目が来る前にページが変わってしまう
        var DOUBLE_TAP_MS = 300;

        function handleTap(touch) {
            var x = touch.clientX, y = touch.clientY;
            var now = Date.now();
            var isDouble = (now - lastTap.at < DOUBLE_TAP_MS) && Math.abs(x - lastTap.x) < 30 && Math.abs(y - lastTap.y) < 30;

            if (isDouble) {
                if (pendingTapTimer) { clearTimeout(pendingTapTimer); pendingTapTimer = null; }
                lastTap.at = 0;
                if (selectWordAt(x, y)) handleTextSelection();
                return;
            }
            lastTap = { at: now, x: x, y: y };

            // 文字を選んでいる最中の1回叩きは、選択の取り消し
            if (document.getElementById('highlightToolbar').classList.contains('show')) {
                if (pendingTapTimer) { clearTimeout(pendingTapTimer); pendingTapTimer = null; }
                clearTextSelection();
                return;
            }

            var zone = tapZone(x);
            if (pendingTapTimer) clearTimeout(pendingTapTimer);
            // 2回目の叩きを待ってから動く。待たないと、ダブルタップの1回目で
            // ページが変わってしまう
            pendingTapTimer = setTimeout(function() {
                pendingTapTimer = null;
                // 中央は本を大きく見せるための切り替え。左右はページ送り
                if (zone === 'center') toggleChrome();
                else turnByZone(zone);
            }, DOUBLE_TAP_MS);
        }

        // ===== 携帯で文字を選ぶ =====
        // 携帯には長押ししかなく、選べたつもりでも範囲を直せなかった。
        // ダブルタップで単語を選び、両端のつまみで広げられるようにする。

        /**
         * 画面上の一点にある文字の位置を返す（ブラウザによって呼び名が違う）。
         *
         * ページ送りの当たり判定とつまみは本文の上に重ねてあるので、
         * そのままだと「そこにあるのは当たり判定」と答えられて本文の文字に届かない。
         * 探す間だけ、それらを触れない状態にしておく
         */
        function caretRangeAtPoint(x, y) {
            var overlays = ['clickZoneLeft', 'clickZoneRight', 'selHandleStart', 'selHandleEnd']
                .map(function (id) { return document.getElementById(id); })
                .filter(Boolean);
            var saved = overlays.map(function (el) { return el.style.pointerEvents; });
            overlays.forEach(function (el) { el.style.pointerEvents = 'none'; });
            try {
                if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
                if (document.caretPositionFromPoint) {
                    var pos = document.caretPositionFromPoint(x, y);
                    if (!pos) return null;
                    var r = document.createRange();
                    r.setStart(pos.offsetNode, pos.offset);
                    r.collapse(true);
                    return r;
                }
                return null;
            } finally {
                overlays.forEach(function (el, i) { el.style.pointerEvents = saved[i]; });
            }
        }

        function charClass(ch) {
            if (/\s/.test(ch)) return 'space';
            if (/[぀-ゟ]/.test(ch)) return 'kana';
            if (/[゠-ヿㇰ-ㇿー]/.test(ch)) return 'kata';
            if (/[㐀-䶿一-鿿]/.test(ch)) return 'han';
            if (/[0-9A-Za-zÀ-ɏЀ-ӿ֐-׿؀-ۿ가-힯'’-]/.test(ch)) return 'word';
            return 'other';
        }

        /**
         * その位置にある「単語」の範囲を求める。
         * 日本語は語の間に空白が無いので、Intl.Segmenter に区切ってもらう。
         * 使えないブラウザでは、同じ種類の文字（ひらがな・カタカナ・漢字・英数）の続きを1語とみなす
         */
        function wordBoundsAt(text, index) {
            if (index >= text.length) index = text.length - 1;
            if (index < 0) return null;
            if (charClass(text.charAt(index)) === 'space' && index > 0) index--;

            if (window.Intl && Intl.Segmenter) {
                try {
                    var cls = charClass(text.charAt(index));
                    var locale = (cls === 'kana' || cls === 'kata' || cls === 'han') ? 'ja' : 'en';
                    var seg = new Intl.Segmenter(locale, { granularity: 'word' }).segment(text);
                    var part = seg.containing ? seg.containing(index) : null;
                    if (part && part.segment && part.segment.trim()) {
                        return { start: part.index, end: part.index + part.segment.length };
                    }
                } catch (err) { /* 古いブラウザは下の方法で選ぶ */ }
            }

            var cls2 = charClass(text.charAt(index));
            if (cls2 === 'space') return null;
            var start = index, end = index + 1;
            var MAX = 20;   // 助詞まで延々と続くのを防ぐ
            while (start > 0 && charClass(text.charAt(start - 1)) === cls2 && index - start < MAX) start--;
            while (end < text.length && charClass(text.charAt(end)) === cls2 && end - index < MAX) end++;
            return { start: start, end: end };
        }

        /**
         * 叩いた場所にある「文字そのもの」を選ぶ。
         *
         * ブラウザが返すのは文字と文字の境目なので、そのまま使うと
         * 漢字のように幅の広い文字では隣の字を指してしまう
         * （「窓」を叩いたのに次の「の」が選ばれる）
         */
        function charIndexAt(node, offset, x, y) {
            var text = node.nodeValue || '';
            function inside(i) {
                if (i < 0 || i >= text.length) return false;
                var r = document.createRange();
                r.setStart(node, i);
                r.setEnd(node, i + 1);
                var box = r.getBoundingClientRect();
                return x >= box.left && x <= box.right && y >= box.top && y <= box.bottom;
            }
            if (inside(offset)) return offset;
            if (inside(offset - 1)) return offset - 1;
            return Math.min(offset, Math.max(0, text.length - 1));
        }

        /** 画面上の一点にある単語を選ぶ */
        function selectWordAt(x, y) {
            var rc = document.getElementById('readerContent');
            var caret = caretRangeAtPoint(x, y);
            if (!caret || !rc.contains(caret.startContainer)) return false;
            var node = caret.startContainer;
            if (node.nodeType !== 3) return false;
            var bounds = wordBoundsAt(node.nodeValue || '', charIndexAt(node, caret.startOffset, x, y));
            if (!bounds || bounds.end <= bounds.start) return false;
            var range = document.createRange();
            range.setStart(node, bounds.start);
            range.setEnd(node, bounds.end);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            return true;
        }

        /** つまみを動かして、選んだ範囲の端を今指がある文字まで伸ばす */
        function extendSelectionTo(which, x, y) {
            var rc = document.getElementById('readerContent');
            var caret = caretRangeAtPoint(x, y);
            var sel = window.getSelection();
            if (!caret || !sel.rangeCount || !rc.contains(caret.startContainer)) return;
            var cur = sel.getRangeAt(0);
            var next = document.createRange();
            try {
                if (which === 'start') {
                    next.setStart(caret.startContainer, caret.startOffset);
                    next.setEnd(cur.endContainer, cur.endOffset);
                } else {
                    next.setStart(cur.startContainer, cur.startOffset);
                    next.setEnd(caret.startContainer, caret.startOffset);
                }
            } catch (err) { return; }
            if (next.collapsed || !next.toString().trim()) return;   // 端を追い越したときは何もしない
            sel.removeAllRanges();
            sel.addRange(next);
            positionSelHandles();
        }

        function positionSelHandles() {
            var start = document.getElementById('selHandleStart');
            var end = document.getElementById('selHandleEnd');
            var sel = window.getSelection();
            // つまみは指で操作するもの。マウスで選んだときに出しても引っ張れず、邪魔になるだけ
            if (!isTouchInput() || !sel.rangeCount || !sel.toString().trim()) return hideSelHandles();
            var rects = sel.getRangeAt(0).getClientRects();
            if (!rects.length) return hideSelHandles();
            var first = rects[0], last = rects[rects.length - 1];
            start.style.left = first.left + 'px';
            start.style.top = first.bottom + 'px';
            end.style.left = last.right + 'px';
            end.style.top = last.bottom + 'px';
            start.classList.add('show');
            end.classList.add('show');
        }

        function hideSelHandles() {
            document.getElementById('selHandleStart').classList.remove('show');
            document.getElementById('selHandleEnd').classList.remove('show');
        }

        function clearTextSelection() {
            window.getSelection().removeAllRanges();
            document.getElementById('highlightToolbar').classList.remove('show');
            hideSelHandles();
        }

        var selDrag = null;

        function initSelHandles() {
            [['selHandleStart', 'start'], ['selHandleEnd', 'end']].forEach(function (pair) {
                var el = document.getElementById(pair[0]);
                el.addEventListener('touchstart', function (e) {
                    selDrag = pair[1];
                    e.preventDefault();       // つまんでいる間はページを動かさない
                    e.stopPropagation();
                }, { passive: false });
            });

            document.addEventListener('touchmove', function (e) {
                if (!selDrag) return;
                var t = e.changedTouches[0];
                // つまみは文字の下に出るので、指の少し上にある文字を見る
                extendSelectionTo(selDrag, t.clientX, t.clientY - 26);
                e.preventDefault();
            }, { passive: false });

            ['touchend', 'touchcancel'].forEach(function (ev) {
                document.addEventListener(ev, function () {
                    if (!selDrag) return;
                    selDrag = null;
                    handleTextSelection();
                });
            });

        }

        /** 色のボタンとつまみを、選んだ文字のそばへ置く */
        function placeSelectionUi() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const toolbar = document.getElementById('highlightToolbar');
            const rect = selection.getRangeAt(0).getBoundingClientRect();

            // 位置は画面基準（position: fixed）。
            // ここに window.scrollY を足すと、下の方を読んでいるときに
            // 画面外へ飛んで色のボタンが押せなくなる（携帯でハイライトできなかった原因）
            let top = rect.top - 50;
            let left = rect.left + (rect.width / 2) - 110;

            if (top < 60) top = rect.bottom + 10;
            // 選んだ文字が画面の外へ流れても、色のボタンは押せる場所に残す
            top = Math.min(Math.max(top, 60), window.innerHeight - 60);
            if (left < 10) left = 10;
            if (left > window.innerWidth - 250) left = window.innerWidth - 250;

            toolbar.style.top = top + 'px';
            toolbar.style.left = left + 'px';
            positionSelHandles();
        }

        // 画面を動かしている間も、選んだ文字に付いてくるようにする
        var selTrackRaf = null, selTrackAt = '';

        // 画面が動いたら置き直す。requestAnimationFrame は
        // 別の画面を見ている間は止まるので、スクロールでも直接呼んでおく
        document.addEventListener('scroll', function () {
            if (document.getElementById('highlightToolbar').classList.contains('show')) placeSelectionUi();
        }, { capture: true, passive: true });

        function startSelectionTracking() {
            if (selTrackRaf) return;
            var step = function () {
                if (!document.getElementById('highlightToolbar').classList.contains('show')) {
                    selTrackRaf = null; selTrackAt = '';
                    return;
                }
                var sel = window.getSelection();
                if (sel.rangeCount) {
                    var r = sel.getRangeAt(0).getBoundingClientRect();
                    var at = Math.round(r.top) + ':' + Math.round(r.left);
                    if (at !== selTrackAt) { selTrackAt = at; placeSelectionUi(); }
                }
                selTrackRaf = requestAnimationFrame(step);
            };
            selTrackRaf = requestAnimationFrame(step);
        }

        function handleTextSelection() {
            const selection = window.getSelection();
            selectedText = selection.toString().trim();

            if (selectedText.length > 0) {
                document.getElementById('highlightToolbar').classList.add('show');
                placeSelectionUi();
                startSelectionTracking();
            } else {
                document.getElementById('highlightToolbar').classList.remove('show');
                hideSelHandles();
            }
        }

        function reportTranslationIssue() {
            const selection = window.getSelection();
            const text = selection.toString().trim() || selectedText;
            
            if (!text) {
                alert(getL(uiText.selectText));
                return;
            }
            
            const reportUrl = new URL('feedback/report.html', window.location.origin + '/pages/');
            reportUrl.searchParams.set('workId', workId);
            reportUrl.searchParams.set('text', text);
            reportUrl.searchParams.set('page', currentPage);
            reportUrl.searchParams.set('title', document.getElementById('workTitle').textContent);
            
            document.getElementById('highlightToolbar').classList.remove('show');
            hideSelHandles();
            window.location.href = reportUrl.toString();
        }

        function applyHighlight(color) {
            const selection = window.getSelection();
            if (selection.rangeCount > 0 && selection.toString().trim()) {
                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.className = `highlighted highlight-${color}`;
                span.dataset.highlightId = Date.now();
                try {
                    range.surroundContents(span);
                    highlights.push({ id: span.dataset.highlightId, text: selection.toString(), color: color, page: currentPage });
                    localStorage.setItem(storageKey('reader_highlights'), JSON.stringify(highlights));
                } catch (e) { alert(getL(uiText.cannotHighlight)); }
            }
            clearTextSelection();
        }

        function removeHighlight() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const parent = selection.anchorNode.parentElement;
                if (parent && parent.classList.contains('highlighted')) {
                    const text = document.createTextNode(parent.textContent);
                    parent.parentNode.replaceChild(text, parent);
                }
            }
            clearTextSelection();
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('show');
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('show');
            document.getElementById('bookmarksPanel').classList.remove('show');
            document.getElementById('searchPanel').classList.remove('show');
            document.getElementById('tocPanel').classList.remove('show');
        }

        // ===== 読書の見た目の設定 =====
        // 文字サイズ・テーマ・段落は「その人の読み方」なので端末に1つだけ覚える。
        // 表示方向だけは「その本の性質」なので作品ごとに覚える
        // （日本語の本を縦書きで読んだあと、英語の本まで縦書きで開かないように）
        const VIEW_MODES = ["paged", "scroll"];
        const VIEW_MODE_KEY = "reader_view_mode";
        const LEADINGS = ["tight", "normal", "loose"];
        const MARGIN_SIZES = ["narrow", "normal", "wide"];
        const LEADING_KEY = "reader_leading";
        const MARGIN_KEY = "reader_margin";
        const TEXT_SIZES = ["small", "medium", "large", "xlarge"];
        const THEMES = ["light", "dark", "sepia"];
        const WRITING_MODES = ["horizontal", "vertical", "rtl"];
        const PARAGRAPH_STYLES = ["indent", "spaced", "both"];

        const TEXT_SIZE_KEY = "reader_text_size";
        const THEME_KEY = "reader_theme";
        const PARAGRAPH_STYLE_KEY = "reader_paragraph_style";
        const WRITING_MODE_KEY = "reader_writing_mode"; // storageKey() で作品ごとに分ける

        // プライベートブラウズでは localStorage が例外を投げる。読書自体は止めない
        function saveSetting(key, value) { try { localStorage.setItem(key, value); } catch (err) {} }
        function loadSetting(key, allowed) {
            var v = null;
            try { v = localStorage.getItem(key); } catch (err) {}
            return allowed.indexOf(v) === -1 ? null : v;   // 壊れた値はclass名に混ぜない
        }

        // 押されているボタンの見た目を値で決める（DOM上の並び順に依存させない）
        function markActiveSetting(rowId, value) {
            document.querySelectorAll("#" + rowId + " .settings-btn").forEach(function(btn) {
                btn.classList.toggle("active", btn.dataset.value === value);
            });
        }

        // save に false を渡すのは復元・自動判定のとき（読者が選んでいないので上書きしない）
        function setTextSize(size, save) {
            keepReadingPlace();   // 組み直す前に、読んでいた場所を控える
            if (TEXT_SIZES.indexOf(size) === -1) size = "medium";
            document.body.classList.remove("text-small", "text-medium", "text-large", "text-xlarge");
            document.body.classList.add("text-" + size);
            markActiveSetting("textSizeRow", size);
            if (save !== false) saveSetting(TEXT_SIZE_KEY, size);
            relayoutAfterSetting();
        }

        function setTheme(theme, save) {
            if (THEMES.indexOf(theme) === -1) theme = "light";
            document.body.classList.remove("theme-light", "theme-dark", "theme-sepia");
            document.body.classList.add("theme-" + theme);
            markActiveSetting("themeRow", theme);
            if (save !== false) saveSetting(THEME_KEY, theme);
        }

        function setWritingMode(mode, save) {
            keepReadingPlace();   // 組み直す前に、読んでいた場所を控える
            if (WRITING_MODES.indexOf(mode) === -1) mode = "horizontal";
            const content = document.getElementById("readerContent");
            content.classList.remove("writing-horizontal", "writing-vertical", "writing-rtl");
            content.classList.add("writing-" + mode);
            updateReaderHeight();
            markActiveSetting("directionRow", mode);
            if (save !== false) saveSetting(storageKey(WRITING_MODE_KEY), mode);
            relayoutAfterSetting();
        }

        function setParagraphStyle(style, save) {
            keepReadingPlace();   // 組み直す前に、読んでいた場所を控える
            if (PARAGRAPH_STYLES.indexOf(style) === -1) style = "indent";
            document.body.classList.remove("para-indent", "para-spaced", "para-both");
            document.body.classList.add("para-" + style);
            markActiveSetting("paragraphStyleRow", style);
            if (save !== false) saveSetting(PARAGRAPH_STYLE_KEY, style);
            relayoutAfterSetting();
        }

        // 設定を変えたら、今読んでいる場所を保ったまま組み直す。
        // 場所は「変える前」に控えておく——変えた後では、もう組み直された後の
        // ページ5の先頭を指してしまい、読んでいた場所とずれる
        var pendingAnchor = -1;
        function keepReadingPlace() { pendingAnchor = currentAnchorIndex(); }
        function relayoutAfterSetting() {
            var anchor = pendingAnchor;
            pendingAnchor = -1;
            // クラスの反映（文字サイズ等）が終わってから測る
            setTimeout(function() { layoutPages(anchor); }, 0);
        }

        /** 連続スクロール表示か */
        function isScrollMode() { return document.body.classList.contains('reader-scroll'); }

        // ページ送りか連続スクロールか。
        // スクロールにすると、ページ送りの操作そのものが無くなる
        function setViewMode(mode, save) {
            keepReadingPlace();
            if (VIEW_MODES.indexOf(mode) === -1) mode = "paged";
            document.body.classList.toggle("reader-scroll", mode === "scroll");
            markActiveSetting("viewModeRow", mode);
            if (save !== false) saveSetting(VIEW_MODE_KEY, mode);
            relayoutAfterSetting();
        }

        // 行間。文字を大きくしなくても、これだけで読みやすさが変わる
        function setLeading(size, save) {
            keepReadingPlace();
            if (LEADINGS.indexOf(size) === -1) size = "normal";
            document.body.classList.remove("leading-tight", "leading-normal", "leading-loose");
            document.body.classList.add("leading-" + size);
            markActiveSetting("leadingRow", size);
            if (save !== false) saveSetting(LEADING_KEY, size);
            relayoutAfterSetting();
        }

        // 左右の余白。狭くすれば1行が長く、広くすれば紙の本の見え方に近づく
        function setMargin(size, save) {
            keepReadingPlace();
            if (MARGIN_SIZES.indexOf(size) === -1) size = "normal";
            document.body.classList.remove("margin-narrow", "margin-normal", "margin-wide");
            document.body.classList.add("margin-" + size);
            markActiveSetting("marginRow", size);
            if (save !== false) saveSetting(MARGIN_KEY, size);
            relayoutAfterSetting();
        }

        function updateReaderSettingLabels() {
            var view = { en: "Display", ja: "表示", zh: "显示方式", 'zh-TW': "顯示方式", es: "Visualización", fr: "Affichage", de: "Darstellung", ko: "표시 방식", ar: "طريقة العرض", pt: "Apresentação", it: "Visualizzazione" }, paged = { en: "Pages", ja: "ページ送り", zh: "翻页", 'zh-TW': "翻頁", es: "Páginas", fr: "Pages", de: "Seiten", ko: "페이지", ar: "صفحات", pt: "Páginas", it: "Pagine" }, scrolled = { en: "Scroll", ja: "スクロール", zh: "滚动", 'zh-TW': "捲動", es: "Desplazamiento", fr: "Défilement", de: "Scrollen", ko: "스크롤", ar: "تمرير", pt: "Rolagem", it: "Scorrimento" };
            var v = document.getElementById('labelViewMode');
            if (v) v.textContent = getL(view);
            var pb = document.getElementById('viewPaged');
            if (pb) pb.textContent = getL(paged);
            var sb = document.getElementById('viewScroll');

                page: currentPage,
                percent: isScrollMode() ? scrollPercent() : Math.round(currentPage / (totalPages || 1) * 100),
                at: Date.now()
            };
            if (pos.blockIndex < 0) return;
            try { localStorage.setItem(storageKey(POSITION_KEY), JSON.stringify(pos)); } catch (e) {}

            // サーバーへは間を置いて送る（1ページごとに送ると通信が増えるだけ）
            var token = localStorage.getItem('token');

                positionSaveTimer = null;

                        }

         * どうしても数十pxの余りが出る。そこを地の色で覆う（紙の余白と同じ見え方）
         */
        function updateEdgeMask(vp) {
            var mask = document.getElementById('readerEdgeMask');
            if (!mask) return;
            if (!pageOffsets || !pageOffsets.length) { mask.style.width = '0px'; return; }
            var start = pageOffset(currentPage);

            } else {
                span = vp.scrollHeight - vp.clientHeight;
                pos = vp.scrollTop;
            }
            if (span <= 0) return 100;
            return Math.min(100, Math.max(0, Math.round(pos / span * 100)));
        }

            const notesLabel = getL(uiText.notes);

            let content = '', filename = '', mimeType = '';
            if (format === 'txt') {
                content = `${notesLabel}: ${title}\n${exportedLabel}: ${new Date().toLocaleString()}\n${'='.repeat(40)}\n\n`;
                notes.forEach((n, i) => { content += `[${i + 1}] ${pageLabel} ${n.page} - ${new Date(n.createdAt).toLocaleString()}\n${n.text}\n\n`; });

        // ===== 下部のスライダー =====
