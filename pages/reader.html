        var progressTipText = { en: "page", ja: "ページ", zh: "页", 'zh-TW': "頁", es: "pág.", fr: "page", de: "Seite", ko: "페이지", ar: "صفحة", pt: "pág.", it: "pag." };

        function initProgressBar() {
            var bar = document.getElementById('readingProgressBar');
            var tip = document.getElementById('progressTip');
            if (!bar) return;
            var dragging = false;

            function ratioAt(clientX) {
                var r = bar.getBoundingClientRect();
                return Math.min(1, Math.max(0, (clientX - r.left) / (r.width || 1)));
            }

            function apply(clientX, commit) {
                var ratio = ratioAt(clientX);
                if (isScrollMode()) {
                    var vp = readerViewport();
                    if (!vp) return;
                    if (isVerticalMode()) {
                        var span = vp.scrollWidth - vp.clientWidth;
                        vp.scrollLeft = scrollSign * span * ratio;
                    } else {
                        vp.scrollTop = (vp.scrollHeight - vp.clientHeight) * ratio;
                    }
                    updateReadingProgress();
                    if (tip) { tip.textContent = scrollPercent() + '%'; tip.style.left = (ratio * 100) + '%'; }
                    return;
                }
                var page = Math.min(totalPages, Math.max(1, Math.round(ratio * (totalPages - 1)) + 1));
                if (tip) {
                    tip.textContent = page + ' / ' + totalPages;
                    tip.style.left = (ratio * 100) + '%';
                }
                // つまんでいる間も動かす（Kindleは離した時だけだが、動く方が分かりやすい）
                if (page !== currentPage) { currentPage = page; updatePageInfo(); }
            }

            function start(e) {
                dragging = true;
                bar.classList.add('dragging');
                if (tip) tip.classList.add('show');
                apply(e.clientX);
                if (e.pointerId !== undefined && bar.setPointerCapture) bar.setPointerCapture(e.pointerId);
                e.preventDefault();
            }
            function move(e) { if (dragging) { apply(e.clientX); e.preventDefault(); } }
            function end() {
                if (!dragging) return;
                dragging = false;
                bar.classList.remove('dragging');
                if (tip) tip.classList.remove('show');
            }

            bar.addEventListener('pointerdown', start);
            bar.addEventListener('pointermove', move);
            bar.addEventListener('pointerup', end);
            bar.addEventListener('pointercancel', end);
        }

        // ===== 触ったときの割り当て =====
        // 画面を3つに分ける。左右でページを送り、中央でバーの表示を切り替える（Kindleと同じ）。
        // 上下の操作には何も割り当てない——1ページが画面に収まっているので動かす必要が無く、
        // 割り当てるとページ送りと取り違えが起きる（以前はこれで誤爆していた）
        var ZONE_SIDE = 0.25;   // 左右それぞれ画面の25%。指で狙える広さ（10%では狭すぎる）

        function tapZone(x) {
            if (x < window.innerWidth * ZONE_SIDE) return 'left';
            if (x > window.innerWidth * (1 - ZONE_SIDE)) return 'right';
            return 'center';

        function turnByZone(zone) {
            if (isScrollMode()) return;   // スクロール表示にページ送りは無い

            if (zone === 'left') { rtl ? nextPage() : prevPage(); }
            else if (zone === 'right') { rtl ? prevPage() : nextPage(); }
        }

        function initClickZones() {
            var leftZone = document.getElementById('clickZoneLeft');
            var rightZone = document.getElementById('clickZoneRight');
            // 触ったときは handleTap が受け持つ（1回叩き＝ページ送り、2回＝単語を選ぶ）
            if (leftZone) {
                leftZone.addEventListener('click', function() {
                    if (!hasDragged && !isTouchInput()) turnByZone('left');
                });
            }
            if (rightZone) {
                rightZone.addEventListener('click', function() {
                    if (!hasDragged && !isTouchInput()) turnByZone('right');
                });
            }
        }

        /**
         * 本文の高さを画面から測る。
         * 1ページはここに収まる量なので、この値が「1ページの大きさ」になる。
         * バーを隠したときも呼ばれ、そのぶん本文が広がる
         */
        function updateReaderHeight() {
            var rc = document.getElementById('readerContent');
            if (!rc) return;
            var top = rc.getBoundingClientRect().top;                    // 上のツールバー等の分
            var footer = document.querySelector('.reader-footer, .notes-section');
            var bottom = footer ? footer.getBoundingClientRect().height : 0;
            var h = Math.max(240, window.innerHeight - top - bottom - 16);
            document.documentElement.style.setProperty('--reader-vh', h + 'px');
            // スライダーをメモ欄の上に置くため、メモ欄の高さも渡す
            document.documentElement.style.setProperty('--notes-h', Math.round(bottom) + 'px');
        }

        // 画面の大きさが変わったら組み直す（読んでいた場所は保つ）
        var resizeTimer = null;
        function relayoutSoon() {
            if (resizeTimer) clearTimeout(resizeTimer);
            var anchor = pendingAnchor >= 0 ? pendingAnchor : currentAnchorIndex();
            pendingAnchor = -1;
            resizeTimer = setTimeout(function() { resizeTimer = null; layoutPages(anchor); }, 150);
        }
        window.addEventListener('resize', relayoutSoon);
        // 画面の幅が変わったことを確実に捕まえる。resize が来ない場面（DevToolsの
        // 端末表示の切替など）でも、本文の枠そのものの変化なら拾える
        if (window.ResizeObserver) {
            var lastW = 0, lastH = 0;
            new ResizeObserver(function(entries) {
                var r = entries[0].contentRect;
                var w = Math.round(r.width), h = Math.round(r.height);
                if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
                lastW = w; lastH = h;
                if (pendingLayout !== null) { var a = pendingLayout; pendingLayout = null; layoutPages(a); }
                else relayoutSoon();
            }).observe(document.getElementById('readerContent'));
        }
        window.addEventListener('orientationchange', function () { setTimeout(relayoutSoon, 250); });

        // ===== マウスの操作 =====
        function initMouseDrag() {
            var DRAG_THRESHOLD = 80;

            document.addEventListener('mousedown', function(e) {
                if (isTouchInput()) return;   // 携帯は touchstart 側で受けている
                if (e.target.closest(CONTROL_SELECTOR)) return;
                if (e.detail >= 2) return;    // ダブルクリックの文字選択は邪魔しない
                isDragging = true;
                hasDragged = false;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var diffX = e.clientX - dragStartX;
                var diffY = Math.abs(e.clientY - dragStartY);
                // 横に引いたときだけページ送り。上下に引いても何もしない
                if (Math.abs(diffX) > 10 && Math.abs(diffX) > diffY && !hasDragged) {
                    window.getSelection().removeAllRanges();
                    hasDragged = true;
                }
                if (hasDragged && Math.abs(diffX) > 30) {
                    if (diffX > 50 && currentPage > 1) {
                        document.getElementById('swipeLeft').classList.add('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    } else if (diffX < -50 && currentPage < totalPages) {
                        document.getElementById('swipeRight').classList.add('show');
                        document.getElementById('swipeLeft').classList.remove('show');
                    } else {
                        document.getElementById('swipeLeft').classList.remove('show');
                        document.getElementById('swipeRight').classList.remove('show');
                    }
                }
            });

            document.addEventListener('mouseup', function(e) {
                if (!isDragging) return;
                isDragging = false;
                document.getElementById('swipeLeft').classList.remove('show');
                document.getElementById('swipeRight').classList.remove('show');

                if (hasDragged) {
                    var diffX = e.clientX - dragStartX;
                    if (Math.abs(diffX) > DRAG_THRESHOLD && !isScrollMode()) {
                        var rtl = isRightToLeftBook();
                        if (diffX > 0) { rtl ? nextPage() : prevPage(); }
                        else { rtl ? prevPage() : nextPage(); }
                    }
                    setTimeout(function() { hasDragged = false; }, 50);
                    return;
                }

                // 引かずに離した＝クリック。画面の中央ならバーの表示を切り替える
                if (isTouchInput()) return;
                if (e.target.closest(CONTROL_SELECTOR) || e.target.closest('.click-zone')) return;
                if (String(window.getSelection())) return;   // 文字を選んだだけのときは何もしない
                // 動かしていたらクリックではない（縦に引いた場合など）
                if (Math.abs(e.clientX - dragStartX) > 12 || Math.abs(e.clientY - dragStartY) > 12) return;
                if (tapZone(e.clientX) === 'center') toggleChrome();
            });

            // ページが画面に収まっているので、マウスホイールはページ送りに使う
            var wheelAt = 0;
            document.addEventListener('wheel', function(e) {
                if (isScrollMode()) return;   // スクロール表示はブラウザに任せる
                if (e.target.closest(CONTROL_SELECTOR)) return;
                var now = Date.now();
                if (now - wheelAt < 250) return;            // 1回転がしで1ページだけ進める
                var delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                if (Math.abs(delta) < 4) return;
                wheelAt = now;
                if (delta > 0) nextPage(); else prevPage();
            }, { passive: true });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
            else if (e.ctrlKey && e.key === 'f') { e.preventDefault(); toggleSearch(); }
            else if (e.key === 'Escape') {
                document.getElementById('settingsPanel').classList.remove('show');
                document.getElementById('bookmarksPanel').classList.remove('show');
                document.getElementById('searchPanel').classList.remove('show');
                document.getElementById('tocPanel').classList.remove('show');
                document.getElementById('highlightToolbar').classList.remove('show');
            }
        });

        document.addEventListener('click', function(e) {
            if (e.target.closest('.click-zone')) return; // Don't close panels when clicking navigation zones
            if (!e.target.closest('.settings-panel, [onclick*="toggleSettings"]')) document.getElementById('settingsPanel').classList.remove('show');
            if (!e.target.closest('.bookmarks-panel, [onclick*="toggleBookmarks"]')) document.getElementById('bookmarksPanel').classList.remove('show');
            if (!e.target.closest('.search-panel, [onclick*="toggleSearch"]')) document.getElementById('searchPanel').classList.remove('show');
            if (!e.target.closest('#tocPanel, [onclick*="toggleToc"]')) document.getElementById('tocPanel').classList.remove('show');
            if (!e.target.closest('.mobile-menu-dropdown')) document.getElementById('mobileMenu').classList.remove('show');
        });
    </script>

    <!-- ===== Manga Viewer Script ===== -->
    <script>
    if (isManga) {
        // ---- Manga State ----
        let mangaCurrentPage = 1;
        let mangaTotalPages = 10;
        let mangaReadingMode = 'ltr';
        let mangaZoomLevel = 1;
        const mangaPreloadedPages = new Map();

        // Demo page URLs (replace with API data in production)
        const mangaPageUrls = Array.from({length: mangaTotalPages}, (_, i) =>
            `https://via.placeholder.com/800x1200/2D2A26/FFFFFF?text=Page+${i+1}`
        );
        const mangaThumbUrls = Array.from({length: mangaTotalPages}, (_, i) =>
            `https://via.placeholder.com/80x120/2D2A26/FFFFFF?text=${i+1}`
        );

        // ---- UI Text ----
        const mangaUiText = {
            backToDashboard: { en: 'Dashboard', ja: 'ダッシュボード', zh: '控制台', es: 'Panel', fr: 'Tableau de bord', de: 'Dashboard', ko: '대시보드', ar: 'لوحة التحكم', pt: 'Painel', it: 'Pannello di Controllo' },
            pagesBtn:        { en: 'Pages', ja: 'ページ一覧', zh: '页面', 'zh-TW': '頁面', es: 'Páginas', fr: 'Pages', de: 'Seiten', ko: '페이지', ar: 'الصفحات', pt: 'Páginas', it: 'Pagine' },
            fullscreen:      { en: 'Fullscreen', ja: '全画面', zh: '全屏', es: 'Pantalla completa', fr: 'Plein écran', de: 'Vollbild', ko: '전체화면', ar: 'ملء الشاشة', pt: 'Tela cheia', it: 'Schermo intero' },
            close:           { en: 'Close', ja: '閉じる', zh: '关闭', 'zh-TW': '關閉', es: 'Cerrar', fr: 'Fermer', de: 'Schließen', ko: '닫기', ar: 'إغلاق', pt: 'Fechar', it: 'Chiudi' },
            loadingPage:     { en: 'Loading page...', ja: 'ページを読み込み中...', zh: '加载页面中...', 'zh-TW': '載入頁面中...', es: 'Cargando página...', fr: 'Chargement de la page...', de: 'Seite wird geladen...', ko: '페이지 로딩 중...', ar: 'جارٍ تحميل الصفحة...', pt: 'Carregando página...', it: 'Caricamento pagina...' },
            leftToRight:     { en: 'Left to Right', ja: '左→右', zh: '从左到右', 'zh-TW': '從左到右', es: 'Izquierda a derecha', fr: 'Gauche à droite', de: 'Links nach rechts', ko: '왼쪽→오른쪽', ar: 'من اليسار إلى اليمين', pt: 'Esquerda para direita', it: 'Da sinistra a destra' },
            rightToLeft:     { en: 'Right to Left', ja: '右→左', zh: '从右到左', 'zh-TW': '從右到左', es: 'Derecha a izquierda', fr: 'Droite à gauche', de: 'Rechts nach links', ko: '오른쪽→왼쪽', ar: 'من اليمين إلى اليسار', pt: 'Direita para esquerda', it: 'Da destra a sinistra' },
            vertical:        { en: 'Vertical', ja: '縦読み', zh: '竖排', 'zh-TW': '豎排', es: 'Vertical', fr: 'Vertical', de: 'Vertikal', ko: '세로', ar: 'عمودي', pt: 'Vertical', it: 'Verticale' },
            verticalSoon:    { en: 'Vertical mode coming soon!', ja: '縦読みは近日公開予定！', zh: '竖排模式即将推出！', 'zh-TW': '豎排模式即將推出！', es: '¡Modo vertical próximamente!', fr: 'Mode vertical bientôt disponible !', de: 'Vertikaler Modus kommt bald!', ko: '세로 모드 곧 출시!', ar: 'وضع عمودي قريباً!', pt: 'Modo vertical em breve!', it: 'Modalità verticale disponibile a breve!' },
            noPages:         { en: 'This work has no pages yet.', ja: 'この作品にはまだページがありません。', zh: '该作品还没有页面。', 'zh-TW': '該作品還沒有頁面。', es: 'Esta obra aún no tiene páginas.', fr: 'Cette œuvre n\'a pas encore de pages.', de: 'Dieses Werk hat noch keine Seiten.', ko: '이 작품에는 아직 페이지가 없습니다.', ar: 'لا توجد صفحات لهذا العمل بعد.', pt: 'Esta obra ainda não tem páginas.', it: 'Quest\'opera non ha ancora pagine.' }
        };
        function mangaGetL(obj) { const lang = localStorage.getItem('preferredLanguage') || 'en'; return obj[lang] || obj.en || ''; }

        // ---- 実作品データ（apiWorkIdがあるときAPIから読み込む） ----
        let mangaPagesMeta = null;           // [{pageNo, chapterTitle}]
        const mangaChapters = [];            // [{page(表示上の番号), title}]
        const mangaBlobUrls = new Map();     // 表示番号 -> Promise<objectURL>（認証付きfetchの結果）

        // 表示上のページ番号 -> サーバー上のpage_no（通常は同じ）
        function mangaServerPageNo(pageNum) {
            return (mangaPagesMeta && mangaPagesMeta[pageNum - 1]) ? mangaPagesMeta[pageNum - 1].pageNo : pageNum;
        }

        // ページ画像URLを取得（実作品は認証付きfetch→blob、デモはプレースホルダー）
        function mangaFetchPageUrl(pageNum) {
            if (!apiWorkId) return Promise.resolve(mangaPageUrls[pageNum - 1]);
            if (mangaBlobUrls.has(pageNum)) return mangaBlobUrls.get(pageNum);
            const token = localStorage.getItem('token');
            const pr = fetch((window.API_ORIGIN || '') + '/api/works/' + encodeURIComponent(apiWorkId) + '/pages/' + mangaServerPageNo(pageNum) + '/image', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
              .then(b => URL.createObjectURL(b));
            mangaBlobUrls.set(pageNum, pr);
            pr.catch(() => mangaBlobUrls.delete(pageNum));
            return pr;
        }

        // 読み込み失敗・購入必要などの案内をビューア中央に表示
        function mangaShowNotice(msg, href, linkText) {
            const loading = document.getElementById('mangaPageLoading');
            loading.style.display = 'block';
            loading.innerHTML = '';
            const p = document.createElement('p');
            p.textContent = msg;
            p.style.cssText = 'color:#fff; margin-bottom:1rem;';
            loading.appendChild(p);
            if (href) {
                const a = document.createElement('a');
                a.href = href;
                a.textContent = linkText || '';
                a.className = 'btn btn-light btn-sm';
                loading.appendChild(a);
            }
        }

        async function mangaLoadFromApi() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = 'login.html'; return; }
            try {
                const resp = await fetch((window.API_ORIGIN || '') + '/api/works/' + encodeURIComponent(apiWorkId) + '/pages', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (resp.status === 401) { window.location.href = 'login.html'; return; }
                const data = await resp.json();
                if (resp.status === 403) {
                    mangaShowNotice(getL(uiText.purchaseRequired), 'work-detail.html?id=' + encodeURIComponent(apiWorkId), getL(uiText.viewWorkPage));
                    return;
                }
                if (resp.status === 404) {
                    mangaShowNotice(getL(uiText.workNotFound), 'browse.html', getL(uiText.viewWorkPage));
                    return;
                }
                if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
                if (!data.totalPages) {
                    mangaShowNotice(mangaGetL(mangaUiText.noPages), 'browse.html', getL(uiText.viewWorkPage));
                    return;
                }

                mangaTotalPages = data.totalPages;
                mangaPagesMeta = data.pages || [];
                mangaPagesMeta.forEach((p, i) => {
                    if (p.chapterTitle) mangaChapters.push({ page: i + 1, title: p.chapterTitle });
                });

                document.getElementById('mangaWorkTitle').textContent = data.title || '';
                document.getElementById('mangaWorkAuthor').textContent = data.authorName ? ('by ' + data.authorName) : '';
                document.title = (data.title || 'Reader') + ' - AuctLect';

                mangaBuildChapterSelect();
                mangaInit();
            } catch (err) {
                console.error('Failed to load manga work:', err);
                mangaShowNotice(getL(uiText.loadFailed), 'javascript:location.reload()', getL(uiText.retry));
            }
        }

        // ---- 章ジャンプ ----
        function mangaBuildChapterSelect() {
            const sel = document.getElementById('mangaChapterSelect');
            if (!mangaChapters.length) return;
            sel.innerHTML = '';
            mangaChapters.forEach(c => {
                const o = document.createElement('option');
                o.value = String(c.page);
                o.textContent = c.title + ' — P' + c.page;
                sel.appendChild(o);
            });
            sel.style.display = '';
        }
        function mangaJumpChapter(v) {
            const p = parseInt(v, 10);
            if (p) mangaGoToPage(p);
        }
        window.mangaJumpChapter = mangaJumpChapter;
        function mangaUpdateChapterSelect(pageNum) {
            const sel = document.getElementById('mangaChapterSelect');
            if (!mangaChapters.length) return;
            let cur = null;
            mangaChapters.forEach(c => { if (c.page <= pageNum) cur = c.page; });
            if (cur !== null) sel.value = String(cur);
        }

        // ---- Init ----
        function mangaInit() {
            document.getElementById('mangaBackText').textContent     = mangaGetL(mangaUiText.backToDashboard);
            document.getElementById('mangaPagesText').textContent    = mangaGetL(mangaUiText.pagesBtn);
            document.getElementById('mangaFullscreenText').textContent = mangaGetL(mangaUiText.fullscreen);
            document.getElementById('mangaCloseText').textContent    = mangaGetL(mangaUiText.close);
            document.getElementById('mangaLoadingText').textContent  = mangaGetL(mangaUiText.loadingPage);
            document.getElementById('mangaLtrText').textContent      = mangaGetL(mangaUiText.leftToRight);
            document.getElementById('mangaRtlText').textContent      = mangaGetL(mangaUiText.rightToLeft);
            document.getElementById('mangaVerticalText').textContent = mangaGetL(mangaUiText.vertical);
            document.getElementById('mangaTotalPagesNum').textContent = mangaTotalPages;
            mangaInitThumbnails();
            mangaLoadPage(1);
        }

        // ---- Load Page ----
        function mangaLoadPage(pageNum) {
            const img = document.getElementById('mangaPageImg');
            const loading = document.getElementById('mangaPageLoading');
            loading.style.display = 'block';
            img.style.display = 'none';
            mangaCurrentPage = pageNum;
            document.getElementById('mangaCurrentPageNum').textContent = pageNum;
            mangaUpdateThumbnailActive(pageNum);
            mangaUpdateChapterSelect(pageNum);
            mangaFetchPageUrl(pageNum)
                .then(url => new Promise((resolve, reject) => {
                    const tmp = new Image();
                    tmp.onload = () => resolve(url);
                    tmp.onerror = reject;
                    tmp.src = url;
                }))
                .then(url => {
                    if (mangaCurrentPage !== pageNum) return; // 読み込み中に別ページへ移動済み
                    img.src = url;
                    img.style.display = 'block';
                    loading.style.display = 'none';
                    mangaPreloadedPages.set(pageNum, true);
                    mangaUpdatePreloadProgress();
                })
                .catch(() => { if (mangaCurrentPage === pageNum) loading.style.display = 'none'; });
            mangaPreloadPages(pageNum);
        }

        function mangaPreloadPages(current) {
            for (let i = 1; i <= 3; i++) {
                const next = current + i;
                if (next <= mangaTotalPages && !mangaPreloadedPages.has(next)) {
                    mangaFetchPageUrl(next).then(url => {
                        const img = new Image();
                        img.onload = () => { mangaPreloadedPages.set(next, true); mangaUpdatePreloadProgress(); };
                        img.src = url;
                    }).catch(() => {});
                }
            }
        }

        function mangaUpdatePreloadProgress() {
            const pct = (mangaPreloadedPages.size / mangaTotalPages) * 100;
            const bar = document.getElementById('mangaPreloadProgress');
            bar.style.width = pct + '%';
            if (pct >= 100) setTimeout(() => { bar.style.opacity = '0'; }, 500);
        }

        // ---- Thumbnails ----
        function mangaInitThumbnails() {
            const strip = document.getElementById('mangaThumbnailStrip');
            strip.innerHTML = '';
            for (let i = 1; i <= mangaTotalPages; i++) {
                const div = document.createElement('div');
                div.className = 'thumb-item' + (i === 1 ? ' active' : '');
                if (apiWorkId) {
                    // 実作品: 全ページ画像の先読みを避け、番号+章タイトルのテキストサムネイルにする
                    const meta = (mangaPagesMeta && mangaPagesMeta[i - 1]) || {};
                    const box = document.createElement('div');
                    box.style.cssText = 'width:80px; height:120px; background:#3a362f; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:4px; padding:4px; text-align:center;';
                    const num = document.createElement('div');
                    num.textContent = i;
                    num.style.cssText = 'font-size:1.2rem; font-weight:700;';
                    box.appendChild(num);
                    if (meta.chapterTitle) {
                        const ct = document.createElement('div');
                        ct.textContent = meta.chapterTitle;
                        ct.style.cssText = 'font-size:0.65rem; line-height:1.3; overflow:hidden; max-height:2.6em;';
                        box.appendChild(ct);
                    }
                    div.appendChild(box);
                } else {
                    div.innerHTML = `<img src="${mangaThumbUrls[i-1]}" alt="Page ${i}" loading="lazy">`;
                }
                div.onclick = () => mangaGoToPage(i);
                strip.appendChild(div);
            }
        }

        function mangaUpdateThumbnailActive(pageNum) {
            document.querySelectorAll('.thumb-item').forEach((t, i) => { t.classList.toggle('active', i + 1 === pageNum); });
            const active = document.querySelector('.thumb-item.active');
            if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function mangaShowThumbnails() { document.getElementById('mangaThumbnailStrip').classList.toggle('show'); }

        // ---- Navigation ----
        function mangaGoToPage(page) {
            if (page >= 1 && page <= mangaTotalPages) { mangaLoadPage(page); document.getElementById('mangaThumbnailStrip').classList.remove('show'); }
        }

        function mangaNextPage() {
            if (mangaReadingMode === 'rtl') { if (mangaCurrentPage > 1) mangaLoadPage(mangaCurrentPage - 1); }
            else { if (mangaCurrentPage < mangaTotalPages) mangaLoadPage(mangaCurrentPage + 1); }
        }

        function mangaPrevPage() {
            if (mangaReadingMode === 'rtl') { if (mangaCurrentPage < mangaTotalPages) mangaLoadPage(mangaCurrentPage + 1); }
            else { if (mangaCurrentPage > 1) mangaLoadPage(mangaCurrentPage - 1); }
        }

        // ---- Reading Mode ----
        function mangaSetReadingMode(mode) {
            mangaReadingMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(mode + 'Btn').classList.add('active');
            if (mode === 'vertical') alert(mangaGetL(mangaUiText.verticalSoon));
        }

        // ---- Zoom ----
        function mangaZoomIn()    { mangaZoomLevel = Math.min(mangaZoomLevel + 0.1, 3); mangaApplyZoom(); }
        function mangaZoomOut()   { mangaZoomLevel = Math.max(mangaZoomLevel - 0.1, 0.5); mangaApplyZoom(); }
        function mangaResetZoom() { mangaZoomLevel = 1; mangaApplyZoom(); }
        function mangaApplyZoom() { document.getElementById('mangaPageImg').style.transform = `scale(${mangaZoomLevel})`; }

        // ---- Fullscreen ----
        function mangaToggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // ---- Keyboard ----
        document.addEventListener('keydown', (e) => {
            if (!isManga) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') mangaNextPage();
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') mangaPrevPage();
            else if (e.key === 'f') mangaToggleFullscreen();
            else if (e.key === '+' || e.key === '=') mangaZoomIn();
            else if (e.key === '-') mangaZoomOut();
            else if (e.key === '0') mangaResetZoom();
            else if (e.key === 'Escape') document.getElementById('mangaThumbnailStrip').classList.remove('show');
        });

        // ---- Touch Swipe ----
        let mangaTouchStartX = 0;
        document.getElementById('mangaViewerContent').addEventListener('touchstart', e => { mangaTouchStartX = e.changedTouches[0].screenX; }, { passive: true });
        document.getElementById('mangaViewerContent').addEventListener('touchend', e => {
            const diff = e.changedTouches[0].screenX - mangaTouchStartX;
            if (Math.abs(diff) > 50) { if (diff > 0) mangaPrevPage(); else mangaNextPage(); }
        }, { passive: true });

        // ---- Start ----
        document.addEventListener('DOMContentLoaded', () => {
            if (apiWorkId) mangaLoadFromApi();
            else mangaInit(); // デモ表示（IDなし）
        });
    }
    </script>
</body>
</html>
