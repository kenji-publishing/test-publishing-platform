<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="mangaEditor.pageTitle">Manga Editor - Publisher</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Platform CSS -->
    <link href="../css/variables.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style-new.css">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/navbar.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/mobile-fixes.css">

    <!-- Language Files -->
    <script src="../js/lang/ja.js"></script>
    <script src="../js/lang/en.js"></script>
    <script src="../js/lang/zh.js"></script>
    <script src="../js/lang/es.js"></script>
    <script src="../js/lang/fr.js"></script>
    <script src="../js/lang/de.js"></script>
    <script src="../js/lang/ko.js"></script>
    <script src="../js/lang/ar.js"></script>
    <script src="../js/lang/pt.js"></script>
    <script src="../js/lang/it.js"></script>

    <style>
        :root {
            --color-bg: #FAF8F5;
            --color-bg-card: #FFFFFF;
            --color-bg-main: #FAF8F5;
            --color-bg-hover: rgba(139, 115, 85, 0.05);
            --color-accent: #8B7355;
            --color-text: #2D2A26;
            --color-text-secondary: #6B6560;
            --color-border: #E8E4E0;
            --color-success: #5D9C59;
            --color-warning: #D4A853;
            --color-error: #C75D5D;
            --color-info: #5D8BC7;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            margin: 0; padding: 0;
        }

        /* ========== Editor Layout ========== */
        .editor-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.25rem;
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .editor-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-accent);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .editor-header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .editor-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 1.25rem;
            min-height: calc(100vh - 200px);
        }

        @media (max-width: 1024px) {
            .editor-layout { grid-template-columns: 1fr; }
        }

        /* ========== Upload / Staging State ========== */
        .upload-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .upload-zone {
            border: 2px dashed var(--color-border);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            color: var(--color-text-secondary);
            transition: all 0.2s;
            width: 100%;
            max-width: 700px;
            background: var(--color-bg-card);
        }
        .upload-zone:hover { border-color: var(--color-accent); color: var(--color-accent); }
        .upload-zone.dragover { border-color: var(--color-accent); background: rgba(139, 115, 85, 0.05); }
        .upload-zone i { font-size: 3rem; margin-bottom: 1rem; display: block; }
        .upload-zone p { font-size: 1rem; margin: 0.5rem 0; }
        .upload-zone small { font-size: 0.82rem; }

        .staged-panel {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            padding: 1.25rem;
        }
        .staged-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .staged-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .staged-count {
            background: var(--color-accent);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .staged-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .staged-item {
            position: relative;
            aspect-ratio: 3/4;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
        }
        .staged-item img { width: 100%; height: 100%; object-fit: cover; }
        .staged-item-num {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .staged-item-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(199, 93, 93, 0.9);
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .staged-item-remove:hover { background: var(--color-error); }
        .staged-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* ========== Canvas Panel ========== */
        .canvas-panel {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .canvas-toolbar-left,
        .canvas-toolbar-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .toolbar-btn {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 0.4rem 0.7rem;
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--color-text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .toolbar-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
        .toolbar-btn.active { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
        .toolbar-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .tool-divider {
            width: 1px;
            height: 22px;
            background: var(--color-border);
            margin: 0 0.25rem;
        }

        .brush-options {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.5rem;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 6px;
        }
        .brush-options label {
            font-size: 0.72rem;
            color: var(--color-text-secondary);
            margin: 0;
        }
        .brush-options input[type="color"] {
            width: 28px;
            height: 24px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
        }
        .brush-options input[type="range"] {
            width: 80px;
        }

        .page-nav-info {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--color-text);
            min-width: 60px;
            text-align: center;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #E0DDD8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            line-height: 0;
        }
        .canvas-wrapper img {
            max-width: 100%;
            max-height: 75vh;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Drawing canvas overlay */
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            touch-action: none;
        }
        .tool-mode-draw #drawCanvas { pointer-events: auto; cursor: crosshair; }
        .tool-mode-region .canvas-wrapper { cursor: crosshair; }

        /* ========== Text Regions on Canvas ========== */
        .text-region {
            position: absolute;
            border: 2px solid var(--color-accent);
            background: rgba(139, 115, 85, 0.1);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            min-width: 20px;
            min-height: 20px;
        }
        .text-region:hover {
            border-color: var(--color-info);
            background: rgba(93, 139, 199, 0.15);
        }
        .text-region.selected {
            border-color: var(--color-info);
            background: rgba(93, 139, 199, 0.2);
            box-shadow: 0 0 0 2px rgba(93, 139, 199, 0.3);
        }

        .region-label {
            position: absolute;
            top: -18px;
            left: -2px;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px 3px 0 0;
            color: #fff;
            white-space: nowrap;
            background: var(--color-accent);
        }

        /* Drawing rectangle (during drag) */
        .draw-rect {
            position: absolute;
            border: 2px dashed var(--color-accent);
            background: rgba(139, 115, 85, 0.1);
            pointer-events: none;
        }

        /* Preview overlay text */
        .preview-text-overlay {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            color: #000;
            padding: 2px 4px;
            overflow: hidden;
            word-break: break-word;
            line-height: 1.3;
            pointer-events: none;
        }
        .preview-text-overlay.writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        /* ========== Thumbnail Bar ========== */
        .thumbnail-bar {
            display: flex;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--color-border);
            overflow-x: auto;
            background: var(--color-bg);
        }
        .thumbnail-bar::-webkit-scrollbar { height: 5px; }
        .thumbnail-bar::-webkit-scrollbar-track { background: var(--color-bg); }
        .thumbnail-bar::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }

        .thumb-item {
            flex: 0 0 60px;
            width: 60px;
            aspect-ratio: 3/4;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid var(--color-border);
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s;
        }
        .thumb-item:hover { border-color: var(--color-accent); }
        .thumb-item.active { border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(139, 115, 85, 0.3); }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-item .thumb-num {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6);
            color: #fff;
            text-align: center;
            font-size: 0.6rem;
            padding: 1px;
        }

        /* ========== Side Panel ========== */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            overflow: hidden;
        }
        .panel-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            background: var(--color-bg);
        }
        .panel-header h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .panel-body { padding: 0.75rem 1rem; }

        /* ========== Region List ========== */
        .region-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 500px;
            overflow-y: auto;
        }
        .region-list::-webkit-scrollbar { width: 5px; }
        .region-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }

        .region-card {
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .region-card:hover { border-color: var(--color-accent); }
        .region-card.selected { border-color: var(--color-info); background: rgba(93, 139, 199, 0.06); }

        .region-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }
        .region-number {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-accent);
            background: rgba(139, 115, 85, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .region-delete-btn {
            background: none;
            border: none;
            color: var(--color-error);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .region-delete-btn:hover { opacity: 1; }

        .region-field {
            margin-bottom: 0.4rem;
        }
        .region-field:last-child { margin-bottom: 0; }
        .region-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 0.15rem;
            text-transform: uppercase;
        }
        .region-field textarea {
            width: 100%;
            padding: 0.4rem 0.5rem;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: 'Noto Sans JP', sans-serif;
            resize: vertical;
            min-height: 50px;
            line-height: 1.5;
            color: var(--color-text);
            background: var(--color-bg);
        }
        .region-field textarea:focus { outline: none; border-color: var(--color-accent); background: #fff; }

        .region-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
        }
        .region-options label {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 0.15rem;
            text-transform: uppercase;
        }
        .region-options select,
        .region-options input {
            width: 100%;
            padding: 0.3rem 0.4rem;
            border: 1px solid var(--color-border);
            border-radius: 5px;
            font-size: 0.75rem;
            background: #fff;
            color: var(--color-text);
        }

        .empty-regions {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            padding: 2rem 1rem;
        }
        .empty-regions i { font-size: 2rem; margin-bottom: 0.5rem; display: block; color: var(--color-border); }

        /* ========== Action Buttons ========== */
        .btn-primary-custom {
            background: var(--color-accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-primary-custom:hover { background: #7A6548; }
        .btn-primary-custom:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary-custom {
            background: transparent;
            color: var(--color-accent);
            border: 1px solid var(--color-accent);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-secondary-custom:hover { background: var(--color-accent); color: #fff; }

        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.82rem; }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .editor-container { padding: 0.75rem; }
            .editor-header { flex-direction: column; align-items: flex-start; }
            .canvas-area { min-height: 350px; }
            .region-options { grid-template-columns: 1fr; }
            .editor-header-actions { width: 100%; justify-content: flex-end; }
            .staged-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
            .brush-options input[type="range"] { width: 60px; }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="editor-container">
        <!-- Header -->
        <div class="editor-header">
            <h1><i class="fas fa-edit"></i> <span id="editorTitle">Manga Editor</span></h1>
            <div class="editor-header-actions" id="headerActions" style="display:none;">
                <button class="btn-secondary-custom btn-sm" onclick="backToStaging()">
                    <i class="fas fa-arrow-left"></i> <span id="btnBackStaging">Manage Pages</span>
                </button>
                <button class="btn-secondary-custom btn-sm" id="btnTogglePreview" onclick="togglePreview()">
                    <i class="fas fa-eye"></i> <span id="btnPreviewText">Preview</span>
                </button>
                <button class="btn-primary-custom btn-sm" onclick="exportPage()">
                    <i class="fas fa-download"></i> <span id="btnExport">Export</span>
                </button>
            </div>
        </div>

        <!-- Upload / Staging State -->
        <div id="uploadState" class="upload-state">
            <div class="upload-zone" id="uploadZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <p id="uploadText">Click or drag manga pages here</p>
                <small id="uploadHint">Supports .jpg, .png, .webp - multiple pages OK</small>
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp" multiple style="display:none;" onchange="handleFileUpload(this)">
            </div>

            <!-- Staged pages (shown after upload) -->
            <div id="stagedPanel" class="staged-panel" style="display:none;">
                <div class="staged-header">
                    <div class="staged-title">
                        <i class="fas fa-images"></i>
                        <span id="stagedTitle">Uploaded Pages</span>
                        <span class="staged-count" id="stagedCount">0</span>
                    </div>
                </div>
                <div class="staged-grid" id="stagedGrid"></div>
                <div class="staged-actions">
                    <button class="btn-secondary-custom btn-sm" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-plus"></i> <span id="btnAddMore">Add More Pages</span>
                    </button>
                    <button class="btn-secondary-custom btn-sm" onclick="clearAllStaged()">
                        <i class="fas fa-trash-alt"></i> <span id="btnClearStaged">Clear All</span>
                    </button>
                    <button class="btn-primary-custom btn-sm" onclick="startEditing()">
                        <span id="btnStartEdit">Start Editing</span> <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Editor State -->
        <div id="editorState" style="display:none;">
            <div class="editor-layout">
                <!-- Left: Canvas -->
                <div class="canvas-panel">
                    <div class="canvas-toolbar">
                        <div class="canvas-toolbar-left">
                            <button class="toolbar-btn active" id="btnToolRegion" onclick="setTool('region')" title="Add text region">
                                <i class="fas fa-font"></i> <span id="btnRegionLabel">Text</span>
                            </button>
                            <button class="toolbar-btn" id="btnToolDraw" onclick="setTool('draw')" title="Freehand drawing">
                                <i class="fas fa-paint-brush"></i> <span id="btnDrawLabel">Draw</span>
                            </button>
                            <button class="toolbar-btn" id="btnToolErase" onclick="setTool('erase')" title="Eraser">
                                <i class="fas fa-eraser"></i> <span id="btnEraseLabel">Erase</span>
                            </button>

                            <!-- Brush options (visible in draw/erase mode) -->
                            <div class="brush-options" id="brushOptions" style="display:none;">
                                <label id="labelBrushColor"><i class="fas fa-palette"></i></label>
                                <input type="color" id="brushColor" value="#000000">
                                <label id="labelBrushSize">
                                    <i class="fas fa-circle" style="font-size:0.65rem;"></i>
                                </label>
                                <input type="range" id="brushSize" min="1" max="30" value="4">
                                <span id="brushSizeVal" style="font-size:0.72rem; min-width:18px; text-align:right;">4</span>
                                <button class="toolbar-btn" onclick="clearDrawing()" style="padding: 0.25rem 0.5rem;" title="Clear drawing on this page">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="canvas-toolbar-right">
                            <button class="toolbar-btn" onclick="navPage(-1)" id="btnPrevPage"><i class="fas fa-chevron-left"></i></button>
                            <span class="page-nav-info" id="pageNavInfo">1 / 1</span>
                            <button class="toolbar-btn" onclick="navPage(1)" id="btnNextPage"><i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>

                    <div class="canvas-area tool-mode-region" id="canvasArea">
                        <div class="canvas-wrapper" id="canvasWrapper">
                            <img id="canvasImg" src="" alt="Manga page">
                            <canvas id="drawCanvas"></canvas>
                        </div>
                    </div>

                    <div class="thumbnail-bar" id="thumbnailBar"></div>
                </div>

                <!-- Right: Side Panel -->
                <div class="side-panel">
                    <!-- Text Regions List -->
                    <div class="panel">
                        <div class="panel-header">
                            <h3><i class="fas fa-layer-group"></i> <span id="panelRegionsTitle">Text Regions</span></h3>
                            <span id="regionCount" style="font-size:0.75rem; color:var(--color-text-secondary);">0</span>
                        </div>
                        <div class="panel-body">
                            <div class="region-list" id="regionList">
                                <div class="empty-regions">
                                    <i class="fas fa-draw-polygon"></i>
                                    <p id="emptyRegionsText">Drag on the image to add text regions</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- ========== JavaScript ========== -->
    <script>
    // ===== State =====
    // Each page: { file, url, regions: [], drawingDataUrl: null }
    var pages = [];
    var currentPageIndex = 0;
    var selectedRegionId = null;
    var tool = 'region';          // 'region' | 'draw' | 'erase'
    var isDrawing = false;        // for region rectangle drag
    var isPainting = false;       // for freehand drawing
    var drawStart = { x: 0, y: 0 };
    var previewMode = false;
    var regionIdCounter = 0;
    var lastPaintX = 0, lastPaintY = 0;

    function getLang() {
        return (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : (localStorage.getItem('preferredLanguage') || 'en');
    }

    // ===== File Upload =====
    function handleFileUpload(input) {
        var files = Array.from(input.files).filter(function(f) { return f.type.startsWith('image/'); });
        if (files.length === 0) return;
        files.forEach(function(f) {
            pages.push({ file: f, regions: [], url: URL.createObjectURL(f), drawingDataUrl: null });
        });
        input.value = '';
        renderStaged();
    }

    function renderStaged() {
        var panel = document.getElementById('stagedPanel');
        var grid = document.getElementById('stagedGrid');
        var count = document.getElementById('stagedCount');

        if (pages.length === 0) {
            panel.style.display = 'none';
            return;
        }

        panel.style.display = '';
        count.textContent = pages.length;
        grid.innerHTML = '';
        pages.forEach(function(pg, i) {
            var div = document.createElement('div');
            div.className = 'staged-item';
            var img = document.createElement('img');
            img.src = pg.url;
            var num = document.createElement('div');
            num.className = 'staged-item-num';
            num.textContent = 'P' + (i + 1);
            var btn = document.createElement('button');
            btn.className = 'staged-item-remove';
            btn.innerHTML = '<i class="fas fa-times"></i>';
            btn.onclick = function(e) { e.stopPropagation(); removeStagedPage(i); };
            div.appendChild(img);
            div.appendChild(num);
            div.appendChild(btn);
            grid.appendChild(div);
        });
    }

    function removeStagedPage(idx) {
        pages.splice(idx, 1);
        renderStaged();
    }

    function clearAllStaged() {
        var L = getLang();
        var msg = { en: 'Remove all uploaded pages?', ja: 'アップロードした全ページを削除しますか？', zh: '删除所有已上传的页面？', es: '¿Eliminar todas las páginas subidas?', fr: 'Supprimer toutes les pages téléchargées ?', de: 'Alle hochgeladenen Seiten entfernen?', ko: '업로드된 모든 페이지를 삭제하시겠습니까?', ar: 'إزالة جميع الصفحات المحملة؟', pt: 'Remover todas as páginas enviadas?', it: 'Rimuovere tutte le pagine caricate?' };
        if (!confirm(msg[L] || msg.en)) return;
        pages = [];
        renderStaged();
    }

    function startEditing() {
        if (pages.length === 0) return;
        currentPageIndex = 0;
        document.getElementById('uploadState').style.display = 'none';
        document.getElementById('editorState').style.display = '';
        document.getElementById('headerActions').style.display = '';
        renderPage();
    }

    function backToStaging() {
        // Save current drawing before going back
        savePageDrawing();
        document.getElementById('editorState').style.display = 'none';
        document.getElementById('headerActions').style.display = 'none';
        document.getElementById('uploadState').style.display = '';
        renderStaged();
    }

    // ===== Page Navigation =====
    function navPage(dir) {
        var next = currentPageIndex + dir;
        if (next < 0 || next >= pages.length) return;
        savePageDrawing();
        currentPageIndex = next;
        selectedRegionId = null;
        renderPage();
    }

    function goToPage(idx) {
        if (idx < 0 || idx >= pages.length) return;
        savePageDrawing();
        currentPageIndex = idx;
        selectedRegionId = null;
        renderPage();
    }

    function renderPage() {
        var page = pages[currentPageIndex];
        if (!page) return;
        var img = document.getElementById('canvasImg');
        img.onload = function() {
            setupDrawCanvas();
            loadPageDrawing();
            renderRegionsOnCanvas();
        };
        img.src = page.url;
        document.getElementById('pageNavInfo').textContent = (currentPageIndex + 1) + ' / ' + pages.length;
        document.getElementById('btnPrevPage').disabled = currentPageIndex === 0;
        document.getElementById('btnNextPage').disabled = currentPageIndex === pages.length - 1;
        renderThumbnails();
        renderRegionList();
    }

    function renderThumbnails() {
        var bar = document.getElementById('thumbnailBar');
        bar.innerHTML = '';
        pages.forEach(function(pg, i) {
            var div = document.createElement('div');
            div.className = 'thumb-item' + (i === currentPageIndex ? ' active' : '');
            div.onclick = function() { goToPage(i); };
            var img = document.createElement('img');
            img.src = pg.url;
            var num = document.createElement('div');
            num.className = 'thumb-num';
            num.textContent = 'P' + (i + 1);
            div.appendChild(img);
            div.appendChild(num);
            bar.appendChild(div);
        });
    }

    // ===== Tool Mode =====
    function setTool(t) {
        tool = t;
        document.getElementById('btnToolRegion').classList.toggle('active', t === 'region');
        document.getElementById('btnToolDraw').classList.toggle('active', t === 'draw');
        document.getElementById('btnToolErase').classList.toggle('active', t === 'erase');

        var area = document.getElementById('canvasArea');
        area.classList.remove('tool-mode-region', 'tool-mode-draw', 'tool-mode-erase');
        area.classList.add('tool-mode-' + t);

        var brushOpts = document.getElementById('brushOptions');
        brushOpts.style.display = (t === 'draw' || t === 'erase') ? '' : 'none';
    }

    // ===== Draw Canvas Setup =====
    function setupDrawCanvas() {
        var img = document.getElementById('canvasImg');
        var canvas = document.getElementById('drawCanvas');
        canvas.width = img.offsetWidth;
        canvas.height = img.offsetHeight;
        canvas.style.width = img.offsetWidth + 'px';
        canvas.style.height = img.offsetHeight + 'px';
    }

    function loadPageDrawing() {
        var canvas = document.getElementById('drawCanvas');
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var page = pages[currentPageIndex];
        if (page && page.drawingDataUrl) {
            var drawImg = new Image();
            drawImg.onload = function() {
                ctx.drawImage(drawImg, 0, 0, canvas.width, canvas.height);
            };
            drawImg.src = page.drawingDataUrl;
        }
    }

    function savePageDrawing() {
        var canvas = document.getElementById('drawCanvas');
        if (!canvas || !pages[currentPageIndex]) return;
        // Only save if canvas has content
        try {
            pages[currentPageIndex].drawingDataUrl = canvas.toDataURL('image/png');
        } catch (e) {}
    }

    function clearDrawing() {
        var L = getLang();
        var msg = { en: 'Clear all drawings on this page?', ja: 'このページの全描画をクリアしますか？', zh: '清除此页面的所有绘图？', es: '¿Borrar todos los dibujos de esta página?', fr: 'Effacer tous les dessins de cette page ?', de: 'Alle Zeichnungen auf dieser Seite löschen?', ko: '이 페이지의 모든 그림을 삭제하시겠습니까?', ar: 'مسح جميع الرسومات على هذه الصفحة؟', pt: 'Limpar todos os desenhos desta página?', it: 'Cancellare tutti i disegni di questa pagina?' };
        if (!confirm(msg[L] || msg.en)) return;
        var canvas = document.getElementById('drawCanvas');
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pages[currentPageIndex].drawingDataUrl = null;
    }

    // Window resize: re-setup canvas
    window.addEventListener('resize', function() {
        if (document.getElementById('editorState').style.display === 'none') return;
        savePageDrawing();
        setupDrawCanvas();
        loadPageDrawing();
    });

    // ===== Drawing Events =====
    (function() {
        var canvasArea, wrapper, drawCanvas, drawRect;

        document.addEventListener('DOMContentLoaded', function() {
            canvasArea = document.getElementById('canvasArea');
            wrapper = document.getElementById('canvasWrapper');
            drawCanvas = document.getElementById('drawCanvas');

            // Upload zone events
            var uploadZone = document.getElementById('uploadZone');
            uploadZone.addEventListener('click', function() { document.getElementById('fileInput').click(); });
            uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault(); this.classList.remove('dragover');
                var files = Array.from(e.dataTransfer.files).filter(function(f) { return f.type.startsWith('image/'); });
                files.forEach(function(f) { pages.push({ file: f, regions: [], url: URL.createObjectURL(f), drawingDataUrl: null }); });
                if (files.length > 0) renderStaged();
            });

            // Brush size display
            document.getElementById('brushSize').addEventListener('input', function() {
                document.getElementById('brushSizeVal').textContent = this.value;
            });

            // ===== Region mode: mouse drag on wrapper =====
            wrapper.addEventListener('mousedown', function(e) {
                if (tool !== 'region') return;
                // Click on existing region → select
                if (e.target.classList.contains('text-region') || e.target.closest('.text-region')) return;
                e.preventDefault();
                var rect = wrapper.getBoundingClientRect();
                drawStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                isDrawing = true;
                drawRect = document.createElement('div');
                drawRect.className = 'draw-rect';
                drawRect.style.left = drawStart.x + 'px';
                drawRect.style.top = drawStart.y + 'px';
                drawRect.style.width = '0px';
                drawRect.style.height = '0px';
                wrapper.appendChild(drawRect);
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDrawing || !drawRect) return;
                var rect = wrapper.getBoundingClientRect();
                var cx = Math.max(0, Math.min(e.clientX - rect.left, wrapper.offsetWidth));
                var cy = Math.max(0, Math.min(e.clientY - rect.top, wrapper.offsetHeight));
                var x = Math.min(drawStart.x, cx);
                var y = Math.min(drawStart.y, cy);
                drawRect.style.left = x + 'px';
                drawRect.style.top = y + 'px';
                drawRect.style.width = Math.abs(cx - drawStart.x) + 'px';
                drawRect.style.height = Math.abs(cy - drawStart.y) + 'px';
            });

            document.addEventListener('mouseup', function(e) {
                if (!isDrawing || !drawRect) return;
                isDrawing = false;
                var w = parseInt(drawRect.style.width);
                var h = parseInt(drawRect.style.height);
                var x = parseInt(drawRect.style.left);
                var y = parseInt(drawRect.style.top);
                drawRect.remove();
                drawRect = null;
                if (w < 15 || h < 15) return;
                addRegion(x, y, w, h);
            });

            // Touch support for region drawing
            wrapper.addEventListener('touchstart', function(e) {
                if (tool !== 'region') return;
                if (e.target.classList.contains('text-region') || e.target.closest('.text-region')) return;
                e.preventDefault();
                var touch = e.touches[0];
                var rect = wrapper.getBoundingClientRect();
                drawStart = { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
                isDrawing = true;
                drawRect = document.createElement('div');
                drawRect.className = 'draw-rect';
                drawRect.style.left = drawStart.x + 'px';
                drawRect.style.top = drawStart.y + 'px';
                drawRect.style.width = '0px';
                drawRect.style.height = '0px';
                wrapper.appendChild(drawRect);
            }, { passive: false });

            wrapper.addEventListener('touchmove', function(e) {
                if (!isDrawing || !drawRect) return;
                e.preventDefault();
                var touch = e.touches[0];
                var rect = wrapper.getBoundingClientRect();
                var cx = Math.max(0, Math.min(touch.clientX - rect.left, wrapper.offsetWidth));
                var cy = Math.max(0, Math.min(touch.clientY - rect.top, wrapper.offsetHeight));
                var x = Math.min(drawStart.x, cx);
                var y = Math.min(drawStart.y, cy);
                drawRect.style.left = x + 'px';
                drawRect.style.top = y + 'px';
                drawRect.style.width = Math.abs(cx - drawStart.x) + 'px';
                drawRect.style.height = Math.abs(cy - drawStart.y) + 'px';
            }, { passive: false });

            wrapper.addEventListener('touchend', function(e) {
                if (!isDrawing || !drawRect) return;
                isDrawing = false;
                var w = parseInt(drawRect.style.width);
                var h = parseInt(drawRect.style.height);
                var x = parseInt(drawRect.style.left);
                var y = parseInt(drawRect.style.top);
                drawRect.remove();
                drawRect = null;
                if (w < 15 || h < 15) return;
                addRegion(x, y, w, h);
            });

            // ===== Freehand drawing on canvas =====
            drawCanvas.addEventListener('mousedown', function(e) {
                if (tool !== 'draw' && tool !== 'erase') return;
                e.preventDefault();
                var rect = drawCanvas.getBoundingClientRect();
                isPainting = true;
                lastPaintX = e.clientX - rect.left;
                lastPaintY = e.clientY - rect.top;
                drawDot(lastPaintX, lastPaintY);
            });

            document.addEventListener('mousemove', function(e) {
                if (!isPainting) return;
                var rect = drawCanvas.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                drawLine(lastPaintX, lastPaintY, x, y);
                lastPaintX = x;
                lastPaintY = y;
            });

            document.addEventListener('mouseup', function() {
                if (isPainting) {
                    isPainting = false;
                    savePageDrawing();
                }
            });

            drawCanvas.addEventListener('touchstart', function(e) {
                if (tool !== 'draw' && tool !== 'erase') return;
                e.preventDefault();
                var touch = e.touches[0];
                var rect = drawCanvas.getBoundingClientRect();
                isPainting = true;
                lastPaintX = touch.clientX - rect.left;
                lastPaintY = touch.clientY - rect.top;
                drawDot(lastPaintX, lastPaintY);
            }, { passive: false });

            drawCanvas.addEventListener('touchmove', function(e) {
                if (!isPainting) return;
                e.preventDefault();
                var touch = e.touches[0];
                var rect = drawCanvas.getBoundingClientRect();
                var x = touch.clientX - rect.left;
                var y = touch.clientY - rect.top;
                drawLine(lastPaintX, lastPaintY, x, y);
                lastPaintX = x;
                lastPaintY = y;
            }, { passive: false });

            drawCanvas.addEventListener('touchend', function() {
                if (isPainting) {
                    isPainting = false;
                    savePageDrawing();
                }
            });

            // Click on canvas area to deselect
            canvasArea.addEventListener('mousedown', function(e) {
                if (tool !== 'region') return;
                if (!e.target.classList.contains('text-region') && !e.target.closest('.text-region')) {
                    selectedRegionId = null;
                    renderRegionsOnCanvas();
                    renderRegionList();
                }
            });
        });
    })();

    // ===== Canvas draw helpers =====
    function drawDot(x, y) {
        var canvas = document.getElementById('drawCanvas');
        var ctx = canvas.getContext('2d');
        var size = parseInt(document.getElementById('brushSize').value);
        if (tool === 'erase') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        } else {
            ctx.fillStyle = document.getElementById('brushColor').value;
            ctx.beginPath();
            ctx.arc(x, y, size / 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawLine(x1, y1, x2, y2) {
        var canvas = document.getElementById('drawCanvas');
        var ctx = canvas.getContext('2d');
        var size = parseInt(document.getElementById('brushSize').value);
        if (tool === 'erase') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = size * 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        } else {
            ctx.strokeStyle = document.getElementById('brushColor').value;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }
    }

    // ===== Region operations =====
    function addRegion(x, y, w, h) {
        var img = document.getElementById('canvasImg');
        var iw = img.offsetWidth;
        var ih = img.offsetHeight;
        if (iw === 0 || ih === 0) return;

        var region = {
            id: ++regionIdCounter,
            x: (x / iw * 100).toFixed(2),
            y: (y / ih * 100).toFixed(2),
            w: (w / iw * 100).toFixed(2),
            h: (h / ih * 100).toFixed(2),
            original: '',
            edited: '',
            fontSize: 14,
            fontWeight: '700',
            fontColor: '#000000',
            bgOpacity: 'opaque',   // 'transparent' | 'semi' | 'opaque'
            writingMode: 'horizontal'  // 'horizontal' | 'vertical'
        };
        pages[currentPageIndex].regions.push(region);
        selectedRegionId = region.id;
        renderRegionsOnCanvas();
        renderRegionList();
        scrollToRegionCard(region.id);
    }

    function renderRegionsOnCanvas() {
        var wrapper = document.getElementById('canvasWrapper');
        wrapper.querySelectorAll('.text-region, .preview-text-overlay').forEach(function(el) { el.remove(); });
        if (!pages[currentPageIndex]) return;

        var regions = pages[currentPageIndex].regions;

        regions.forEach(function(r) {
            if (previewMode) {
                if (r.edited.trim()) {
                    var overlay = document.createElement('div');
                    overlay.className = 'preview-text-overlay';
                    if (r.writingMode === 'vertical') overlay.className += ' writing-vertical';
                    overlay.style.left = r.x + '%';
                    overlay.style.top = r.y + '%';
                    overlay.style.width = r.w + '%';
                    overlay.style.height = r.h + '%';
                    overlay.style.fontSize = r.fontSize + 'px';
                    overlay.style.fontWeight = r.fontWeight;
                    overlay.style.color = r.fontColor;
                    var bgMap = { transparent: 'transparent', semi: 'rgba(255,255,255,0.7)', opaque: '#ffffff' };
                    overlay.style.background = bgMap[r.bgOpacity] || bgMap.opaque;
                    overlay.textContent = r.edited;
                    wrapper.appendChild(overlay);
                }
            } else {
                var div = document.createElement('div');
                div.className = 'text-region';
                if (r.id === selectedRegionId) div.className += ' selected';
                div.style.left = r.x + '%';
                div.style.top = r.y + '%';
                div.style.width = r.w + '%';
                div.style.height = r.h + '%';
                div.dataset.regionId = r.id;

                var label = document.createElement('div');
                label.className = 'region-label';
                label.textContent = '#' + r.id;
                div.appendChild(label);

                div.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectRegion(r.id);
                });
                div.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                    selectRegion(r.id);
                });

                wrapper.appendChild(div);
            }
        });
    }

    function renderRegionList() {
        var list = document.getElementById('regionList');
        if (!pages[currentPageIndex]) return;
        var regions = pages[currentPageIndex].regions;
        document.getElementById('regionCount').textContent = regions.length;

        if (regions.length === 0) {
            list.innerHTML = '<div class="empty-regions">' +
                '<i class="fas fa-draw-polygon"></i>' +
                '<p>' + getEmptyText() + '</p></div>';
            return;
        }

        var L = getLang();
        var origLabel = { en: 'Original', ja: '原文', zh: '原文', es: 'Original', fr: 'Original', de: 'Original', ko: '원문', ar: 'الأصل', pt: 'Original', it: 'Originale' };
        var editLabel = { en: 'Edited', ja: '編集後', zh: '编辑后', es: 'Editado', fr: 'Modifié', de: 'Bearbeitet', ko: '편집됨', ar: 'معدل', pt: 'Editado', it: 'Modificato' };
        var writeLabel = { en: 'Writing', ja: '書字方向', zh: '书写', es: 'Escritura', fr: 'Écriture', de: 'Schreibweise', ko: '쓰기', ar: 'الكتابة', pt: 'Escrita', it: 'Scrittura' };
        var bgLabel = { en: 'Background', ja: '背景', zh: '背景', es: 'Fondo', fr: 'Fond', de: 'Hintergrund', ko: '배경', ar: 'الخلفية', pt: 'Fundo', it: 'Sfondo' };
        var sizeLabel = { en: 'Size', ja: 'サイズ', zh: '大小', es: 'Tamaño', fr: 'Taille', de: 'Größe', ko: '크기', ar: 'الحجم', pt: 'Tamanho', it: 'Dimensione' };
        var colorLabel = { en: 'Color', ja: '色', zh: '颜色', es: 'Color', fr: 'Couleur', de: 'Farbe', ko: '색상', ar: 'اللون', pt: 'Cor', it: 'Colore' };
        var horizOpt = { en: 'Horizontal', ja: '横書き', zh: '横排', es: 'Horizontal', fr: 'Horizontal', de: 'Horizontal', ko: '가로', ar: 'أفقي', pt: 'Horizontal', it: 'Orizzontale' };
        var vertOpt = { en: 'Vertical', ja: '縦書き', zh: '竖排', es: 'Vertical', fr: 'Vertical', de: 'Vertikal', ko: '세로', ar: 'عمودي', pt: 'Vertical', it: 'Verticale' };
        var transpOpt = { en: 'Transparent', ja: '透明', zh: '透明', es: 'Transparente', fr: 'Transparent', de: 'Transparent', ko: '투명', ar: 'شفاف', pt: 'Transparente', it: 'Trasparente' };
        var semiOpt = { en: 'Semi', ja: '半透明', zh: '半透明', es: 'Semi', fr: 'Semi', de: 'Halb', ko: '반투명', ar: 'نصف', pt: 'Semi', it: 'Semi' };
        var opaqueOpt = { en: 'Opaque', ja: '不透明', zh: '不透明', es: 'Opaco', fr: 'Opaque', de: 'Undurchsichtig', ko: '불투명', ar: 'معتم', pt: 'Opaco', it: 'Opaco' };
        var t = function(o) { return o[L] || o.en; };

        var html = '';
        regions.forEach(function(r) {
            var sel = r.id === selectedRegionId ? ' selected' : '';
            html += '<div class="region-card' + sel + '" data-region-id="' + r.id + '" onclick="selectRegion(' + r.id + ')">';
            html += '<div class="region-card-header">';
            html += '<span class="region-number">#' + r.id + '</span>';
            html += '<button class="region-delete-btn" onclick="event.stopPropagation();deleteRegion(' + r.id + ')" title="Delete"><i class="fas fa-times"></i></button>';
            html += '</div>';

            html += '<div class="region-field"><label>' + escH(t(origLabel)) + '</label>';
            html += '<textarea oninput="updateRegionText(' + r.id + ',\'original\',this.value)" onclick="event.stopPropagation()">' + escH(r.original) + '</textarea></div>';
            html += '<div class="region-field"><label>' + escH(t(editLabel)) + '</label>';
            html += '<textarea oninput="updateRegionText(' + r.id + ',\'edited\',this.value)" onclick="event.stopPropagation()">' + escH(r.edited) + '</textarea></div>';

            html += '<div class="region-options">';
            // Writing mode
            html += '<div><label>' + escH(t(writeLabel)) + '</label>';
            html += '<select onchange="updateRegionProp(' + r.id + ',\'writingMode\',this.value)" onclick="event.stopPropagation()">';
            html += '<option value="horizontal"' + (r.writingMode === 'horizontal' ? ' selected' : '') + '>' + escH(t(horizOpt)) + '</option>';
            html += '<option value="vertical"' + (r.writingMode === 'vertical' ? ' selected' : '') + '>' + escH(t(vertOpt)) + '</option>';
            html += '</select></div>';
            // Background
            html += '<div><label>' + escH(t(bgLabel)) + '</label>';
            html += '<select onchange="updateRegionProp(' + r.id + ',\'bgOpacity\',this.value)" onclick="event.stopPropagation()">';

            html += '<option value="semi"' + (r.bgOpacity === 'semi' ? ' selected' : '') + '>' + escH(t(semiOpt)) + '</option>';
            html += '<option value="opaque"' + (r.bgOpacity === 'opaque' ? ' selected' : '') + '>' + escH(t(opaqueOpt)) + '</option>';
            html += '</select></div>';
            // Font size
            html += '<div><label>' + escH(t(sizeLabel)) + '</label>';
            html += '<input type="number" value="' + r.fontSize + '" min="8" max="72" onchange="updateRegionProp(' + r.id + ',\'fontSize\',parseInt(this.value))" onclick="event.stopPropagation()"></div>';

            html += '<div><label>' + escH(t(colorLabel)) + '</label>';
            html += '<input type="color" value="' + r.fontColor + '" onchange="updateRegionProp(' + r.id + ',\'fontColor\',this.value)" onclick="event.stopPropagation()" style="height:28px;"></div>';

    function updateRegionProp(id, prop, value) {
        var region = findRegion(id);
        if (region) {
            region[prop] = value;

        }

    function findRegion(id) {
        var regions = pages[currentPageIndex].regions;
        for (var i = 0; i < regions.length; i++) {
            if (regions[i].id === id) return regions[i];
        }
        return null;

    // ===== Export =====
    function exportPage() {
        savePageDrawing();
        var page = pages[currentPageIndex];
        if (!page) return;

        var img = document.getElementById('canvasImg');
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        // Apply freehand drawing layer
        if (page.drawingDataUrl) {
            var drawImg = new Image();
            drawImg.onload = function() {
                ctx.drawImage(drawImg, 0, 0, canvas.width, canvas.height);
                drawRegionsOnCanvas(ctx, canvas, img, page);
                saveCanvas(canvas);
            };
            drawImg.src = page.drawingDataUrl;
        } else {
            drawRegionsOnCanvas(ctx, canvas, img, page);
            saveCanvas(canvas);
        }
    }

    function drawRegionsOnCanvas(ctx, canvas, img, page) {
        var scale = canvas.width / img.offsetWidth;
        page.regions.forEach(function(r) {
            if (!r.edited.trim()) return;
            var rx = r.x / 100 * canvas.width;
            var ry = r.y / 100 * canvas.height;
            var rw = r.w / 100 * canvas.width;
            var rh = r.h / 100 * canvas.height;
            var fs = r.fontSize * scale;

            // Background
            var bgMap = { transparent: null, semi: 'rgba(255,255,255,0.7)', opaque: '#ffffff' };
            if (bgMap[r.bgOpacity]) {
                ctx.fillStyle = bgMap[r.bgOpacity];
                ctx.fillRect(rx, ry, rw, rh);
            }

            // Text
            ctx.fillStyle = r.fontColor;
            ctx.font = r.fontWeight + ' ' + fs + 'px "Noto Sans JP", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (r.writingMode === 'vertical') {
                renderVerticalText(ctx, r.edited, rx, ry, rw, rh, fs);
            } else {
                renderHorizontalText(ctx, r.edited, rx, ry, rw, rh, fs);
            }
        });
    }

    function renderHorizontalText(ctx, text, rx, ry, rw, rh, fs) {
        var chars = text.split('');
        var lines = [];
        var currentLine = '';
        chars.forEach(function(char) {
            if (char === '\n') { lines.push(currentLine); currentLine = ''; return; }
            var testLine = currentLine + char;
            if (ctx.measureText(testLine).width > rw - 8) {
                lines.push(currentLine);
                currentLine = char;
            } else {
                currentLine = testLine;
            }
        });
        if (currentLine) lines.push(currentLine);

        var lineHeight = fs * 1.3;
        var totalH = lines.length * lineHeight;
        var startY = ry + (rh - totalH) / 2 + lineHeight / 2;
        lines.forEach(function(line, i) {
            ctx.fillText(line, rx + rw / 2, startY + i * lineHeight);
        });
    }

    function renderVerticalText(ctx, text, rx, ry, rw, rh, fs) {
        // Split by newlines first (each becomes a column, right to left)
        var cols = text.split('\n');
        var lineHeight = fs * 1.1;
        var colWidth = fs * 1.2;
        var charsPerCol = Math.floor((rh - 8) / lineHeight);
        if (charsPerCol < 1) charsPerCol = 1;

        // Further split long cols into multiple columns
        var allCols = [];
        cols.forEach(function(col) {
            for (var i = 0; i < col.length; i += charsPerCol) {
                allCols.push(col.substr(i, charsPerCol));
            }
            if (col === '') allCols.push('');
        });

        var totalW = allCols.length * colWidth;
        var startX = rx + rw - (rw - totalW) / 2 - colWidth / 2;

        allCols.forEach(function(col, colIdx) {
            var colX = startX - colIdx * colWidth;
            var chars = col.split('');
            var totalColH = chars.length * lineHeight;
            var startY = ry + (rh - totalColH) / 2 + lineHeight / 2;
            chars.forEach(function(ch, i) {
                ctx.fillText(ch, colX, startY + i * lineHeight);
            });
        });
    }

    function saveCanvas(canvas) {
        canvas.toBlob(function(blob) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'manga_edited_page' + (currentPageIndex + 1) + '.png';
            a.click();
            URL.revokeObjectURL(url);
        }, 'image/png');
    }
