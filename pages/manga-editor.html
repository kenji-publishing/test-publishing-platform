    <!-- ========== マンガ翻訳ウィザード連携 ==========
         manga-editor.html?order=<注文ID> で開くと、翻訳済み注文のページ画像と
         AI翻訳をサーバーから自動読み込みする（画像の再アップロード不要）。
         サイドパネルに翻訳リストを表示し、クリックで訳文入りのテキスト枠を作成する。 -->
    <script>
    (function () {
        var aiOrderId = null;

        function aiGetLang() { return (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : (localStorage.getItem('preferredLanguage') || 'en'); }
        function aiEsc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }

        // ===== 翻訳パネル（Regionsパネルの上に挿入） =====
        function ensureAiPanel() {
            if (document.getElementById('aiTransPanel')) return;
            var sidePanel = document.querySelector('.side-panel');
            if (!sidePanel) return;
            var L = aiGetLang();
            var panel = document.createElement('div');
            panel.className = 'panel';
            panel.id = 'aiTransPanel';
            panel.innerHTML =
                '<div class="panel-header"><h3><i class="fas fa-language"></i> ' +
                (L === 'ja' ? 'AI翻訳（このページ）' : 'AI Translations (this page)') +
                '</h3><span id="aiTransCount" style="font-size:0.75rem; color:var(--color-text-secondary);"></span></div>' +
                '<div class="panel-body"><div id="aiTransHint" style="font-size:0.75rem; color:var(--color-text-secondary); margin-bottom:0.5rem;">' +
                (L === 'ja' ? '「＋枠を作成」で訳文入りのテキスト枠が画像に置かれます。ドラッグで位置を調整してください。' : 'Click "+ Add box" to place a text box with the translation, then drag it into position.') +
                // 翻訳が多いページでも領域一覧が押し下げられないよう、リスト部分だけスクロール
                '</div><div id="aiTransList" style="max-height:45vh; overflow-y:auto; padding-right:2px;"></div></div>';
            sidePanel.insertBefore(panel, sidePanel.firstChild);
        }

        // ===== ヘッダーに「このページを保存」「作品アップロードへ」ボタンを追加 =====
        function ensureSaveButtons() {
            if (document.getElementById('aiBtnSavePage')) return;
            var actions = document.getElementById('headerActions');
            if (!actions) return;
            var save = document.createElement('button');
            save.className = 'btn-secondary-custom btn-sm';
            save.id = 'aiBtnSavePage';
            save.addEventListener('click', function () { window.aiSavePage(); });
            actions.appendChild(save);
            var up = document.createElement('button');
            up.className = 'btn-primary-custom btn-sm';
            up.id = 'aiBtnGoUpload';
            up.addEventListener('click', function () { window.aiGoUpload(); });
            actions.appendChild(up);
            aiUpdateSaveUi();
        }

        function renderAiPanel() {
            var listEl = document.getElementById('aiTransList');
            if (!listEl) return;
            var L = aiGetLang();
            var page = pages[currentPageIndex];
            var bubbles = (page && page.aiBubbles) || [];
            document.getElementById('aiTransCount').textContent = bubbles.length ? String(bubbles.length) : '';
            if (!bubbles.length) {
                listEl.innerHTML = '<div style="font-size:0.8rem; color:var(--color-text-secondary);">' +
                    (L === 'ja' ? 'このページのAI翻訳はありません' : 'No AI translations for this page') + '</div>';
                return;
            }
            var icons = { speech: '💬', thought: '💭', narration: '📖', sfx: '💥', sign: '🪧' };
            // bboxを持つ未配置の訳文があれば一括配置ボタンを出す（旧注文はbbox無しのため表示されない）
            var autoCount = bubbles.filter(function (b) {
                var placed = b.regionId != null && page.regions.some(function (r) { return r.id === b.regionId; });
                return !placed && aiValidBbox(b.bbox);
            }).length;
            var autoBtn = autoCount
                ? '<button class="btn btn-sm" onclick="aiAutoPlaceAll()" style="width:100%; margin-bottom:0.6rem; font-size:0.8rem; padding:5px 10px; border:1px solid var(--color-accent); color:#fff; background:var(--color-accent); border-radius:6px; font-weight:600;">⚡ ' +
                  (L === 'ja' ? '全訳文の枠を自動作成' : 'Auto-place all translations') + ' (' + autoCount + ')</button>'
                : '';
            listEl.innerHTML = autoBtn + bubbles.map(function (b, bi) {
                // 枠を作成済みかどうか（領域一覧側で削除された場合も追随して未作成に戻る）
                var hasBox = b.regionId != null && page.regions.some(function (r) { return r.id === b.regionId; });
                var cardStyle = hasBox
                    ? 'border:1px solid #4c9a5f; background:rgba(76,154,95,0.12); border-radius:8px; padding:0.5rem 0.6rem; margin-bottom:0.5rem;'
                    : 'border:1px solid var(--color-border); border-radius:8px; padding:0.5rem 0.6rem; margin-bottom:0.5rem;';
                var doneMark = hasBox
                    ? ' <span style="color:#4c9a5f; font-weight:700;">✓ ' + (L === 'ja' ? '配置済み' : 'Placed') + '</span>'
                    : '';
                var addBtn = '<button class="btn btn-sm" onclick="aiInsertText(' + bi + ')"' + (hasBox ? ' disabled' : '') +
                    ' style="font-size:0.75rem; padding:2px 10px; border:1px solid var(--color-accent); color:var(--color-accent); border-radius:6px; background:transparent;' + (hasBox ? ' opacity:0.4;' : '') + '">＋ ' +
                    (L === 'ja' ? '枠を作成' : 'Add box') + '</button>';
                var delBtn = '<button class="btn btn-sm" onclick="aiDeleteBox(' + bi + ')"' + (hasBox ? '' : ' disabled') +
                    ' style="font-size:0.75rem; padding:2px 10px; border:1px solid #c0392b; color:#c0392b; border-radius:6px; background:transparent; margin-left:6px;' + (hasBox ? '' : ' opacity:0.4;') + '">× ' +
                    (L === 'ja' ? '枠を削除' : 'Remove box') + '</button>';
                return '<div style="' + cardStyle + '">' +
                    '<div style="font-size:0.7rem; color:var(--color-text-secondary);">' + (icons[b.type] || '💬') + ' ' + (bi + 1) + (b.location ? ' — ' + aiEsc(b.location) : '') + doneMark + '</div>' +
                    '<div style="font-size:0.8rem; color:var(--color-text-secondary); margin:2px 0;">' + aiEsc(b.original) + '</div>' +
                    '<div style="font-size:0.86rem; font-weight:600; margin-bottom:4px;">' + aiEsc(b.translation) + '</div>' +
                    addBtn + delBtn +
                    '</div>';
            }).join('');
        }

        // AI抽出のbbox（%座標）を検証。無効なら null（従来の段々ずらし配置にフォールバック）
        // 過去の注文にはbboxが無いので、存在チェックが後方互換を兼ねる
        function aiValidBbox(bb) {
            if (!bb) return null;
            var x = parseFloat(bb.x), y = parseFloat(bb.y), w = parseFloat(bb.w), h = parseFloat(bb.h);
            if (!isFinite(x) || !isFinite(y) || !isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) return null;
            // 小さすぎる枠は掴めないので最小サイズを確保しつつ、画像内に収める
            w = Math.min(Math.max(w, 8), 90);
            h = Math.min(Math.max(h, 4), 60);
            x = Math.min(Math.max(x, 0), 100 - w);
            y = Math.min(Math.max(y, 0), 100 - h);
            return { x: x, y: y, w: w, h: h };
        }

        // 訳文入りのテキスト枠を作成。bboxがあればAI推定の吹き出し位置に、
        // 無ければ中央付近に段々ずらして配置 → どちらもユーザーがドラッグで微調整
        var aiInsertOffset = 0;
        window.aiInsertText = function (bi, skipRender) {
            var page = pages[currentPageIndex];
            if (!page || !page.aiBubbles || !page.aiBubbles[bi]) return;
            var b = page.aiBubbles[bi];
            var bb = aiValidBbox(b.bbox);
            var region = {
                id: ++regionIdCounter,
                type: 'text',
                preview: false,
                edited: b.translation,
                fontSize: 9, // 実運用では9〜10が適切なことが多い（kenjiさん実機フィードバック）
                fontWeight: '700',
                fontColor: '#000000',
                bgOpacity: 'opaque',
                writingMode: 'horizontal'
            };
            if (bb) {
                region.x = bb.x.toFixed(2);
                region.y = bb.y.toFixed(2);
                region.w = bb.w.toFixed(2);
                region.h = bb.h.toFixed(2);
            } else {
                var off = (aiInsertOffset++ % 5) * 8;
                region.x = (18 + off).toFixed(2);
                region.y = (28 + off).toFixed(2);
                region.w = '45.00';
                region.h = '10.00';
            }
            page.regions.push(region);
            b.regionId = region.id; // 「配置済み」表示と削除ボタン用
            selectedRegionId = region.id;
            if (!skipRender) {
                renderRegionsOnCanvas();
                renderRegionList();
                scrollToRegionCard(region.id);
            }
        };

        // 「全訳文の枠を自動作成」: bboxを持つ未配置の訳文をまとめて配置（描画は最後に1回）
        window.aiAutoPlaceAll = function () {
            var page = pages[currentPageIndex];
            if (!page || !page.aiBubbles) return;
            page.aiBubbles.forEach(function (b, bi) {
                var hasBox = b.regionId != null && page.regions.some(function (r) { return r.id === b.regionId; });
                if (!hasBox && aiValidBbox(b.bbox)) window.aiInsertText(bi, true);
            });
            renderRegionsOnCanvas();
            renderRegionList();
        };

        // 「枠を削除」: この訳文から作成したテキスト枠を取り除き、未配置状態に戻す
        window.aiDeleteBox = function (bi) {
            var page = pages[currentPageIndex];
            var b = page && page.aiBubbles && page.aiBubbles[bi];
            if (!b || b.regionId == null) return;
            var idx = page.regions.findIndex(function (r) { return r.id === b.regionId; });
            if (idx !== -1) page.regions.splice(idx, 1);
            if (selectedRegionId === b.regionId) selectedRegionId = null;
            b.regionId = null;
            renderRegionsOnCanvas();
            renderRegionList();
        };

        // 領域一覧側での削除にも追随できるよう、renderRegionListをラップして翻訳パネルも更新
        var origRenderRegionList = window.renderRegionList;
        window.renderRegionList = function () {
            origRenderRegionList();
            renderAiPanel();
        };

        // ===== ページ保存 → 作品アップロード連携 =====
        // 各ページを「このページを保存」で完成画像として確定し、全ページ保存後に
        // upload.html へ引き渡す（IndexedDB経由。画像のダウンロード・再選択は不要）
        var aiSavedBlobs = {}; // pageIndex -> Blob（文字入れ済みの完成画像）

        function aiUpdateSaveUi() {
            var L = aiGetLang();
            var saved = Object.keys(aiSavedBlobs).length;
            var sp = document.getElementById('aiBtnSavePage');
            if (sp) {
                sp.innerHTML = (aiSavedBlobs[currentPageIndex] ? '<i class="fas fa-check" style="color:#4c9a5f;"></i> ' : '<i class="fas fa-save"></i> ') +
                    (L === 'ja' ? 'このページを保存' : 'Save this page');
            }
            var up = document.getElementById('aiBtnGoUpload');
            if (up) {
                up.innerHTML = '<i class="fas fa-upload"></i> ' +
                    (L === 'ja' ? '作品アップロードへ' : 'To Work Upload') +
                    ' (' + saved + '/' + (pages.length || 0) + ')';
            }
        }

        // 表示中のページを完成画像（テキスト焼き込み済みJPEG）としてレンダリング
        function aiRenderCurrentPageBlob() {
            return new Promise(function (resolve, reject) {
                savePageDrawing();
                var page = pages[currentPageIndex];
                if (!page) return reject(new Error('no page'));
                var img = document.getElementById('canvasImg');
                var canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                drawDrawBackdrops(ctx, canvas, page);
                var finish = function () {
                    drawTextRegions(ctx, canvas, img, page);
                    canvas.toBlob(function (b) {
                        if (b) resolve(b); else reject(new Error('render failed'));
                    }, 'image/jpeg', 0.92);
                };
                if (page.drawingDataUrl) {
                    var di = new Image();
                    di.onload = function () { ctx.drawImage(di, 0, 0, canvas.width, canvas.height); finish(); };
                    di.onerror = function () { finish(); };
                    di.src = page.drawingDataUrl;
                } else {
                    finish();
                }
            });
        }

        window.aiSavePage = async function () {
            var L = aiGetLang();
            try {
                aiSavedBlobs[currentPageIndex] = await aiRenderCurrentPageBlob();
                aiUpdateSaveUi();
            } catch (e) {
                alert((L === 'ja' ? 'ページの保存に失敗しました: ' : 'Failed to save the page: ') + e.message);
            }
        };

        function aiOpenHandoffDb() {
            return new Promise(function (res, rej) {
                var rq = indexedDB.open('auctlect-editor-handoff', 1);
                rq.onupgradeneeded = function () { rq.result.createObjectStore('handoff'); };
                rq.onsuccess = function () { res(rq.result); };
                rq.onerror = function () { rej(rq.error); };
            });
        }

        window.aiGoUpload = async function () {
            var L = aiGetLang();
            // 表示中のページは最新状態で自動保存（保存後に編集した場合の反映漏れ対策）
            try {
                if (pages[currentPageIndex]) {
                    aiSavedBlobs[currentPageIndex] = await aiRenderCurrentPageBlob();
                    aiUpdateSaveUi();
                }
            } catch (e) { /* 失敗時は従来どおり未保存チェックに任せる */ }
            var missing = [];
            for (var i = 0; i < pages.length; i++) {
                if (!aiSavedBlobs[i]) missing.push(i + 1);
            }
            if (missing.length) {
                alert(L === 'ja'
                    ? '未保存のページがあります: ' + missing.join(', ') + '\n各ページを開いて「このページを保存」を押してから進んでください。'
                    : 'Some pages are not saved yet: ' + missing.join(', ') + '\nOpen each page and press "Save this page" first.');
                return;
            }
            try {
                var items = pages.map(function (p, i) {
                    return { blob: aiSavedBlobs[i], name: 'page_' + String(i + 1).padStart(3, '0') + '.jpg' };
                });
                var db = await aiOpenHandoffDb();
                await new Promise(function (res, rej) {
                    var tx = db.transaction('handoff', 'readwrite');
                    tx.objectStore('handoff').put(items, 'mangaPages');
                    tx.oncomplete = function () { db.close(); res(); };
                    tx.onerror = function () { rej(tx.error); };
                });
                window.location.href = 'upload.html?fromEditor=manga';
            } catch (e) {
                alert((L === 'ja' ? 'アップロード画面への引き渡しに失敗しました: ' : 'Failed to hand off to the upload page: ') + e.message);
            }
        };

        // ページ切替のたびに翻訳パネルと保存ボタンも更新（既存のrenderPageをラップ）
        var origRenderPage = window.renderPage;
        window.renderPage = function () {
            origRenderPage();
            ensureAiPanel();
            ensureSaveButtons();
            renderAiPanel();
            aiUpdateSaveUi();
        };

        // ===== 注文の自動読み込み =====
        document.addEventListener('DOMContentLoaded', async function () {
            var params = new URLSearchParams(window.location.search);
            aiOrderId = params.get('order');
            if (!aiOrderId) return;
            var L = aiGetLang();
            var token = localStorage.getItem('token');
            if (!token) {
                alert(L === 'ja' ? 'ログインしてから再度このページを開いてください。' : 'Please log in and reopen this page.');
                window.location.href = 'login.html';
                return;
            }
            try {
                var resp = await fetch((window.API_ORIGIN || '') + '/api/ai-tools/orders/' + encodeURIComponent(aiOrderId), {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var data = await resp.json();
                if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
                var order = data.order;
                if (order.tool !== 'manga' || order.status !== 'completed' || !order.result) {
                    alert(L === 'ja' ? 'この注文にはまだ完成した翻訳がありません。' : 'This order has no completed translation yet.');
                    return;
                }
                var result;
                try { result = JSON.parse(order.result); } catch (e) { result = { pages: [] }; }
                var resultPages = Array.isArray(result.pages) ? result.pages : [];

                // ページ画像を認証付きで取得してエディターに投入（再アップロード不要）
                for (var i = 0; i < order.pageCount; i++) {
                    var ir = await fetch((window.API_ORIGIN || '') + '/api/ai-tools/orders/' + encodeURIComponent(aiOrderId) + '/page/' + (i + 1), {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (!ir.ok) continue;
                    var blob = await ir.blob();
                    var file = new File([blob], 'page_' + (i + 1) + '.jpg', { type: blob.type || 'image/jpeg' });
                    var pr = resultPages.find(function (p) { return p.page === i + 1; });
                    pages.push({
                        file: file,
                        regions: [],
                        url: URL.createObjectURL(blob),
                        drawingDataUrl: null,
                        aiBubbles: (pr && pr.bubbles) || []
                    });
                }
                if (!pages.length) throw new Error(L === 'ja' ? 'ページ画像を取得できませんでした' : 'Could not load page images');

                startEditing(); // ラップ済みrenderPage経由で翻訳パネルも表示される
            } catch (err) {
                alert((L === 'ja' ? '翻訳注文の読み込みに失敗しました: ' : 'Failed to load the translation order: ') + err.message);
            }
        });
    })();
    </script>
</body>
</html>
