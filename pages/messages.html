<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Publisher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/variables.css" rel="stylesheet">
    <link href="../css/style-new.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/mobile-fixes.css" rel="stylesheet">
    <link href="../css/navbar.css" rel="stylesheet">

    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }

        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }

        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }

        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }

        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1001;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }

        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Adjustments ========== */
        @media (max-width: 991.98px) {

        }

        /* ========== Page Specific Styles ========== */
        .page-header {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-light) 100%);
            color: white;
            padding: var(--spacing-xl) 0;
            margin-bottom: var(--spacing-xl);
        }
        .page-header h1 { color: white; font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .page-header p { color: rgba(255,255,255,0.9); margin: 0; }

        /* ========== Messages Layout ========== */
        .messages-container {
            height: calc(100vh - 280px);
            min-height: 500px;
            display: flex;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        /* ---- Conversation List (Left Panel) ---- */
        .conversation-list-panel {
            width: 100%;
            max-width: 380px;
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            background: var(--color-bg-card);
        }
        .conversation-list-header {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        .conversation-list-header .search-box {
            flex: 1;
        }
        .conversation-list-header .search-box input {
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
        }
        .btn-new-message {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-accent);
            color: white;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .btn-new-message:hover {
            background: var(--color-accent-light);
            transform: scale(1.05);
        }
        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }
        .conversation-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            cursor: pointer;
            transition: background var(--transition-fast);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            position: relative;
        }
        .conversation-item:hover {
            background: var(--color-bg-hover);
        }
        .conversation-item.active {
            background: rgba(139, 115, 85, 0.08);
            border-left: 3px solid var(--color-accent);
        }
        .conversation-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }
        .conversation-avatar.author { background: linear-gradient(135deg, #6C63FF, #8B80FF); }
        .conversation-avatar.editor { background: linear-gradient(135deg, #FF6B6B, #FF8E8E); }
        .conversation-avatar.translator { background: linear-gradient(135deg, #4ECDC4, #6EE7DE); }
        .conversation-avatar.support { background: linear-gradient(135deg, var(--color-accent), var(--color-accent-light)); }
        .conversation-details {
            flex: 1;
            min-width: 0;
        }
        .conversation-name {
            font-weight: 600;
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .conversation-preview {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .conversation-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }
        .conversation-time {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            white-space: nowrap;
        }
        .unread-badge {
            background: var(--color-accent);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* ---- Message Thread (Right Panel) ---- */
        .message-thread-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--color-bg-main);
        }
        .thread-header {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            background: var(--color-bg-card);
        }
        .thread-header .btn-back {
            display: none;
            background: none;
            border: none;
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            cursor: pointer;
            padding: 0.25rem;
        }
        .thread-header .btn-back:hover {
            color: var(--color-accent);
        }
        .thread-contact-name {
            font-weight: 600;
            font-size: var(--font-size-base);
            color: var(--color-text-primary);
        }
        .role-badge {
            font-size: var(--font-size-xs);
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-weight: 500;
        }
        .role-badge.author { background: rgba(108, 99, 255, 0.1); color: #6C63FF; }
        .role-badge.editor { background: rgba(255, 107, 107, 0.1); color: #FF6B6B; }
        .role-badge.translator { background: rgba(78, 205, 196, 0.1); color: #3BAFA8; }
        .role-badge.support { background: rgba(139, 115, 85, 0.1); color: var(--color-accent); }

        .thread-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }
        .message-bubble {
            max-width: 70%;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-sm);
            line-height: 1.5;
            position: relative;
        }
        .message-bubble.sent {
            align-self: flex-end;
            background: var(--color-accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-bubble.received {
            align-self: flex-start;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text-primary);
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 0.65rem;
            margin-top: 4px;
            opacity: 0.7;
        }
        .message-bubble.sent .message-time { text-align: right; color: rgba(255,255,255,0.8); }
        .message-bubble.received .message-time { color: var(--color-text-secondary); }

        .date-separator {
            text-align: center;
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            padding: var(--spacing-sm) 0;
        }
        .date-separator span {
            background: var(--color-bg-main);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-border);
        }

        /* ---- Message Input Area ---- */
        .message-input-area {
            padding: var(--spacing-md) var(--spacing-lg);
            border-top: 1px solid var(--color-border);
            background: var(--color-bg-card);
            display: flex;
            align-items: flex-end;
            gap: var(--spacing-sm);
        }
        .message-input-area textarea {
            flex: 1;
            border-radius: var(--radius-lg);
            resize: none;
            font-size: var(--font-size-sm);
            max-height: 120px;
            min-height: 40px;
            padding: 8px 14px;
        }
        .btn-send {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-accent);
            color: white;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }
        .btn-send:hover {
            background: var(--color-accent-light);
            transform: scale(1.05);
        }
        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ---- Empty Thread State ---- */
        .thread-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--color-text-secondary);
            text-align: center;
            padding: var(--spacing-xl);
        }
        .thread-empty i {
            font-size: 4rem;
            opacity: 0.2;
            margin-bottom: var(--spacing-md);
        }

        /* ---- Guest Login Prompt ---- */
        .login-prompt {
            text-align: center;
            padding: var(--spacing-2xl);
        }
        .login-prompt i {
            font-size: 4rem;
            color: var(--color-accent);
            opacity: 0.4;
            margin-bottom: var(--spacing-md);
        }

        /* ---- Responsive: Mobile ---- */
        @media (max-width: 991.98px) {
            .messages-container {
                height: calc(100vh - 200px);
                min-height: 400px;
            }
            .conversation-list-panel {
                max-width: 100%;
            }
            .message-thread-panel {
                display: none;
            }
            .messages-container.show-thread .conversation-list-panel {
                display: none;
            }
            .messages-container.show-thread .message-thread-panel {
                display: flex;
            }
            .messages-container.show-thread .thread-header .btn-back {
                display: inline-block;
            }
            .message-bubble {
                max-width: 85%;
            }
        }

        /* ========== Message/Notification Tabs ========== */
        .msg-tabs {
            display: flex;
            border-bottom: 2px solid var(--color-border);
            background: var(--color-bg-card);
            flex-shrink: 0;
        }
        .msg-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            padding: 0.7rem 0.5rem;
            border: none;
            background: transparent;
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: color 0.2s, background 0.2s;
        }
        .msg-tab:hover {
            color: var(--color-accent);
            background: rgba(139, 115, 85, 0.04);
        }
        .msg-tab.active {
            color: var(--color-accent);
            font-weight: 600;
        }
        .msg-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 15%;
            right: 15%;
            height: 2px;
            background: var(--color-accent);
            border-radius: 1px;
        }
        .notif-badge {
            background: #dc3545;
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            margin-left: 4px;
        }

        /* ========== Notifications Panel ========== */
        .notif-panel-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0.5rem var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
        }
        .btn-mark-all-read {
            background: none;
            border: none;
            color: var(--color-accent);
            font-size: var(--font-size-xs);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }
        .btn-mark-all-read:hover {
            background: rgba(139, 115, 85, 0.08);
        }
        .notif-list {
            flex: 1;
            overflow-y: auto;
        }
        .notif-item {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            padding: 0.65rem var(--spacing-lg);
            cursor: pointer;
            transition: background var(--transition-fast);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            position: relative;
        }
        .notif-item:hover {
            background: var(--color-bg-hover);
        }
        .notif-item.unread {
            background: rgba(139, 115, 85, 0.04);
        }
        .notif-item.unread::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-accent);
        }
        .notif-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .notif-icon.success { background: rgba(40,167,69,0.12); color: #28a745; }
        .notif-icon.info { background: rgba(23,162,184,0.12); color: #17a2b8; }
        .notif-icon.warning { background: rgba(255,193,7,0.12); color: #e6a800; }
        .notif-icon.primary { background: rgba(139,115,85,0.12); color: var(--color-accent); }
        .notif-content {
            flex: 1;
            min-width: 0;
        }
        .notif-title {
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--color-text-primary);
            margin-bottom: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .notif-message {
            font-size: 0.72rem;
            color: var(--color-text-secondary);
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .notif-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2px;
        }
        .notif-time {
            font-size: 0.65rem;
            color: var(--color-text-secondary);
        }
        .notif-link-label {
            font-size: 0.65rem;
            color: var(--color-accent);
        }
        .notif-link-label:hover {
            text-decoration: underline;
        }
        .notif-empty {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--color-text-secondary);
        }
        .notif-empty i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- ========== NAVBAR HTML START ========== -->

    <!-- Navbar Overlay -->
    <div id="navbar-container"></div>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-comments me-2"></i><span id="pageTitle" data-i18n="messages.pageTitle">Messages</span></h1>
            <p id="pageSubtitle" data-i18n="messages.pageSubtitle">Communicate with authors, translators, editors and support</p>
        </div>
    </div>

    <!-- Auth-only Content -->
    <div class="container mb-5 auth-only">
        <div class="messages-container" id="messagesContainer">
            <!-- Conversation List (Left Panel) -->
            <div class="conversation-list-panel">
                <!-- Tabs -->
                <div class="msg-tabs">
                    <button class="msg-tab active" id="tabConversations" onclick="switchMsgTab('conversations')">
                        <i class="fas fa-comments me-1"></i><span id="tabConvLabel" data-i18n="messages.tabConvLabel">Conversations</span>
                    </button>
                    <button class="msg-tab" id="tabNotifications" onclick="switchMsgTab('notifications')">
                        <i class="fas fa-bell me-1"></i><span id="tabNotifLabel" data-i18n="messages.tabNotifLabel">Notifications</span>
                        <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
                    </button>
                </div>

                <!-- Conversations Panel -->
                <div id="conversationsPanel" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                    <div class="conversation-list-header">
                        <div class="search-box">
                            <input type="text" class="form-control form-control-sm" id="searchConversations" data-i18n-placeholder="messages.searchPlaceholder" placeholder="Search conversations...">
                        </div>
                        <button class="btn-new-message" id="btnNewMessage" title="New Message" data-bs-toggle="modal" data-bs-target="#newMessageModal">
                            <i class="fas fa-pen"></i>
                        </button>
                    </div>
                    <div class="conversation-list" id="conversationList">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Notifications Panel (hidden by default) -->
                <div id="notificationsPanel" style="display:none; flex-direction:column; flex:1; min-height:0;">
                    <div class="notif-panel-header">
                        <button class="btn-mark-all-read" onclick="markAllNotifRead()">

        let activeConversationId = null;

        function getCurrentLang() { return localStorage.getItem('preferredLanguage') || 'en'; }
        function getL(obj) { if (!obj) return ''; const l = getCurrentLang(); return obj[l] || obj['en'] || ''; }

        // ========== Notification Helper Functions ==========
        function getNotifText(type, field, params) {
            const tmpl = notifTemplates[type];
            if (!tmpl || !tmpl[field]) return '';
            const lang = getCurrentLang();
            let text = tmpl[field][lang] || tmpl[field]['en'] || '';
            if (params) {
                Object.keys(params).forEach(k => {
                    text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
                });
            }
            return text;
        }

        function formatNotifTimeAgo(isoStr) {
            const diff = Date.now() - new Date(isoStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return { en:'Just now', ja:'たった今', zh:'刚刚', es:'Ahora', fr:'À l\'instant', de:'Gerade eben', ko:'방금', ar:'الآن', pt:'Agora' }[getCurrentLang()] || 'Just now';
            if (mins < 60) return mins + { en:'m ago', ja:'分前', zh:'分钟前', es:'m', fr:'min', de:'Min.', ko:'분 전', ar:'د', pt:'min' }[getCurrentLang()];
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + { en:'h ago', ja:'時間前', zh:'小时前', es:'h', fr:'h', de:'Std.', ko:'시간 전', ar:'س', pt:'h' }[getCurrentLang()];
            const days = Math.floor(hrs / 24);
            if (days < 7) return days + { en:'d ago', ja:'日前', zh:'天前', es:'d', fr:'j', de:'T.', ko:'일 전', ar:'ي', pt:'d' }[getCurrentLang()];
            return new Date(isoStr).toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        // ========== Switch Tab ==========
        function switchMsgTab(tab) {
            currentMsgTab = tab;
            const convTab = document.getElementById('tabConversations');
            const notifTab = document.getElementById('tabNotifications');
            const convPanel = document.getElementById('conversationsPanel');
            const notifPanel = document.getElementById('notificationsPanel');

            if (tab === 'conversations') {
                convTab.classList.add('active');
                notifTab.classList.remove('active');
                convPanel.style.display = 'flex';
                notifPanel.style.display = 'none';
            } else {
                convTab.classList.remove('active');
                notifTab.classList.add('active');
                convPanel.style.display = 'none';
                notifPanel.style.display = 'flex';
                renderNotificationList();
            }
        }

        // ========== Load Notifications from localStorage ==========
        function loadNotifs() {
            const saved = localStorage.getItem('publisher_msg_notifs');
            if (saved) { try { return JSON.parse(saved); } catch(e) {} }
            localStorage.setItem('publisher_msg_notifs', JSON.stringify(DEMO_NOTIFS));
            return JSON.parse(JSON.stringify(DEMO_NOTIFS));
        }
        function saveNotifs(notifs) {
            localStorage.setItem('publisher_msg_notifs', JSON.stringify(notifs));
        }

        // ========== Render Notification List ==========
        function renderNotificationList() {
            const notifs = loadNotifs();
            const list = document.getElementById('notifList');

            if (notifs.length === 0) {
                list.innerHTML = '<div class="notif-empty"><i class="fas fa-bell-slash"></i><p style="font-size:var(--font-size-sm); margin:0;">' + getL(uiText.noNotifications) + '</p></div>';
                return;
            }

            list.innerHTML = notifs.map(n => {
                const title = getNotifText(n.type, 'title', n.params);
                const message = getNotifText(n.type, 'message', n.params);
                const timeAgo = formatNotifTimeAgo(n.created_at);
                const link = NOTIFICATION_LINKS[n.type] || '';
                const linkLabel = link ? getL(uiText.notifViewLink) : '';
                return '<div class="notif-item ' + (n.is_read ? '' : 'unread') + '" onclick="handleNotifClick(\'' + n.id + '\')">' +
                    '<div class="notif-icon ' + n.icon_color + '"><i class="fas ' + n.icon + '"></i></div>' +
                    '<div class="notif-content">' +
                        '<div class="notif-title">' + escapeHtml(title) + '</div>' +
                        '<div class="notif-message">' + escapeHtml(message) + '</div>' +
                        '<div class="notif-meta">' +
                            '<span class="notif-time"><i class="fas fa-clock me-1"></i>' + timeAgo + '</span>' +
                            (linkLabel ? '<span class="notif-link-label"><i class="fas fa-external-link-alt me-1"></i>' + linkLabel + '</span>' : '') +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        // ========== Mark All Notifications as Read ==========
        function markAllNotifRead() {
            const notifs = loadNotifs();
            notifs.forEach(n => n.is_read = true);
            saveNotifs(notifs);
            renderNotificationList();
            updateNotifBadge();
            if (typeof updateMessageBadge === 'function') updateMessageBadge();
        }

        // ========== Handle Notification Click ==========
        function handleNotifClick(id) {
            const notifs = loadNotifs();
            const n = notifs.find(x => x.id === id);
            if (n) {
                n.is_read = true;
                saveNotifs(notifs);
                updateNotifBadge();
                if (typeof updateMessageBadge === 'function') updateMessageBadge();
                const link = NOTIFICATION_LINKS[n.type] || '';
                if (link) {
                    window.location.href = link;
                } else {
                    renderNotificationList();
                }
            }
        }

        // ========== Update Notification Badge ==========
        function updateNotifBadge() {
            const notifs = loadNotifs();
            const unread = notifs.filter(n => !n.is_read).length;
            const badge = document.getElementById('notifBadge');
            if (unread > 0) {
                badge.textContent = unread;
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // ========== Load/Save messages from localStorage ==========
        function loadConversations() {
            const saved = localStorage.getItem('publisher_messages');
            if (saved) {
                try {
                    var convs = JSON.parse(saved);
                    syncUnreadCount();
                    return convs;
                } catch(e) { /* fall through */ }
            }
            // First time: save demo data
            localStorage.setItem('publisher_messages', JSON.stringify(demoConversations));
            syncUnreadCount();
            return demoConversations;
        }

        function saveConversations(convs) {
            localStorage.setItem('publisher_messages', JSON.stringify(convs));
            syncUnreadCount();
        }

        // Sync unread count to localStorage for navbar badge
        function syncUnreadCount() {
            try {
                var convs = JSON.parse(localStorage.getItem('publisher_messages') || '[]');
                var unreadConvs = 0;
                for (var i = 0; i < convs.length; i++) {
                    if (convs[i].unread && convs[i].unread > 0) unreadConvs += convs[i].unread;
                }
                localStorage.setItem('publisher_unread_conversations', String(unreadConvs));
                if (typeof updateMessageBadge === 'function') updateMessageBadge();
            } catch(e) {}
        }

        // ========== Render Conversation List ==========
        function renderConversationList(filter) {
            const convs = loadConversations();
            const list = document.getElementById('conversationList');
            const search = (filter || '').toLowerCase();
            const filtered = convs.filter(c => !search || c.name.toLowerCase().includes(search));

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center; padding:2rem; color:var(--color-text-secondary);">
                        <i class="fas fa-inbox" style="font-size:2rem; opacity:0.3; margin-bottom:0.5rem;"></i>
                        <p style="font-size:var(--font-size-sm); margin:0;">${getL(uiText.noConversations)}</p>
                        <p style="font-size:var(--font-size-xs); margin-top:4px;">${getL(uiText.startConversation)}</p>
                    </div>`;
                return;
            }

            list.innerHTML = filtered.map(c => {
                const lastMsg = c.messages[c.messages.length - 1];
                const preview = lastMsg ? (lastMsg.sent ? 'You: ' : '') + lastMsg.text.substring(0, 50) + (lastMsg.text.length > 50 ? '...' : '') : '';
                const timeStr = lastMsg ? formatConversationTime(lastMsg.time) : '';
                const isActive = c.id === activeConversationId;

                return `
                    <div class="conversation-item ${isActive ? 'active' : ''}" onclick="openConversation('${c.id}')">
                        <div class="conversation-avatar ${c.role}">${c.initial}</div>
                        <div class="conversation-details">
                            <div class="conversation-name">${escapeHtml(c.name)}</div>
                            <div class="conversation-preview">${escapeHtml(preview)}</div>
                        </div>
                        <div class="conversation-meta">
                            <span class="conversation-time">${timeStr}</span>
                            ${c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : ''}
                        </div>
                    </div>`;
            }).join('');
        }

        function formatConversationTime(timeStr) {
            const d = new Date(timeStr);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());

            if (msgDate.getTime() === today.getTime()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (msgDate.getTime() === yesterday.getTime()) return getL(uiText.yesterday);
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function formatMessageTime(timeStr) {
            const d = new Date(timeStr);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDateSeparator(timeStr) {
            const d = new Date(timeStr);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            const msgDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());

            if (msgDate.getTime() === today.getTime()) return getL(uiText.today);
            if (msgDate.getTime() === yesterday.getTime()) return getL(uiText.yesterday);
            return d.toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // ========== Open Conversation ==========
        function openConversation(convId) {
            const convs = loadConversations();
            const conv = convs.find(c => c.id === convId);
            if (!conv) return;

            activeConversationId = convId;

            // Mark as read
            conv.unread = 0;
            saveConversations(convs);

            // Update header
            document.getElementById('threadContactName').textContent = conv.name;
            const roleBadge = document.getElementById('threadRoleBadge');
            const roleKey = 'role' + conv.role.charAt(0).toUpperCase() + conv.role.slice(1);
            roleBadge.textContent = getL(uiText[roleKey]) || conv.role;
            roleBadge.className = 'role-badge ' + conv.role;

            // Render messages
            const container = document.getElementById('threadMessages');
            let html = '';
            let lastDate = '';
            conv.messages.forEach(msg => {
                const msgDate = new Date(msg.time);
                const dateKey = msgDate.toDateString();
                if (dateKey !== lastDate) {
                    html += `<div class="date-separator"><span>${formatDateSeparator(msg.time)}</span></div>`;
                    lastDate = dateKey;
                }
                html += `
                    <div class="message-bubble ${msg.sent ? 'sent' : 'received'}">
                        <div class="message-text">${escapeHtml(msg.text).replace(/\n/g, '<br>')}</div>
                        <div class="message-time">${formatMessageTime(msg.time)}</div>
                    </div>`;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;

            // Show thread, hide empty
            document.getElementById('threadEmpty').style.display = 'none';
            const threadView = document.getElementById('threadView');
            threadView.style.display = 'flex';

            // Mobile: show thread panel
            document.getElementById('messagesContainer').classList.add('show-thread');

            // Re-render list to update active state
            renderConversationList(document.getElementById('searchConversations').value);
        }

        // ========== Mobile: Back to list ==========
        function showConversationList() {
            document.getElementById('messagesContainer').classList.remove('show-thread');
        }

        // ========== Send Message in Thread ==========
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeConversationId) return;

            const convs = loadConversations();
            const conv = convs.find(c => c.id === activeConversationId);
            if (!conv) return;

            conv.messages.push({
                id: 'm' + Date.now(),
                text: text,
                sent: true,
                time: new Date().toISOString()
            });
            saveConversations(convs);

            input.value = '';
            input.style.height = 'auto';
            document.getElementById('btnSend').disabled = true;
            openConversation(activeConversationId);
        }

        // ========== Send New Message (Modal) ==========
        function sendNewMessage() {
            const recipient = document.getElementById('newMsgRecipient').value.trim();
            const subject = document.getElementById('newMsgSubject').value.trim();
            const body = document.getElementById('newMsgBody').value.trim();

            if (!recipient || !subject || !body) {
                alert(getL(uiText.fillAllFields));
                return;
            }

            const convs = loadConversations();
            const newConv = {
                id: 'conv' + Date.now(),
                name: recipient,
                role: 'author',
                initial: recipient.charAt(0).toUpperCase(),
                unread: 0,
                messages: [{
                    id: 'm' + Date.now(),
                    text: (subject ? '[' + subject + ']\n' : '') + body,
                    sent: true,
                    time: new Date().toISOString()
                }]
            };
            convs.unshift(newConv);
            saveConversations(convs);

            // Reset modal
            document.getElementById('newMsgRecipient').value = '';
            document.getElementById('newMsgSubject').value = '';
            document.getElementById('newMsgBody').value = '';
            bootstrap.Modal.getInstance(document.getElementById('newMessageModal')).hide();

            renderConversationList();
            openConversation(newConv.id);
            alert(getL(uiText.messageSent));
        }

        // ========== Update All Text ==========
        function updateAllText() {
            document.title = getL(uiText.pageTitle) + ' - Publisher';
            if (typeof i18n !== 'undefined') i18n.applyToDOM();

            // Re-render to apply role translations
            renderConversationList(document.getElementById('searchConversations').value);
            if (activeConversationId) openConversation(activeConversationId);
            if (currentMsgTab === 'notifications') renderNotificationList();
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        // ========== Init ==========
        document.addEventListener('DOMContentLoaded', () => {
            updateAllText();
            renderConversationList();
            updateNotifBadge();

            // Search filter
            document.getElementById('searchConversations').addEventListener('input', function() {
                renderConversationList(this.value);
            });

            // Send button enable/disable
            const msgInput = document.getElementById('messageInput');
            msgInput.addEventListener('input', function() {
                document.getElementById('btnSend').disabled = !this.value.trim();
                // Auto-resize textarea
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Enter to send (Shift+Enter for newline)
            msgInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        document.addEventListener('languageChanged', function(e) {
            const l = e.detail.language || e.detail.lang;
            if (l) {
                const d = document.getElementById('languageSelector');
                const m = document.getElementById('languageSelectorMobile');
                if (d) d.value = l;
                if (m) m.value = l;
            }
            updateAllText();
        });

        if (typeof i18n !== 'undefined') {
            i18n.onLanguageChange(function() {
                i18n.applyToDOM();
                renderConversationList(document.getElementById('searchConversations').value);
                if (activeConversationId) openConversation(activeConversationId);
                if (currentMsgTab === 'notifications') renderNotificationList();
            });
        }
    </script>

function updateUIText() {

        const els = {

        };
        Object.keys(els).forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = getNavL(els[id]);
        });
    }
document.addEventListener('DOMContentLoaded', function() {
        const desktopSelector = document.getElementById('languageSelector');
        const mobileSelector = document.getElementById('languageSelectorMobile');

        if (desktopSelector && mobileSelector) {
            const savedLang = localStorage.getItem('preferredLanguage') || 'en';
            desktopSelector.value = savedLang;
            mobileSelector.value = savedLang;

            mobileSelector.addEventListener('change', function() {
                desktopSelector.value = this.value;
                if (typeof changeLanguage === 'function') changeLanguage(this.value);
                updateUIText();
            });

            desktopSelector.addEventListener('change', function() {
                mobileSelector.value = this.value;
                if (typeof changeLanguage === 'function') changeLanguage(this.value);
                updateUIText();
            });
        }

        updateUIText();
loadUserInfo();

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.user-dropdown')) {
                const dropdown = document.getElementById('userDropdown');
                const dropdownMenu = document.getElementById('userMenu');
                if (dropdown) dropdown.classList.remove('open');
                if (dropdownMenu) dropdownMenu.classList.remove('show');
            }
        });

        const navbarCollapse = document.getElementById('navbarNav');
        const navbarOverlay = document.getElementById('navbarOverlay');

        if (navbarCollapse) {
            navbarCollapse.addEventListener('show.bs.collapse', function() {
                if (navbarOverlay) navbarOverlay.classList.add('show');
            });
            navbarCollapse.addEventListener('hide.bs.collapse', function() {
                if (navbarOverlay) navbarOverlay.classList.remove('show');
            });
        }

        if (navbarOverlay) {
            navbarOverlay.addEventListener('click', function() {
                const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                if (bsCollapse) bsCollapse.hide();
            });
        }

        document.addEventListener('languageChanged', function() {
            updateUIText();
        });
    });
    </script>
