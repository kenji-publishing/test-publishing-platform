<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="registerAuthor.pageTitle">Author Registration - Publisher</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style-new.css">
    <link rel="stylesheet" href="../css/mobile-fixes.css">
    
    <style>
        .navbar-lang-selector { display: flex; align-items: center; margin-right: 0.5rem; }
        @media (max-width: 991.98px) { .navbar-lang-selector { order: 1; } .navbar-toggler { order: 2; } }
        .register-container { padding: var(--spacing-xl) 0; max-width: 800px; margin: 0 auto; }
        .register-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--spacing-xl); }
        .register-header { text-align: center; margin-bottom: var(--spacing-xl); }
        .register-header .icon { font-size: 4rem; color: var(--color-accent); margin-bottom: var(--spacing-md); }
        .register-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--spacing-xs); }
        .register-header p { color: var(--color-text-secondary); }
        .form-section { margin-bottom: var(--spacing-xl); }
        .form-section h5 { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--spacing-md); display: flex; align-items: center; gap: var(--spacing-sm); }
        .form-section h5 i { color: var(--color-accent); }
        .form-label { font-weight: 500; margin-bottom: var(--spacing-xs); }
        .form-text { font-size: var(--font-size-sm); color: var(--color-text-muted); }
        .form-check-label { font-weight: 400; }
        .btn-register { padding: var(--spacing-md) var(--spacing-xl); font-size: var(--font-size-lg); }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-book-open"></i> Publisher
            </a>
            <!-- Mobile Language Selector -->
            <div class="navbar-lang-selector d-lg-none">
                <select class="language-selector" id="languageSelectorMobile">
                    <option value="en">🇬🇧 English</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="pt">🇧🇷 Português</option>
                </select>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html" data-i18n="nav.home">Home</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <!-- Desktop Language Selector -->
                    <select class="language-selector d-none d-lg-block" id="languageSelector">
                        <option value="en">🇬🇧 English</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="zh">🇨🇳 中文</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="ar">🇸🇦 العربية</option>
                        <option value="pt">🇧🇷 Português</option>
                    </select>
                    <a href="login.html" class="btn btn-outline-custom" data-i18n="nav.login">Sign In</a>
                    <a href="register.html" class="btn btn-custom" data-i18n="nav.register">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="register-container">
        <div class="container">
            <div class="register-card">
                <div class="register-header">
                    <div class="icon">
                        <i class="fas fa-pen-fancy"></i>
                    </div>
                    <h1 data-i18n="registerAuthor.title">Author Registration</h1>
                    <p data-i18n="registerAuthor.subtitle">Start sharing your stories with the world</p>
                </div>

                <form id="authorRegistrationForm">
                    <!-- Personal Information -->
                    <div class="form-section">
                        <h5><i class="fas fa-user"></i> <span data-i18n="registerAuthor.personalInfo">Personal Information</span></h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label" data-i18n="registerAuthor.firstName">First Name *</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label" data-i18n="registerAuthor.lastName">Last Name *</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="penName" class="form-label" data-i18n="registerAuthor.penName">Pen Name (Optional)</label>
                            <input type="text" class="form-control" id="penName">
                            <div class="form-text" data-i18n="registerAuthor.penNameHint">The name readers will see</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label" data-i18n="registerAuthor.email">Email Address *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="country" class="form-label" data-i18n="registerAuthor.country">Country *</label>
                            <select class="form-select" id="country" required>
                                <option value="" data-i18n="registerAuthor.selectCountry">Select your country</option>
                                <option value="US" data-i18n="registerAuthor.countries.us">United States</option>
                                <option value="GB" data-i18n="registerAuthor.countries.gb">United Kingdom</option>
                                <option value="JP" data-i18n="registerAuthor.countries.jp">Japan</option>
                                <option value="DE" data-i18n="registerAuthor.countries.de">Germany</option>
                                <option value="FR" data-i18n="registerAuthor.countries.fr">France</option>
                                <option value="ES" data-i18n="registerAuthor.countries.es">Spain</option>
                                <option value="CN" data-i18n="registerAuthor.countries.cn">China</option>
                                <option value="other" data-i18n="registerAuthor.countries.other">Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Author Details -->
                    <div class="form-section">
                        <h5><i class="fas fa-book"></i> <span data-i18n="registerAuthor.authorDetails">Author Details</span></h5>
                        
                        <div class="mb-3">
                            <label for="primaryLanguage" class="form-label" data-i18n="registerAuthor.primaryLanguage">Primary Writing Language *</label>
                            <select class="form-select" id="primaryLanguage" required>
                                <option value="" data-i18n="registerAuthor.selectLanguage">Select language</option>
                                <option value="en" data-i18n="registerAuthor.languages.en">English</option>
                                <option value="es" data-i18n="registerAuthor.languages.es">Spanish</option>
                                <option value="de" data-i18n="registerAuthor.languages.de">German</option>
                                <option value="fr" data-i18n="registerAuthor.languages.fr">French</option>
                                <option value="ja" data-i18n="registerAuthor.languages.ja">Japanese</option>
                                <option value="zh" data-i18n="registerAuthor.languages.zh">Chinese</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="genres" class="form-label" data-i18n="registerAuthor.writingGenres">Writing Genres *</label>
                            <select class="form-select" id="genres" multiple size="5" required>
                                <option value="fiction" data-i18n="registerAuthor.genres.fiction">Fiction</option>
                                <option value="nonfiction" data-i18n="registerAuthor.genres.nonfiction">Non-Fiction</option>
                                <option value="manga" data-i18n="registerAuthor.genres.manga">Manga/Comics</option>
                                <option value="poetry" data-i18n="registerAuthor.genres.poetry">Poetry</option>
                                <option value="scifi" data-i18n="registerAuthor.genres.scifi">Science Fiction</option>
                                <option value="fantasy" data-i18n="registerAuthor.genres.fantasy">Fantasy</option>
                                <option value="romance" data-i18n="registerAuthor.genres.romance">Romance</option>
                                <option value="mystery" data-i18n="registerAuthor.genres.mystery">Mystery/Thriller</option>
                                <option value="horror" data-i18n="registerAuthor.genres.horror">Horror</option>
                                <option value="biography" data-i18n="registerAuthor.genres.biography">Biography/Memoir</option>
                            </select>
                            <div class="form-text" data-i18n="registerAuthor.genresHint">Hold Ctrl (Cmd on Mac) to select multiple</div>
                        </div>

                        <div class="mb-3">
                            <label for="bio" class="form-label" data-i18n="registerAuthor.authorBio">Author Bio (Optional)</label>
                            <textarea class="form-control" id="bio" rows="4" data-i18n-placeholder="registerAuthor.bioPlaceholder" placeholder="Tell readers about yourself..."></textarea>
                        </div>
                    </div>

                    <!-- Additional Services -->
                    <div class="form-section">
                        <h5><i class="fas fa-plus-circle"></i> <span data-i18n="registerAuthor.additionalServices">Additional Services</span></h5>
                        
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="offerTranslation">
                            <label class="form-check-label" for="offerTranslation" data-i18n="registerAuthor.canWorkTranslator">
                                I can also work as a translator
                            </label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="offerEditing">
                            <label class="form-check-label" for="offerEditing" data-i18n="registerAuthor.canWorkEditor">
                                I can also work as an editor
                            </label>
                        </div>

                        <div id="translationLanguages" class="mb-3" style="display: none;">
                            <label class="form-label" data-i18n="registerAuthor.translationLanguages">Translation Languages</label>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="en" id="trans-en">
                                        <label class="form-check-label" for="trans-en" data-i18n="registerAuthor.languages.en">English</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="es" id="trans-es">
                                        <label class="form-check-label" for="trans-es" data-i18n="registerAuthor.languages.es">Spanish</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="de" id="trans-de">
                                        <label class="form-check-label" for="trans-de" data-i18n="registerAuthor.languages.de">German</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="fr" id="trans-fr">
                                        <label class="form-check-label" for="trans-fr" data-i18n="registerAuthor.languages.fr">French</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="ja" id="trans-ja">
                                        <label class="form-check-label" for="trans-ja" data-i18n="registerAuthor.languages.ja">Japanese</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="zh" id="trans-zh">
                                        <label class="form-check-label" for="trans-zh" data-i18n="registerAuthor.languages.zh">Chinese</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                        <label class="form-check-label" for="agreeTerms">
                            <span data-i18n="registerAuthor.agreeToTerms">I agree to the</span>
                            <a href="terms.html" data-i18n="registerAuthor.termsOfService">Terms of Service</a>
                            <span data-i18n="registerAuthor.and">and</span>
                            <a href="revenue-sharing.html" data-i18n="registerAuthor.revenueSharing">Revenue Sharing Agreement</a> *
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-custom btn-register">
                            <i class="fas fa-user-plus me-2"></i><span data-i18n="registerAuthor.createAccount">Create Author Account</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center">
                <p class="small mb-0" data-i18n="footer.copyright">&copy; 2024 Publisher. All rights reserved.</p>
                <div class="d-flex gap-3">
                    <a href="support/faq.html" class="text-secondary" data-i18n="footer.help">Help</a>
                    <a href="terms.html" class="text-secondary" data-i18n="footer.terms">Terms</a>
                    <a href="privacy.html" class="text-secondary" data-i18n="footer.privacy">Privacy</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/language-switcher.js"></script>
    <script>
        // Language switching
        function switchLanguage(lang) {
            localStorage.setItem('preferredLanguage', lang);
            
            // Update both selectors
            document.getElementById('languageSelector').value = lang;
            document.getElementById('languageSelectorMobile').value = lang;
            
            // Use LanguageSwitcher if available
            if (typeof LanguageSwitcher !== 'undefined') {
                LanguageSwitcher.changeLanguage(lang);
            } else if (typeof loadLanguage === 'function') {
                loadLanguage(lang);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set current language
            const currentLang = localStorage.getItem('preferredLanguage') || 'en';
            const desktopSelector = document.getElementById('languageSelector');
            const mobileSelector = document.getElementById('languageSelectorMobile');
            
            if (desktopSelector) {
                desktopSelector.value = currentLang;
                desktopSelector.addEventListener('change', function() {
                    switchLanguage(this.value);
                });
            }
            
            if (mobileSelector) {
                mobileSelector.value = currentLang;
                mobileSelector.addEventListener('change', function() {
                    switchLanguage(this.value);
                });
            }
        });

        // Show translation languages when checkbox is checked
        document.getElementById('offerTranslation').addEventListener('change', function() {
            document.getElementById('translationLanguages').style.display = this.checked ? 'block' : 'none';
        });

        // Form submission
        document.getElementById('authorRegistrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registration submitted! (This will connect to backend in production)');
        });
    </script>
</body>
</html>
