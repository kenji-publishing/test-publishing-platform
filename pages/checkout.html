<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=202608282148">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Pattern C Navbar Styles -->
    <style>
        /* ========== Mobile Language Selector ========== */
        .navbar-lang-selector {
            display: flex;
            align-items: center;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 991.98px) {
            .navbar-lang-selector {
                order: 1;
            }
            .navbar-toggler {
                order: 2;
            }
        }
        
        /* ========== PC Navbar - 横並び維持 ========== */
        @media (min-width: 992px) {
            .navbar-nav {
                flex-wrap: nowrap !important;
                flex-direction: row !important;
            }
            .navbar-nav .nav-item {
                white-space: nowrap !important;
            }
            .navbar-nav .nav-link {
                white-space: nowrap !important;
                padding: 0.5rem 0.6rem !important;
                font-size: 0.9rem;
            }

            .dropdown-menu {
                white-space: nowrap;
            }
            .navbar-buttons-guest {
                display: flex !important;
                flex-wrap: nowrap !important;
                gap: 0.5rem;
            }
            .navbar-buttons-guest .btn {
                white-space: nowrap !important;
                flex-shrink: 0;
            }
        }
        
        /* ========== Auth Visibility Control ========== */
        .auth-only {
            display: none !important;
        }
        .guest-only {
            display: block;
        }
        body.logged-in .auth-only {
            display: block !important;
        }
        body.logged-in .auth-only.nav-item {
            display: list-item !important;
        }
        body.logged-in .auth-only.dropdown {
            display: block !important;
        }
        body.logged-in .guest-only {
            display: none !important;
        }
        @media (min-width: 992px) {
            body.logged-in .navbar-buttons-guest {
                display: none !important;
            }
        }
        
        /* ========== User Dropdown Menu ========== */
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: 25px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .user-dropdown-toggle:hover {
            border-color: var(--color-accent);
            background: rgba(139, 115, 85, 0.05);
        }
        .user-dropdown-toggle i:first-child {
            font-size: 1.25rem;
            color: var(--color-accent);
        }
        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-chevron {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }
        .user-dropdown.open .user-chevron {
            transform: rotate(180deg);
        }
        .user-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            min-width: 240px;
            z-index: 1055;
            display: none;
            overflow: hidden;
        }
        .user-menu.show {
            display: block;
        }
        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--color-bg-main);
        }
        .user-avatar {
            font-size: 2.5rem;
            color: var(--color-accent);
        }
        .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-display-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-email {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-menu-divider {
            height: 1px;
            background: var(--color-border);
        }
        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .user-menu-item:hover {
            background: var(--color-bg-hover);
            color: var(--color-accent);
        }
        .user-menu-item i {
            width: 20px;
            text-align: center;
            color: var(--color-text-secondary);
        }
        .user-menu-item:hover i {
            color: var(--color-accent);
        }
        .logout-btn {
            color: var(--color-error);
        }
        .logout-btn i {
            color: var(--color-error);
        }
        .logout-btn:hover {
            background: rgba(199, 93, 93, 0.1);
            color: var(--color-error);
        }
        
        /* ========== Navbar Overlay ========== */

        /* ========== Mobile Menu ========== */
        @media (max-width: 991.98px) {

        }
    </style>
    
    <!-- Checkout Page Styles -->
    <style>
        .payment-method-card{cursor:pointer;transition:all 0.3s;border:2px solid #dee2e6}.payment-method-card:hover{border-color:#0d6efd;transform:translateY(-3px);box-shadow:0 5px 15px rgba(0,0,0,0.1)}.payment-method-card.selected{border-color:#0d6efd;background-color:#f0f7ff}
        .payment-icon{font-size:3rem}.stripe-icon{color:#635bff}
        .order-summary{background:#f8f9fa;border-radius:10px}
        
        /* ========== Z-index Fix: ドロップダウンをOrder Summaryより上に ========== */
        /* Navbar全体を最上位に */

        /* Navbarのドロップダウンメニュー */
        .navbar .dropdown-menu {
            z-index: 1060 !important;
        }
        /* Order Summaryのsticky-topを低く */
        .order-summary.sticky-top {
            z-index: 1000 !important;
            position: sticky !important;
        }
        /* コンテンツエリア全体をNavbarより下に */
        .container.py-5 {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
<div id="navbar-container"></div>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-7">
                <h2 class="mb-4"><i class="fas fa-credit-card me-2"></i><span data-i18n="checkout.title">Checkout</span></h2>
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title" data-i18n="checkout.yourOrder">Your Order</h5>
                        <div class="d-flex align-items-center">
                            <div class="bg-secondary rounded me-3" style="width:80px;height:100px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-book text-white fa-2x"></i></div>
                            <div>
                                <h6 id="workTitle" dir="auto">Loading...</h6>
                                <p class="text-muted mb-0" id="workAuthor" dir="auto">by Author</p>
                                <span class="badge bg-primary" id="workGenre">Genre</span>
                            </div>
                        </div>
                    </div>
                </div>
                <h5 class="mb-3" data-i18n="checkout.paymentMethod">Payment Method</h5>
                <div class="card payment-method-card mb-3" id="stripeMethod" onclick="selectPaymentMethod('stripe')">
                    <div class="card-body d-flex align-items-center">
                        <div class="payment-icon stripe-icon me-4"><i class="fab fa-cc-stripe"></i></div>
                        <div class="flex-grow-1">
                            <h5 class="mb-1" data-i18n="checkout.creditCard">Credit / Debit Card</h5>
                            <p class="text-muted mb-0"><i class="fab fa-cc-visa me-1" title="Visa"></i><i class="fab fa-cc-mastercard me-1" title="Mastercard"></i><i class="fab fa-cc-amex me-1" title="American Express"></i><i class="fab fa-cc-jcb me-1" title="JCB"></i><i class="fab fa-apple-pay me-1" title="Apple Pay"></i><i class="fab fa-google-pay me-1" title="Google Pay"></i><i class="fab fa-paypal me-1" title="PayPal"></i><i class="fab fa-amazon-pay me-1" title="Amazon Pay"></i><span data-i18n="checkout.securePayment">Secure Payment</span></p>
                            <p class="text-muted mb-0 mt-1" style="font-size:0.78rem;" id="methodsRegionNote"></p>
                        </div>
                        <div><i class="fas fa-check-circle text-primary fa-2x" id="stripeCheck" style="display:none;"></i></div>
                    </div>
                </div>
                <div class="alert alert-light mt-4"><i class="fas fa-lock text-success me-2"></i><small data-i18n="checkout.encryptedSecure">Your payment information is encrypted and secure.</small></div>
            </div>
            <div class="col-lg-5">
                <div class="order-summary p-4 sticky-top" style="top:20px;">
                    <h5 class="mb-4" data-i18n="checkout.orderSummary">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2"><span data-i18n="checkout.subtotal">Subtotal</span><span id="subtotal">$0.00</span></div>
                    <!-- 税の行は置いていない。当社はVAT未登録で、表示価格が総額のため（利用規約 8.4）。
                         登録が必要になったら、ここに実際に計算した税額を出す。$0.00 を固定で出すのは、
                         計算しているように見えて実は計算していない、という誤解のもとになる。 -->
                    <hr>
                    <div class="d-flex justify-content-between mb-4"><strong data-i18n="checkout.total">Total</strong><strong id="total">$0.00</strong></div>
                    <div class="card bg-white mb-4">
                        <div class="card-body">
                            <small class="text-muted d-block mb-2" data-i18n="checkout.revenueDistribution">Revenue Distribution:</small>
                            <div class="d-flex justify-content-between small"><span><i class="fas fa-pen-fancy text-primary me-1"></i><span data-i18n="checkout.author">Author</span></span><span>40%</span></div>
                            <div class="d-flex justify-content-between small"><span><i class="fas fa-language text-success me-1"></i><span data-i18n="checkout.translator">Translator</span></span><span>20%</span></div>
                            <div class="d-flex justify-content-between small"><span><i class="fas fa-edit text-info me-1"></i><span data-i18n="checkout.editor">Editor</span></span><span>10%</span></div>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" id="payButton" onclick="processPayment()" disabled><i class="fas fa-lock me-2"></i><span data-i18n="checkout.paymentMethod">Select Payment Method</span></button>
                    <p class="text-center mt-3 mb-0"><small class="text-muted"><span data-i18n="checkout.agreeTerms">By purchasing, you agree to our</span> <a href="terms.html" data-i18n="footer.terms">Terms</a></small></p>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js?v=202608282148"></script>
    <script src="../js/i18n.js?v=202608282148"></script>
    <script src="../js/navbar.js?v=202608282148"></script>
    <script src="../js/lang/ja.js?v=202608282148"></script>
    <script src="../js/lang/en.js?v=202608282148"></script>
    <script src="../js/lang/zh.js?v=202608282148"></script>
    <script src="../js/lang/zh-TW.js?v=202608282148"></script>
    <script src="../js/lang/es.js?v=202608282148"></script>
    <script src="../js/lang/fr.js?v=202608282148"></script>
    <script src="../js/lang/de.js?v=202608282148"></script>
    <script src="../js/lang/ko.js?v=202608282148"></script>
    <script src="../js/lang/ar.js?v=202608282148"></script>
    <script src="../js/lang/pt.js?v=202608282148"></script>
    <script src="../js/lang/it.js?v=202608282148"></script>
    
    
    <!-- Pattern C Navbar Script -->
    <script>
        // ========== 多言語対応テキスト（9言語）==========
// Navbar initialization
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                loadUserInfo();
                
                // User dropdown close on outside click
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.user-dropdown')) {
                        const dropdown = document.getElementById('userDropdown');
                        const dropdownMenu = document.getElementById('userMenu');
                        if (dropdown) dropdown.classList.remove('open');
                        if (dropdownMenu) dropdownMenu.classList.remove('show');
                    }
                });
                
                // Mobile overlay
                const navbarCollapse = document.getElementById('navbarNav');
                const navbarOverlay = document.getElementById('navbarOverlay');
                
                if (navbarCollapse) {
                    navbarCollapse.addEventListener('show.bs.collapse', function() {
                        if (navbarOverlay) navbarOverlay.classList.add('show');
                    });
                    navbarCollapse.addEventListener('hide.bs.collapse', function() {
                        if (navbarOverlay) navbarOverlay.classList.remove('show');
                    });
                }
                
                if (navbarOverlay) {
                    navbarOverlay.addEventListener('click', function() {
                        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                        if (bsCollapse) bsCollapse.hide();
                    });
                }
            });
            
            document.addEventListener('languageChanged', function() {
            });
        })();
    </script>
    
    <!-- Checkout Page Script -->
    <script>
        let selectedMethod=null,workData=null;
        const urlParams=new URLSearchParams(window.location.search);
        const workId=urlParams.get('workId');
        
        function renderWorkDetails(){
            document.getElementById('workTitle').textContent=workData.title;
            document.getElementById('workAuthor').textContent=(window.i18n ? i18n.t('checkout.by') : 'by')+' '+workData.author;
            document.getElementById('workGenre').textContent=workData.genre;
            var priceText = (typeof formatWorkPrice === 'function') ? formatWorkPrice(workData.price, workData.currency) : (workData.currency + ' ' + workData.price);
            document.getElementById('subtotal').textContent = priceText;
            document.getElementById('total').textContent = priceText;
        }

        function showCheckoutError(msgJa, msgEn){
            var lang = localStorage.getItem('preferredLanguage') || 'en';
            var box = document.getElementById('checkoutError');
            if (!box) {
                box = document.createElement('div');
                box.id = 'checkoutError';
                box.className = 'alert alert-danger mt-3';
                var payBtn = document.getElementById('payButton');
                payBtn.parentNode.insertBefore(box, payBtn);
            }
            box.textContent = (lang === 'ja') ? msgJa : msgEn;
        }

        async function loadWorkDetails(){
            // Always show the real work + price for this workId, so the
            // displayed total matches what the backend will actually charge.
            try {
                if (!workId) throw new Error('Missing workId');
                const r = await fetch((window.API_ORIGIN||'') + '/api/works/' + encodeURIComponent(workId));
                const d = await r.json();
                if (!r.ok || !d.work) throw new Error(d.error || 'Failed to load work');
                workData = {
                    id: d.work.work_id,
                    title: d.work.title || '',
                    author: d.work.author_name || '',
                    genre: d.work.genre || '',
                    price: parseFloat(d.work.price) || 0,
                    currency: d.work.currency || 'USD'
                };
            } catch (e) {
                if (window.DEMO_MODE) {
                    // Demo only: sample data for trying out the page offline
                    workData = { id: workId||'sample-123', title:'Midnight Stories', author:'J.A. Writer', genre:'Fiction', price:9.99, currency:'USD' };
                } else {
                    console.error('Failed to load work details:', e);
                    showCheckoutError(
                        '作品情報を読み込めませんでした。前のページに戻ってやり直してください。',
                        'Could not load the work details. Please go back and try again.'
                    );
                    document.getElementById('payButton').disabled = true;
                    return;
                }
            }
            renderWorkDetails();
        }
        
        function selectPaymentMethod(method){
            selectedMethod=method;
            document.querySelectorAll('.payment-method-card').forEach(c=>c.classList.remove('selected'));
            document.getElementById('stripeMethod').classList.add('selected');
            document.getElementById('stripeCheck').style.display='block';
            document.getElementById('payButton').innerHTML='<i class="fas fa-lock me-2"></i>Proceed to Payment';
            document.getElementById('payButton').disabled=false;
        }

        // 決済手段の注記（Stripeの決済ページが通貨・地域に応じて自動で出し分ける）
        function updateMethodsRegionNote(){
            var lang = (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : 'en';
            var notes = {
                en:'Available payment methods are shown on the payment page based on your currency and region.',
                ja:'ご利用可能な決済方法は、通貨・地域に応じて決済ページに表示されます。',
                zh:'可用的付款方式將依貨幣與地區顯示於付款頁面。',
                es:'Los métodos de pago disponibles se muestran en la página de pago según su moneda y región.',
                fr:"Les moyens de paiement disponibles s'affichent sur la page de paiement selon votre devise et votre région.",
                de:'Die verfügbaren Zahlungsmethoden werden auf der Zahlungsseite je nach Währung und Region angezeigt.',
                ko:'이용 가능한 결제 수단은 통화 및 지역에 따라 결제 페이지에 표시됩니다.',
                ar:'تُعرض طرق الدفع المتاحة في صفحة الدفع حسب العملة والمنطقة.',
                pt:'Os métodos de pagamento disponíveis são mostrados na página de pagamento conforme sua moeda e região.',
                it:'I metodi di pagamento disponibili vengono mostrati nella pagina di pagamento in base a valuta e regione.'
            };
            // 決済カテゴリのヘルプへの文脈リンク（疑問が生まれる場所に置く）
            var links = {
                en: 'Payment FAQ', ja: '決済のよくある質問', zh: '付款常見問題',
                es: 'Preguntas sobre pagos', fr: 'FAQ paiement', de: 'Zahlungs-FAQ',
                ko: '결제 FAQ', ar: 'أسئلة الدفع الشائعة', pt: 'FAQ de pagamento', it: 'FAQ sui pagamenti'
            };
            var el = document.getElementById('methodsRegionNote');
            if (el) {
                el.textContent = notes[lang] || notes['en'];
                var a = document.createElement('a');
                a.href = 'support/help.html#cat-2';
                a.textContent = links[lang] || links['en'];
                a.style.marginLeft = '0.4rem';
                el.appendChild(a);
            }
        }
        document.addEventListener('DOMContentLoaded', updateMethodsRegionNote);
        document.addEventListener('languageChanged', updateMethodsRegionNote);
        
        // ========== ライブラリ管理（localStorage）==========
        function addToLibrary(workId, title) {
            try {
                var lib = JSON.parse(localStorage.getItem('publisherLibrary') || '[]');
                if (!lib.some(function(item) { return String(item.id) === String(workId); })) {
                    lib.push({ id: String(workId), title: title || '', addedAt: new Date().toISOString() });
                    localStorage.setItem('publisherLibrary', JSON.stringify(lib));
                }
            } catch(e) { console.error('Library save error:', e); }
        }

        function buildSuccessUrl() {
            var params = new URLSearchParams();
            params.set('work_id', workData.id || '');
            params.set('title', workData.title || 'Digital Content');
            params.set('amount', workData.price || '0');
            return 'payment-success.html?' + params.toString();
        }

        function resetPayButton(btn){
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock me-2"></i>Proceed to Payment';
        }

        async function processPayment(){
            const btn=document.getElementById('payButton');
            btn.disabled=true;
            btn.innerHTML='<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
            try{
                if(selectedMethod==='stripe'){
                    const r=await fetch((window.API_ORIGIN||'') + '/api/payments/create-checkout-session',{
                        method:'POST',
                        headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},
                        body:JSON.stringify({workId:workData.id})
                    });
                    const d=await r.json();
                    if(d.url){
                        // The work is added to the library AFTER payment, on the
                        // payment-success page — never before redirecting to Stripe
                        // (the buyer may still cancel there).
                        window.location.href=d.url;
                    }
                    else if(d.code==='ALREADY_OWNED'){
                        // 二重課金防止: すでに購入済みならライブラリへ案内する
                        alert(getL({ en: 'You already own this work. It is available in your library.', ja: 'この作品はすでにご購入済みです。ライブラリからお読みいただけます。' }));
                        window.location.href='library.html';
                    }
                    else{throw new Error(d.error||'Payment failed')}
                }
            }catch(e){
                if (window.DEMO_MODE) {
                    // Explicit demo mode only: simulate a successful purchase
                    console.warn('DEMO_MODE: simulating purchase:', e);
                    addToLibrary(workData.id, workData.title);
                    window.location.href = buildSuccessUrl();
                    return;
                }
                // Real mode: a failed payment is an ERROR. Never pretend it
                // succeeded or hand over the item.
                console.error('Payment failed:', e);
                showCheckoutError(
                    '決済処理に失敗しました。請求は行われていません。時間をおいて再度お試しください。',
                    'Payment could not be processed. You have not been charged. Please try again later.'
                );
                resetPayButton(btn);
            }
        }
        
        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadWorkDetails();
        });

        // 言語変更時にworkAuthorを更新
        document.addEventListener('languageChanged', function() {
            if (workData) {
                document.getElementById('workAuthor').textContent = (window.i18n ? i18n.t('checkout.by') : 'by') + ' ' + workData.author;
            }
        });
    </script>
</body>
</html>
