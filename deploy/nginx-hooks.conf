# hooks.auctlect.com — 機械同士の通知だけを受ける入口
#
# ■ なぜ分けるか
# Cloudflare は人間のアクセスを守る仕組みなので、データセンターから来る自動化された
# 通信を疑う。2026-08-08、SNSの購読確認が auctlect.com 宛に一度も届かなかった
# （AWSは送信済みと表示、nginxのアクセスログには痕跡なし）。
# webhook は Cloudflare を通さず、サーバーに直接届ける。
#
# ■ 置くときの手順
#   sudo cp ~/auctlect/deploy/nginx-hooks.conf /etc/nginx/sites-available/hooks
#   sudo ln -sf /etc/nginx/sites-available/hooks /etc/nginx/sites-enabled/hooks
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hooks.auctlect.com -n --agree-tos -m info@auctlect.com
#
# ⚠️ auctlect.com 側の設定ファイルには触らないこと。
#    あちらは certbot が 443 のブロックを追記しており、上書きするとHTTPSが落ちる。
#
# ■ DNS
#   hooks.auctlect.com  A  16.60.96.232  … Cloudflareのプロキシは必ずオフ（グレーの雲）
#   オレンジのままだと、分けた意味がなくなる。

server {
    listen 80;
    server_name hooks.auctlect.com;

    # 通知の本文は小さい。大きなものを受ける必要はない
    client_max_body_size 1M;

    # 受け付けるのは、署名を検証できる webhook だけ。
    # Cloudflare の後ろにいないぶん、入口は必要最小限にしておく。
    location = /api/ses/notifications {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 生きているかの確認用。中身は返さない
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # それ以外は何も見せない。ここはサイトではない
    location / {
        return 404;
    }

    # 検索エンジンに拾わせない
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }
}
