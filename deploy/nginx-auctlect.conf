# AuctLect - Nginx configuration
#
# ⚠️ デプロイ手順（cpだけではHTTPSが消えて521になる！）:
#   sudo cp ~/auctlect/deploy/nginx-auctlect.conf /etc/nginx/sites-available/auctlect
#   sudo certbot install --nginx --cert-name auctlect.com -n   # ← 必須。443/SSLブロックを再付与
#   sudo nginx -t && sudo systemctl reload nginx
# 本番の実ファイルにはcertbotが443(SSL)のserverブロックを追記している。
# このリポジトリ版（80番のみ）で上書きしたままreloadするとHTTPSが落ち、
# Cloudflareが521を返す（2026-07-17に実際に発生）。

# アセットのキャッシュ方針を ?v= の有無で切り替える。
#   ?v= 付き  … tools/bump-assets.js が付けたバージョン。中身が変われば必ずURLも変わるので、
#                1年間キャッシュして構わない（2回目以降の表示が速くなる）
#   ?v= なし  … 付け忘れ・直リンク・古いブックマーク。今までどおり毎回サーバーに確認する。
#                ここを一律で長期キャッシュにすると、付け忘れた1ファイルが
#                1年間古いまま固定されてしまうため、あえて分けている。
map $arg_v $asset_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name auctlect.com www.auctlect.com 16.60.96.232;

    root /home/ubuntu/auctlect;
    index index.html;

    client_max_body_size 15M;

    # API requests -> Node.js app (port 3000)
    # ^~ は「ここに当たったら下の正規表現locationは見ない」の意味。
    # これがないと /api/... で .json や .js で終わるURLが下のキャッシュ設定に横取りされる
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AIサンプル翻訳など長い処理向け（デフォルト60sだと複雑なページで504になる。
        # Cloudflare側の上限は約100sなので、アプリ側は100s未満で応答する設計）
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Uploaded files -> Node.js app
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Never serve dotfiles or backend internals
    location ~ /\. {
        deny all;
    }
    location ^~ /backend/ {
        deny all;
    }

    # HTMLは絶対にキャッシュしない。
    # 中に書かれた ?v=... の値が「新しいアセットを取りに行け」の合図になるので、
    # HTMLが古いままだと、いくらバージョンを上げても誰にも届かない
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # CSS/JS/翻訳JSON/画像/フォント: ?v= 付きなら長期キャッシュ、無しなら毎回確認（上のmap参照）
    # .json を含めているのは、翻訳データ js/lang/*.json が
    #   これまでキャッシュ指定なしで配信され、更新が読者に届くまで数日かかり得たため
    location ~* \.(css|js|json|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        add_header Cache-Control $asset_cache_control;
        try_files $uri =404;
    }

    # Static frontend (HTML/CSS/JS)
    location / {
        try_files $uri $uri/ =404;
    }
}
