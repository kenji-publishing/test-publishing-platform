# AuctLect - Nginx configuration
# Deploy: sudo cp ~/auctlect/deploy/nginx-auctlect.conf /etc/nginx/sites-available/auctlect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name auctlect.com www.auctlect.com 16.60.96.232;

    root /home/ubuntu/auctlect;
    index index.html;

    client_max_body_size 15M;

    # API requests -> Node.js app (port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files -> Node.js app
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Never serve dotfiles or backend internals
    location ~ /\. {
        deny all;
    }
    location ^~ /backend/ {
        deny all;
    }

    # HTML is always revalidated so new deploys show up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static frontend (HTML/CSS/JS)
    location / {
        try_files $uri $uri/ =404;
    }
}
