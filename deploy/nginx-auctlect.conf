# AuctLect - Nginx configuration
#
# ⚠️ デプロイ手順（cpだけではHTTPSが消えて521になる！）:
#   sudo cp ~/auctlect/deploy/nginx-auctlect.conf /etc/nginx/sites-available/auctlect
#   sudo certbot install --nginx --cert-name auctlect.com -n   # ← 必須。443/SSLブロックを再付与
#   sudo nginx -t && sudo systemctl reload nginx
# 本番の実ファイルにはcertbotが443(SSL)のserverブロックを追記している。
# このリポジトリ版（80番のみ）で上書きしたままreloadするとHTTPSが落ち、
# Cloudflareが521を返す（2026-07-17に実際に発生）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name auctlect.com www.auctlect.com 16.60.96.232;

    root /home/ubuntu/auctlect;
    index index.html;

    client_max_body_size 15M;

    # API requests -> Node.js app (port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AIサンプル翻訳など長い処理向け（デフォルト60sだと複雑なページで504になる。
        # Cloudflare側の上限は約100sなので、アプリ側は100s未満で応答する設計）
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Uploaded files -> Node.js app
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Never serve dotfiles or backend internals
    location ~ /\. {
        deny all;
    }
    location ^~ /backend/ {
        deny all;
    }

    # HTML/JS/CSS are always revalidated so new deploys show up immediately
    # (also stops Cloudflare edge-caching them; switch to versioned assets before launch)
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static frontend (HTML/CSS/JS)
    location / {
        try_files $uri $uri/ =404;
    }
}
